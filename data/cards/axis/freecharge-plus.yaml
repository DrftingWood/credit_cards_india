    notes: Current issuer cashback T&C confirms 5% on Freecharge app on-deck merchant IDs, 2% on local commute MCCs 4121/4131/4111/7512, and 1% on other eligible spends. Utilities earn only when paid through Freecharge; all other listed reward exclusions apply. Cashback is not earned on transactions under INR 100, is rounded down per individual transaction, and is credited by the 8th of the month after statement generation. Same-period refunds and later reversals adjust cashback; EMI conversions do not qualify. Source T&C does not state a document effective date; product page also announces general Axis terms updated 28 Aug 2026.
  mcc_exclusions:

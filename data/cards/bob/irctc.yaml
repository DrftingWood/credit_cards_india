rewards:
- effective_from: '2026-10-26'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 2
    per_inr: 100
    unit_value_inr: 0.25
    unit_value_inr_realized: 0.25
  loyalty_program: irctc-loyalty
  unit_value_from_program: false
  accelerated:
  - category: irctc-train-booking
    canonical_categories:
    - travel
    multiplier: 8
    effective_rate: 16
    card_attributable_rate: 16
    card_attributable_per_inr: 100
    cap_unit: points
    cycle: statement
    channel:
      class: utility-rail
      merchants:
      - irctc-rail
    notes: 16 BOBCARD Reward Points per INR 100 is the standard period rate for eligible 1AC, 2AC, 3AC, CC or EC
      fares through the IRCTC website/app. The issuer page raises this to 40 per INR 100 for travel dates Jan 15-Mar
      31 and Jul 15-Sep 15. Primary cardholder must be a listed passenger; only the primary cardholder fare qualifies.
      4 BOBCARD RP = 1 IRCTC Travel Point. Travel points post 5 days after completed non-cancelled journey. Seasonal
      dates cannot be represented directly by this schema; rate field records the non-peak rate to avoid overstating
      year-round earn.
    stacks_with_program: false
  - category: departmental-stores
    canonical_categories:
    - groceries
    multiplier: 2
    effective_rate: 4
    cap_per_cycle: 1000
    cap_unit: points
    cycle: statement
    notes: 4 BOBCARD Reward Points per INR 100 on departmental-store purchases; capped at 1,000 BOBCARD Reward Points
      per statement cycle. UPI earns core points only and no bonus rewards.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  mcc_exclusions:
  - '6513'
  redemption:
  - type: statement-credit
    program: BOBCARD Rewards
    rate_inr_per_unit: 0.25
    constraints: Statement cashback at 1 BOBCARD Reward Point = INR 0.25. Separately, 4 BOBCARD Reward Points convert
      to 1 IRCTC Travel Point for qualifying AC-class IRCTC tickets; IRCTC points are credited after journey completion
      and can be redeemed only on eligible tickets.
  source:
    url: https://www.bobcard.co.in/credit-card-types/irctc-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    notes: Current product page and its linked official terms confirm base/accelerated rates, seasonal IRCTC rates,
      store cap, 1:4 BOBCARD-to-IRCTC point conversion, INR 0.25 cashback value, UPI limits, eligible rail classes,
      passenger and channel restrictions, and fuel exclusion. The complete current select-MCC appendix was not verified;
      rent MCC 6513 retained and other unverified exclusions removed. Reward-rule dates are observation dates because
      current rates? start dates are not all published.
    confidence: medium
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated[1].effective_rate
    - rewards.accelerated[1].cap_per_cycle
    - rewards.exclusions
    - rewards.mcc_exclusions
    - rewards.redemption
  capping_rules:
  - Department-store accelerator capped at 1,000 BOBCARD Reward Points per statement cycle. IRCTC accelerated rate
    varies by travel-date season; seasonal rate cannot be represented with current schema.
benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Spend INR 5,000 or more within 60 days of card issuance
    benefit: 500 joining bonus reward points
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 500
    max_txn_inr: 3000
    cap_per_cycle_inr: 100
    cycle: statement
  other:
  - name: Railway lounge access
    description: Four complimentary partner railway-lounge visits per year (one per quarter), primary cardholder
      only.
  - name: IRCTC booking transaction-charge cashback
    description: Up to 1% cashback against transaction charges for eligible IRCTC website/app bookings (MCC 4112
      and 9399); cancelled-ticket transaction charges are reversed.
  - name: Lost-card liability
    description: BOBCARD product page advertises zero liability for fraudulent transactions when card loss is reported
      immediately; detailed conditions not stated on product page.
  - name: Add-on cards
    description: Up to three lifetime-free add-on cards for eligible family members aged over 18.
  - name: Smart EMI
    description: Purchases above INR 2,500 can be converted to Smart EMI for 6-48 months.
  concierge: false
  source:
    url: https://www.bobcard.co.in/credit-card-types/irctc-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high
    fields_verified:

  credit_score_min: null
  residency: null
  notes: >-
    HDFC lists Indian nationality; a specific residence-status requirement is not stated. Salaried applicants age 21–60:
    the eligibility subpage says gross monthly income >INR 35,000, while the main card page says net monthly salary
    INR 35,000 and its FAQ says net income at least INR 35,000. Self-employed age 21–65 and annual ITR >INR 600,000.

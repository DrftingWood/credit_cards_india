benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 3
      cycle: quarterly
      spend_threshold_inr: 40000
      spend_threshold_cycle: quarterly
      notes: Requires INR40,000 net eligible settled spend in the prior calendar quarter; new-card issue-quarter waiver may apply.
  welcome:
  - condition: Spend INR5,000 or more within 60 days of issuance; first-year primary-card benefit.
    benefit: 500 reward points
    value_inr: 125
    window_days: 60
  milestones:
  - spend_inr: 100000
    cycle: quarterly
    benefit: 4,000 points on financial-calendar-quarter spend exceeding the higher of INR100,000 or the assigned credit limit.
    reward_kind: points
    reward_units: 4000
    reward_currency_name: Reward Points
    is_repeatable: true
    max_awards_per_cycle: 1
    value_inr: 1000
  insurance:
  - type: other
    sum_insured_inr: 500000
    conditions: Up to INR5 lakh professional indemnity cover; only practicing CMA members with a valid Certificate of Practice at card issuance and claim qualify.
  - type: air-accident
    sum_insured_inr: 1500000
    conditions: Up to INR15 lakh air-accident death cover; claim conditions apply.
  - type: personal-accident
    sum_insured_inr: 500000
    conditions: Up to INR5 lakh non-air-accident death cover; claim conditions apply.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
    notes: 1% waiver for INR400–5,000 fuel transactions, capped at INR250 per statement. GST on surcharge is not reversed; fuel earns no points.
  other:
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+).
  - name: FITPASS PRO
    description: 12-month membership for primary cards issued on or after 1-Aug-2026; code sent by email within 30 days.
  - name: Smart EMI
    description: Purchases above INR2,500 may be converted to 6–48 month EMIs; applicable charges are shown at conversion.
  - name: Network variants
    description: BOBCARD lists RuPay and Mastercard CMA One variants. This record represents RuPay; Mastercard is not modeled separately.
  - name: Lost-card liability
    description: Issuer advertises zero liability for fraudulent transactions after immediate loss reporting, subject to issuer terms.
  concierge: false
  source:
    url: https://www.bobcard.co.in/credit-card-types/cma-one
    retrieved_on: 2026-10-26

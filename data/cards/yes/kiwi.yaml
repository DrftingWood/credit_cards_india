benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 3
      cycle: annual
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Optional Kiwi Neon subscribers receive one lounge pass for each annual
        spend milestone reached at ?50,000, ?1 lakh, and ?1.5 lakh after joining;
        one person per pass, maximum two hours, valid six months from issue. Not a
        base-card benefit.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 500
    max_txn_inr: 3000
    cap_per_cycle_inr: 250
    cycle: statement
  concierge: false
  other:
  - name: Optional Kiwi Neon membership
    description: '₹999 plus taxes per year, select-user eligibility. On eligible Kiwi
      card transactions, 2% scan-and-pay; annual membership spend milestones from
      enrollment: ₹50,000 earns a total 3% on eligible annual spend and one lounge
      pass, ₹1 lakh total 4% and one pass, ₹1.5 lakh total 5% and one pass. Each milestone
      cashback is net of cashback already credited under the subscription. Monthly
      cap is 1% of credit limit, excluding milestone cashback. Each lounge pass is
      one-person, up to two hours and valid six months after issue.'
  - name: Optional Kiwi Boost membership
    description: ₹49 plus taxes for three months, select-user eligibility and no auto-renewal.
      Increases eligible online transactions through Kiwi app from 0.5% to 1% while
      active; Scan & Pay remains at its usual rate. Kiwis are worth ₹0.25 and are
      redeemable in 500-Kiwi multiples.
  source:
    url: https://gokiwi.in/neon/neon2/
    retrieved_on: '2026-10-27'
    type: other
    confidence: high
    notes: Kiwi Neon membership terms (effective 01-Feb-2025) and Kiwi Boost terms
      (effective 29-Jun-2026) confirm select-user eligibility, prices, bonus rates,
      annual spend milestones and lounge voucher access. YES BANK current MITC confirms
      fuel waiver range/cycle cap.

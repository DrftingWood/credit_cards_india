  - type: catalog
    program: IDFC FIRST Rewards
    rate_inr_per_unit: 0.25
    constraints: INR 0.25 per point; Travel & Shop redemption is capped monthly and annually and at 70% of a booking.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/lic-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.base.applies_to_categories
    - rewards.accelerated[0].effective_rate
    - rewards.redemption[0].rate_inr_per_unit
    notes: >-
      Current issuer page and linked LIC Select Travel & Shop T&C. Other eligible retail earns 5 points per INR 125.
      Essentials (grocery, utilities, railways, FASTag, education, government) earn 5 points/INR 125 but share
      a 600-point monthly cap. App bookings earn additional bonus points equal to 20% of base points for hotels
      and 8% for flights, with a shared 8,000 bonus-point monthly cap; the linked T&C says 20/8% bonus, not a
      guaranteed total earn rate. The same live page separately shows 45 bonus points/INR125 on hotels, 20/INR125
      on flights, and a 40% headline; these do not reconcile with the June T&C percentages and remain unmodeled.
      Fuel, rent, non-LIC insurance, EMI and cash withdrawals earn no points.
      Linked Travel & Shop terms: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/LIC-Select-TnC-Travel-and-Shop.pdf
    local_refs:
    - docs/sources/idfc-first/lic-select/lic-select-travel-shop-terms-2026-06-18.pdf
  capping_rules:
  - Essentials earn 5 points per INR 125 up to a shared 600-point monthly cap; schema does not encode this cross-category cap.
  - Only the first five LIC-premium transactions per statement cycle qualify for 10 points per INR 125; the field model has no transaction-count cap.
  - Travel & Shop app booking bonus is 20% of base points on hotels and 8% on flights, shared cap 8,000 bonus points per calendar month. Bonus is credited after travel/check-in; cash-plus-points and EMI bookings are excluded.
  - Travel & Shop point redemption is limited to 70% of booking value and 100,000 points/month and 200,000 points/year. Points expire three years after earning.
benefits:
- effective_from: 2026-03-09
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: >-
        Spend INR20,000 or more during a calendar month to activate visits for the next month;
        activation remains valid through the following month. Visits are shared with add-on cards.
  welcome:
  - condition: >-
      Primary LIC Select cardholder; spend within 30 days of card setup; page says INR 10,000 while linked PDF says
      more than INR 10,000, so threshold conflict remains. Once per cardholder.
      Reversed, cancelled, disputed, wallet, ATM, add-on and EMI-converted transactions are excluded.
    benefit: >-
      Welcome points award conflicts across current issuer sources: the product page says 2,000 Reward Points,
      while its linked welcome-terms PDF dated 09-Mar-2026 says 2,500. Amount remains unresolved; issuer states
      fulfilment within 45 days of card generation after qualifying spend.
    value_inr: null
    window_days: 30
  - condition: >-
      Primary LIC Select cardholder's first EMI transaction within 30 days of card setup; EMI tenure must be at
      least 6 months; once per cardholder; no cashback for refunded EMI transactions.
    benefit: 5% cashback on the first qualifying EMI transaction, capped at INR 1,000; credited within 60 days after offer end.
    value_inr: 1000
    window_days: 30
  insurance:
  - type: air-accident
    sum_insured_inr: 100000000
    conditions: INR 1 crore; covered air ticket must be purchased using the card; insurer terms and claim deadlines apply.
  - type: personal-accident
    sum_insured_inr: 500000
    conditions: INR 5 lakh; at least one purchase or ATM withdrawal in preceding 30 days; subject to insurer terms.
  - type: lost-card-liability
    sum_insured_inr: 50000
    conditions: INR 50,000 card-liability/fraud cover; active-card condition and reporting deadlines apply.
  - type: purchase-protection
    sum_insured_inr: 25000
    conditions: INR 25,000; specified fire/burglary perils, up to 60 days from purchase; active-card and insurer terms apply.
  - type: credit-shield
    sum_insured_inr: 25000
    conditions: INR 25,000; applies to eligible card debits after accidental death; active-card and insurer terms apply.
  - type: baggage-loss
    sum_insured_inr: 4000
    conditions: INR 4,000 for loss of checked-in baggage on international travel; ticket must be purchased on the covered card.
  - type: other
    sum_insured_inr: 4000
    conditions: INR 4,000 for checked-in baggage delay on international travel; classify as trip delay; ticket must be purchased on the covered card.
  - type: trip-delay
    sum_insured_inr: 4000
    conditions: INR 4,000 for qualifying international flight delay; ticket must be purchased on the covered card.
  - type: other
    sum_insured_inr: 4000
    conditions: INR 4,000 for loss of passport/travel documents on qualifying international travel; ticket must be purchased on the covered card.

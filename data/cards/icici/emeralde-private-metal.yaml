    currency: points
    currency_name: ICICI Reward Points
    base:
      rate: 6
      per_inr: 200
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: international-spend
        canonical_categories: [international]
        multiplier: 1
        effective_rate: 6
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
      - category: ishop-hotels
        canonical_categories:
          - travel
        multiplier: 12
        cap_per_cycle: 18000
        cap_unit: points
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants:
            - ishop
        notes: Up to 12X reward points on HOTEL bookings via ICICI iShop (booked via iShop only). Shares the 18,000 RP/calendar-month iShop cap (ICICI capping PDF, WEF 1-Oct-2025) with iShop flights; iShop also gives 6X on bus + shopping vouchers (not modelled).
      - category: ishop-flights
        canonical_categories:
          - travel
        multiplier: 6
        cap_per_cycle: 18000
        cap_unit: points
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants:
            - ishop
        notes: Up to 6X reward points on FLIGHT bookings via ICICI iShop (booked via iShop only). Shares the 18,000 RP/calendar-month iShop cap with iShop hotels.
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    capping_rules:
      - "Grocery, Utilities and Education: max 1,000 Reward Points per category per statement cycle"
      - "Insurance payments: max 5,000 Reward Points per statement cycle"
    redemption:
      - type: catalog
        program: ICICI Rewards
        rate_inr_per_unit: 1.0
      - type: airmiles
        program: Multiple
        ratio: "1:1"
        constraints: 1 transfer partner(s); ratios card-point:partner-unit. realized Rs 1.00 = non-transfer floor; best transfer Rs 0.55; 0 beat the floor. Only transfer partner is Air India (1:1); at ~Rs 0.55 it is BELOW the Rs 1.0 iShop floor — iShop is better.
        transfer_partners:
          - partner_name: Air India Maharaja Club
            partner_type: airline
            transfer_ratio: "1:1"
            last_verified_on: '2026-07-05'
            notes: 1:1 -> ~Rs 0.55/pt [below floor — avoid]
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-private-metal-credit-card
      retrieved_on: 2026-07-05

      notes: 'Encoded 2026-07-05, full-visibility: per-partner ratios; realized=floor, face=best transfer. No blend.'

benefits:
- effective_from: 2026-07-01
  effective_until: null
  welcome:
  - condition: One eligible IT/GST, travel or advertising transaction within 30 days of card issuance; first-time cardholders only, not upgrades, migrations or conversions (rule effective 2025-10-25).
    benefit: Amazon Prime membership or INR 1,500 Amazon voucher
    value_inr: 1500
    window_days: 30
  milestones:
  - spend_inr: 250000
    cycle: quarterly
    benefit: INR 5,000 MakeMyTrip or Reliance Digital voucher on eligible retail spend
    value_inr: 5000
    reward_kind: voucher
    reward_units: 1
    reward_currency_name: Voucher
    is_repeatable: true
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - visa
    international:
      visits_per_cycle: 6
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
  concierge: false
  other:
  - name: Domestic flight cancellation voucher
    description: One MakeMyTrip domestic flight cancellation voucher per calendar quarter; lounge and voucher benefits unlock after INR 75,000 eligible spend in the previous calendar quarter.
  - name: Credit liability cover
    description: INR 9 lakh credit liability cover; policy terms apply.
  - name: Lost-card liability
    description: Zero liability for fraudulent transactions if lost or stolen card is reported immediately to HDFC customer care.
  - name: Optional business insurance
    description: Optional business insurance package starts at INR 3,785 per year; this is a paid add-on, not complimentary card cover.
  - name: SmartPay offer
    description: Current issuer page advertises up to INR 1,800 first-year cashback and e-vouchers up to INR 800 for adding two or more bills; offer terms apply.
  - name: Dining offer
    description: 10% discount on dining bills at participating restaurants through Swiggy Dineout; offer terms apply.
  - name: SmartBuy platform benefits
    description: Up to 10X Reward Points on selected SmartBuy purchases, capped at 4,000 points per month; terms apply.
  source:
    url: https://www.hdfc.bank.in/business-credit-cards/biz-power-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - benefits.welcome
    - benefits.milestones
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.other
    notes: >-
      Current benefits snapshot from 2026-07-01. Domestic lounge and MMT voucher each require INR 75,000 spend in the
      preceding calendar quarter. Six international visits require Priority Pass; application follows four retail
      transactions. Voucher milestone: INR 5,000 on INR 2.5 lakh quarterly retail spend excluding fuel, IT, GST and EMI.
      Welcome benefit is limited to first-time cardholders since 2025-10-25. The issuer also lists INR 9 lakh credit
      cover, immediate lost-card reporting, optional paid business insurance and current platform/dining offers.

benefits:
- effective_from: '2026-10-25'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: 0
      via:
      - visa
      notes: Four domestic visits per calendar quarter per eligible card; primary and supplementary cards each have
        an individual allowance. INR 2 validation swipe.
    international:
      visits_per_cycle: 2
      cycle: monthly
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Two Priority Pass uses per month per card if individual-account FUM is at least INR 30 lakh in the
        calendar month of use and the card is active. Additional and guest visits are chargeable (up to USD 35).
        FUM includes specified bank balances, investments, Demat, eligible insurance premiums and Homesaver funds.
  insurance:
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: Primary cardholder only; overseas air ticket must be purchased using this card; additional policy
      conditions and qualifying recent POS/e-commerce swipe apply.
  - type: travel-medical
    sum_insured_inr: null
    sum_insured_amount: 25000
    sum_insured_currency: USD
    conditions: Up to USD 25,000 emergency medical expenses for primary cardholder on international travel outside
      India; USD 100 deductible; subject to insurer policy.
  fuel_surcharge_waiver: null
  source:
    url: https://www.sc.bank.in/content/dam/sc/in/credit-cards/docs/in-consolidated-priority-visa-infinite-terms-conditions.pdf
    retrieved_on: '2026-10-25'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified:

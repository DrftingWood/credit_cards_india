    - benefits.lounge_access.international.visits_per_cycle
    - benefits.golf.rounds_per_cycle
    - benefits.golf.lessons_per_cycle
    - benefits.welcome
    - benefits.insurance
    - benefits.movies
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    local_refs:
    - docs/sources/idfc-first/first-private/first-private-consolidated-terms-2026-07-17.pdf
    - docs/sources/idfc-first/first-private/cfar-policy-linked-current-page.pdf
    notes: >-
      Current consolidated terms dated 17-Jul-2026:
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/first-private/FIRST-Private-Credit-Card-Consolidated-TnC-17072026.pdf
      Current policy runs from 8-May-2026 or later card-issue date (whichever is
      later) through 7-May-2027. The separately linked one-page CFAR PDF is stale
      and ends 7-May-2025; the consolidated July-2026 terms and current card page
      support current coverage.
      The issuer says spending milestones were discontinued effective 17-Jul-2026;
      current issue fees and welcome points are in the product page. Fuel waiver
      schedule is in the issuer credit-card policy document:
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/regulatory-disclosures/IDFC-FIRST-Bank-Credit-Card-Policy-Document.pdf

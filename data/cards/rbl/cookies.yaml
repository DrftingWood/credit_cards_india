fees:
- effective_from: '2026-10-26'
  effective_until: null
  joining_fee_inr: null
  annual_fee_inr: null
  fee_waiver: null
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.99
  cash_advance_fee:
    pct: 2.5
    min_inr: 500
  gst_applicable: true
  notes: 'Current Cookies card is billed a monthly membership fee of INR100 + GST (not an INR500 annual fee); RBL
    waives the subsequent month fee when eligible settled calendar-month purchases reach INR5,000. The schema has
    no monthly-fee field, so joining_fee_inr, annual_fee_inr and annual fee_waiver are null rather than misrepresenting
    the charge. Add-on card fee is INR200 in the current MITC; schedule of charges permits INR0-5,000 by card/variant.
    Forex markup is up to 3.5%. Finance charges are bureau-category dependent: current MITC lists 3.35% p.m. for
    >775, 3.85% for 725-775, and 3.99% for <725; record stores maximum. Other current charges include reward redemption
    INR99 + GST, branch cash payment INR100, and late fee 12.5% of outstanding (INR5-INR1,300); schedule charges
    say overlimit NIL. GST applies to fees/charges.'
  source:
    url: https://webassets.rbl.bank.in/document/Credit%20Cards/RBL-MITC-final.pdf
    retrieved_on: '2026-10-26'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    local_refs:
    - docs/sources/rbl/cookies/mitc-retrieved-2026-10-26.pdf
    - docs/sources/rbl/cookies/schedule-charges-retrieved-2026-10-26.pdf
    fields_verified:
    - fees.forex_markup_pct
    - fees.finance_charge_monthly_pct
    - fees.cash_advance_fee.pct
    - fees.cash_advance_fee.min_inr
    notes: Cookies current variant monthly fee and spend waiver appear on product terms and MITC; the schedule of
      charges provides common fees and current network variants.
rewards:
- effective_from: '2026-10-26'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 0.2
    unit_value_inr_realized: 0.2
  accelerated:
  - category: online-spend

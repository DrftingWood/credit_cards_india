launched_on: '2024-10-03'
discontinued_on: null
fees:
- effective_from: '2026-10-27'
  effective_until: null
  joining_fee_inr: 999
  annual_fee_inr: 999
  fee_waiver:
    spend_inr: 300000
    cycle: annual
    conditions: Primary cardholder gets the next year's annual fee reversed from year two onward after at least
      INR300,000 total card spend in the previous anniversary year; EMI transactions do not count.
  forex_markup_pct: 0.99
  finance_charge_monthly_pct: 3.75
  gst_applicable: true
  source:
    url: https://www.icici.bank.in/personal-banking/cards/credit-card/makemytrip/makemytrip-icici-bank-credit-card
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:

    - docs/sources/idfc-first/diamond-reserve/current-customer-mitc.pdf
    notes: >-
      Current fee and add-on details are on the product page. Diamond Reserve launched
      on 6-Jan-2026 already with zero forex. The zero-forex and cash-advance terms also
      appear in the issuer launch announcement:
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/news-media/press-release/Press-Release-Diamond-Reserve-Credit-Card.pdf
rewards:
- effective_from: 2026-06-18
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 150
    unit_value_inr: 0.25
    unit_value_inr_realized: null
    notes: >-
      One point is valued at INR 0.25. The ordinary tier is 3 points per INR 150
      for eligible spends up to INR 20,000 in a monthly statement cycle and 10
      points per INR 150 on eligible incremental spends above INR 20,000. Reward
      accrual is limited to the assigned credit limit. Current product terms
      separately give 1 point per INR 150 for transactions up to INR 2,000 and 3
      points per INR 150 above INR 2,000 on the linked FIRST Digital Credit Card;
      do not conflate that UPI-linked product term with the regular card earn.
  accelerated:
  - category: eligible-incremental-spend-above-20000
    canonical_categories:
    - other
    multiplier: 10
    effective_rate: 10
    effective_per_inr: 150
    cap_status: not-published
    cap_unit: points
    source:
      url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/Diamond-Reserve-Terms%26Conditions.pdf
      retrieved_on: 2026-10-27
      type: issuer-pdf
      confidence: high
      fields_verified:
      - rewards.accelerated.effective_rate
      - rewards.accelerated.effective_per_inr
    notes: >-
      Applies to eligible incremental spends above INR 20,000 per monthly statement
      cycle. Birthday transactions also earn 10X per current issuer FAQ. The schema
      cannot express either the incremental threshold or birthday window exactly.
  - category: eligible-general-spend-up-to-threshold

  notes: Current card page states 4 EDGE points per INR 200 and no points on movies, fuel, insurance, wallet, rent, utilities, education, government institutions, EMI, jewellery, gift cards, bridge fees, road fees and tolls. Movies are documented in notes because the reward exclusion enum has no movie category; exact movie MCCs are not published for this offer. The 2025 card-specific revision also explicitly names utility/telecom, cash advances and repayments; cash advances are listed in the schema, while repayments have no enum category and remain documented here. Point balance may be forfeited 30 days after card closure or when MAD remains overdue over 90 days. Universal cash value is unpublished.

id: sbi-reliance
name: Reliance SBI Card
image_path: /cards/sbi/reliance.webp
issuer: sbi
network: rupay
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: Reliance
  category: retail
  partner_website: https://www.reliancedigital.in
status: active
launched_on: 2023-10-31
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 499
    annual_fee_inr: 499
    renewal_fee_inr: 499
    fee_waiver:
      spend_inr: 100000
      cycle: annual
      conditions: "Renewal fee reversed on annual spends of ₹1,00,000 in the previous year (second year onwards)."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    supplementary_card_fee_inr: 0
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.25
    accelerated:
      - category: ajio-jiomart-online
        canonical_categories: [online]
        multiplier: 1
        effective_rate: 10
        cap_unit: points
        merchants: [ajio, jiomart]
        channel:
          class: cobrand-merchant
          merchants: [ajio, jiomart]
        notes: "10 Reward Points per ₹100 on AJIO & JioMart online stores (except UPI payments)."
      - category: reliance-retail
        canonical_categories: [online]
        multiplier: 1
        effective_rate: 5
        cap_unit: points
        merchants: [reliance-digital, reliance-smart, trends, netmeds]
        channel:
          class: cobrand-merchant
          merchants: [reliance-digital, reliance-smart, trends, netmeds]
        notes: "5 Reward Points per ₹100 at other participating Reliance Retail stores (except UPI payments)."
      - category: dining-movies
        canonical_categories: [dining, entertainment]
        multiplier: 5
        effective_rate: 5
        cap_per_cycle: 5000
        cap_unit: points
        cycle: statement
        notes: "5 Reward Points per INR 100 on dining and movies; 5,000-point statement-cycle cap, then base earning continues."
    redemption:
      - type: voucher
        program: Reliance Retail gift vouchers
        rate_inr_per_unit: 0.25
        constraints: "Closed-loop redemption only into Reliance Retail vouchers; no cash, statement credit or card charge redemption. Four Reward Points equal INR 1."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high

    mcc_exclusions: ['6513', '9311', '9399', '5172', '5541', '5542', '5983', '6540', '6541']
    capping_rules:
      - "Reward points expire 24 months after accrual. Rent MCC 6513 excluded from 1-Apr-2024; government MCCs 9311 and 9399 excluded from 15-Jun-2024. Wallet load MCCs 6540 and 6541 excluded."
benefits:
  - effective_from: 2026-07-03
    effective_until: null
    welcome:
      - condition: "Payment of Joining Fee"
        benefit: "Reliance Retail e-voucher worth ₹500 (delivered within 30 days of joining fee realisation)"
        value_inr: 500
        window_days: 30
      - condition: "Payment of Joining Fee"
        benefit: "Additional discount vouchers worth ₹3,200 across participating Reliance Retail stores"
        value_inr: 3200
    milestones:
      - spend_inr: 25000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹500"
        value_inr: 500
      - spend_inr: 50000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹750"
        value_inr: 750
      - spend_inr: 80000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹1,000"
        value_inr: 1000
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: statement
      notes: "1% fuel surcharge waiver on transactions between ₹500 and ₹3,000 at all petrol pumps. Max ₹100 per statement cycle."
    other:
      - name: "MakeMyTrip (Mastercard)"
        description: "Up to 15% cashback on hotels and flight bookings at MakeMyTrip."
      - name: "ZoomCar (Mastercard)"
        description: "Up to 20% off on ZoomCar."
      - name: "Lifestyle Stores (Mastercard)"
        description: "Up to 15% off on shopping at Lifestyle Stores."
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high

eligibility:
  min_age: 21
  max_age: 70
  age_ranges:
    salaried: {min_age: 21, max_age: 65}
    self_employed: {min_age: 25, max_age: 70}
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: "Tier-standard entry income requirement (~₹3L p.a.) per aggregator consensus. SBI Card policy states age 21?65 for salaried applicants and 25?70 for self-employed applicants; the broad 21?70 range preserves the occupation-specific detail in age_ranges. No card-specific minimum income or fixed credit-score cutoff is published; approval depends on SBI Card underwriting."
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/who-we-are/notices/policy-for-the-issuance-and-conduct-of-credit-cards-2023.pdf
    retrieved_on: '2026-10-25'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified: [eligibility.min_age, eligibility.max_age, eligibility.age_ranges]
    notes: "Issuer policy section 3 gives the occupation-specific age ranges. SBI states card-specific income minimums vary; this policy does not publish a fixed credit-score cutoff."
application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card.html


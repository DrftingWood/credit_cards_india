benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      notes: Primary cardholder only; INR75,000+ spend in preceding quarter unlocks following quarter. For paired
        dual-card variants FAQ says one visit per quarter per variant.
  golf:
    rounds_per_cycle: 2
    lessons_per_cycle: 2
    cycle: monthly
    notes: One round or lesson per INR50,000 eligible retail spend in preceding calendar month; maximum two per
      month; primary cardholder. Credited by 10th of following month, usable next two months.
  milestones:
  - spend_inr: 300000
    cycle: annual
    benefit: 3,000 points on INR300,000 annual spend; 1,500 for each additional INR100,000, up to 15,000 points/year.
    reward_kind: points
    reward_units: 3000
    reward_currency_name: ICICI Reward Points
    trigger_window: anniversary-year
    value_inr: null
  - spend_inr: 100000
    cycle: annual
    benefit: 1,500 points per additional INR100,000 annual spend after the first INR300,000, subject to 15,000 points/year
      maximum.
    reward_kind: points
    reward_units: 1500
    reward_currency_name: ICICI Reward Points
    trigger_window: anniversary-year
    is_repeatable: true
    value_inr: null
  welcome:
  - condition: Joining fee paid; claim through ICICI Rewards within offer terms.
    benefit: 'Core vouchers: Tata CLiQ INR2,000; EaseMyTrip domestic flights INR2,000 (two INR1,000 vouchers); Croma
      INR1,000 (two INR500). Current page separately lists EaseMyTrip holiday gift card INR3,000, Elivaas coupon
      INR10,000 (minimum INR50,000 transaction), 3-month EazyDiner Prime and Avis offers with separate restrictions.'
    value_inr: 5000
  movies:
    type: discount
    partner: BookMyShow and INOX
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 150
    notes: 25% off up to INR150, twice monthly at BMS and INOX. BMS from Apr 1, 2026 requires INR25,000+ eligible
      spend in preceding quarter to unlock subsequent quarter. FAQ says one BMS offer/month/variant for dual-card
      pairings and add-on card must individually meet INR25,000. INOX spend gate not stated.
  insurance:
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: Primary cardholder; international air travel only, ticket bought using card. Product FAQ says card
      used within prior 60 days; linked policy updated Dec 2025 says an active card needs transaction within prior
      90 days. Conflict retained. Policy excludes on-duty armed forces/police/pilots/air crew and terrorism.
  - type: personal-accident
    sum_insured_inr: 200000
    conditions: RuPay variant only, per current product page.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: null
    cycle: monthly
    notes: 1% waiver on INR400?INR4,000 fuel transactions at any fuel outlet in India; primary and supplementary

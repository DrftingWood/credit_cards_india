  capping_rules:
  - 'No overall rewards cap established in current terms. The record cannot encode separate Visa and RuPay base
    rates/minimum transactions: Visa earns 10 Rewards per INR100 on eligible transactions of INR20+, RuPay earns
    5 Rewards per INR100 on eligible transactions of INR500+. Scapia-app travel earns 20 Rewards per INR100. Utility/telecom/cable
    rewards are excluded; high-spend transaction convenience fees are described in notes. Government-service MCC
    exclusion is a range (9099-9999) and cannot be enumerated exactly in mcc_exclusions.'
  notes: 'Current terms vary by network variant: Visa earns 10 Rewards per INR100 on eligible purchases of INR20+;
    RuPay earns 5 Rewards per INR100 on eligible purchases of INR500 or more. The product record cannot encode network-specific
    base rates and minimum transaction thresholds; the structured base is the conservative RuPay rate and the Visa
    rate is documented here. Scapia-app travel bookings earn 20 Rewards per INR100. Rewards convert 1:1 to Scapia
    Coins, worth INR0.20 each (5 coins=INR1), so 10/20 Rewards per INR100 represent about 2%/4% value. Ineligible
    categories and published MCCs are listed; the agreement also excludes business services and government-service
    MCCs 9099-9999. Utility, telecom and cable spend over INR50,000 per billing cycle may incur a 1% convenience
    fee. Fuel spend over INR50,000 per cycle may incur a 1% convenience fee.'

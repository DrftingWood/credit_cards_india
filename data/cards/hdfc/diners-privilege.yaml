    - fees.fee_waiver.spend_inr
    - fees.forex_markup_pct
    - fees.finance_charge_monthly_pct
    - fees.cash_advance_fee
    notes: Current product fee page confirms fee, waiver and forex; HDFC personal MITC v4.15 supplies finance/cash-advance
      charges and confirms fuel surcharge waiver is not applicable. May 2026 notice records 1.75% DCC and INR 199
      reissuance, while the current fee-page FAQ says INR 100 for reissue; discrepancy unresolved.
rewards:
- effective_from: '2026-05-15'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 4
    per_inr: 200
    unit_value_inr: 0.5
    unit_value_inr_realized: 0.2
    notes: 'Current product page says 4 RP/INR 200 on eligible general spends. Redemption value varies by route:
      SmartBuy flights/hotels INR 0.50, select restaurants INR 0.50, exclusive catalogue up to INR 0.35, cashback
      up to INR 0.20. Model uses best-case and conservative cashback values; route-specific net realized value depends
      on use.'
  accelerated:
  - category: smartbuy-flights-hotels
    canonical_categories:
    - travel
    multiplier: 10
    effective_rate: 40
    effective_per_inr: 200
    cap_status: not-published
    cap_unit: points
    channel:
      required: true
      class: issuer-portal
      merchants:
      - smartbuy
    notes: Current issuer page advertises up to 10X points via SmartBuy. Exact eligible portal categories, earn rate by
      category and a category cap are not specified in the reviewed current card terms; treat this as an advertised
      maximum, not a universal 10X rate.
  - category: dining-food-delivery
    canonical_categories:
    - dining
    multiplier: 4
    effective_rate: 16
    effective_per_inr: 200
    cap_per_cycle: 2500
    cap_unit: points
    cycle: monthly
    mcc_list:
    - '5812'
    - '5814'
    channel:
      required: true
      class: food-delivery
      merchants:
      - swiggy
      - zomato
    notes: '5X total on eligible direct online food orders from Swiggy/Zomato/Eternal: 4 base + 16 incremental RP per
      INR 200. Incremental bonus cap 2,500 points/month combined; minimum transaction INR 200. June-2026 terms specify
      MCC 5812/5814 or merchant TID/MID; settled online orders only, no wallet payments, and reversal-adjusted net
      spend. This matches the May update and current product page.'
  exclusions:
  - fuel
  - wallet-loads
  - emi
  - rent
  - government
  - cash-advance
  category_caps:
  - category: insurance
    mcc_list:
    - '1411'
    - '1235'
    - '5960'
    - '6300'
    - '6381'
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: HDFC personal MITC v4.15 caps insurance points at 2,000 per month for this card group, effective 1-Jul-2025.
  - category: groceries
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: HDFC MITC grocery cap for Diners Privilege.
  - category: utilities
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: HDFC MITC utility cap, effective 1-Sep-2024.
  - category: telecom
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: HDFC MITC telecom cap, effective 1-Sep-2024.
  reward_cap:
    max_units: 50000
    cap_unit: points
    cycle: statement
  capping_rules:
  - Reward points expire 2 years after accumulation. Points are nullified if the card is unused for more than 365 days.
  - SmartBuy flight/hotel redemption is limited to 50% of booking value; selected product/voucher redemption is limited to 70% of value.
  - Cashback redemption is capped at 50,000 points per calendar month; minimum cashback redemption is INR 500 (2,500 points at INR 0.20 each). Cashback redemption also incurs INR 50 + GST per request. Catalogue redemption incurs INR 99 + GST per request.
  - Reward points earned on eligible settled transactions are reversed on refunds/reversals; HDFC may reverse points for spend converted to SmartEMI. Third-party-app education payments are excluded under MITC.
  redemption:
  - type: catalog
    program: Exclusive catalogue
    rate_inr_per_unit: 0.35
    fee_inr: 99
    constraints: Exclusive catalogue up to INR 0.35 per point; selected product/voucher redemptions may use points for up to 70% of value. HDFC MITC fee INR 99 + GST per catalogue redemption request.
  - type: statement-credit
    rate_inr_per_unit: 0.2
    min_units: 2500
    fee_inr: 50
    constraints: INR 0.20 per point; minimum cashback amount INR 500 (2,500 points), capped at 50,000 points per calendar month. HDFC MITC cashback redemption fee INR 50 + GST per request; cashback credit does not count as payment of the last statement.
  - type: other
    program: SmartBuy flights and hotels
    rate_inr_per_unit: 0.5
    constraints: 50% maximum of booking value may be redeemed through Reward Points; balance must be paid with the card.
  - type: other
    program: Select restaurants
    rate_inr_per_unit: 0.5

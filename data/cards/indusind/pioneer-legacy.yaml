  gst_applicable: true
  notes: Current MITC lists joining fee options of INR 50,000 and INR 5,000, while the product page advertises INR 45,000 with INR 50,000 vouchers or INR 5,000 waived after INR 50,000 spend in 90 days, plus limited lifetime-free offers. Actual fee is disclosed at application; a single joining fee cannot represent these plans. Forex is 1.8% on paid variants and 3.5% on complimentary variants, so no single rate is assigned. Cash-advance fee is waived. The current MITC also charges 1% + GST on cumulative fuel transactions above INR50,000 per statement cycle. Network variants and tiers are not normalized as separate records.

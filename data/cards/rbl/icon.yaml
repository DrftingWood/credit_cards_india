rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 2
    per_inr: 100
    unit_value_inr: null
    unit_value_inr_realized: null
  accelerated:
  - category: international-purchases
    canonical_categories:
    - international
    multiplier: 10
    effective_rate: 20
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    notes: Total rate is 20 points per INR100; after 2,000 points in this category in a billing cycle, eligible spend earns the base 2 points per INR100.
  - category: weekend-dining
    canonical_categories:
    - dining
    multiplier: 10
    effective_rate: 20
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    notes: Total rate is 20 points per INR100; after 2,000 points in this category in a billing cycle, eligible spend earns the base 2 points per INR100.
  exclusions:
  - emi
  - cash-advance
  - rent
  - other
  mcc_exclusions:
  - '0066'
  - '4011'
  - '4112'
  - '6513'
  - '5960'
  capping_rules:
  - Eligible retail transactions earn 2 reward points per INR100; international purchase and weekend dining categories earn 20 per INR100 up to 2,000 points per category per billing cycle, then revert to the base rate.
  - Card-specific terms name railways, rental and miscellaneous payments as excluded. Issuer lists MCC 0066 for railways, 4011/4112, 6513 for rental and 5960 for miscellaneous; 0066 is preserved as printed despite not being a four-digit MCC.
  - Points post within 45 days of eligible transaction settlement. Redemption is through RBL Rewards; the issuer documents no universal point-to-INR value in these terms.
  redemption:
  - type: catalog
    program: RBL Rewards
    rate_inr_per_unit: null
    constraints: Redeem through the RBL Rewards portal. The issuer's card-specific terms do not state a fixed INR conversion rate.

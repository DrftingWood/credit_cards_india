  capping_rules:
  - White Pass is earned on settled spend milestones in the card-anniversary year; the live White Pass page states an annual maximum of INR 250,000.
  - The dedicated White Pass page says balances are valid for 15 months from credit; Kotak's general cardholder terms state validity through 90 days after the anniversary cycle. These validity rules conflict and need issuer clarification.
  - The live White Pass milestone ladder differs from the schedule in Kotak's general cardholder terms. Record follows the live card-specific White Pass page; applicability/effective date of the change is unpublished.
  - Multiple active White and/or White Reserve cards are not eligible to receive White Pass, per current card page.

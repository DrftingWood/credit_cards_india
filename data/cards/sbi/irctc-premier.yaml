      retrieved_on: '2026-11-01'
      type: issuer-pdf
      confidence: high
      method: pdf-extract
      fields_verified: [rewards.base, rewards.accelerated, rewards.exclusions, rewards.redemption, rewards.capping_rules]
      notes: "Current issuer booklet verifies 10% on eligible AC rail fare with no monthly/annual value-back cap; 5 points/₹125 on Air and e-catering (Air capped at 750 points/month); 3 points/₹125 on dining and standing-instruction utilities; and 1 point/₹125 on other eligible non-fuel retail. Rent rewards stopped 2024-04-15; government rewards stopped 2024-07-15."
    mcc_exclusions: ['6513']
    capping_rules:
      - "No capping on monthly/annual IRCTC rail value-back per current IRCTC Premier booklet; Air booking rewards have a separate cap of 750 points per monthly statement cycle."
      - "The current booklet states no separate cap for e-catering rewards; this no-published-cap status should be rechecked whenever the issuer revises the booklet."

  source:
    url:
      https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/swiggy-blck-hdfc-bank-credit-card/pdf/tncs-swiggy-blck-hdfc-bank-credit-card-15102026.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    fields_verified:
    - benefits.welcome
    notes: Product page and 15-Oct-2026 specific T&Cs reviewed. The product page confirms Mastercard
      Golf benefits of four green-fee rounds and 12 lessons/year. The specific terms require
      activation within 37 days and in-app claiming; no monetary value is published for the 3-month
      membership.
  other:
  - name: Mastercard World golf
    description: Mastercard's 2026 World program lists four complimentary green-fee rounds and 12
      golf lessons per year, up to one of each per month; additional green-fee bookings are discounted
      up to 50% and INR 1,800. The linked program terms run through 31-Dec-2026.
  - name: Birthday-week Dineout offer
    description: Additional 10% discount up to INR 500 on a minimum INR 3,000 Dineout order for
      seven days (three days before/after registered birthday), once per cardholder; available only
      after 30 days from card activation.
  - name: Limited-time partner discounts
    description: Current 15-Oct-2026 issuer T&Cs advertise 5% cashback plus instant discounts on
      Cleartrip and Nykaa; offers are explicitly limited-time and no end dates are published.
  - name: Merchant and MCC limits
    description: Only transactions recognized under selected merchant IDs qualify. The 5% terms
      include a catch-all online MCC row excluding standard excluded MCCs, but do not provide a
      static full merchant-ID list; the record retains enumerated MCCs and documents this coverage
      limit.
  - name: Gaming MCC discrepancy
    description: The 15-Oct-2026 card T&Cs list gaming MCC 5816; the issuer's separate live 1%
      cashback-details PDF lists MCC 7995. Both are treated as excluded pending issuer
      clarification.

      product page says no reward point redemption fee, so fee conflict is unresolved. Product point prices vary; points expire
      12 months after accumulation.
  source:
    url: https://www.axis.bank.in/cards/credit-card/lic-axis-bank-signature-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high

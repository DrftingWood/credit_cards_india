# defaults (not individually source-verified). Exact monthly caps on some cashback
# cards remain source/HTML-noted. See docs/sources/<issuer>/ for evidence.
# ---------------------------------------------------------------------------
id: sbi-air-india-platinum
name: Air India SBI Platinum Credit Card
issuer: sbi
network: visa
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: Air India
  category: airline
  partner_website: https://www.airindia.com
status: active
launched_on: 2013-01-01
discontinued_on: null

# NOTE: Post the Vistara-Air India merger (completed Nov-2024), the loyalty
# programme is now Air India Maharaja Club (Maharaja Points). The card earns
# SBI Reward Points that convert to Maharaja Points (min 5,000, multiples of
# 5,000).

fees:
  - effective_from: 2013-01-01
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/air-india-sbi-platinum-card.html
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2013-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    loyalty_program: null
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.5
    accelerated:
      - category: air-india-bookings
        canonical_categories: [travel]
        multiplier: 2.5
        effective_rate: 5
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [air-india]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [air-india-direct]
        notes: "5 Reward Points per ₹100 spent on Air India tickets booked via website, app, booking offices or call centres (including Super Saver tickets for self and others)."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - emi
    redemption:
      - type: airmiles
        program: Air India Maharaja Club
        constraints: "Reward Points convert to Air India Maharaja Points (min 5,000, in multiples of 5,000); credited within 7 working days; redeemable for Air India / Star Alliance award tickets."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/air-india-sbi-platinum-card.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2013-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [visa]
        notes: "4 complimentary domestic lounge visits per year (max. 1 per quarter)."
    welcome:
      - condition: "Joining fee paid"
        benefit: "5,000 Reward Points"
        value_inr: 2500
        window_days: 15
      - condition: "Joining fee paid"
        benefit: "Complimentary Air India Maharaja Club membership"
    milestones:
      - spend_inr: 200000
        cycle: annual
        benefit: "5,000 bonus Reward Points on annual spends of ₹2 lakhs"
        value_inr: 2500
      - spend_inr: 300000
        cycle: annual
        benefit: "10,000 bonus Reward Points on annual spends of ₹3 lakhs"
        value_inr: 5000
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: 250
      cycle: monthly
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/air-india-sbi-platinum-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/air-india-sbi-platinum-card.html

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, airline, air-india, miles, entry]

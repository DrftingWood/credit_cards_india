    rate_inr_per_unit: 0.25
  notes: 1% CashPoints on other eligible spends; each transaction must be at least INR 100. Each rewards feature has its own 500-point calendar-month cap. Points post in the first week of the following month based on settlement date. CashPoints are reward points valued at INR 0.25 each for statement credit; the current live page lists a 500-point minimum redemption, while the linked card terms list 2,000 points. The difference remains unresolved. Card-specific terms state two-year expiry.
  source:
    url: https://www.hdfc.bank.in/credit-cards/hdfc-bank-upi-rupay-credit-card
    retrieved_on: '2026-10-27'
    confidence: high
    notes: HDFC defines CashPoints as reward points; INR 0.25 per point for statement cashback. Current live page says 500-point minimum redemption; linked card T&Cs dated 27-Mar-2025 say 2,000 points. Statement-credit redemption has no handling fee in those T&Cs; catalogue redemption is listed at INR 99 plus tax. CashPoints expire after two years.

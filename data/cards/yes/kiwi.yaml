  capping_rules:
  - 'Kiwi-issued-card rewards policy: maximum monthly earn is 1% of assigned credit
    limit measured in Kiwis; at ₹0.25 per Kiwi, this is equivalent to 0.25% of limit
    in cash value. Kiwis accrue per ₹100 transaction increment (fractions rounded
    down).'
  - Minimum redemption is 500 Kiwis and redemptions must be in multiples of 500; Kiwis
    can be redeemed to the customer’s linked goaxb UPI ID.
  - Reward exclusions are determined by merchant category code. Direct educational
    institution payments may earn even though third-party-app education payments do
    not; policy also excludes agriculture, horticulture/veterinary, business services,
    government, marketing/advertising, professional services, retail/fuel, tolls,
    utilities, and miscellaneous/financial/insurance/real-estate/gift-card merchant
    codes.
  redemption:
  - type: cashback-bank
    program: Kiwi App Instant Cashback
    rate_inr_per_unit: 0.25
    constraints: 4 Kiwis = ₹1. Redeem 500 Kiwis minimum and in multiples of 500 to
      a linked goaxb UPI ID.

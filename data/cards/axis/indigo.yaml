    - rewards.base.per_inr
    - rewards.accelerated
    - rewards.exclusions
    - rewards.capping_rules
    notes: Current issuer T&Cs confirm base 1 BluChip per INR 100, grocery/dining 2 per INR 100 (grocery MCCs 5399, 5422, 5441, 5411, 5451, 5462, 5499, 5999; dining MCCs 5812, 5814, 5813), and IndiGo channel 3 per INR 100 (MCC 4511 with merchant-name keywords IndiGo or Interglobe). UPI earns share a 750 BluChip statement-month cap across base and grocery/dining accelerators, excluding IndiGo channels; capped UPI earns do not count toward milestones. Lifetime-free and first-year-free customers are excluded from regular earn. BluChips have no cash value; estimated INR 0.40-0.60 redemption values are variable and controlled by IndiGo. The official IndiGo FAQ sets a 500-BluChip starting minimum and limits redemption to eligible flights, not 6E add-ons.
  capping_rules:
  - UPI earns across base and grocery/dining accelerated categories share a cap of 750 BluChips per statement month; IndiGo-channel spend is excluded from this cap. UPI earns above the cap do not count toward milestone spend.

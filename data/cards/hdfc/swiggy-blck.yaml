  - condition: Activate the card within 37 days of issuance using an accepted activation method,
      then claim in the Swiggy app.
    benefit: Complimentary Swiggy BLCK membership for three months; existing BLCK members receive a
      three-month extension. Membership claim appears in the app within 2-3 days after activation.
    value_inr:
    window_days: 37
  fuel_surcharge_waiver:

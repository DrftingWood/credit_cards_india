    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
  notes: 'Current product page sets 2 quarterly visits and a prior-quarter INR 50,000 lounge spend gate effective 1 Oct 2026; 30 Sep KFS confirms fuel waiver and cap. Welcome value is a model-derived proxy using the 2,000 points and INR 0.0025 catalogue rate, not a guaranteed rupee payout. Card welcome T&C also has a dining-membership offer on INR 10,000 spend in 30 days but does not identify membership type/duration. Insurance details: https://www.au.bank.in/pdf/credit-card/insurance-terms-and-conditions.pdf.'

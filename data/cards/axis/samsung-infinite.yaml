      notes: 'Archived Axis Priority Pass terms grant 6 complimentary visits plus an additional 6 visits per calendar year, auto-renewed for active cardholders; the current product page advertises only 6. Retain 12 based on the card-linked detailed terms and flag the page/PDF mismatch. Guests and excess visits are chargeable.'

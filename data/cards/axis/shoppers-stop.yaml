      after INR2,500 qualifying purchase; INR250 online voucher; complimentary Golden Glow membership
    value_inr: 2250
    window_days: null
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 400
    cycle: statement
    notes: 1% waiver on fuel transactions INR400-INR5,000, max INR400 per statement cycle. GST on surcharge is non-refundable;
      fuel earns no First Citizen points.
  concierge: false

rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: AU Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 0.0025
    unit_value_inr_realized: 0.002
    applies_to_categories:
    - utilities
    - telecom
    - insurance
  accelerated:
  - category: online spends
    effective_rate: 2
    effective_per_inr: 100
    canonical_categories:
    - online
    notes: 2 Reward Points per INR 100 on eligible online spends; this is the total online rate, not additive to the 1-point base rate.
    source:
      url: https://www.au.bank.in/personal-banking/credit-cards/altura-plus-credit-card
      retrieved_on: '2026-10-27'
      type: issuer-page
      confidence: high
      fields_verified:
      - rewards.accelerated[0].effective_rate
      - rewards.accelerated[0].effective_per_inr
      - rewards.accelerated[0].canonical_categories
      notes: Card-specific issuer product page and reward terms.
  exclusions:
  - fuel
  - rent
  - government
  - education
  - emi
  - cash-advance
  reward_cap:
    max_units: 25000
    cap_unit: points
    cycle: statement
  capping_rules:
  - Offline POS spend earns 1.5% cashback up to an issuer-defined maximum cashback limit; the numeric cashback cap
    is not stated in the current product evidence. The issuer says POS Reward Points accrue only after that cashback
    limit is reached, so offline points are deliberately not scored by this calculator record.
  - Utilities and telecom earn 1 point per ?100, capped at 100 points per transaction. BBPS and quasi-cash transactions
    do not earn points.
  redemption_floor_value_inr: 0.002
  redemption_ceiling_value_inr: 0.0025
  redemption:
  - type: catalog
    program: AU Reward Points catalogue
    rate_inr_per_unit: 0.0025
    min_units: 200
    fee_inr: 99
    constraints: Issuer FAQ states 0.25 paise per point for catalogue redemption; points expire two years after accrual.
  - type: voucher
    program: Eligible e-vouchers
    rate_inr_per_unit: 0.002
    min_units: 200
    fee_inr: 99
    constraints: Issuer FAQ states 0.20 paise per point for e-voucher redemption; INR 99 + GST redemption fee applies.
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards/altura-plus-credit-card
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: medium
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated[0].effective_rate
    - rewards.accelerated[0].effective_per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.base.applies_to_categories
    - rewards.reward_cap
    - rewards.exclusions
    - rewards.redemption_floor_value_inr
    - rewards.redemption_ceiling_value_inr
    - rewards.redemption.rate_inr_per_unit
    - rewards.redemption.min_units
    - rewards.redemption.fee_inr
    notes: 'Card-specific product page states 2 points per INR 100 online (total rate), and 1 point per INR 100 on utilities/telecom and insurance. Base scope is limited to utilities, telecom and insurance so online accelerator does not stack with a base point. Transportation MCC accrual ceased 1 Apr 2026; calculator spend buckets cannot isolate those MCCs. Offline POS earns 1.5% cashback until an issuer cap is reached; the current page does not quantify the cap, so offline cashback/points are not scored. AU Reward Points FAQ states catalogue value of 0.25 paise and e-voucher value of 0.20 paise per point; AU redemption fee is INR 99 + GST, and points expire two years after accrual. The 25,000-point statement-cycle cap, utility cap and exclusions are in the issuer Card Member Agreement dated 16 May 2026. BBPS and quasi-cash exclusions are documented here because schema categories cannot encode them.'

  notes: 'Current detailed product page and October KFS support INR 500 joining and annual fees; KFS has no annual-fee waiver. Current finance is 3.75% monthly (55.55% p.a.), cash advance 2.5% (minimum INR 500), foreign currency fee 3.5%, cash payment INR 175, card replacement nil, duplicate statement/charge slip/outstation cheque waived, mobile alerts free, hotlisting nil and balance enquiry waived. Overlimit 2.5% (minimum INR 500); cheque/auto-debit reversal 2% (minimum INR 500); railway surcharge as prescribed; reward point redemption fee applies, amount unspecified. Late fee: nil below INR 500, INR 500 for INR 501-5,000, INR 750 for INR 5,001-10,000, INR 1,200 for INR 10,001-50,000, INR 1,300 above INR 50,000, plus INR 100 after two consecutive unpaid MAD cycles until cleared; exact INR 500 is unassigned. Current product page lists DCC 3.5% plus GST. Other current transaction fees include rent 1% per transaction; third-party education 1% per transaction; wallet load 1% at cumulative INR 10,000 per statement; fuel 1% at INR 50,000 per statement; utilities 1% at INR 25,000 per statement; online skill gaming 1% at INR 10,000 per statement. T&Cs are announced effective 28-Aug-2026. Axis permits card applicants to choose among Mastercard, Visa and RuPay networks; this record cannot assert one network variant.'

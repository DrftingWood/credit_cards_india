    notes: >-
      IDFC FIRST Bank's 17-Sep-2026 announcement confirms zero forex markup for all
      existing and new cards, superseding the older general 3.5% MITC entry. The
      announcement: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/news-media/press-release/Press-Release-IDFC-FIRST-Bank-introduces-Zero-Forex-Markup-across-all-its-Credit-Cards-existing-and-new-1709.pdf.
      product page gives dynamic APR 0.71%-3.85% monthly
      (8.5%-46.2% p.a.), so there is no single current monthly rate. It states
      interest-free ATM withdrawals until the due date with a flat INR 199 per
      withdrawal. Page states 15% of total due late fee, min INR 100/max INR 1,300.
      Source MITC: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/MITC-Document-Customer.pdf?77=
rewards:
- effective_from: 2026-06-18
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 2
    per_inr: 150
    unit_value_inr: 0.25
    unit_value_inr_realized: null
    excluded_categories:
    - fuel
    - groceries
    - utilities
    - insurance
    - emi
    notes: >-
      Other retail and eligible UPI retail purchases earn 2 points per INR 150. The
      issuer's category accelerators separately cover HPCL fuel, grocery/utility and
      IDFC FIRST FASTag. HP Pay Happy Coins are a separate loyalty-wallet currency,
      not card Reward Points. Rewards accrue only up to the credit limit per billing
      cycle and are withheld/reversed for a cycle if the Minimum Amount Due is unpaid.
      INR 0.25 point value is confirmed for Travel & Shop bookings only; universal
      realized value is not asserted.
  accelerated:

id: axis-privilege
name: Axis Bank Privilege Credit Card
issuer: axis
network: visa
network_tier: signature
tier: premium
card_type: credit
co_brand: null
status: active
launched_on: 2010-01-01
discontinued_on: null

fees:
  - effective_from: 2010-01-01
    effective_until: null
    joining_fee_inr: 1500
    annual_fee_inr: 1500
    fee_waiver:
      spend_inr: 500000
      cycle: annual
      conditions: "Annual fee waived on spends of ₹5 lakh in a card anniversary year."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.axis.bank.in/cards/credit-card/privilege-credit-card-with-unlimited-benefits
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2010-01-01
    effective_until: null
    currency: points
    currency_name: EDGE Reward Points
    base:
      rate: 10
      per_inr: 200
      unit_value_inr: 0.2
      unit_value_inr_realized: 0.18
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - insurance-premiums
      - utilities
      - jewellery
      - education
    redemption:
      - type: catalog
        program: EDGE Rewards
        rate_inr_per_unit: 0.2
    source:
      url: https://www.axis.bank.in/cards/credit-card/privilege-credit-card-with-unlimited-benefits
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2010-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [dreamfolks]
      international:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [priority-pass]
    milestones:
      - spend_inr: 250000
        cycle: annual
        benefit: "Additional 10,000 EDGE Reward Points worth ₹2,000"
        value_inr: 2000
        reward_kind: points
        reward_units: 10000
        trigger_window: anniversary-year
    movies:
      type: bogo
      partner: District
      max_per_cycle: 1
      cycle: monthly
      cap_inr: 250
      notes: "100% off (up to ₹250) on second movie ticket via District app, once per month on min purchase of two tickets."
    welcome:
      - condition: "Joining fee paid"
        benefit: "Shopping or Travel voucher on welcome"
        value_inr: 2500
        window_days: 90
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 4000
      cap_per_cycle_inr: 400
      cycle: monthly
    concierge: false
    source:
      url: https://www.axis.bank.in/cards/credit-card/privilege-credit-card-with-unlimited-benefits
      retrieved_on: 2026-07-03

eligibility:
  min_age: 18
  max_age: 70
  income_inr_annual:
    salaried: 600000
    self_employed: 600000
  credit_score_min: 730
  residency: resident-indian

application:
  apply_url: https://www.axis.bank.in/cards/credit-card/privilege-credit-card-with-unlimited-benefits

metadata:
  last_verified_on: 2026-07-03
  tags: [premium, travel, points]

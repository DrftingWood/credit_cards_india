benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: annual
      guests_per_visit: null
      via:
      - visa
      notes: One domestic lounge visit every six calendar months per the current Live+ Service Guide;
        generic HSBC lounge FAQ still says four annual domestic visits and appears stale.
    international:
      visits_per_cycle: 1
      cycle: annual
      guests_per_visit: null
      via:
      - visa
      notes: One complimentary international lounge visit per year effective 2026-09-01 per the current
        Live+ Service Guide.
  welcome:
  - condition: New primary Live+ cardholders who apply during 2026-07-26 through 2026-12-31; download/log
      in to HSBC India Mobile Banking app and make eligible sales transactions totalling at least INR25,000
      within 30 calendar days of card issuance. No combining with other welcome offers; eligibility also
      requires updated KYC and no minimum-payment delinquency within 30 days.
    benefit: INR1,000 cashback
    value_inr: 1000
    window_days: 30
  - condition: 'Alternative to the HSBC INR1,000 welcome-cashback offer: a new Visa Infinite consumer
      credit card must make at least one eligible INR300 transaction processed on VisaNet during the Visa
      campaign period 2026-02-07 through 2026-10-31 (inclusive), subject to voucher availability. Visa
      campaign permits one voucher per eligible card/person; HSBC says its INR1,000 welcome offer cannot
      be combined with another welcome/introductory offer.'
    benefit: INR750 voucher for Amazon Pay, Swiggy, Zomato or Flipkart
    value_inr: 750
    window_days: null
  milestones: []
  fuel_surcharge_waiver: null
  concierge: true
  other:
  - name: Fuel contactless cashback offer
    description: INR250 cashback per calendar quarter for domestic contactless fuel transactions totalling
      at least INR10,000; each transaction must be INR1,000?INR5,000. Primary and add-on card spend combine.
      Offer for Live+ runs 2026-07-26 through 2026-12-31; cashback paid to primary cardholder within 45
      days after quarter end.
  - name: Visa Infinite privileges
    description: HSBC product page lists Visa Infinite lifestyle privileges, including Visa Concierge;
      partner offers are subject to their own terms and can change.
  - name: Foreign-currency cashback restriction
    description: Current Live+ Service Guide states international transactions no longer earn the 1.5%
      cashback; older generic guide text conflicts.
  source:
    url: https://www.hsbc.bank.in/credit-cards/products/live-plus/
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hsbc/live-plus/live-plus-service-guide-retrieved-2026-10-27.pdf
    - docs/sources/hsbc/live-plus/live-plus-welcome-cashback-retrieved-2026-10-27.pdf
    - docs/sources/hsbc/live-plus/live-plus-fuel-contactless-offer-retrieved-2026-10-27.pdf
    - docs/sources/hsbc/live-plus/visa-infinite-welcome-offer-retrieved-2026-10-27.pdf
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.welcome[0].value_inr
    - benefits.welcome[0].window_days
    - benefits.welcome[1].value_inr
    notes: Current issuer product page and archived current Service Guide support lounge, Visa Infinite
      and current welcome terms. The fuel transaction rebate is a limited-time contactless cashback offer,
      not a fuel surcharge waiver. The card-specific guide states 2 domestic visits (one every six calendar
      months) plus 1 international visit from 2026-09-01; a separate generic HSBC FAQ still says 4 domestic
      visits.
    method: pdf-extract

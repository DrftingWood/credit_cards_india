benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access: null
  movies:
    type: discount
    partner: Online and box office merchants (MCC 7832 or 7922)
    max_per_cycle: null
    cycle: annual
    cap_inr: 1000
    notes: 25% cashback on online or box-office movie ticket transactions all week, limited to MCC 7832 or 7922; calendar-year cashback cap INR 1,000. Transactions in these MCCs do not earn EDGE points. Cashback posts to the statement according to merchant settlement timing; no per-transaction maximum or separate usage frequency is published.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 400
    cycle: statement
    notes: 1% surcharge refund on fuel transactions of INR 400-4,000, capped at INR 400 per statement cycle. Fuel transactions do not earn points. GST on surcharge is non-refundable; some transactions incur INR 10 + GST instead of 1% + GST.
  concierge: false
  other:
  - name: Contactless payments
    description: Tap-and-pay transactions up to INR 5,000.
  - name: Cash withdrawal access
    description: Cash withdrawals up to 100% of the credit limit from day one; standard cash withdrawal fee and interest apply.
  - name: Interest-free purchase period
    description: Up to 50 days on purchases when the previous statement is paid in full by the due date; does not apply to cash transactions.
  - name: EMI conversion
    description: Contact the bank to convert transactions above INR 2,500 into EMIs.
  - name: Dining Delights
    description: At least 15% off at partner restaurants in India; participating venues and offer terms vary.
  - name: Wednesday Delight
    description: Current product page lists offers up to 15% off flights/hotels via Goibibo and MakeMyTrip, 10% off Swiggy and Amazon Fresh, and 10% off Tira up to INR 1,000. Offers are subject to changing merchant and campaign terms.

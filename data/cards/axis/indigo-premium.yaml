    notes: Card-specific terms exclude government, insurance, utilities/telecom, rent, wallet, fuel, jewellery, bridge/road/toll fees and gift cards, plus EMI products, cash withdrawals, fees/charges/GST and temporary disputed-transaction credits. The BluChip terms explicitly say points have no monetary value; redemption value and validity are governed by IndiGo. Prior 0.6/0.45 INR unit-value estimates were unsupported and have been cleared. The issuer does not specify an overall earning cap. Product page/terms describe eligible-category limits; current terms require the card fee to be paid for the anniversary year.
  mcc_exclusions: []
  capping_rules:
  - BluChips are awarded only on eligible settled spend; excluded categories, EMI conversions, cash withdrawals, fees/taxes, refunds and dispute credits do not earn.
  - Reward earning under the card terms is unavailable where applicable joining/annual fees are unpaid, including first-year-free and lifetime-free accounts.
benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: Two visits per quarter, subject to at least INR 50,000 eligible spend in the preceding three calendar months. New issuance waives the spend test for the issue month and following three calendar months; an upgrade does not count as new issuance. Lounge validation and cardholder-only entry rules apply.
    international:
      visits_per_cycle: 2
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Two international lounge visits per calendar year through Priority Pass. A USD 1 authorization on the card is required for entry and is reversed after successful authorization; guests are not complimentary.
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 250
    notes: Buy-one-get-one movie ticket offer, once per month; maximum discount INR 250 per month. Effective 2026-11-01, an INR 25,000 eligible spend in the preceding three months is required; new-card accounts are exempt for issue month and the next three calendar months. The issuer page does not state whether the spend gate changes the monthly ticket cap.
  welcome:
  - condition: Joining fee successfully paid; eligible fee must be paid within 120 days after it is charged. Not applicable to first-year-free/lifetime-free accounts or add-on cards.
    benefit: Welcome voucher of 5,000 IndiGo BluChips plus one 6E Eats voucher; issued within 30 days of fee payment and valid for six months from issue.
    value_inr: null
    window_days: 120
  - condition: Temporary double-welcome campaign for card applications from 2026-06-01 through 2026-10-31 per campaign PDF (product page says 2026-09-01 through 2026-10-31); joining fee payment required and offer communication may be required.
    benefit: Additional voucher of 5,000 IndiGo BluChips, issued within 60 days of joining-fee payment and valid for six months. One standard 6E Eats voucher remains part of the welcome offer.

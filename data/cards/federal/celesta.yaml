        - rewards.base.per_inr
        - rewards.accelerated
        - rewards.exclusions
        - rewards.mcc_exclusions
        - rewards.category_caps
        - rewards.redemption
      notes: Current MITC confirms base earn of 1 point per INR 100, 3x on travel and international spend and 2x on dining. Cash, fuel, wallet loading, government, financial institution/quasi-cash and rent transactions do not earn; listed MCC exclusions include rent MCC 6513. Insurance MCCs 6300 and 5960 are capped at 250 points per card per calendar month. Points have an INR 0.25 catalog face value, but statement credit is INR 0.10 per point. Redemption fee is INR 99/request in MITC; product FAQ calls it a minimum and says actual fee depends on redemption type. No realized redemption value should be inferred; the calculator does not deduct redemption fees.
benefits:
  - effective_from: 2026-10-25
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        spend_threshold_inr: 60000
        spend_threshold_cycle: quarterly
        guests_per_visit: 0
        via: [visa, issuer-direct]
        notes: Primary cardholder only. Spend of INR 60,000 must be met in the immediately preceding qualifying cycle; add-on and primary spends aggregate, but add-on holders cannot use the benefit. Spend cycles run 21st to 20th and eligibility is based on transactions settled/billed within the cycle. An INR 2 non-refundable validation charge applies.
      international:
        visits_per_cycle: 2
        cycle: annual
        guests_per_visit: 0
        via: [loungekey]
        notes: No spend threshold. Primary cardholder access; lounge charges are initially billed and reimbursed within 30 days. Guest visits are chargeable.
    welcome:
      - condition: Spend at least INR 10,000 within 30 days from card issuance; Federal Bank terms define this as the offer period.
        benefit: Amazon voucher worth INR 600
        value_inr: 600
        window_days: 30
    movies:
      type: bogo
      partner: INOX
      max_per_cycle: 1
      cycle: monthly
      cap_inr: 100
      notes: Maximum INR 100 discount; taxes and food/beverages excluded. Active account in good standing required.
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: 150
      cycle: monthly
      notes: Waives 1% of fuel surcharge excluding GST; INR 150 monthly cap.
    other:
      - name: Add-on cards
        description: Up to 4 add-on cards are available for INR 100 plus GST per card.
      - name: Credit Card EMI
        description: Eligible purchases can be converted to EMI at purchase or later through supported merchants, FedMobile or customer service; current issuer page does not provide a Celesta-specific minimum amount or tenure.
    source:
      url: https://www.federal.bank.in/visa-celesta-credit-card
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      method: rendered-page
      fields_verified:
        - benefits.lounge_access
        - benefits.welcome
        - benefits.movies
        - benefits.fuel_surcharge_waiver
        - benefits.other
      notes: Current product page and Amazon voucher T&Cs (https://www.federal.bank.in/amazon-gift-card-tc) state INR 600 for INR 10,000 spend within 30 days from issuance. Voucher code is communicated within 45 days after the eligible month and valid for 12 months from activation; void/cancelled transactions can invalidate eligibility. Issuer also publishes selected-customer campaigns with individually communicated targets; those are not baseline card benefits.

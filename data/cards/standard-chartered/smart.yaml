    - benefits.fuel_surcharge_waiver
    - benefits.concierge
    - benefits.other
    notes: Smart-specific terms dated 30-Sep-2024 verify cashback terms, 90-day interest-free period and eligible 3-month EMI. No Smart-specific lounge, fuel waiver or concierge entitlement identified.

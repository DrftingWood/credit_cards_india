# NOTE: Vistara merged into Air India (12-Nov-2024); Club Vistara points migrated to
# the Air India "Maharaja Club" (Maharaja Points). Sourcing of new Axis Vistara cards
# has been discontinued and existing cards are being wound down / migrated.

fees:

  notes: Issuer page labels the card White Signature. Fees are INR 3,000 plus GST; annual waiver requires INR 500,000
    annual retail spend. Waiver on programme-linked cards depends on continued programme eligibility; if programme
    eligibility is lost, fees become payable. A fee-free variant is mentioned but its complete terms are not established
    here. Current KFS version KFSWS12032026 also lists DCC 3.5%, rent fee 2%, wallet-load fee above INR10,000, fuel
    spend fee above INR50,000, online skill gaming fee above INR10,000, third-party education fee, utilities above
    INR75,000, replacement card INR100, overlimit INR500 and late-payment slabs up to INR1,300; these do not all
    map to dedicated schema fields. KFS cycle wording for some surcharge waiver caps conflicts with product page
    calendar-year wording.
  source:

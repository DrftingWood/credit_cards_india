benefits:
- effective_from: 2026-06-18
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: null
      via:
      - visa
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: Spend INR 20,000 in a calendar month unlocks access in the next month. The quarterly quota is shared between the primary cardholder and add-on cardholders; one entry per visit, no guest beyond quota.
    international:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: null
      via:
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: Spend INR 20,000 in a calendar month unlocks access in the next month. The quarterly quota is shared between the primary cardholder and add-on cardholders; one entry per visit, no guest beyond quota.
  golf:
    rounds_per_cycle: null
    lessons_per_cycle: null
    cycle: monthly
    notes: >-
      Up to two complimentary golf rounds or golf lessons per month: one session
      at INR 20,000 and two at INR 40,000 or more in eligible statement-cycle spend.
      The issuer describes a shared rounds-or-lessons entitlement, so separate
      round and lesson counts are left null. Primary cardholder only; each earned
      session is valid for 60 days after it appears in the golf account.
  milestones:
  - spend_inr: 800000
    cycle: annual
    benefit: 7,500 Reward Points after paying the next annual fee
    value_inr: null
    reward_kind: points
    reward_units: 7500
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
    is_repeatable: true
    max_awards_per_cycle: 1
  welcome:
  - condition: Ashva card generated on or after 2025-09-01; joining fee successfully realized; primary cardholder; once per customer
    benefit: 2,500 Reward Points
    value_inr: 1000
    window_days: null
  - condition: Same joining-fee offer; at least INR 20,000 net settled eligible spend in the second statement cycle
    benefit: 2,500 Reward Points
    value_inr: 1000
    window_days: null
  - condition: Same joining-fee offer; at least INR 20,000 net settled eligible spend in the third statement cycle
    benefit: 2,500 Reward Points
    value_inr: 1000
    window_days: null
  insurance:
  - type: other
    sum_insured_inr: 25000
    conditions: >-
      Cancel-for-any-reason trip-cancellation cover for non-refundable flight and
      eligible hotel bookings, maximum two cancellations shared by primary and
      add-on cardholders during the policy period 2026-05-08 through 2027-05-07;
      bookings/cancellations must fall within the policy period and cancellation
      must be at least 24 hours before travel. Four-/five-star hotels only. Current
      terms and claim conditions are in the linked issuer policy.
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: >-
      Air accident cover. Current insurer schedule requires the ticket to be
      purchased using the covered card; active-card and claim conditions apply.
  - type: personal-accident
    sum_insured_inr: 1000000
    conditions: >-
      Personal accident cover; insurer requires at least one purchase or ATM
      withdrawal within the preceding 30 days. Claim is payable once across the
      cardholder's IDFC FIRST cards.
  - type: lost-card-liability
    sum_insured_inr: 50000
    conditions: >-
      Lost-card, counterfeit/skimming and online-fraud liability cover. At least
      one purchase or ATM withdrawal within the preceding 30 days is required;
      detailed exclusions and reporting deadlines are in issuer insurance terms.
  - type: baggage-loss
    sum_insured_inr: null
    sum_insured_amount: 500
    sum_insured_currency: USD
    conditions: >-
      Loss of checked-in baggage on international travel; ticket must be purchased
      with the covered card, and the card must have had a purchase or ATM
      withdrawal in the preceding 30 days.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: International flight delay cover; ticket must be purchased with the covered card and active-card terms apply.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 100
    sum_insured_currency: USD
    conditions: International checked-in baggage delay cover; ticket must be purchased with the covered card and active-card terms apply.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: >-
      Reimbursement for loss of passport and other travel documents on eligible
      international travel; ticket must be purchased with the covered card and
      active-card terms apply. Together with baggage and delay sublimits, these
      issuer-published travel protections total USD 1,200.
  - type: purchase-protection
    sum_insured_inr: 50000
    coverage_duration_days: 60
    conditions: >-
      Shared issuer insurance schedule lists INR 50,000 for Ashva. Covers fire,
      allied perils and burglary of eligible purchases at the cardholder's
      recorded Indian residence for 60 days; card must have been used at least
      once in the preceding 30 days.
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 300
    cycle: monthly
    notes: Issuer describes the INR 300 ceiling per statement cycle.
  movies:
    type: bogo
    partner: District by Zomato
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 400
    notes: >-
      Up to INR 400 off each of two tickets/transactions per calendar month
      (maximum INR 800 total). From 18-Jun-2026, spend INR 20,000 in the current
      calendar month to unlock the next month's offer.
  concierge: true
  dining:
    program: Visa Infinite dining privileges
    discount_pct: 20
    notes: Up to 20% off at participating restaurants; individual merchant terms apply.
  other:
  - name: Railway lounge access
    description: >-
      Up to four complimentary visits per quarter at participating Indian railway
      lounges, shared between primary and add-on cardholders. Spend INR 20,000 in
      the current calendar month to unlock access in the next month; one guest may
      accompany a visit within the quota, with valid train ticket and ID.
    value_inr: null
  - name: The Postcard Hotels & Resorts
    description: >-
      Flat INR 5,000 off a minimum INR 25,000 booking once per calendar quarter
      with promo code IDFCVIP; issuer page lists validity through 2027-02-10.
    value_inr: 5000
  - name: Roadside assistance
    description: Roadside-assistance service advertised at an issuer-stated value of INR 1,399; service counts and exclusions are in linked terms.
    value_inr: 1399
  - name: Visa Infinite hotel, stay and airport privileges
    description: >-
      Current Ashva page lists ITC Hotels stay offers, Elivaas offers, airport
      meet-and-greet/transfer discounts, and luxury-hotel benefits. Availability,
      partner conditions and current offer periods vary; see issuer-linked Visa
      terms.
    value_inr: null
  source:
    url: https://www.idfcfirst.bank.in/credit-card/metal-credit-card/ashva
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    local_refs:

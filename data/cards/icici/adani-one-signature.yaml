benefits:
- effective_from: '2026-10-26'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Primary cardholder only; requires INR75,000 spend in the preceding
        spends quarter for access in the following calendar quarter.
    international:
      visits_per_cycle: 2
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Primary cardholder only.
  milestones:
  - spend_inr: 300000
    cycle: annual
    benefit: Second Pranaam Meet & Greet service; first service is on card
      activation.
  - spend_inr: 100000
    cycle: annual
    benefit: 2 Porter services per INR100,000 annual spend, up to 8 services at
      INR400,000 spend.
    is_repeatable: true
    max_awards_per_cycle: 4
  welcome:
  - condition: Pay the joining fee and spend INR25,000 or more within first 60
      days of activation
    benefit: Flight voucher worth INR5,000; primary cardholder only
    value_inr: 5000
    window_days: 60
  - condition: On activation
    benefit: Hotel voucher worth INR2,000; primary cardholder only
    value_inr: 2000
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 500
    notes: Buy one ticket, get up to INR500 off the second; minimum 2 tickets,
      twice monthly. From 1-Apr-2026 requires INR25,000 spend in preceding
      quarter; add-on members individually meet the gate.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr:
    max_txn_inr: 4000
    cap_per_cycle_inr:
    cycle: monthly
    notes: 1% waiver on fuel transactions up to INR4,000 transaction value; no
      monthly rupee cap is published.
  concierge:
  other:
  - name: Pranaam Meet & Greet
    description: '2 per year: one on activation and one after INR300,000 spend.'
  - name: Premium lounge upgrades
    description: 4 per quarter (16 annually) at Adani-managed airports.
  - name: Valet parking
    description: 4 per year on activation at Adani-managed airports.
  - name: Premium car parking
    description: 4 per year on activation at Adani-managed airports.

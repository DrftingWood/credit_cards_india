    rate_inr_per_unit: 1.0
    constraints: INR 1 per myCash applies to MakeMyTrip travel bookings or eligible partner vouchers only; closed-loop,
      non-cashable and non-transferable to a bank account. Cannot be used for rail, offline holiday bookings or

rewards:
- effective_from: 2026-10-26
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1
    unit_value_inr_realized: 1
  accelerated:
  - category: dining-food-grocery
    canonical_categories:
    - dining
    - groceries
    multiplier: 10
    effective_rate: 10
    cap_per_cycle: 400
    cap_unit: cashback-inr
    cycle: monthly
    notes: >-
      10% cashback on dining, food delivery and grocery transactions; 1% on other eligible
      transactions. Combined cashback from both rates is capped at INR400 per billing cycle,
      including eligible UPI transactions. No separate UPI accelerator. Cashback is credited
      as statement credit. Exclusions are extensive and depend on MCC; consult the linked HSBC
      Service Guide. Excluded groups include fuel, wallets, rent/property management, B2B,
      education, government, insurance, jewellery/antiques, cash withdrawals, credit
      repayments, foreign currency, liquid/crypto assets, securities brokers, collections,
      charity, money transfers, wholesale clubs, utilities and other listed MCCs. Reversals,
      cancellations and delinquency may result in cashback recovery.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - insurance-premiums
  - education
  - government
  - utilities
  - emi
  - international
  - jewellery
  - cash-advance
  mcc_exclusions:
  - '6513'
  reward_cap:
    max_units: 400
    cap_unit: cashback-inr
    cycle: monthly
  capping_rules:
  - Total cashback across the base and accelerated rates is capped at INR400 per billing cycle.
  redemption:
  - type: statement-credit
    program: Cashback
    rate_inr_per_unit: 1
  source:
    url: https://www.hsbc.bank.in/content/dam/hsbc/in/documents/credit-cards/rupay-cashback/rupay-cashback-credit-card-services-guide.pdf
    retrieved_on: 2026-10-26
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base
    - rewards.accelerated
    - rewards.accelerated.cap_per_cycle
    - rewards.reward_cap
    local_refs:
    - docs/sources/hsbc/rupay-cashback/service-guide-retrieved-2026-10-26.pdf
    notes: HSBC Service Guide directly states the 10%/1% rates and combined INR400 billing-cycle cap.

# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : ICICI per-card T&C PDFs (docs/sources/icici/)
#   Verified   : 2026-07-04   Confidence: HIGH (pdf)
#   Fees, reward rate, forex & caps cross-checked vs the source above where extractable.
# Eligibility income bands, min credit score & some launch dates are tier-standard
# defaults (not individually source-verified). Exact monthly caps on some cashback
# cards remain source/HTML-noted. See docs/sources/<issuer>/ for evidence.
# ---------------------------------------------------------------------------
id: icici-emeralde
name: ICICI Bank Emeralde Credit Card
issuer: icici
network: mastercard
network_tier: world-elite
tier: super-premium
card_type: credit
co_brand: null
status: active
launched_on: 2017-01-01
discontinued_on: null

# NOTE: The newer Emeralde Private Metal card (launched 2023) is a separate
# invite-only product and is not represented here.

fees:
  - effective_from: 2017-01-01
    effective_until: null
    joining_fee_inr: 12000
    annual_fee_inr: 12000
    fee_waiver:
      spend_inr: 1000000
      cycle: annual
    forex_markup_pct: 2.0
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2017-01-01
    effective_until: null
    currency: points
    currency_name: ICICI Reward Points
    base:
      rate: 4
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.22
    accelerated:
      - category: international-spend
        canonical_categories: [international]
        multiplier: 1
        effective_rate: 4
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
      - category: ishop-hotels
        canonical_categories:
          - travel
        multiplier: 12
        cap_per_cycle: 15000
        cap_unit: points
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants:
            - ishop
        notes: Up to 12X reward points on HOTEL bookings via ICICI iShop (booked via iShop only). Shares the 15,000 RP/calendar-month iShop cap (ICICI capping PDF, WEF 1-Oct-2025) with iShop flights; iShop also gives 6X on bus + shopping vouchers (not modelled).
      - category: ishop-flights
        canonical_categories:
          - travel
        multiplier: 6
        cap_per_cycle: 15000
        cap_unit: points
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants:
            - ishop
        notes: Up to 6X reward points on FLIGHT bookings via ICICI iShop (booked via iShop only). Shares the 15,000 RP/calendar-month iShop cap with iShop hotels.
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    capping_rules:
      - "Utility and insurance spends earn 1 Reward Point per ₹100"
    redemption:
      - type: catalog
        program: ICICI Rewards
        rate_inr_per_unit: 0.25
        constraints: 1 ICICI RP = Rs 0.25 (catalogue/cashback). The 1:1 Air India Maharaja transfer belongs to Emeralde Private Metal only; classic Emeralde's transfer eligibility is doubtful and is NOT 6:1.
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-credit-card
      retrieved_on: 2026-07-05

      notes: 'Corrected 2026-07-05: RP = Rs 0.25 (was 0.6). Removed unsupported 6:1 Air India transfer (1:1 is Private Metal only; classic eligibility doubtful). Card phased out in favour of Emeralde Private Metal.'
      confidence: medium
    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2017-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: unlimited
        cycle: annual
        guests_per_visit: unlimited
        via: [dreamfolks]
      international:
        visits_per_cycle: unlimited
        cycle: annual
        guests_per_visit: unlimited
        via: [priority-pass, dragonpass]
    golf:
      rounds_per_cycle: 4
      cycle: monthly
      lessons_per_cycle: 0  # Golf T&C: combined "round/lesson" allowance, max 4/month (1 per Rs50k prev-month spend)
    welcome:
      - condition: "Joining fee paid"
        benefit: "12,000 ICICI Reward Points"
        value_inr: 3000
        window_days: 90
    insurance:
      - type: air-accident
        sum_insured_inr: 10000000
      - type: travel-medical
        sum_insured_inr: 5000000
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 4000
      cap_per_cycle_inr: null
      cycle: monthly
    dining:
      program: Culinary Treats
      discount_pct: 25
    movies:
      type: bogo
      partner: BookMyShow
      max_per_cycle: 4
      cycle: monthly
      cap_inr: 750
    concierge: true
    other:
      - name: Birthday benefit (Amex variant)
        description: Tata CLiQ shopping voucher for American Express Cardholders.
        value_inr: 5000
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-credit-card
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 1800000
    self_employed: 1800000
  credit_score_min: 780
  residency: resident-indian

application:
  apply_url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-credit-card

metadata:
  last_verified_on: 2026-07-05
  tags: [super-premium, world-elite, golf, lounge, points]

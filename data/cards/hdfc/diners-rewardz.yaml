    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.redemption[0].rate_inr_per_unit
    - rewards.redemption[1].rate_inr_per_unit
    - rewards.redemption[2].rate_inr_per_unit
    - rewards.redemption[3].rate_inr_per_unit
    - rewards.capping_rules
    notes: Official HDFC notice effective 15-May-2026 changes Diners Rewards accrual to 3 points per INR 200; current card page caps earned points at 15,000 per statement cycle and lists route-specific values. No current dining accelerator found; prior weekend-dining rule removed. Realized value left unknown because advertised routes vary.

    program: AU Rewardz
    rate_inr_per_unit: null
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards/swipeup-program/xcite-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    fields_verified:
    - rewards.base.unit_value_inr
    notes: AU Rewardz FAQ gives ordinary points at 0.25 paise and e-vouchers at 0.20 paise (https://www.au.bank.in/personal-banking/credit-cards). Catalog conversion varies by redemption type and is left unknown. Current member agreement confirms 25,000-point statement cap and exclusions including rent, education, government and BBPS; EMI, fuel, cash withdrawal, quasi-cash, fees and other charges also earn no points (https://www.au.bank.in/credit-cards/credit-card-member-agreement.pdf). Xcite base/category earn remains unpublished in accessible page text.
benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access: null
  insurance:
  - type: lost-card-liability
    sum_insured_inr: null
    conditions: Current product page advertises zero liability following card loss; detailed current limits and conditions are not stated. The linked detailed insurance PDF is dated 16-Apr-2021.
  other:
  - name: Railway lounge access
    description: 8 complimentary railway lounge visits per annum, maximum 2 per calendar quarter. Current issuer page does not list airport lounge access.
  - name: Device Protection Plan
    description: Complimentary device protection for mobiles, tablets, laptops and select electronics.
  - name: Contactless payments
    description: Tap-to-pay transactions up to INR 5,000 without PIN at participating merchants.
  - name: Xpress EMI
    description: Convert transactions with minimum total value INR 2,000 into EMI and club up to 20 billed or unbilled transactions; per-transaction minimum is not stated on the product page.
  - name: Add-on cards
    description: Add-on cards are offered free for lifetime; the page does not publish a numerical card limit.

id: axis-magnus
name: Axis Bank Magnus Credit Card
issuer: axis
network: mastercard
network_tier: world
tier: super-premium
card_type: credit
co_brand: null
status: active
launched_on: 2019-07-01
discontinued_on: null

# NOTE: Magnus has been revised multiple times (notably the Sept-2023 nerf).
# The fee/reward/benefit arrays below demonstrate the effective-dated pattern:
# old records are closed with an effective_until date, new records open-ended.

fees:
  - effective_from: 2019-07-01
    effective_until: null
    joining_fee_inr: 12500
    annual_fee_inr: 12500
    fee_waiver:
      spend_inr: 2500000
      cycle: annual
      conditions: "Annual fee waived on spends of ₹25L in the preceding year."
    forex_markup_pct: 2.0
    finance_charge_monthly_pct: 3.0
    cash_advance_fee: null
    gst_applicable: true
    source:
      url: https://www.axis.bank.in/cards/credit-card/axis-bank-magnus-credit-card
      retrieved_on: 2026-07-03
      notes: "No cash withdrawal fees per live page; 3% finance charge; 2% forex markup."

rewards:
  - effective_from: 2019-07-01
    effective_until: 2023-08-31
    currency: points
    currency_name: EDGE Reward Points
    base:
      rate: 12
      per_inr: 200
      unit_value_inr: 0.2
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - insurance-premiums
    redemption:
      - type: airmiles
        program: Multiple (Axis Gift Edge transfer)
        ratio: "5:4"
        constraints: "Pre-Sept-2023 transfer ratio across partners."
    source:
      url: https://web.archive.org/web/2023/https://www.axisbank.com/retail/cards/credit-card/magnus-credit-card
      retrieved_on: 2026-04-15
      notes: "Historical record; values prior to the Sept-2023 revision."

    mcc_exclusions: ['6513']
  - effective_from: 2023-09-01
    effective_until: null
    currency: points
    currency_name: EDGE Reward Points
    base:
      rate: 12
      per_inr: 200
      unit_value_inr: 0.44
      unit_value_inr_realized: 0.2
    accelerated:
      - category: monthly-spend-above-threshold
        multiplier: 1
        effective_rate: 35
        cap_per_cycle: 35000
        cap_unit: points
        cycle: monthly
        notes: "35 EDGE Reward points per ₹200 on incremental spends above ₹1.5L in a calendar month; the 35-point rate applies on spends up to (assigned credit limit + ₹1.5L) per calendar month."
      - category: travel-edge-portal
        canonical_categories: [travel]
        multiplier: 5
        cap_per_cycle: 200000
        cap_unit: spend-inr
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants: [edge-travel]
        notes: "5X (60 EDGE Reward Points per ₹200) on Travel EDGE portal spends, capped at ₹2,00,000 per calendar month; base rate thereafter."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - insurance-premiums
      - utilities
      - education
      - jewellery
    capping_rules:
      - "Transfer to airline partners capped at 5,00,000 EDGE points per year."
    redemption:
      - type: airmiles
        program: Multiple (EDGE transfer)
        ratio: "5:2"
        constraints: "10 transfer partners; ratios are card-point : partner-unit. realized Rs 0.20 = guaranteed non-transfer floor; best documented transfer Rs 0.44. 9 partners beat the floor. Full per-partner values below."
        transfer_partners:
          - partner_name: Singapore KrisFlyer

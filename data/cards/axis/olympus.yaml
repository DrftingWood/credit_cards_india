benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - issuer-direct
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - priority-pass
  welcome:
  - condition: Applied for and issued on or after 2024-07-01; first transaction within 30 days of issuance; primary card only
    benefit: Taj or ITC hotel voucher worth INR 10,000
    value_inr: 10000
  - condition: Primary cardholders issued the card on or after 2024-07-01; make first transaction within 30 days of issuance
    benefit: 2,500 EDGE Miles welcome benefit
    value_inr: 2500
    window_days: 30
  insurance: []
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 500
    cycle: monthly
  concierge: true
  other:
  - name: Domestic golf benefit
    description: 8 complimentary domestic golf rounds or lessons per year, with one guest; one additional round or lesson for each INR 50,000 spend. The issuer terms state a combined rounds-or-lessons entitlement, so separate counts are not inferred.
  - name: Annual renewal rewards
    description: For an active primary card after its anniversary, 2,500 EDGE Miles are credited within 30 days and an INR 10,000 Taj or ITC hotel voucher is offered, subject to the issuer terms.
  - name: Complimentary Stay Program
    description: Book at least 3 consecutive nights at participating Hotels.com properties through the concierge. The third-night base fare is returned as a statement credit within 2 billing cycles (up to 90 days); one room in the primary cardholder's name, up to twice per calendar year, and full payment is required.
  - name: BookMyShow movie offer
    description: Up to INR 650 off the second movie ticket, at most twice per month on an active primary card.
  - name: BookMyShow non-movie offer
    description: Up to INR 1,000 off the second non-movie ticket, at most twice per month on an active primary card.
  - name: Taj Epicure membership
    description: Complimentary membership for the primary cardholder, renewed annually if the card is active; includes 25% savings on participating hotel dining for up to 10 people, unlimited 20% Jiva Spa savings, and unlimited 25% Qmin app savings, subject to membership terms.
  - name: Domestic airport concierge and transfer
    description: The current issuer page lists 8 domestic airport meet-and-assist services and 2 airport transfers per year; transfers allow up to 3 guests per booking, subject to booking terms.
  source:
    url: https://www.axis.bank.in/docs/default-source/default-document-library/olympus-terms-and-conditions.pdf
    retrieved_on: 2026-10-26
    type: issuer-pdf
    confidence: high
    notes: >-
      Domestic lounge access is unlimited at select airports; 10 guest visits per
      calendar year shared across cardholders. Priority Pass: unlimited international
      visits and 10 guest visits per anniversary year; from 2026-08-28 PP is invalid
      for Indian domestic lounges. Primary cardholders get 8 domestic airport concierge
      visits/calendar year, 2 domestic airport transfers/year (up to 3 guests per
      booking), Taj Epicure renewed annually while active, and INR 10,000 Taj/ITC
      welcome and annual vouchers. BookMyShow offers up to INR 650 off a second movie
      ticket and INR 1,000 off a second non-movie ticket, each up to twice monthly.
      Current terms specify 8 domestic golf rounds or lessons per year with one guest and one additional round or lesson per INR 50,000 spend. The terms distinguish Visa Infinite and Mastercard World Elite variants; separate scalar network/tier fields are not assigned. They also specify 2,500 EDGE Miles and an INR 10,000 Taj/ITC voucher as annual benefits for active primary cardholders.
      The issuer migration page states Olympus is offered to former Citi Prestige cardholders. The current offer is migration-restricted, not listed among Axis's open-market credit cards. The migration page says pre-migration converted points do not expire, but post-migration points expire after 365 days without a transaction, redemption or portal login. Card-specific insurance coverage is not established by the current product page or card terms; the empty insurance list does not claim that no cover exists.
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.welcome.value_inr
    - benefits.fuel_surcharge_waiver.pct

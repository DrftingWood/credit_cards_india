    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 100
    cycle: statement
  concierge: false
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards/tejas-credit-card
    retrieved_on: '2026-11-01'
    type: issuer-page
    confidence: high
    fields_verified:
    - benefits.welcome
    - benefits.welcome.window_days
    - benefits.welcome.value_inr
    - benefits.milestones.spend_inr
    - benefits.milestones.reward_units
    - benefits.fuel_surcharge_waiver.pct

    - benefits.lounge_access.domestic.spend_threshold_inr
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.welcome.0.value_inr
    - benefits.welcome.1.value_inr
    - benefits.movies.max_per_cycle
    - benefits.movies.cap_inr
    notes: Current product page and card T&C support dual Mastercard/RuPay issuance. Product page lists domestic lounge
      access as quarterly and FAQ supplies the INR75,000 previous-quarter spend threshold; card-specific T&C confirms
      two domestic visits per quarter, one international visit per calendar year, primary cardholder only, and no
      add-on access. Dining discount is not assigned a numeric value because no stable amount is published.

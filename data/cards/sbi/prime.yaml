      outside India (max 2/quarter, primary cardholder only), INR 1,000 voucher at INR 50,000 quarterly spend, INR
      7,000 voucher at INR 5 lakh annual spend, renewal-fee waiver at INR 3 lakh, INR 3,000 welcome voucher following
      annual-fee realization, 1% fuel-surcharge waiver for INR 500 to 4,000 transactions capped INR 250 per statement
      cycle, INR 1 lakh fraud-liability cover, and Club ITC Silver membership. Domestic access is via participating
      network program; Priority Pass access requires membership and has charges for guests/visits after the allowance
      (see https://www.sbicard.com/en/most-important-terms-and-conditions.page and SBI Priority Pass FAQ). Issuer

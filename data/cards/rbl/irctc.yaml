  welcome:
  - condition: Make an eligible retail transaction above INR500 within 30 days
      of card issuance and pay the first annual membership fee by its due date
    benefit: 500 reward points; credited within 60 days of issuance
    value_inr: 500
    window_days: 30
  milestones:
  - spend_inr: 75000
    cycle: quarterly
    benefit: 500 reward points at INR75,000 eligible spend per calendar quarter
    value_inr: 500
    reward_kind: points
    reward_units: 500
    reward_currency_name: IRCTC Reward Points
    is_repeatable: true
  notes: The IRCTC product page distinguishes RuPay-only UPI/NCMC features and
    current issuer network guide lists both Mastercard and RuPay. Train
    cancellation protection is a conditional reimbursement benefit, not
    unconditional insurance.

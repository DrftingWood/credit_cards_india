rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: cashback
  currency_name: Cashback reward points
  base:
    rate: 0.5
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: ₹1 per reward point; accrues in whole-rupee multiples. Points expire one year after accrual; cashback
      redemption only against statement outstanding in multiples of 400 points. Base 0.5% is uncapped on other eligible
      spends. Insurance MCC 6300 earns base cashback only on up to ₹25,000 insurance spend/billing cycle.

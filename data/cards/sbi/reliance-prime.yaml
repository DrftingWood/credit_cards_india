id: sbi-reliance-prime
name: Reliance SBI Card PRIME
issuer: sbi
network: mastercard
network_tier: world
tier: premium
card_type: credit
co_brand:
  partner: Reliance Retail
  category: retail
  partner_website: https://www.reliancedigital.in
status: active
launched_on: 2021-06-01
discontinued_on: null

fees:
  - effective_from: 2021-06-01
    effective_until: null
    joining_fee_inr: 2999
    annual_fee_inr: 2999
    fee_waiver:
      spend_inr: 300000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card-prime.html
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2021-06-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 4
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.22
    accelerated:
      - category: ajio-jiomart-online
        canonical_categories: [online]
        multiplier: 1
        effective_rate: 20
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [ajio, jiomart]
        channel:
          class: cobrand-merchant
          merchants: [ajio, jiomart]
        notes: "20 Reward Points per ₹100 on AJIO & JioMart online stores (except UPI payments)."
      - category: reliance-retail
        canonical_categories: [online]
        multiplier: 1
        effective_rate: 10
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [reliance-digital, reliance-smart, trends, netmeds]
        channel:
          class: cobrand-merchant
          merchants: [reliance-digital, reliance-smart, trends, netmeds]
        notes: "10 Reward Points per ₹100 at other participating Reliance Retail stores (except UPI payments)."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
      - type: voucher
        program: Reliance Retail gift vouchers
        rate_inr_per_unit: 0.25
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/reliance-sbi-card-prime.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']

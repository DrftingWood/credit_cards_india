rewards:
- effective_from: 2024-04-20
  effective_until: null
  currency: points
  currency_name: EDGE Reward Points
  base:
    rate: 15
    per_inr: 200
    unit_value_inr: null
    unit_value_inr_realized: null
  exclusions:
  - emi
  - government
  - jewellery
  - fuel
  - utilities
  mcc_exclusions: []
  capping_rules:
  - Base earn is 15 EDGE Reward Points for every INR200 spent.
  - Rent spend earns points only up to INR100,000 per month.
  - Insurance earn is capped at 6,000 EDGE Reward Points per month.
  - Government institutions, gold/jewellery, fuel, utilities and telecom do not earn points.
  - EMI-converted transactions have points debited; points are not restored if the EMI is later cancelled.
  - From 20-Jun-2025, excluded spends are identified by spend category rather than four-digit MCC.
  - 'Miles transfer cap per customer ID per calendar year: 1,500,000 EDGE Reward Points overall, including up to
    300,000 to Group A partners and 1,200,000 to Group B partners.'
  redemption:
  - type: catalog
    program: Axis EDGE Rewards
    rate_inr_per_unit: null
    constraints: Catalog redemption values vary by item; Axis does not publish a fixed Burgundy Private card-specific
      cash value.

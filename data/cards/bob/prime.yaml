benefits:
- effective_from: 2026-01-15
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Spend at least INR 5,000 within 60 days of issuance; UPI transactions do not qualify for joining rewards where credit-card UPI applies.
    benefit: 500 reward points
    value_inr: 100
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+).
  - name: Lost-card liability
    description: BOBCARD Prime page advertises zero liability for fraudulent transactions after immediate loss reporting; issuer claim conditions apply.
  - name: Smart EMI
    description: Purchases above INR 2,500 may be converted to Smart EMI for 6 to 48 months, subject to issuer approval and applicable charges.
  - name: Accidental insurance
    description: Discontinued for Prime effective 25-Aug-2026 under BOBCARD's July-2026 benefits revision; do not rely on any prior accidental-cover amount.

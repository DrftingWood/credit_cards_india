rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: ICICI Reward Points
  base:
    rate: 4
    per_inr: 100
  exclusions:
  - fuel
  - emi
  capping_rules:
  - Utility and insurance transactions earn 1 ICICI Reward Point per INR100.
  redemption:
  - type: catalog
    program: ICICI Rewards
  source:
    url: https://www.icici.bank.in/personal-banking/cards/credit-card/emeralde-credit-card
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/icici/emeralde/emeralde-membership-guide-retrieved-2026-10-27.pdf
    - docs/sources/icici/emeralde/tnc-english-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    notes: Current product page publishes 4 points per INR100 on domestic and international spend, and 1 per INR100
      on utility and insurance. The issuer's 2022 membership guide says 4 points per INR100 on retail transactions
      except fuel. No current card-specific fixed point-to-rupee value was found; redemption values vary by catalogue
      item and are not encoded. Generic current terms exclude fees, charges, EMI and reversed transactions.
  notes: No fixed INR value or unsupported iShop multiplier is asserted. Current live page does not publish the exact
    current reward exclusions list or a stable card-specific iShop earn schedule.
benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via: []
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
  golf:
    rounds_per_cycle: 4
    cycle: monthly
    lessons_per_cycle: 4
    notes: One round or lesson for each INR50,000 spent on retail purchases in the previous calendar month, maximum
      four rounds/lessons monthly. Benefits are credited by the 10th of the following month and are usable in the
      next two months; booking and course conditions apply.
  insurance:
  - type: air-accident
    sum_insured_inr: 30000000
    conditions: Primary cardholder only; international travel only; ticket must be purchased using the card. Current
      product FAQ also says the card must have been used at least once during the 60 days before the incident; linked
      group policy separately defines active card using a 90-day window, a source conflict retained in the source note.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: null
    max_txn_inr: 4000
    cap_per_cycle_inr: null
    cycle: monthly
    notes: Issuer page says 1% on fuel transactions up to INR4,000; applies to primary and Plus cardholders. No
      minimum transaction or monthly waiver cap stated on the reviewed page.
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 4
    cycle: monthly
    cap_inr: 750
    notes: Buy one ticket and get up to INR750 off the second ticket, up to four times monthly. From 2026-04-01,
      cardholder must spend INR25,000 or more in the preceding spends quarter; each add-on member must meet the
      threshold individually. Dual-network holders may avail one offer per month per variant.
  concierge: true
  other:
  - name: Birthday voucher (American Express variant)
    description: ICICI lists a Tata CLiQ voucher worth INR5,000 for eligible American Express Emeralde cardholders;
      terms apply.
    value_inr: 5000
  - name: Birthday voucher (Mastercard variant)
    description: ICICI lists a PostCard Hotels voucher worth INR5,000 for eligible Mastercard Emeralde cardholders;
      terms apply.
    value_inr: 5000
  - name: Domestic travel cancellation benefit
    description: No cancellation charges for eligible domestic flight and hotel bookings, up to INR12,000, twice
      per year; claim conditions apply.
  - name: Fraud protection
    description: Counterfeit Card Liability and Account Takeover Cover are advertised on the current issuer page;
      detailed coverage limits are not stated there.
  source:

rewards:
  - effective_from: 2026-10-26
    effective_until: null
    currency: points
    currency_name: ICICI Bank Reward Points
    base:
      rate: 2
      per_inr: 100
      excluded_categories:
        - utilities
        - insurance
    accelerated:
      - category: match-day-spend
        canonical_categories:
          - other
        multiplier: 5
        effective_rate: 10
        cap_per_cycle: unlimited
        cap_unit: points
        cycle: monthly
        notes: Current product page advertises up to 10 points per INR 100 on CSK match days. The card-specific T&C last updated 21-May-2026 says match-day bonus points equal regular points earned and are credited separately, which implies 4 total points per INR 100 when regular earn is 2. The exact current match-day rate is unresolved; the product-page value is retained as the current advertised maximum and should not be treated as reconciled with the T&C.
      - category: utility-insurance
        canonical_categories:
          - utilities
          - insurance
        multiplier: 0.5
        effective_rate: 1
        cap_per_cycle: unlimited
        cap_unit: points
        cycle: monthly
        notes: Current product page says 1 point per INR 100 on utility and insurance spends; the card-specific T&C dated 21-May-2026 appears to state 2 per INR 100 on utility purchases. Page and T&C conflict; 1 is the conservative page-listed rate pending clarification. Government payments classified as utility transactions follow ICICI's general utility-payment update.
    exclusions:
      - fuel
      - rent
      - wallet-loads
      - emi
      - cash-advance
    redemption:
      - type: catalog
        program: ICICI Bank Rewards
        rate_inr_per_unit: null
        constraints: Redeem for products, vouchers and other catalogue options; point value varies by item and points are not equivalent to currency. The current ICICI Rewards FAQ states a INR 99 plus GST handling fee per redemption request and a three-year points validity period. Exact CSK-specific redemption value is unpublished.
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/csk-card
      retrieved_on: 2026-10-26
      type: issuer-page
      confidence: medium
      local_refs:
        - docs/sources/icici/csk/csk-tnc.pdf
      fields_verified:
        - rewards.currency
        - rewards.currency_name
        - rewards.base.rate
        - rewards.base.per_inr
        - rewards.accelerated.effective_rate
        - rewards.exclusions
        - rewards.mcc_exclusions
        - rewards.capping_rules
      verified_by: agent
      method: pdf-extract
      notes: Also checked the current ICICI Rewards FAQ for variable point value, fees and expiry, and the issuer changes page (https://www.icici.bank.in/personal-banking/cards/credit-card/upcoming-changes-features-and-charges) for rent/e-wallet reward exclusions and rent MCC mapping. Product page and current card-specific T&C conflict on utility and match-day rates; see card confidence audit.
    mcc_exclusions:
      - '6513'
      - '7349'
    capping_rules:
      - ICICI's current issuer update says rent and e-wallet load transactions do not earn points; MCC 6513 and 7349 are classified as rent payments. Government payments are included within utility transactions from 5-Feb-2024 and earn at the card's applicable utility rate.
benefits:
  - effective_from: 2026-10-26
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 1
        cycle: quarterly
        guests_per_visit: 0
        spend_threshold_inr: 75000
        spend_threshold_cycle: quarterly
        notes: Primary cardholder only. Requires INR 75,000 or more spend in a calendar quarter for access in the following calendar quarter.
        via:
          - issuer-direct
    welcome:
      - condition: Primary cardholder; pay the INR 500 joining fee and spend INR 5,000 in the first 45 days. Welcome gift is available only on cards charged a joining fee.
        benefit: 2,000 ICICI Bank Reward Points; dispatched within 60 days after becoming eligible.
        value_inr: null
        window_days: 45
    movies:
      type: discount
      partner: BookMyShow / INOX
      max_per_cycle: 2
      cycle: monthly
      cap_inr: 100
      notes: 25% off up to INR 100 with a minimum two tickets. INOX offer is listed twice a month. From 1-Apr-2026 BookMyShow requires INR 25,000 spend in the preceding quarter for access in the next quarter; add-on holders must individually meet the gate. ICICI says dual-network cardholders may use one BookMyShow offer per month per network variant. The page's generic twice-monthly line does not reconcile that variant rule.
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: null
      max_txn_inr: 4000
      cap_per_cycle_inr: null
      cycle: monthly
      notes: Current FAQ says 1% waiver on fuel transactions up to INR 4,000 at any fuel outlet in India, for primary and supplementary cards; the feature summary narrows this to HPCL pumps. No minimum transaction amount or cycle cap is published on the card page.
    concierge: null
    other:
      - name: Annual reward gift
        description: 2,000 ICICI Bank Reward Points within 45 business days of annual-fee payment. Not applicable when the annual fee is waived.
      - name: CSK top spender experiences
        description: Current issuer page describes meet-and-greet, practice-session and complimentary home-match ticket experiences, with campaign-specific terms and availability. The archived 2023-24 top-spender campaign terms are not treated as current campaign rules.
      - name: Monthly top-spender memorabilia
        description: Five monthly top spenders can receive signed memorabilia. Add-on spends count for the primary cardholder; only primary cardholders are selected. Cash advances, fees, EMI, reversals, tax, mutual funds, wallet and business transactions are excluded; delinquent accounts are ineligible.
      - name: Card security coverage
        description: Issuer advertises Counterfeit Card Liability and Account Takeover Cover; coverage limits and detailed conditions are not established in the accessed material.
    source:

    the shared schema has only one min_age field, so 18 is recorded with the occupational split preserved
    here. Applicant must reside in a published service city: Chennai, Gurgaon, Delhi NCR, Pune, Noida,
    Hyderabad, Mumbai, Bengaluru, Kochi, Coimbatore, Jaipur, Chandigarh, Ahmedabad, Kolkata, Amritsar,
    Baroda, Indore, Lucknow, Nagpur, Surat or Trivandrum. No minimum credit-score cutoff is published.'
  source:

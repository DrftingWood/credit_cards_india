id: sbi-landmark-select
name: Landmark Rewards SBI Card SELECT
image_path: /cards/sbi/landmark-select.webp
issuer: sbi
network: visa
network_tier: null
tier: mid
card_type: credit
co_brand:
  partner: Landmark
  category: retail
status: active
launched_on: 2020-02-20
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    fee_waiver: null # verified: MITC — Landmark Rewards SBI Card SELECT 1,499/1,499, no spend-based waiver listed
    forex_markup_pct: 3.5 # verified: MITC — 3.5% foreign currency txn fee (standard cards)
    finance_charge_monthly_pct: 3.75 # verified: MITC — up to 3.75% p.m. (45% p.a.)
    cash_advance_fee:
      pct: 2.5 # verified: MITC — 2.5% or Rs.500 whichever higher
      min_inr: 500
    gst_applicable: true
    supplementary_card_fee_inr: 0
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2 # verified: SELECT booklet — "Earn 2 Reward Points per Rs.100 on other retail purchases (Non fuel)"
      per_inr: 100
      unit_value_inr: 0.25
    accelerated:
      - category: landmark-stores-online-and-retail
        canonical_categories: [online, other]
        merchants: [Lifestyle, Home Centre, Max, Spar, Baby Shop, EasyBuy]
        channel:
          class: cobrand-merchant
          merchants: [lifestyle, home-centre, max, spar, baby-shop, easybuy]
        multiplier: 7.5
        effective_rate: 15
        notes: "15 Reward Points per INR100 at named Landmark stores. The booklet does not state a card-specific cap; SBI's generic cap wording does not clearly resolve this 7.5X tier, so no unlimited cap claim is made."
      - category: dining-movies
        canonical_categories: [dining, entertainment]
        multiplier: 5
        effective_rate: 10
        cap_per_cycle: 7500
        cap_unit: points
        cycle: monthly
        notes: "10 Reward Points per INR100 on Dining and Movies. The current SBI Cardholder Agreement caps cumulative 5X categories at 7,500 points/month for PRIME and relevant co-brand variants; base 2 points/INR100 continue after the cap."
      - category: international-spends
        canonical_categories: [international]
        multiplier: 5
        effective_rate: 10
        notes: "10 Reward Points per INR100 on international spends; international is not among categories named in the PRIME 7,500-point cap clause."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - insurance-premiums
      - emi
    redemption:
      - type: catalog
        program: Landmark Rewards
        rate_inr_per_unit: 0.25
        fee_inr: 99
        constraints: Closed-loop conversion into Landmark Rewards only; 4 SBI Reward Points = INR 1 in the Landmark program. INR 99 + GST conversion fee applies below 1,000 points. No statement-credit redemption is published for this card.
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high

    mcc_exclusions: ['6513', '5712', '5541', '5983', '5542']
    capping_rules:
      - "Current SBI Cardholder Agreement caps cumulative 5X points on SBI Card PRIME dining, movies, departmental stores and groceries at 7,500/month and says caps apply to relevant co-brand variants. Applied to SELECT's 5X dining/movie tier. The Landmark-specific 7.5X store earn is not explicitly mapped to that 5X wording; its cap applicability is unresolved and no unlimited claim is made."
benefits:
  - effective_from: 2026-07-03
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [visa]
        notes: 8 complimentary visits per calendar year, maximum 2 per quarter. SBI's Jan-2026 lounge revision lists Landmark SELECT in Set A but not among cards whose quota was reduced; current participation list still includes the card.
    milestones:
      - spend_inr: 300000
        cycle: annual
        benefit: "12,000 bonus Reward Points on overall annual retail spends of Rs. 3,00,000"
        value_inr: 3000
        reward_kind: points
        reward_units: 12000
        reward_currency_name: Reward Points
        trigger_window: anniversary-year
    welcome:
      - condition: "On payment of annual fees"
        benefit: "6,000 bonus Reward Points worth Rs. 1,500"
        value_inr: 1500
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: statement
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high

eligibility:
  min_age: 21
  max_age: 70
  age_ranges:
    salaried: {min_age: 21, max_age: 65}
    self_employed: {min_age: 25, max_age: 70}
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: "SBI Card policy states age 21-65 for salaried applicants and 25-70 for self-employed applicants; the broad 21-70 range preserves the occupation-specific detail in age_ranges. No card-specific minimum income or fixed credit-score cutoff is published; approval depends on SBI Card underwriting."
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/who-we-are/notices/policy-for-the-issuance-and-conduct-of-credit-cards-2023.pdf
    retrieved_on: '2026-10-25'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified: [eligibility.min_age, eligibility.max_age, eligibility.age_ranges]
    notes: "Issuer policy section 3 gives the occupation-specific age ranges. SBI states card-specific income minimums vary; this policy does not publish a fixed credit-score cutoff."
application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card-select.html


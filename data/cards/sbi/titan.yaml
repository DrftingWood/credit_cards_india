        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: []
        notes: 4 complimentary international visits per year, maximum 2 per quarter. SBI booklet describes Priority Pass membership for first 2 years; confirm current eligibility and program terms for the issued variant.

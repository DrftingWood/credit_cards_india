  notes: Current Privilege Easy page confirms 10 EDGE points per INR 200 and that fuel earns no reward points. The issuer
    terms effective 28-Aug-2026 state gift cards remain reward-excluded and that bridge fees, road fees and tolls earn no
    rewards. Other category reward exclusions in the prior record could not be verified from current card-specific issuer
    material reviewed; they are not asserted here. No universal point redemption value or card-specific reward MCC list
    is published.

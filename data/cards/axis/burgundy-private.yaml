eligibility:
  min_age: null
  max_age: null
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: null
  notes: The One Card is offered to Burgundy Private clients meeting the INR5 crore TRV requirement excluding demat.
    The Burgundy Private programme eligibility page also describes a net salary credit pathway (INR10 lakh/month
    average over the prior 3 months) for Burgundy Private account eligibility; the card page says The One Card itself
    requires Burgundy Private client status and INR5 crore TRV. The relationship requirement cannot be represented
    in the schema. The page also supports Burgundy Private NRI variants, so residency is not restricted to resident
    Indians. Numeric age, card-specific income and bureau-score cutoffs are not published.

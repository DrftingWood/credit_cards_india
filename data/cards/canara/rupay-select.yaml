      - rent
      - insurance-premiums
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: catalog
        program: Canara Rewardz
        rate_inr_per_unit: 0.25
    source:
      url: https://www.canarabank.bank.in/pages/rupay-select-credit-card
      retrieved_on: 2026-07-04
      type: issuer-pdf
      confidence: high
      local_refs:
        - docs/sources/canara/rupay-select/variants-and-features.pdf
      fields_verified:
        - rewards.base.rate
        - rewards.base.per_inr
      notes: "Issuer schedule: 2 Reward Points per Rs 100 on POS/E-Commerce (fractions of Rs 100 excluded); redeem via canararewardz.com."


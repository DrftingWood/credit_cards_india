  notes: 'Fixed Deposit-backed secured card. Standard joining and renewal fees are INR 1,500; joining fee is nil for Priority
    customers. Annual fee is reversed at INR 500,000 eligible anniversary-year spend. The issuer excludes utility/telecom,
    rent, wallet, government, insurance, gold/jewellery, fuel, education, bridge fees, road fees/tolls, and (from 28-Aug-2026)
    gift-card purchases from fee-waiver spend. Current issuer-listed charges: finance 3.4% monthly (49.36% p.a.); cash advance
    2.5% (minimum INR 500); cash payment INR 175; card replacement/add-on nil; duplicate statement, charge-slip retrieval,
    outstation cheque, mobile alerts, hotlisting and balance enquiry waived; late fee nil below INR 500, INR 500 at INR
    501-5,000, INR 750 at INR 5,001-10,000, INR 1,200 at INR 10,001-50,000 and INR 1,300 above INR 50,000, plus INR 100
    after two consecutive missed MAD cycles until cured; overlimit 2.5% (minimum INR 500); cheque return/auto-debit reversal
    2% (minimum INR 500); railway surcharge as set by IRCTC; fuel transaction surcharge 1% refunded on INR 400-4,000 transactions;
    foreign-currency markup 3.5%; DCC 3.5% plus taxes effective 28-Aug-2026; rent 1%; third-party education 1%; wallet 1%
    at INR 10,000/cycle; fuel 1% at INR 50,000/cycle; utilities 1% at INR 25,000/cycle; online skill gaming 1% at INR 10,000/cycle.
    EDGE redemption fee is waived. The exact INR 500 late-fee boundary is not stated.'

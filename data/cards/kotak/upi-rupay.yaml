  capping_rules:
  - Reward points on utility spends only up to INR35,000 per statement cycle; utility spend above this cap does not earn points.
  - Points are earned only on integer multiples of INR100; spends below INR100 and residual amounts do not earn points.
  - Effective 2025-06-01, reward points stopped for insurance, government, online skill-based gaming, rent, education, fuel and wallet-load categories.
  - Railway and balance-transfer transactions are also excluded under current issuer terms.

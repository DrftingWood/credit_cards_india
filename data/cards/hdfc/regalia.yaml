    notes: Cross-checked the Regalia-specific page and current Personal MITC
      version 4.15 updated 17-Oct-2026. The MITC KFS fee table applies the same
      INR 2,500 fee and INR 3 lakh annual waiver to Regalia; its general charges
      set 3.75% monthly finance and 2.5%/INR 500 cash advances. Current product
      FAQ says foreign-currency markup 3.5%. The Regalia-specific May change
      notice says DCC 1.75% effective 15-May-2026, while the latest shared MITC
      says effective 20-May-2026; modeled the latest shared MITC date and kept
      the product-specific date conflict noted.
  notes: Current product terms list INR 2,500 joining/renewal, INR 300,000
    annual-fee waiver, 3.5% foreign-currency markup, 3.75% monthly finance
    charge and cash advance at 2.5%/INR 500. The latest shared MITC lists 1.75%
    DCC markup effective 20 May 2026; the Regalia-specific notice says 15 May.
    DCC is separate from foreign-currency markup and has no schema field. The
    shared MITC also lists a 1% rent fee from the second monthly rental payment
    and wallet/gaming fees at defined thresholds; these lack dedicated fields.
rewards:
- effective_from: '2026-05-15'
  effective_until:
  currency: points
  currency_name: Reward Points
  base:
    rate: 4
    per_inr: 200
    unit_value_inr: 0.5
    unit_value_inr_realized: 0.5
    notes: 4 Reward Points per INR 200 eligible retail spend from 15-May-2026;
      transactions earn only in INR 200 multiples and residual amounts or
      transactions below INR 200 earn no points. Updated from the earlier INR
      150 base threshold. Retail includes valid purchases; fuel earns none. Point
      value is modeled at INR 0.50, the published SmartBuy travel redemption
      value; miles have no guaranteed INR value.
  accelerated:
  - category: smartbuy-flights-hotels-vouchers
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 20
    cap_unit: points
    channel:
      required: true
      class: issuer-portal
      merchants:
      - smartbuy
    notes: Up to 5X total Reward Points on eligible SmartBuy transactions. The
      current linked Regalia issuer terms do not state a SmartBuy-specific
      accrual cap; do not model an unsupported cap.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  redemption:
  - type: other
    program: HDFC SmartBuy flights/hotels
    rate_inr_per_unit: 0.5
    constraints: Published travel redemption value is INR 0.50 per Reward Point;
      no more than 70% of eligible travel booking value may be paid with points.
      SmartBuy flights/hotels redemption is capped at 50,000 points per calendar
      month.
  - type: catalog
    program: HDFC SmartBuy products and vouchers
    rate_inr_per_unit: 0.35
    constraints: Issuer page states up to INR 0.35 per point; actual catalogue
      values vary.
  - type: statement-credit
    program: HDFC cashback redemption
    rate_inr_per_unit: 0.15
    constraints: Issuer page states INR 0.15 per point; cashback redemption
      capped at 50,000 points per calendar month.
  - type: airmiles
    program: Airmiles
    ratio: "100:50"
    constraints: Issuer page states up to 0.5 miles per point. Mile value varies
      and no fixed rupee value is published. Existing specific terms list
      Singapore Airlines/KrisFlyer at 100:50; current eligibility of this legacy
      route should be rechecked.
  source:
    url:
      https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/regalia-credit-card/pdfs/rp-regalia.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: medium
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated.effective_rate
    - rewards.category_caps
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption.rate_inr_per_unit
    notes: Reviewed the issuer Regalia reward-terms PDF and live product page.
      Product terms confirm 4 RP/INR 200 after the May-2026 change, grocery cap,
      total statement-cycle cap, exclusion/expiry rules, and redemption
      rates/limits. The current linked issuer terms do not substantiate the
      previously recorded SmartBuy 4,000/month and 3,000/month voucher caps,
      so these are omitted from structured data.
  category_caps:
  - category: grocery
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Reward points from grocery transactions are capped at 2,000 per
      calendar month.
  - category: all-eligible-spends
    cap_per_cycle: 50000
    cap_unit: points
    cycle: statement
    conditions: Regalia-specific terms state that maximum points earned in a
      statement cycle are 50,000; verify whether SmartBuy bonuses are included
      in this overall cap because the terms do not make the interaction clear.
  - category: utilities
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Current Personal MITC caps utility-category earn at 2,000 Reward Points per calendar month.
  - category: telecom
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Current Personal MITC caps telecom-category earn at 2,000 Reward Points per calendar month.
  capping_rules:
  - Only valid retail purchases earn; fuel, wallet loads, EasyEMI,
    rent/property-management and government transactions are excluded.
  - Grocery earn is capped at 2,000 points per calendar month; total earn is
    capped at 50,000 points per statement cycle under Regalia-specific terms.
  - Utility and telecom earn are each capped at 2,000 points per calendar month. Online skill-based gaming does not earn Reward Points.
  - Points expire after two years and are nullified after 365 days without card
    use; insurance earn is capped at 2,000 points/month.
  - If a retail purchase is converted to SmartEMI, accrued points are reversed.
  - Online skill-based gaming transactions do not earn Reward Points; this category is documented in notes because the schema exclusions enum has no matching value.

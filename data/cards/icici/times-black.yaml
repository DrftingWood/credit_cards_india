    notes: Insurance schedule updated December 2025. Older YAML incorrectly called the INR30,000,000 death-only
      air cover permanent-disability cover and used an unsupported INR5,000,000 travel-medical limit. Domestic lounge
      access is unlimited for primary/add-on cardholders; international Priority Pass access is unlimited for primary/add-on
      cardholders, while guests are chargeable. Current issuer card-specific T&C (updated 02-May-2025) confirms
      unlimited domestic and international access for primary and add-on cardholders. International Priority Pass
      guest visits are charged USD29 + GST per guest. The lounge schema cannot encode per-guest charges or add-on
      cardholder access separately. The T&C confirms 1% fuel waiver with maximum INR1,000 per statement cycle; it
      prints numeric terms in bracketed template form. The issuer says joining benefit communication is sent within
      45 business days after the joining fee is paid; T&Cs require joining fee + GST within the first two statement
      cycles. Milestone vouchers/services unlock at the annual spend thresholds and remain available for six months
      from notification.

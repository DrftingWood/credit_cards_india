rewards:
- effective_from: 2023-03-01
  effective_until: null
  currency: points
  currency_name: IRCTC Reward Points
  redemption_scope: closed-loop
  ecosystem_label: IRCTC
  loyalty_program: irctc-loyalty
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: 1 point per INR 100 on eligible other spends; points post on settled transactions. Category-specific monthly caps are listed below. Fuel, wallet/gift/prepaid loads, cash advances, government, education, rent, card fees, Smart EMI/Dial-an-EMI transactions and merchant EMI interest/fees/GST are excluded; merchant EMI principal earns points.
  accelerated:
  - category: irctc-rail-bookings
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 5
    card_attributable_rate: 5
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_per_cycle: 1000
    cap_unit: points
    cycle: monthly
    merchants:
    - irctc
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - irctc-direct
    notes: 5X total (1X base + 4X additional) on IRCTC ticketing website/Rail Connect and HDFC SmartBuy IRCTC rail bookings recognized by IRCTC MIDs/TIDs. Total 5X reward points are capped at 1,000/month and 12,000/year; points beyond cap do not post.
  category_caps:
  - category: irctc-rail-bookings
    cap_per_cycle: 1000
    cap_unit: points
    cycle: monthly
    conditions: Total 5X IRCTC reward points are capped at 1,000/month and 12,000/year; the terms illustrate 1X base plus 4X additional.
  - category: groceries
    cap_per_cycle: 1000
    cap_unit: points
    cycle: monthly
    conditions: Eligible grocery transactions; eligible spend limited to INR 100,000/month. 12,000 points/year also stated.
  - category: insurance
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Card-specific cap table says INR 2,000 monthly effective 1 July 2025; another line says INR 2,000/day. Modeled monthly per the cap table; conflict unresolved.
  - category: upi
    cap_per_cycle: 500
    cap_unit: points
    cycle: monthly
    conditions: Calendar-month UPI reward cap.
  - category: utility-bill-payments
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Eligible spend limited to INR 200,000/month.
  - category: telecom
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    conditions: Eligible spend limited to INR 200,000/calendar month.
  - category: other-spends
    cap_per_cycle: 1000
    cap_unit: points
    cycle: monthly
    conditions: 12,000 points/year also stated for other spends. Broader base earn is not separately represented due to schema cap scope.
  capping_rules:
  - Monthly reward caps and spend limits are recorded in category_caps; issuer terms state that reward points are not awarded for spends beyond monthly feature caps.
  - Insurance cap conflicts within the issuer PDF (INR 2,000/month in the product cap table and INR 2,000/day in a related line); monthly is modeled pending clarification.
  - Reward points expire two years after the last eligible earning/use transaction per product terms; the live card page instead describes validity as two years from earning.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  redemption:
  - type: voucher
    program: IRCTC
    rate_inr_per_unit: 1.0
    min_units: 100
    fee_inr: 99
    constraints: Redeem only against train ticket bookings through HDFC SmartBuy; points can cover up to 70% of total fare including IRCTC service charges. INR 99 plus GST is charged per successful redemption.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/irctc-credit-card/irctc-tnc-09-10-25.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/hdfc/irctc-hdfc/irctc-tnc-09-10-25.pdf
    - docs/sources/hdfc/irctc-hdfc/terms-and-conditions-current-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated.multiplier
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
    - rewards.accelerated.cycle
    - rewards.accelerated.channel
    - rewards.category_caps
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption.rate_inr_per_unit
    - rewards.redemption.min_units
    - rewards.redemption.fee_inr
    notes: Current product-specific terms and live card page were checked. The redemption rule is limited to SmartBuy train bookings, with a 70% fare ceiling, INR 99 plus GST fee, and 100-point minimum. Merchant EMI principal earns points; Smart EMI/Dial-an-EMI and merchant EMI interest/fees/GST do not. Insurance earns points subject to category spend and points caps; the issuer PDF conflicts on whether its point cap is monthly or daily, so the monthly table value is modeled.
  mcc_exclusions:
  - '5816'
  - '6540'
benefits:
- effective_from: 2023-03-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 8
      cycle: annual
      guests_per_visit: null
      via:
      - issuer-direct
      notes: Select IRCTC Executive Lounges; maximum 2 complimentary visits per quarter. INR 2 card validation charge is non-refundable.
  milestones:
  - spend_inr: 30000
    cycle: quarterly
    benefit: INR 500 gift voucher for INR 30,000 eligible spend each calendar quarter (from 1-Jan-2026)
    value_inr: 500
    reward_kind: voucher
    is_repeatable: true
    max_awards_per_cycle: 1
  welcome:
  - condition: Current card page advertises INR 500 after one transaction of any amount within 37 days of issuance. October 2025 terms limit the specific offer to LTF cards issued 1 Oct–31 Dec 2025 and exclude some older LTF/fee-reversal cohorts; applicability for other cohorts is not stated consistently.
    benefit: INR 500 activation gift voucher
    value_inr: 500
    window_days: 37
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: IRCTC transaction charge waiver
    description: 1% transaction surcharge reversed for IRCTC website/mobile app, Rail Connect and HDFC SmartBuy bookings; capped at INR 1,000 per calendar month. Reversal is adjusted proportionally if a ticket is cancelled/refunded.
  - name: SmartBuy train booking cashback
    description: Additional 5% cashback on IRCTC train tickets booked via HDFC SmartBuy, on top of 5X reward points; capped at INR 1,000/month and INR 12,000/year. Offer terms can change dynamically.
  concierge: false
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/irctc-credit-card/irctc-tnc-09-10-25.pdf
    retrieved_on: 2026-10-27

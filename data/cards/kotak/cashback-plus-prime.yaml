  - category: online food grocery entertainment
    canonical_categories:
    - online
    - groceries
    - dining
    - entertainment
    multiplier: 10
    effective_rate: 5
    notes: 5% on eligible MCCs for online food and grocery delivery and online entertainment; MCC-controlled.
  - category: auto dealer
    canonical_categories:
    - other
    multiplier: 10
    effective_rate: 5
    notes: 5% on eligible auto-dealer MCCs.
  - category: fuel
    canonical_categories:

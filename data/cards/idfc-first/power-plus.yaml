    notes: >-
      Issuer page says Power+ has no fuel surcharge waiver, while the current MITC
      schedule lists a 1% waiver for INR 200-5,000 fuel purchases with the Power+ cap
      marked “Not Applicable” (i.e. no numeric cap). Conflict left unresolved; no
      structured waiver is asserted. Roadside assistance value up to INR 1,399 and
      up to four services yearly; eligibility requires an active card with a recent
      transaction. Sources also include IDFC FIRST Power+ privileges and the current
      MITC schedule. The dedicated offer details specify the HPCL welcome voucher
      within 60 days for cards set up from 10-Jun-2025, while a general FAQ on the
      product page says 30 days; the dedicated current terms are followed and the
      discrepancy remains documented.

rewards:
- effective_from: 2026-10-26
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 3
    per_inr: 100
    unit_value_inr: 1
    unit_value_inr_realized: 1
    notes: 3 points per INR100 on eligible purchases; selected MCCs earn 0.7 points per INR100. Fuel transactions earn no points. Points are stated to remain live while the card account remains active.
  accelerated:
  - category: low-mcc-merchant-spend
    effective_rate: 0.7
    effective_per_inr: 100
    cap_status: not-published
    canonical_categories:
    - utilities
    - insurance
    - education
    - telecom
    - government
    notes: Issuer lists transportation/tolls MCCs 4111, 4121, 4131, 4112 and 4784; utilities 4900; insurance 5960 and 6300; education 8211, 8241, 8244, 8249 and 8299; telecom 4812; securities brokers 6211; cleaning and maintenance 7349; and government 9211, 9222, 9311, 9399, 9402, 9405 and 8220. Fuel itself earns no points.
    source:
      url: https://bank.indusind.bank.in/content/dam/ipbprivate/attachments/Pioneer-Private-Card-detailed-TNCs.pdf
      retrieved_on: 2026-10-26
      type: issuer-pdf
      confidence: high
      local_refs:
      - docs/sources/indusind/pioneer-private/pioneer-private-detailed-tnc-retrieved-2026-10-26.pdf
      fields_verified:
      - rewards.accelerated[0].effective_rate
      - rewards.accelerated[0].effective_per_inr
  exclusions:
  - fuel
  mcc_exclusions: []
  capping_rules:
  - No general earning cap is stated in the card-specific terms. A previously indexed version of the issuer cash-credit page stated a 30,000-point monthly cash-credit cap, while the current fetched issuer page and detailed T&Cs say no monthly redemption cap across eligible options. Treat the 30,000-point figure as stale/uncertain and confirm at redemption.
  redemption:
  - type: statement-credit
    program: cash credit
    rate_inr_per_unit: 1
    min_units: 500
    fee_inr: 0
    constraints: INR1 per point; minimum redemption 500 points. Current issuer reward page and detailed T&Cs say no monthly cap across eligible options, but an indexed older version of the page stated 30,000 points/month for cash credit. Confirm applicable cap at redemption.
  - type: catalog
    program: IndusMoments gift vouchers
    rate_inr_per_unit: 1
    constraints: Card-specific terms list INR1 per point for gift vouchers; catalogue and partner terms apply.
  - type: airmiles
    program: airline miles
    rate_inr_per_unit: null
    ratio: '1:1'
    constraints: Detailed card terms list 1 point = 1 airmile; eligible partners and transfer terms apply.
  source:

  effective_until:
  joining_fee_inr: 500
  annual_fee_inr: 500
  fee_waiver:
    spend_inr: 100000
    cycle: annual
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.75
  cash_advance_fee:
    pct: 2.5
    min_inr: 500
  gst_applicable: true
  notes: Joining fee is waived on eligible spend of INR 20,000 in the first 90
    days; renewal fee is waived on INR 100,000 eligible spend in a year before
    renewal. Current Pixel MITC also lists 1.75% dynamic currency conversion
    markup effective 20 May 2026; schema has no dedicated DCC fee field. The
    HDFC October-2026 Pricing MID lists a lifetime-free offer through 31-Oct-2026;
    the published standard fee remains INR 500 and account-specific offer terms
    may differ.

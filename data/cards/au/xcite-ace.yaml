    - benefits.insurance[0].sum_insured_inr
    - benefits.insurance[1].sum_insured_inr
    - benefits.insurance[2].sum_insured_inr
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    notes: Current product page states domestic lounge gate, rail visits and insurance benefit amounts/categories; rail validation and guest rules are from the linked 1-May-2026 terms. Fuel waiver changed to INR 100 per statement cycle effective 1-Oct-2026; the 30-Sep-2026 KFS still lists INR 200, so the dated later product-page revision governs. The linked insurance policy is dated 16-Apr-2021 and the device-plan details require login; no current policy wording or insurer schedule was publicly accessible on 1-Nov-2026. Amounts/categories are current-page claims, while detailed insurance conditions remain unverified.

benefits:
- effective_from: 2026-10-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: Two visits per quarter after INR 50,000 eligible settled spend in the preceding 3 calendar months. New-card spend gate is waived for the issue month and following 3 calendar months. Free entry is for the cardholder only; guests pay at the lounge. From 28 Aug 2026, use the physical Select card (not Priority Pass) for domestic entry in India. Domestic lounge terms charge a nominal swipe fee depending on network.
      via:
      - issuer-direct
    international:
      visits_per_cycle: 6
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Six complimentary visits per card-anniversary year. Up to six more visits and renewal for the next year are tied to INR 3 lakh anniversary-year spend; from 1 Oct 2026, insurance, utilities/telecom, gold/jewellery, education, government services, rent, fuel, wallet and gift-card spends do not count toward this threshold. Guests are chargeable. The card page and 28 Aug 2026 revision say achieving INR 3 lakh, while the linked Priority Pass terms specify strictly greater than INR 3 lakh for the extra visits; the exact boundary remains inconsistent in issuer materials.
  golf:
    rounds_per_cycle: 6
    cycle: annual
    notes: Current Select page gives 6 complimentary rounds per year and 6 additional rounds on achieving INR 3 lakh anniversary-year spend. The 28 Aug 2026 revision applies the same excluded-category list as lounge renewal to this spend gate. Book through Extraordinary Weekends/Golflan at least 4 days ahead, subject to availability; this is not a golf-club membership. The linked older golf PDF describes the extra-round threshold against preceding-year spend, unlike the current page's same-anniversary-year rule.
  milestones:
  - spend_inr: 300000
    cycle: annual
    benefit: 5,000 EDGE Reward Points plus up to 6 additional international Priority Pass visits, 6 additional golf rounds, and Priority Pass renewal for the next anniversary year on eligible anniversary-year spend.
    value_inr: null
    reward_kind: points
    reward_units: 5000
    trigger_window: anniversary-year
  dining:
    program: Dining Delights (EazyDiner)
    notes: Current terms give 25% off up to INR 800, minimum order INR 2,500, once per card per month at participating restaurants through EazyDiner.
  welcome:

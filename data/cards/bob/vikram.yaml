benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: First transaction/card activation within 30 days of issuance
    benefit: Complimentary 3-month JioHotstar subscription; coupon code sent after
      eligibility. Current rupee value not established.
    window_days: 30
  - condition: Spend INR 5,000 or more within 60 days of issuance
    benefit: 500 bonus BOBCARD Reward Points
    value_inr: 125
    window_days: 60
  insurance:
  - type: personal-accident
    sum_insured_inr: 2000000
    conditions: Personal accidental-death cover for air/non-air accidents; issuer
      product page states INR 20 lakh. Full policy wording and any separate on-duty
      cover are not confirmed.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
    notes: 1% waiver on INR 400-5,000 fuel transactions up to INR 250 per statement;
      GST on surcharge is not reversed. Fuel earns no reward points.
  other:
  - name: Smart EMI
    description: Purchases of INR 2,500 and above may be converted to 6-48 month EMIs;
      applicable charges are shown at conversion.
  - name: Add-on cards
    description: Up to three lifetime-free add-on cards for spouse, parents, siblings
      or children above 18.
  - name: Lost-card liability
    description: Issuer advertises zero liability for fraudulent transactions if loss
      is reported immediately; detailed conditions apply.
  - name: Network representation
    description: Universal issuer application form lists Vikram under RuPay; the network
      tier is not established.
  - name: Interest-free period
    description: Up to 50 days of interest-free credit when the previous balance is
      paid in full; exact period depends on billing-cycle timing.
  - name: Contactless payments
    description: Contactless card capability is advertised by BOBCARD; transaction
      limits follow network and issuer rules.

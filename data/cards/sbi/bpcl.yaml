    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    supplementary_card_fee_inr: 0
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/bpcl-sbi-card.html

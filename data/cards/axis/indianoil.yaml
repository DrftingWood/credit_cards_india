rewards:
- effective_from: 2026-08-28
  effective_until: null
  currency: points
  currency_name: EDGE Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: null
    unit_value_inr_realized: null
  accelerated:
  - category: indianoil-fuel
    canonical_categories:
    - fuel
    multiplier: 1
    effective_rate: 20
    cap_per_cycle: 1000
    cap_unit: points
    cycle: monthly
    merchants:
    - iocl
    channel:
      class: fuel-network
      merchants:
      - iocl
    notes: Earn 20 points per INR 100 on eligible IndianOil fuel transactions. Product page says settlement INR 400–4,000; up to INR 5,000 eligible spend / 1,000 accelerated points per calendar month. Card-specific terms say transactions above the monthly eligible spend receive no reward (base points do not backstop fuel overflow).
  - category: online-shopping
    canonical_categories:
    - online
    multiplier: 1
    effective_rate: 5
    cap_per_cycle: 250
    cap_unit: points
    cycle: monthly
    notes: 5 points per INR 100 on qualifying online transactions of INR 100–5,000, on up to INR 5,000 cumulative eligible spend per calendar month; no more than 250 accelerated points per month.
  exclusions:
  - wallet-loads
  - rent
  - insurance-premiums
  - emi
  - utilities
  - education
  - government
  - jewellery
  - cash-advance
  - gift-cards
  - bridge-fees
  - road-fees-and-tolls
  redemption: []
  source:
    url: https://www.axis.bank.in/docs/default-source/default-document-library/terms-and-conditions-for-iocl-credit-card.pdf?sfvrsn=9ab59582_5
    retrieved_on: 2026-10-26
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/axis/indianoil/terms-and-conditions-for-iocl-credit-card-retrieved-2026-10-26.pdf
    - docs/sources/axis/indianoil/indianoil-terms-update-effective-2026-08-28.pdf
    - docs/sources/axis/indianoil/indianoil-reward-exclusions-update-effective-2025-06-20.pdf
    - docs/sources/axis/_shared/iocl-fuel-outlet-list-retrieved-2026-10-26.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated
    - rewards.exclusions
    notes: The 2025 revision says reward exclusions are determined by spend category rather than MCC. Current product page lists insurance, gold/jewellery, wallet, rent, utilities, government and education; the 2025 update additionally names telecom, financial institutions, cash advances and repayments. The Aug-2026 card-specific terms additionally exclude gift cards and bridge/road fees/tolls. No point-to-rupee redemption value or general redemption ratio is assigned because available public terms are route-dependent and do not establish a single standard value for this card.
  mcc_exclusions: []
  capping_rules:
  - Fuel acceleration applies to up to INR 5,000 qualifying spend per calendar month, capped at 1,000 points; product T&C says fuel transactions beyond the cap do not receive rewards.
  - Online acceleration applies to up to INR 5,000 qualifying spend per calendar month, capped at 250 points.
benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access: null
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 50
    cycle: monthly
    notes: Current card-specific terms restrict the waiver to eligible IndianOil outlets and say maximum INR 50 per calendar cycle; product page describes a statement-cycle cap. GST on fuel surcharge is not refunded. The cycle wording is inconsistent/ambiguous in issuer materials.
  movies:
    type: discount
    partner: BookMyShow
    cap_inr: 100
    notes: 10% discount, maximum INR 100 per card per month. Issuer notice says an INR 25,000 spend in the preceding 3 months becomes an eligibility condition effective 2026-11-01; new-card waiver applies for issue month and following 3 calendar months. As of this review date (2026-10-26), the issuer's older linked offer PDF expired 2025-03-31 and the current page omits cap/frequency, so current terms through 2026-10-31 are not fully established.
  welcome:
  - condition: First eligible fuel transaction on primary card within 30 days of card issuance; one time only. Migrated, swapped and replacement cards excluded unless Axis specifically communicates eligibility.
    benefit: 100% value back on eligible fuel spend, up to 1,250 EDGE Reward Points (equivalent to INR 250); only the first fuel transaction qualifies.
    value_inr: 250
    window_days: 30
  other:
  - name: Wednesday Delight
    description: Dynamic weekly offers shown on the current issuer page, including travel, food delivery and Tira offers; merchant terms and availability change.
  - name: Dining Delights
    description: Access to Axis Bank Dining Delights participating restaurants; issuer page does not specify a fixed discount or value for this card.
  concierge: false
  source:
    url: https://www.axis.bank.in/cards/credit-card/indianoil-axis-bank-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/axis/indianoil/terms-and-conditions-for-iocl-credit-card-retrieved-2026-10-26.pdf
    - docs/sources/axis/indianoil/indianoil-terms-update-effective-2026-08-28.pdf
    - docs/sources/axis/indianoil/indianoil-activation-benefit-terms.pdf
    - docs/sources/axis/indianoil/bookmyshow-offer-terms-retrieved-2026-10-26.pdf
    fields_verified:
    - benefits.fuel_surcharge_waiver
    - benefits.movies
    - benefits.welcome
    notes: Fuel surcharge waiver terms are ambiguous on cycle wording (calendar vs statement). BookMyShow offer's linked detailed terms expired in March 2025; the Aug-2026 notice defines a new INR 25,000 / preceding 3-month gate effective 2026-11-01. No lounge benefit is listed for this card on the current product page.

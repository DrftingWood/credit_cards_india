  min_age: 18
  max_age: 70
  income_inr_annual:
    salaried: 2400000
    self_employed: 2400000
  credit_score_min: null
  residency: either
  notes: "Min net income ₹24 lakhs p.a. Resident Indian or NRI. Following the Vistara–Air India merger (effective 12-Nov-2024), the card's T&C were revised and cardholders are being migrated to Air India's Maharaja Club programme; sourcing of new cards is discontinued."


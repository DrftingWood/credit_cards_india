    notes: Current card-specific Member Terms PDF version d015df26_5 reviewed 2026-10-27. Reward exclusions are category-based, with no exact MCC table for those categories published in this card-specific PDF; utility bonus MCCs and travel MCCs are published. Axis generic revision effective 28 Aug 2026 separately classifies gift cards outside Wallet and excludes gift-card purchases from rewards and spend-based fee waivers.

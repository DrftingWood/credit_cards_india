rewards:
- effective_from: '2026-01-18'
  effective_until:
  currency: points
  currency_name: Reward Points
  base:
    rate: 3
    per_inr: 200
    unit_value_inr: 0.25
  accelerated:
  - category: dining-travel-international-birthday
    canonical_categories:
    - dining
    - travel
    - international
    multiplier: 3.333333
    effective_rate: 10
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    notes: '10X = 10 points per INR200 on dining, travel, international purchases and birthday spends. Dining MCCs 5812, 5813, 5814; travel MCCs 3000-3350, 3501-3853, 7011, 4511, 4722, 4723. Birthday spend does not map to a canonical merchant category.'
    source:
      url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/Select-Credit-Card.pdf
      retrieved_on: '2026-10-26'
      type: issuer-pdf
      confidence: high
  - category: utility-insurance-railway-fastag
    canonical_categories:
    - utilities
    - insurance
    multiplier: 0.333333
    effective_rate: 1
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    notes: '1 point per INR200 on utility, insurance, railway and FASTag spends. Railway/FASTag excluded from 10X threshold calculation; FASTag above INR10,000 and railway above INR25,000 per billing cycle incur 1% surcharge plus GST on total category spend.'
    source:
      url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/Select-Credit-Card.pdf
      retrieved_on: '2026-10-26'
      type: issuer-pdf
      confidence: high
  exclusions:
  - fuel
  - emi
  - cash-advance
  mcc_exclusions:
  - '6513'
  redemption:
  - type: catalog
    program: FIRST Rewards Gallery
    rate_inr_per_unit: 0.25
    constraints: INR99 + GST convenience fee per redemption; points valid 24 months from credit date. Posted on statement generation only if MAD paid by due date.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/select
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated[0].effective_rate
    - rewards.accelerated[1].effective_rate
    - rewards.exclusions
    - rewards.redemption
    method: manual-read
    local_refs:
    - docs/sources/idfc-first/select/product-guide-retrieved-2026-10-26.pdf
    - docs/sources/idfc-first/select/important-update-retrieved-2026-10-26.pdf
  notes: 'Effective 2026-01-18, rewards base changed from 1 point/INR150 to 1/INR200. Product page conflicts: reward FAQ says points never expire, but the product details and separate expiry FAQ state 24 months; this record follows the explicit current validity term. Page FAQ says 10X threshold is >INR20,000, while product guide states 10X on monthly incremental spends above INR20,000; only the qualifying threshold amount gets 10X. FASTag and rail 1X under latest update. No rewards on fuel, EMI or cash withdrawals.'
benefits:
- effective_from: '2026-04-01'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: 1
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      via:
      - visa
    international:
      visits_per_cycle: 0
      cycle: annual
      guests_per_visit: 0
      via: []
  welcome:
  - condition: Spend INR5,000 within 30 days of card generation
    benefit: INR500 voucher from selected brands
    value_inr: 500
    window_days: 30
  - condition: First EMI transaction within 30 days of card generation
    benefit: 5% cashback on first EMI transaction, capped at INR1,000
    value_inr: 1000
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 300
    cycle: monthly
  movies:
    type: discount
    partner: District by Zomato
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 125
    notes: Buy-one-get-one movie offer up to INR125, twice per month; INR20,000 spend in the preceding calendar month required.
  other:
  - name: Railway lounge access
    description: Four complimentary railway lounge visits per calendar quarter after INR20,000 spend in the previous month; product update says current month activates next month. Eligibility wording varies across issuer page and guide. Present card and valid train ticket; network/validation conditions apply.
    value_inr:
  - name: Trip cancellation cover
    description: Complimentary CFAR cover up to INR10,000 for eligible hotel and flight bookings; policy eligibility and claim limits apply.
    value_inr: 10000
  - name: Travel booking bonus points
    description: 33% bonus points on hotel bookings and 13% on flight bookings through FIRST Rewards Gallery per current Select update; product page separately shows 20% and 10%, so active rates need confirmation.
    value_inr:
  - name: Roadside assistance
    description: Complimentary roadside assistance; current product guide values service at INR1,399.
    value_inr: 1399

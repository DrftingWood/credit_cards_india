    - docs/sources/idfc-first/power/power-series-welcome-offer-terms.pdf
    notes: >-
      Product page states Power offers no fuel surcharge benefit, while current MITC
      table lists 1% waiver on INR 200-5,000 fuel transactions with Power and Power+
      shown under cap “Not Applicable”. Conflict remains unresolved; no structured
      surcharge waiver asserted. Welcome voucher is INR 250 with the qualifying
      transaction within 60 days for cards set up from 10-Jun-2025; older FAQ states
      30 days, while card-specific offer terms and its dedicated section say 60 days.
      Up to four RSA services annually are subject to active-card/recent-transaction
      conditions.

  - '5816'
  capping_rules:
  - Combined cap of 750 reward points per billing cycle across all accelerated 5% and 3% categories; no further
    cashback on accelerated categories after cap is reached. Excluded categories also include B2B transactions and
    online skill-based gaming.
  redemption:
  - type: statement-credit
    program: Kotak Rewards cashback
    rate_inr_per_unit: 1.0
    constraints: Only against statement outstanding; redeem in multiples of 400 reward points; points expire one
      year from accrual.

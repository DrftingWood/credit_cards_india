  notes: Current card page confirms INR 495 annual fee and full renewal waiver at INR 40,000 eligible spend. Fee
    schedule late charge is 30% of minimum amount due (INR 500 minimum; INR 1,000 maximum), which
    the schema cannot encode as a formula. Effective for statements generated after 15 Nov 2026, Amex announces new

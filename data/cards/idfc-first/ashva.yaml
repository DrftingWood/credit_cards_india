    - docs/sources/idfc-first/ashva/golf-terms.pdf
    - docs/sources/idfc-first/ashva/movie-offer-terms-2026-06-25.pdf
    - docs/sources/idfc-first/ashva/trip-cancellation-policy-2026-05-19.pdf
    - docs/sources/idfc-first/ashva/insurance-privileges-2026-08-31.pdf
    - docs/sources/idfc-first/ashva/roadside-assistance-terms-2025-10-28.pdf
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.domestic.spend_threshold_inr
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.lounge_access.international.spend_threshold_inr
    - benefits.golf.rounds_per_cycle
    - benefits.golf.lessons_per_cycle
    - benefits.milestones
    - benefits.welcome
    - benefits.insurance
    - benefits.fuel_surcharge_waiver
    - benefits.movies
    - benefits.dining
    - benefits.other
    notes: >-
      Current product and linked cover conditions were checked against the archived
      lounge, railway, golf, movie, CFAR, roadside-assistance, welcome, annual-fee,
      and shared insurance documents listed in local_refs. The CFAR policy starts
      8-May-2026 or the later issue date and ends 7-May-2027. The shared insurance
      schedule requires an active card and, for travel covers, international travel
      with the ticket purchased on the covered card.

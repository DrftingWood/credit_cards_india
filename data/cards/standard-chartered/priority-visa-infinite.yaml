  notes: Complimentary for Priority Banking clients. Current tariff lists Visa Infinite joining/annual/supplementary
    fees as nil. General MITC gives 3.5% overseas markup (only Ultimate is exempted at 2%) and 3.75% monthly finance.
    Cash advance is left null because the current card page lists INR 100/350/500/700/800 ATM-withdrawal fees according
    to statement outstanding balance, while the current general tariff lists 3% of withdrawal (minimum INR 300).
    The issuer sources do not explain whether the card-specific schedule supersedes or supplements the tariff formula;
    the schema also cannot model the card-page tiers.
  source:
    url: https://www.sc.bank.in/credit-cards/priority-banking-visa-infinite/

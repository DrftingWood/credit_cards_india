    notes: Current product page and June 2026 card T&C cover base, Swiggy/Zomato, redemption routes and exclusions.
      The June terms, May notice and current product page agree on INR 200 basis for base and food orders; older
      pre-2026 terms used INR 150 and are superseded. Current MITC supports expiry, monthly/category and statement caps,
      redemption values/limits and processing fees. No current issuer partner-transfer schedule was found.
benefits:
- effective_from: '2026-07-01'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      spend_threshold_inr: 60000
      spend_threshold_cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Two domestic lounge vouchers per calendar quarter after INR 60,000 eligible posted/settled spend in the
        preceding calendar quarter, effective 1-Jul-2026. Primary cardholder only; voucher generated via SmartBuy and
        valid 180 days from generation.
    international:
      visits_per_cycle: 1
      cycle: quarterly
      spend_threshold_inr: 60000
      spend_threshold_cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: One international lounge voucher per calendar quarter after INR 60,000 eligible posted/settled spend in
        the preceding calendar quarter, effective 1-Jul-2026. Primary cardholder only; voucher generated via SmartBuy
        and valid 180 days from generation.
  milestones:
  - spend_inr: 150000
    cycle: quarterly
    benefit: One INR 1,500 voucher, chosen from Marriott, Dominos, Decathlon, Barbeque Nation, O2 Spa or Lakme Salon,
      after net spends of INR 150,000 or more in a calendar quarter; voucher download window applies.
    value_inr: 1500
  welcome:
  - condition: Net retail spends of INR 75,000 within 90 days from card issuance or last upgrade/downgrade date;
      posted/settled dates count. Voucher can be downloaded within 90 days after the welcome period ends.
    benefit: Complimentary annual memberships of Swiggy One and Times Prime.
    window_days: 90
    value_inr: null
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 250
    notes: Buy one get one on movies, events, concerts, plays, sports and activities via BookMyShow for Friday/Saturday/
      Sunday shows, regardless of booking day. Minimum 2 tickets; max 2 free tickets per calendar month and INR 250
      discount per ticket. Excludes BMS Stream, F&B and gift cards; booking fees remain payable.
  dining:
    program: Dineout
    discount_pct: 10
    notes: Current product page advertises an extra 10% off bills at participating Dineout restaurants; merchant
      participation and offer terms apply.
  insurance:
  - type: air-accident
    sum_insured_inr: null
    sum_insured_amount: 125000
    sum_insured_currency: USD
    conditions: Primary cardholder only; policy 2999204800579204000 effective 23-Jul-2026 to 22-Jul-2027. Cover
      activates after card activation and if air tickets are purchased using Diners; bodily injury resulting in death
      within 12 months of accident.
  - type: travel-medical
    sum_insured_inr: null
    sum_insured_amount: 31250
    sum_insured_currency: USD
    conditions: Primary cardholder only; emergency medical expense for bodily injury or sudden illness during
      international travel outside India; pre-existing illness excluded. Policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: lost-card-liability
    sum_insured_inr: 900000
    conditions: Primary cardholder only; policy covers INR 900,000 liability for 2 days before card block and 30 days
      after block, subject to policy terms.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 625
    sum_insured_currency: USD
    conditions: Baggage delay on international flights beyond 8 hours; maximum USD 10/hour up to USD 625. Primary
      cardholder only; travel must originate in India, Diners-ticket purchase, trip maximum 30 days; policy valid
      23-Jul-2026 to 22-Jul-2027.
  - type: credit-shield
    sum_insured_inr: 900000
    conditions: Credit Shield up to INR 900,000 for the primary cardholder under policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 625
    sum_insured_currency: USD
    conditions: Loss of personal documents during international travel; actual duplicate-document costs, with 10%
      sublimit per article, subject to policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 625
    sum_insured_currency: USD
    conditions: Hijacking on international flights; USD 75 per 6 hours after a 12-hour deductible, maximum USD 625;
      primary cardholder, policy valid 23-Jul-2026 to 22-Jul-2027.
  fuel_surcharge_waiver: null
  concierge: true

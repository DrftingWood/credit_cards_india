  notes: Samsung product/service purchases earn the separate 10% cashback but do not earn EDGE Reward Points, as stated in card-specific T&C; this merchant-specific exclusion is documented here because the category enum cannot represent it. Rental payments are excluded from EDGE Rewards, but the product page's MCC 6513 reference applies to rent fees/fee-waiver exclusions and does not explicitly map that reward exclusion to the MCC.

rewards:
- effective_from: 2025-06-20
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 0.75
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    applies_to_categories:
    - travel
    notes: Issuer terms award 0.75% on all eligible card-present/POS transactions and travel (online or offline). The category model cannot represent transaction channel, so this record encodes travel only; offline non-travel cashback is therefore omitted by calculator projections.
  accelerated:
  - category: online-spends
    canonical_categories:
    - online
    - dining
    - groceries
    - utilities
    multiplier: 1
    effective_rate: 7
    slabs:
    - upto_spend_inr: 5000
      rate_pct: 2
      max_value_inr: 100
    - upto_spend_inr: 40000
      rate_pct: 5
      max_value_inr: 1750
    - upto_spend_inr: null
      rate_pct: 7
      max_value_inr: 2150
    cap_per_cycle: 4000
    cap_unit: cashback-inr
    cycle: monthly
    notes: 'Marginal tiers on net statement-month online (card-not-present) spend: 2% on first INR 5,000 (max INR 100), 5% on the next INR 35,000 (max INR 1,750), and 7% above INR 40,000 (max INR 2,150); total accelerated cashback is capped at INR 4,000 per statement month. The current schema supports these slabs. Base cashback does not backstop online spend after this cap: base is limited to card-present/POS spend or travel. Cashback rounds down per transaction. Net spend includes purchases, reversals and EMI conversions; later reversals/conversions can debit cashback, including a negative net cashback adjustment. The calculator does not model transaction-level rounding or reversal timing.'
  - category: utilities-bill-payments
    canonical_categories:
    - utilities
    multiplier: 1
    effective_rate: 0.5
    cap_per_cycle: 100
    cap_unit: cashback-inr
    cycle: monthly
    notes: 0.5% cashback on utility bill payments, capped at INR 100 per statement, for MCCs 4816, 4899 and 4900. MCC 4814 telephone bill payments receive base or online accelerated cashback according to channel, not this separate utility bonus.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - insurance-premiums
  - government
  - education
  - jewellery
  - emi
  - gift-cards
  - bridge-fees
  - road-fees-and-tolls
  - cash-advance
  capping_rules:
  - 'Accelerated online cashback tiers on net statement-month spend: 2% to INR 5,000, 5% through INR 40,000, then 7%; individual tier maxima INR 100, INR 1,750 and INR 2,150.'
  - Total accelerated cashback cap is INR 4,000 per statement month; base cashback does not apply to online overflow.
  - 'Net spend includes purchases, reversals and EMI conversions. Later returns, cancellations, reversals or EMI conversions may debit cashback; a negative net spend can produce a debit.'
  - Cashback rounds down per transaction; utility bonus is 0.5% up to INR 100 per statement on MCCs 4816, 4899 and 4900. MCC 4814 telephone bill payments earn channel-based base/accelerated cashback.
  - 'Reward exclusions are category-based (bridge/road fees and tolls, insurance, education, jewellery/precious metals/watches, government, wallet, rent, fuel and gift cards); exact category MCCs are not published in the card-specific terms.'
  redemption:
  - type: statement-credit
    rate_inr_per_unit: 1.0
    constraints: Cashback auto-credited before next statement with no minimum amount requirement.
  source:
    url: https://www.axis.bank.in/docs/default-source/default-document-library/axis-bank-cashback-credit-card-tnc.pdf?sfvrsn=d015df26_5

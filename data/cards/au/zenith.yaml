  other:
  - name: Birthday bonus
    description: AU's 1 March 2024 Zenith terms specify 2,500 bonus Reward Points credited on the birthday date. The current product page still advertises a Birthday Bonus Reward Point but does not restate quantity or detailed eligibility; point value follows the general Rewardz redemption path and is not a cash value.
  - name: Xpress EMI
    description: Eligible transactions of INR 500 or more can be converted when the total value is at least INR 2,000; up to 20 billed or unbilled transactions may be combined.
  - name: Contactless payments
    description: Card or digitally added card payments up to INR 5,000 at POS can be made without entering a PIN.
  - name: Add-on cards
    description: Add-on cards are advertised; the current AU Key Fact Statement lists add-on cards as lifetime-free up to three per card account.
  - name: Network-specific offers
    description: AU lists separate curated Visa and RuPay offer sections for Zenith. This record describes the Visa card image; the RuPay offer variant is not separately modeled, and network-tier wording is not established by the current product page.
  - name: Priority customer service
    description: AU advertises priority assistance by email for Zenith cardholders.
  - name: Global concierge
    description: Current product page advertises 24/7 global concierge assistance.

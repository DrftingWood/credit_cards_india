    value_inr: 8250
  - spend_inr: 1500000
    cycle: annual
    benefit: additional Free Night Award (up to 15,000 points)
    value_inr: 8250
  welcome:
  - condition: Primary cardmember with linked active Marriott Bonvoy account; new accounts from 1-Oct-2026 receive the benefit on fee levy. Earlier onboarded accounts qualify on INR 500 eligible spend or fee levy, whichever occurs first. LTF accounts are excluded.
    benefit: 1 Free Night Award (up to 15,000 points) + Silver Elite status + 10 Elite Night Credits
    value_inr: 8250
  insurance:
  - type: baggage-loss
    sum_insured_inr: null
    sum_insured_amount: 250
    sum_insured_currency: USD
    conditions: Primary cardmember only; summary lists checked baggage delay/loss and loss of travel documents. Product page requires ticket purchase using this card for travel insurance activation. Summary says cover valid through 22-Jul-2027; detailed policy limitations apply.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 250
    sum_insured_currency: USD
    conditions: Primary cardmember only; flight-delay cover. Summary describes USD 10 per hour after an 8-hour deductible. Product page requires ticket purchase using this card for travel insurance activation. Summary says cover valid through 22-Jul-2027; detailed policy limitations apply.
  - type: air-accident
    sum_insured_inr: null
    sum_insured_amount: 12500
    sum_insured_currency: USD
    conditions: Primary cardmember only; air ticket must be purchased using this card. Cover requires card activation and is stated as valid through 22-Jul-2027; detailed policy limitations apply.
  - type: travel-medical
    sum_insured_inr: null
    sum_insured_amount: 18750
    sum_insured_currency: USD
    coverage_duration_days: 30
    conditions: Primary cardmember only; international travel originating from India; ticket must be purchased using this card; maximum trip duration 30 days; card activation required; stated valid through 22-Jul-2027.
  - type: credit-shield
    sum_insured_inr: 100000
    sum_insured_amount: null
    sum_insured_currency: INR
    conditions: Primary cardmember only; accidental death or permanent disability; card activation required; stated valid through 22-Jul-2027.
  - type: other
    sum_insured_inr: 900000
    sum_insured_amount: null
    sum_insured_currency: INR
    conditions: Financial liability cover for the primary card only; card activation required; stated valid through 22-Jul-2027.
  fuel_surcharge_waiver: null
  golf:
    rounds_per_cycle: 2
    lessons_per_cycle: 2
    cycle: quarterly
    notes: Select courses in India and internationally; two lessons and two course accesses per quarter, subject to terms.
  concierge: true
  other:
  - name: Marriott Bonvoy Silver Elite status
    description: Primary cardmember receives Silver Elite status on approval and each anniversary year while the card is active and in good standing.
  - name: Annual Free Night Award
    description: One FNA worth up to 15,000 Bonvoy points after annual fee levy each subsequent anniversary year; primary cardmember only, valid 12 months.
    value_inr: 8250
  - name: Annual Elite Night Credits
    description: Ten Elite Night Credits after annual fee levy each year; primary cardmember only. Credits expire 31 December of the posting year.
  - name: Insurance limits advertised by HDFC
    description: HDFC card page and insurance cover summary advertise checked baggage delay/loss and travel document loss USD 250, flight delay USD 250, air accident USD 12,500, international emergency medical USD 18,750, credit shield INR 100,000 and primary-card financial liability INR 900,000. The issuer summary states validity through 22-Jul-2027; see structured cover entries for primary-card, activation and travel conditions. Full policy limitations apply.
  - name: Anniversary Special Offer 2026 (time limited)
    description: Primary cardmembers who enroll can choose 15,000 Marriott Bonvoy points after INR 1,50,000 eligible spend or 30,000 points after INR 2,50,000 spend during 1-Oct-2026 to 30-Nov-2026. Enrollment closes 10-Nov-2026; post-1-Oct enrollment counts eligible spend only from enrollment date. Not modeled as a permanent reward or milestone.
  - name: Concierge service
    description: Concierge assistance is available 9am-9pm via 1800 309 3100 or support@marriotthdfcbank.com, per the current HDFC product page.
  source:

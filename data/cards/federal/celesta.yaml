      notes: "Current issuer page and MITC advertise no joining or annual fee as a limited-period offer; the MITC states the former INR 3,000 fee applies to customers onboarded before 3 April 2023, so zero fee describes current onboarding, not every legacy account. Forex markup is 2%; cash advance is 2.5% or INR 500 minimum. Revised APR schedule effective 10 January 2026: 3.75% monthly below INR 50,000; 2.69% for INR 50,000-INR 300,000; 1.99% for INR 300,001-INR 1,000,000; 0.69% above INR 1,000,000. APR uses prior-quarter Federal Bank operative-account AMB and is refreshed quarterly. The FAQ example assigns 0.69% at exactly INR 1,000,000 although the revision table assigns that boundary to the 1.99% band; use the published band schedule and retain the boundary discrepancy in notes. See https://www.federal.bank.in/revised-credit-card-charges."

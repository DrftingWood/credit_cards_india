fees:
- effective_from: 2026-09-17
  effective_until: null
  joining_fee_inr: 0
  annual_fee_inr: 0
  fee_waiver: null
  forex_markup_pct: 0
  finance_charge_monthly_pct: null
  cash_advance_fee:
    flat_inr: 199
  gst_applicable: true
  notes: >-
    Lifetime-free. The issuer publishes APR as a variable annual range of 8.5%-46.2%;
    no fixed monthly rate is asserted. ATM withdrawals carry a flat INR 199 + GST per
    transaction and have up to 45 interest-free days; the issuer states a maximum
    INR 10,000 per transaction subject to the available cash limit. Add-on and
    personalized-card services are INR 499 + GST per card/service. IDFC FIRST Bank's
    17-Sep-2026 announcement applies zero forex markup to all existing and new cards,
    superseding the older standard MITC rate.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/millennia
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - fees.joining_fee_inr
    - fees.annual_fee_inr
    - fees.forex_markup_pct
    - fees.cash_advance_fee.flat_inr
    local_refs:
    - docs/sources/idfc-first/millennia/current-mitc.pdf
    - docs/sources/idfc-first/millennia/zero-forex-notice-2026-09-17.pdf
    notes: >-
      Product-specific page confirms lifetime-free status, APR range, ATM fee,
      interest-free period and cash withdrawal limit. Card-specific page:
      https://www.idfcfirst.bank.in/credit-card/millennia. The cardmember communication
      also offers a 20% bonus on app hotel bookings and 10% on app flight bookings;
      the bonus is not expressed as absolute points in the current schema.

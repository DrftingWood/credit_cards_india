    notes: Issuer explains 10X as 1 regular plus 9 additional points per INR 50 and 5X as 1 regular plus 4 additional.
      Monthly total-point caps are 500 jointly for Zomato/EaseMyTrip; 500 jointly for Flipkart, Uber, BookMyShow and
      other listed 10X partners; and 250 for Amazon. Eligible merchants can change; don't apply rates to broad
      categories. The separate Reward Multiplier shopping program ended 30 Sep 2026, while the current SmartEarn
      product page continues to state its card-specific 10X/5X merchant terms; these are kept distinct.

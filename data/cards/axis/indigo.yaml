    notes: >-
      Standard joining and annual fees are INR 799 plus GST. Axis currently advertises NIL fees for a limited period; card-specific offer terms apply to applications from 1 September through 31 October 2026 and require more than INR 1,500 eligible spend in the first 30 days. Late fee schedule has an unaddressed exact-INR-500 boundary: nil below INR 500, then INR 500 from INR 501. Additional current issuer fees not modeled as typed fields include 1% rent surcharge (uncapped), 1% third-party-app education fee, 1% wallet fee at INR 10,000 cumulative spend, 1% fuel fee at INR 50,000 cumulative spend, and 1% utility fee at INR 25,000 cumulative spend per statement period; DCC markup is 3.5%. Other service fees are published in the current schedule.

  - road-fees-and-tolls
  redemption:
  - type: catalog
    program: LIC Cards reward catalogue
    rate_inr_per_unit: null
    fee_inr: 30
    constraints: Redeem by phone against listed physical products, e-vouchers and gift cards; handling fee is INR 30 plus GST per request. Product point prices vary, and reward points expire 12 months after accumulation.
  source:
    url: https://www.axis.bank.in/cards/credit-card/lic-axis-bank-platinum-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/axis/lic-platinum/lic-rewards-catalogue-terms-retrieved-2026-10-26.pdf
    - docs/sources/axis/lic-platinum/lic-platinum-reward-exclusions-effective-2025-06-20.pdf
    - docs/sources/axis/lic-platinum/axis-credit-card-terms-update-effective-2026-08-28.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated
    - rewards.exclusions
    - rewards.redemption
    notes: LIC points are a separate catalogue currency, not Axis EDGE Reward Points. Catalogue redemption values vary by product (for example, an INR 1,000 Axis virtual gift card costs 1,400 points, while other INR 1,000 e-vouchers cost different amounts); the former fixed INR 0.20 point value and INR 0.18 realized estimate were unsupported. Catalogue terms specify a maximum of 75 virtual gift cards per financial year. The 2025 revision moved exclusions from MCC identification to spend-category identification and listed utilities/telecom, education, rent, wallet, government services, gold/jewellery, fuel, cash advances and repayments. The 2026-08-28 update additionally excludes gift-card and bridge/road/toll spend. LIC premium payment through official LIC gateways remains eligible for the 2x rate.
  mcc_exclusions: []
  capping_rules:
  - Reward points expire 12 months after accumulation; the issuer does not publish a general monthly earning cap.
benefits:
- effective_from: 2026-08-28
  effective_until: null

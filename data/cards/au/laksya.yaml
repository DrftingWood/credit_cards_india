    notes: 'Current AU Laksya page: base 2 RP/INR 100; 5 RP/INR 100 on grocery/departmental and contactless. Grocery/departmental
      cap 1,000 RP per statement; contactless has no maximum; 1 RP/INR 100 on insurance, utility, telecom, max 100
      RP per transaction. General AU Rewardz conversion is 0.25 paise (INR 0.0025) per point, 0.20 paise on e-vouchers;
      200-point minimum and INR 99 + GST redemption fee. For calculator accuracy, contactless and utility/insurance/telecom
      rates with input/cap granularity limits are retained in capping_rules but not modeled as accelerators. Current
      AU Rewardz FAQ at https://www.au.bank.in/personal-banking/credit-cards confirms general catalogue conversion
      of 0.25 paise (INR 0.0025) per point, or 0.20 paise for e-vouchers; the lower rate and redemption fee remain
      in the redemption constraint.'
  capping_rules:
  - 'Overall cap: 25,000 Reward Points per statement cycle under the current AU Card Member Agreement. Grocery/departmental
    accelerator has a 1,000-point statement cap; contactless has no category cap.'
  - Reward Points do not accrue on cash, rent, education/government, EMI, fuel, BBPS, transportation or quasi-cash.
  - Issuer also grants 5 RP/INR 100 on contactless with no maximum, but the calculator cannot isolate contactless
    spend; this rate is documented but omitted from modeled accelerators.
  - Utility, telecom and insurance earn 1 RP/INR 100 with at most 100 RP per transaction; transaction-level cap
    cannot be modeled from aggregate spend input, so these categories are excluded from the base calculator estimate
    rather than overestimated.
  reward_cap:

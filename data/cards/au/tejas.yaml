- effective_from: '2026-10-26'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Primary cardholder who paid the joining fee; activate the card and make the first successful transaction within 30 days of issuance; claim within 6 months of activation. Choose one option.
    benefit: 2,000 Reward Points
    value_inr: null
    window_days: 30
  - condition: Primary cardholder who paid the joining fee; activate the card and make the first successful transaction within 30 days of issuance; claim within 6 months of activation. Choose one option.
    benefit: INR 500 brand voucher
    value_inr: 500
    window_days: 30
  fuel_surcharge_waiver:

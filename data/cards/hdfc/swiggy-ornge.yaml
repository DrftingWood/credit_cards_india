    notes: Current product page and April 2026 card terms confirm INR 500 joining/renewal fees and the INR 150,000
      annual-fee waiver. Current co-branded MITC confirms monthly finance charge 3.75% and cash advance fee
      2.5% or INR 500 minimum. The shared fee schedule does not state a foreign-currency markup on the Ornge row;
      3.5% is retained at medium confidence based on the issuer's co-branded schedule conventions, pending an
      Ornge-specific confirmation. effective_from is the verification snapshot date; the issuer does not publish
      an effective date for all these terms.

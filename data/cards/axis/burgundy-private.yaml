    retrieved_on: 2026-07-28
    type: issuer-page
    confidence: high
- effective_from: 2026-09-01
  effective_until: null
  joining_fee_inr: 50000
  annual_fee_inr: 100000
  fee_waiver: null
  forex_markup_pct: 0.0
  finance_charge_monthly_pct: 1.5
  cash_advance_fee:
    pct: 0
    min_inr: 0
  gst_applicable: true
  notes: Annual fee INR 1,00,000 + GST (revised from INR 50,000 w.e.f. 01-09-2026),
    charged in the card anniversary month only if the Burgundy Private Total Relationship
    Value fell below INR 5 crore (excluding demat) in the month before it; complimentary
    for clients who maintain INR 5 crore TRV. Zero forex markup and zero cash-withdrawal
    charges carried forward from the product page.
  source:

# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : HDFC per-card T&C/MITC PDFs (docs/sources/hdfc/)
#   Verified   : 2026-07-04   Confidence: HIGH (pdf)
#   Fees, reward rate, forex & caps cross-checked vs the source above where extractable.
# Eligibility income bands, min credit score & some launch dates are tier-standard
# defaults (not individually source-verified). Exact monthly caps on some cashback
# cards remain source/HTML-noted. See docs/sources/<issuer>/ for evidence.
# ---------------------------------------------------------------------------
id: hdfc-6e-rewards
name: 6E Rewards IndiGo HDFC Bank Credit Card
issuer: hdfc
network: visa
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: IndiGo
  category: airline
  partner_website: https://www.goindigo.in
status: discontinued
launched_on: 2022-11-07
discontinued_on: 2025-11-01

# Entry-level IndiGo 6E Rewards co-brand from HDFC Bank. HDFC's product page
# (hdfc.bank.in/credit-cards/6e-rewards-indigo-credit-card, read 2026-10-20)
# says both 6E Rewards cards are discontinued and not accepting applications,
# and "effective 1st Nov'25, all the product features and associated benefits
# will be discontinued ... benefits maximum till 31st Oct'25". discontinued_on
# was previously the date a 404 was observed (2026-07-03); it is now the
# issuer-stated end date, matching the XL variant.

fees:
  - effective_from: 2022-11-07
    effective_until: 2025-10-31
    joining_fee_inr: 500
    annual_fee_inr: 500
    fee_waiver:
      spend_inr: 150000
      cycle: annual
      conditions: "Renewal fee waiver on retail spends of ₹1.5L in the preceding year."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.6
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.hdfc.bank.in/credit-cards/6e-rewards-indigo-credit-card
      retrieved_on: 2026-04-22
      type: issuer-page
      notes: "Joining + annual fee ₹500 per HDFC fees page. Rewards redemption fee of ₹99 per claim applies separately on top."

rewards:
  - effective_from: 2022-11-07
    effective_until: 2025-10-31
    currency: miles
    currency_name: 6E Rewards
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.5
    accelerated:
      - category: indigo-flights-direct
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 2.5
        card_attributable_rate: 2.5
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
        merchants: [indigo-web, indigo-app]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [indigo-app, indigo-web]
        notes: "2.5 6E Rewards per ₹100 on flight bookings made via IndiGo website or app."
      - category: dining-grocery-entertainment
        canonical_categories: [dining, groceries, entertainment]
        multiplier: 1
        effective_rate: 2
        # Issuer page: "2 6E Rewards per ₹100 Spends on Grocery, Dining &
        # Entertainment capped at 100 RP monthly".
        cap_per_cycle: 100
        cap_unit: miles
        cycle: monthly
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
      - utilities
    redemption:
      - type: voucher
        program: IndiGo flights + 6E Prime add-ons
        rate_inr_per_unit: 1.0
        fee_inr: 99
        constraints: "Redeemable only for IndiGo bookings and 6E Prime add-ons at 6E Reward = ₹1. Unused balance auto-converts to BluChip at 1:1 if IndiGo migrates the balance. Redemption fee ₹99 + GST per claim."
    source:
      url: https://www.hdfc.bank.in/credit-cards/6e-rewards-indigo-credit-card
      retrieved_on: 2026-10-20
      type: issuer-page
      confidence: high
      notes: "Earn rates re-read on the issuer page (kept up for existing holders after the card was discontinued): 2.5 per ₹100 on IndiGo app/website flights, 2 per ₹100 on grocery/dining/entertainment capped at 100 RP monthly, 1 per ₹100 on other spends. Replaces the earlier Paisabazaar citation; the dining cap was missing before. Redemption terms are carried forward from that earlier read."

benefits:
  - effective_from: 2022-11-07
    effective_until: 2025-10-31
    lounge_access: null
    welcome:
      - condition: "Joining fee paid + minimum 3 transactions in each of the first 3 months"
        benefit: "IndiGo flight-ticket voucher worth ₹1,500 + 1 × 6E Prime add-on worth ₹1,099"
        value_inr: 2599
        window_days: 90
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: 250
      cycle: statement
    other:
      - name: 6E Prime add-on on welcome
        description: One complimentary 6E Prime add-on (choice of priority check-in, seat, meal, or assistance) worth ₹1,099 on first-use.
        value_inr: 1099
    concierge: false
    source:
      url: https://www.paisabazaar.com/hdfc-bank/6e-rewards-indigo-hdfc-bank-credit-card/
      retrieved_on: 2026-04-22
      type: aggregator
      notes: "Entry-level variant — no complimentary lounge access."

eligibility:
  min_age: 21
  max_age: 60
  income_inr_annual:
    salaried: 300000
    self_employed: 600000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.hdfc.bank.in/credit-cards/6e-rewards-indigo-credit-card
  replaces_card: null

metadata:
  last_verified_on: 2026-10-20
  last_swept_on: 2026-07-03
  tags: [co-branded, airline, indigo, entry, miles]

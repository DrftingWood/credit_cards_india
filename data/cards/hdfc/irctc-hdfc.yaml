    - docs/sources/hdfc/irctc-hdfc/terms-and-conditions-current-2026-10-27.pdf
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.welcome.value_inr
    - benefits.welcome.window_days
    - benefits.milestones.spend_inr
    - benefits.milestones.value_inr
    - benefits.milestones.cycle
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.fuel_surcharge_waiver.cycle
    - benefits.other
    notes: Current product page and October 2025 product terms reviewed. Milestone shifted from 90-day issuance anniversaries for cards issued through 30-Sep-2025 to calendar quarters from 1-Jan-2026 for all customers. Welcome-offer cohort wording differs between current card page/FAQ and the PDF; condition retains the ambiguity.
eligibility:
  min_age: null
  max_age: null
  income_inr_annual:
    salaried: 144000
    self_employed: 600000

    notes: 'The current dedicated White Pass page describes milestone-based earning only (no flat transaction earn), INR 1 per White Pass for catalogue redemptions and INR 0.70 for cashback, 15-month validity, and an INR 250,000 annual maximum. It does not state a published effective date for the current terms. General Kotak terms contain a different milestone ladder and a different expiry rule. Fuel, wallet-load, rent, insurance, education, government, utility and online skill-based transactions are excluded from milestone calculation in Kotak terms; the rule may be revised. The current White Pass page also says settled anniversary-year spend only.'

benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: Current general Axis domestic lounge program lists Privilege under Set A for 2 visits per quarter. Requires INR 50,000 eligible spend in the prior 3 calendar months; new-card issuance waives this gate for issue month and the next 3 calendar months. Free entry is for the cardholder only; guests are paid. The product-page linked Mastercard-specific PDF has expired, so lounge variants and provider/network treatment are not established for the Amex offer variant.
  milestones:
  - spend_inr: 250000
    cycle: annual
    benefit: Additional 10,000 EDGE Reward Points worth INR 2,000 on INR 250,000 anniversary-year eligible spend; primary and add-on card spend counts. Excludes Utility & Telecom, Rent, Wallet, Government, Insurance, Gold & Jewellery, Fuel, Education, Gift Cards, Bridge Fees, Road Fees and Tolls.
    value_inr: 2000
    reward_kind: points
    reward_units: 10000
    trigger_window: anniversary-year
  movies:
    type: bogo
    partner: District
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 250
    notes: 100% discount on the second ticket up to INR 250, minimum two tickets. From 01-Nov-2026, also requires INR 25,000 eligible settled spend in the preceding three months; new card issuance waives the threshold for issue month and following three calendar months.
  welcome:
  - condition: Joining fee levied and first transaction completed within 30 days of card issuance; free cards, first-year-free cards and priority-segment customers are excluded.
    benefit: 12,500 EDGE Reward Points redeemable against vouchers, stated value INR 2,500
    value_inr: 2500
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 400
    cycle: statement
    notes: Fuel surcharge refund on India fuel MCC transactions; surcharge tax is non-refundable and fuel earns no EDGE points.
  dining:
    program: Dining Delights
    notes: Product page links to the Dining Delights program but gives no card-specific discount rate, cap, minimum spend or frequency; do not treat as a quantified benefit.
  other:
  - name: Purchase and travel protection
    description: Product page lists purchase protection up to INR 1 lakh, credit shield INR 1 lakh, loss of travel documents up to USD 300, delayed check-in baggage up to USD 300 and lost check-in baggage up to USD 500; coverage terms are linked separately.
    value_inr: null
  - name: Wednesday Delight
    description: Issuer page advertises changing Wednesday offers; current deals are time-sensitive.
    value_inr: null

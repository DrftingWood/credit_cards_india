    notes: 4 points per INR100 (2 base + 2 additional) on issuer-eligible airline and travel-aggregator MCCs and
      non-DCC foreign-currency transactions, capped at 50,000 accelerated points per calendar month. After the cap,
      eligible spend earns base rate only. The issuer carries qualifying spend remainder at the transaction level
      in INR50 increments. Airline/travel-aggregator purchases in foreign currency earn only one additional bonus
      point per INR50; DCC transactions do not receive foreign-currency bonus.

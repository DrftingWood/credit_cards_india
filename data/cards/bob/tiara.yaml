    notes: Current issuer page confirms lounge spend threshold INR75,000 in the previous calendar quarter, movies, fuel surcharge waiver, FITPASS (for cards issued from 01-Aug-2026), health, shopping, memberships and Swiggy benefits. BOBCARD's 15-Jul-2026 notice proposed the lounge threshold change from INR40,000 to INR75,000 effective 15-Jul, but current issuer page does not show the effective date. Lounge implementation date is therefore treated as unresolved; current minimum spend is recorded. Older rewards T&C list INR40,000 and are superseded by the current card page. RuPay Tiara was launched in the official 2024-25 annual report; no current network tier was confirmed. Concierge is not described on the current page; false is a schema placeholder, not evidence of absence.

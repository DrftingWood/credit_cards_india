      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: points
    currency_name: CashPoints
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
      cap_per_cycle: 500   # 1% on other spends capped at 500 CashPoints/calendar month
      cap_unit: points
      cycle: monthly
    accelerated:
      - category: groceries-supermarket-dining-payzapp
        canonical_categories: [groceries, dining]
        multiplier: 3
        effective_rate: 3
        cap_per_cycle: 500
        cap_unit: points
        cycle: monthly
        merchants: [payzapp]
        mcc_list: ["5411", "5812", "5814"]
        notes: "3% CashPoints on supermarket, groceries and dining spends and on PayZapp transactions. Applies to both UPI and regular credit card spends. Capped at 500 CashPoints per calendar month."
      - category: utilities
        canonical_categories: [utilities]
        multiplier: 2
        effective_rate: 2
        cap_per_cycle: 500
        cap_unit: points
        cycle: monthly
        mcc_list: ["4900"]
        notes: "2% CashPoints on all utility bill payments. Capped at 500 CashPoints per calendar month."
    exclusions:
      - rent
      - wallet-loads
      - emi
      - fuel
      - insurance-premiums
      - government
      - education
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
    notes: "1% CashPoints on all other spends (excluding rent, wallet loads, EMI, fuel, insurance and government categories). CashPoints computed on calendar-month cycle for settled transactions."
    source:
      url: https://www.hdfc.bank.in/credit-cards/hdfc-bank-upi-rupay-credit-card
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6540']

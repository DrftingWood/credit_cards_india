    sum_insured_inr: 2000000
    conditions: The current Xcite Ultra-specific benefit section states cover up to INR 20 lakh; a shared generic footer on the same issuer page says INR 50 lakh. Retain the card-specific INR 20 lakh claim and record the footer as a generic-page conflict. The linked detailed insurance PDF is dated 16-Apr-2021, so current policy conditions remain unverified.
  - type: lost-card-liability
    sum_insured_inr: null
    conditions: Current product-page footer advertises zero liability for fraudulent transactions after reporting loss, plus counterfeit, skimming and online-fraud protection; current limits and terms are not published there. Linked detailed PDF is dated 16-Apr-2021.
  - type: credit-shield
    sum_insured_inr: null

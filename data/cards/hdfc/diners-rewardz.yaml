rewards:
- effective_from: 2026-05-15
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 3
    per_inr: 200
    unit_value_inr: 0.3
    unit_value_inr_realized: null
  accelerated: []
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - insurance-premiums
  - emi
  redemption:
  - type: other
    program: SmartBuy
    rate_inr_per_unit: 0.3
  - type: airmiles
    program: Jet Airways (JPMiles) or Singapore Airlines (KrisFlyer Miles)
    rate_inr_per_unit: null
    constraints: 1 Reward Point converts to 0.30 AirMile; value in INR depends on redemption.
  - type: catalog
    program: Products catalogue and vouchers
    rate_inr_per_unit: 0.25
    constraints: Up to INR 0.25 per point.
  - type: cashback-bank
    program: NetBanking cashback
    rate_inr_per_unit: 0.15
    constraints: Up to INR 0.15 per point.
  capping_rules:
  - Overall earned Reward Points capped at 15,000 per statement cycle.
  source:
    url: https://www.hdfc.bank.in/credit-cards/diners-club-rewardz-credit-card
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hdfc/diners-rewardz/terms-and-conditions.pdf

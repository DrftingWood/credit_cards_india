    - docs/sources/hdfc/_shared/hdfc-card-changes-effective-2026-05-15.pdf
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.domestic.spend_threshold_inr
    - benefits.lounge_access.domestic.guests_per_visit
    - benefits.lounge_access.international.guests_per_visit
    - benefits.lounge_access.international.visits_per_cycle

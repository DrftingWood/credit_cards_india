benefits:
- effective_from: '2025-12-16'
  effective_until:
  lounge_access:
  welcome:
  - condition: New cards issued on or after 2025-12-16; first transaction within 15 days of card generation/FD funding
    benefit: 10% cashback on first transaction, capped at INR250.
    value_inr: 250
    window_days: 15
  - condition: First EMI transaction within 30 days of card generation; terms apply
    benefit: 5% cashback on the transaction value of the first EMI, up to INR1,000.
    value_inr: 1000
    window_days: 30
  movies:
    type: discount
    partner: District by Zomato
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 100
    notes: 25% off movie tickets up to INR100 once per calendar month; cardholder must make at least one purchase or ATM withdrawal in previous calendar month to be spend-active.
  fuel_surcharge_waiver:
  insurance:
  - type: fraud-liability
    sum_insured_inr: 25000
    conditions: Lost-card, counterfeit/skimming and online fraud cover; active card requires at least one purchase or ATM withdrawal in the previous 30 days.
  - type: personal-accident
    sum_insured_inr: 200000
    conditions: Personal accident/death or permanent disability; active card requires at least one purchase or ATM withdrawal in the previous 30 days.
  - type: credit-shield
    sum_insured_inr: 50000
    conditions: Covers eligible card debits upon accidental death; active card requires at least one purchase or ATM withdrawal in the previous 30 days.
  - type: purchase-protection
    sum_insured_inr: 25000
    coverage_duration_days: 60
    conditions: Fire/allied perils and burglary in the cardholder?s India residence on record; active card required. See insurer terms.
  other:
  - name: Virtual FD-backed card
    description: Virtual RuPay card issued against a singly-held IDFC FIRST Bank fixed deposit of at least INR5,000; credit limit equals 100% of linked FD value. A physical card can be requested for INR199 + GST.
  - name: Roadside assistance
    description: Complimentary assistance for a vehicle registered in the cardholder?s name. Card must be active with at least one purchase/ATM withdrawal in the previous 30 days; service activates five days after card status/enrollment change.
  - name: Cashback timing and eligibility
    description: Cashback is credited one day after Payment Due Date only if at least the Minimum Amount Due is paid by the due date; otherwise forfeited. Fuel purchases earn cashback, but current source review did not verify a fuel-surcharge waiver, so none is asserted.
  - name: No add-on card
    description: Issuer states add-on cards are not available for this FD-backed card.
  concierge: false

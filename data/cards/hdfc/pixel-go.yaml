    min_inr: 500
rewards:
- effective_from: 2026-10-15
  effective_until: null
  currency: cashback
  currency_name: CashPoints
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: 1% CashPoints on eligible spends; minimum transaction INR 100 and fractional points round down. SmartBuy cashback cannot combine with 1% merchant cashback. Current October 2026 MITC caps this feature at INR 15,000/month; the product page and older feature terms call it unlimited.
  accelerated:
  - category: smartbuy
    canonical_categories:
    - online
    multiplier: 1
    effective_rate: 5
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      class: issuer-portal
      merchants:
      - smartbuy
    over_cap_earns_base: false
    notes: 5% cashback on successful full-payment transactions in SmartBuy IGP, flights, hotels, bus, rail, instant vouchers and Apple Imagine Tresor; capped at 500 CashPoints/calendar month. Excludes individual merchant offers and cannot be clubbed with the 1% merchant cashback; transactions beyond the cap earn no CashPoints.
  - category: upi-spends
    multiplier: 1
    effective_rate: 1
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    notes: 1% cashback on eligible UPI spends only for the RuPay variant; capped at 500 CashPoints/calendar month. The terms do not state whether this stacks with the 1% all-spends feature.
    canonical_categories:
    - other
  category_caps:
  - category: eligible-other-spends
    cap_per_cycle: 15000
    cap_unit: cashback-inr
    cycle: monthly
    conditions: Current Pixel MITC updated 15 Oct 2026 caps the 1% all-other-spends feature at INR 15,000/calendar month; older product feature terms and FAQ describe it as unlimited.
  - category: smartbuy
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    conditions: Calendar-month cap; no 1% base earn on SmartBuy and no earn beyond this cap.
  - category: upi-spends
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    conditions: RuPay PIXEL Go UPI feature; calendar-month cap.
  - category: insurance
    cap_per_cycle: 2000
    cap_unit: cashback-inr
    cycle: monthly
    conditions: Current Pixel MITC says 2,000 CashPoints/month effective 1 Oct 2025; older card-specific feature terms say 2,000/day. Current MITC value is modeled.
  capping_rules:
  - Transactions below INR 100 do not earn CashPoints; fractional CashPoints are rounded down.
  - CashPoints expire two years after accumulation. Current MITC also says points are nullified after 365 days without card use and may be forfeited for specified delinquency, fraud, death, or inactive blocked-card conditions.
  - If a redemption reversal leaves a negative CashPoints balance for over 60 days, its rupee equivalent may be debited to the card account.
  - Outstanding-balance payments, card fees/charges and online skill-based gaming are excluded; the former two lack dedicated schema categories, while gaming MCC 5816 is listed in mcc_exclusions.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - emi
  - government
  - cash-advance
  redemption:
  - type: cashback-bank
    program: PayZapp CashPoints balance
    rate_inr_per_unit: 1.0
    min_units: 500
    constraints: Redeem through PayZapp; CashPoints transfer to the PayZapp CashPoints balance, not directly as statement credit.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/personal-mitc/MITC-PIXEL-Credit-Card-12Aug-26-1.pdf

  capping_rules:
  - Current AU cardmember agreement sets an overall 25,000 Reward Point cap per statement cycle for Xcite. It excludes rent, education, government and BBPS transactions; EMI, fuel, cash withdrawal, quasi-cash, fees and other charges do not earn points. Insurance and wallet-load exclusions are not stated for Xcite in the current agreement and are not modeled.

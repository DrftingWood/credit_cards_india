# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : PNB issuer MITC (docs/sources/pnb/rupay-select/MITC.pdf) +
#                creditcard.pnb.bank.in card portal.
#   Verified   : 2026-07-04   Confidence: HIGH (fees, pdf) / MEDIUM (rewards)
#   Fees (joining Rs 500, annual Rs 750, usage-based waiver, 3.5% forex) are
#   confirmed against the PNB MITC "Schedule of Charges". The base earn rate is
#   the RuPay Select program standard (portal states "2X reward points on retail")
#   and is not individually rate-stated in the MITC — kept at medium confidence.
# ---------------------------------------------------------------------------
id: pnb-rupay-select
name: PNB RuPay Select Credit Card
issuer: pnb
network: rupay
network_tier: select
tier: mid
card_type: credit
co_brand: null
status: active
launched_on: 2022-01-01
discontinued_on: null

fees:
  - effective_from: 2022-01-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 750
    fee_waiver:
      spend_inr: 0
      cycle: annual
      conditions: "Annual fee waived if the card is used for at least one retail transaction in each quarter of the preceding year (PNB MITC Schedule of Charges)."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 2.95
    cash_advance_fee:
      pct: 3.0
      min_inr: 300
    gst_applicable: true
    source:
      url: https://creditcard.pnb.bank.in/
      retrieved_on: 2026-07-04
      type: issuer-pdf
      confidence: high
      local_refs:
        - docs/sources/pnb/rupay-select/MITC.pdf
      fields_verified:
        - fees.joining_fee_inr
        - fees.annual_fee_inr
        - fees.fee_waiver
        - fees.forex_markup_pct
      notes: "PNB MITC: RuPay Select joining Rs 500 (add-on Rs 500), annual Rs 750, waived on one retail transaction each quarter of the preceding year; foreign-currency mark-up 3.50%."

rewards:
  - effective_from: 2022-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 150
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.18
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: catalog
        program: PNB Rewards
        rate_inr_per_unit: 0.25
    source:
      url: https://creditcard.pnb.bank.in/
      retrieved_on: 2026-07-04
      type: issuer-page
      confidence: medium
      notes: "Portal states '2X reward points on retail merchandise'; exact base earn rate not rate-stated in the MITC — modelled at the RuPay Select program standard (2 RP per Rs 150)."

benefits:
  - effective_from: 2022-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [rupay]
      international:
        visits_per_cycle: 2
        cycle: annual
        guests_per_visit: 0
        via: [rupay]
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 4000
      cap_per_cycle_inr: 150
      cycle: monthly
    concierge: false
    source:
      url: https://creditcard.pnb.bank.in/
      retrieved_on: 2026-07-04
      type: issuer-pdf
      confidence: medium
      local_refs:
        - docs/sources/pnb/rupay-select/MITC.pdf
      notes: "MITC confirms 1% fuel surcharge waiver above Rs 400; lounge access is the NPCI RuPay Select program benefit."

eligibility:
  min_age: 21
  max_age: 70
  income_inr_annual:
    salaried: 360000
    self_employed: 360000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://creditcard.pnb.bank.in/

metadata:
  last_verified_on: 2026-07-04
  tags: [mid, rupay, points, upi-linkable, psu-bank]

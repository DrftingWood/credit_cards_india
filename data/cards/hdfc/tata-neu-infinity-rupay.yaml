rewards:
- effective_from: 2025-07-01
  effective_until: null
  currency: points
  currency_name: NeuCoins
  redemption_scope: closed-loop
  ecosystem_label: Tata Neu
  loyalty_program: tata-neu-points
  base:
    rate: 1.5
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    excluded_categories:
    - groceries
    - insurance
    - utilities
    - telecom
    - other
  accelerated:
  - category: grocery-insurance-utility-telecom-base
    canonical_categories:
    - groceries
    - insurance
    - utilities
    - telecom
    effective_rate: 1.5
    card_attributable_rate: 1.5
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_per_cycle: 2000
    cap_unit: points
    cycle: monthly
    notes: Non-UPI spends in each named category earn 1.5%, capped separately at 2,000 NeuCoins per calendar month.
  - category: tata-partner-brand-non-emi
    effective_rate: 5
    card_attributable_rate: 5
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_status: not-published
    cap_unit: points
    cycle: monthly
    merchants:
    - tata-neu-app
    - bigbasket
    - 1mg
    - air-india
    - air-india-express
    - croma
    - westside
    - tata-cliq
    - ihcl
    - cult
    - tata-play
    - tata-pay
    - titan
    - tanishq
    - qmin
    notes: Non-EMI Tata Neu and eligible partner-brand transactions earn 5% total (1.5% base plus 3.5% additional), independent of NeuPass. Merchant IDs/terminal IDs and merchant-specific monthly/annual eligible-spend ceilings apply. The 5% earn is not included in calculator scoring because those spend ceilings are not modeled.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  reward_cap:
    max_units: 50000
    cap_unit: points
    cycle: statement
  capping_rules:
  - >-
    Eligible non-EMI Tata partner-brand transactions earn 5% total (1.5% base plus 3.5% additional), independent of NeuPass. NeuPass registration is required only for the separate additional 5% on selected Tata Neu categories.
    Eligible spend ceilings by merchant, monthly/annual: Croma 600,000/1,800,000; Tata CliQ and Westside
    300,000/1,800,000; IHCL, Air India Express, and Air India 800,000/3,000,000; 1Mg, Cult, and Tata Play
    200,000/1,500,000; Tata Pay 100,000/600,000 (monthly limit increased from 50,000 effective 1-Aug-2024); BigBasket 100,000/1,200,000; Titan and Tanishq
    600,000/1,800,000; Qmin 50,000/600,000. The calculator does not model this 5% rate until merchant-level
    annual caps can be applied.
  - Non-UPI grocery, insurance, utility, and telecom/cable spends each earn 1.5%, capped separately at 2,000 NeuCoins per calendar month.
  - Additional 5% NeuCoins on selected Tata Neu app/website categories via NeuPass, after registration and only on the primary cardholder mobile account since 15-Jan-2025; category scope varies and listed excluded merchants mean it is not scored here.
  - RuPay UPI earn is 0.5% on eligible UPI IDs plus 1% additional when routed through Tata Neu UPI ID (1.5% total); all UPI channels share a 500 NeuCoin calendar-month cap. UPI is not modeled in calculator scores because customer inputs do not separate UPI from other spend and the cap is shared across both rates. Tata-brand UPI transactions earn the UPI rate, not 5%.
  - 'From 1-Jul-2025: no NeuCoins on online skill-based gaming (MCC 5816).'
  - From 25-Nov-2026 HDFC states that unclaimed NeuCoins will require a manual in-app claim and card balances will expire after 12 months; this future-dated change is not applied yet.
  redemption:
  - type: voucher
    program: Tata Neu App/Website and eligible Tata brands
    rate_inr_per_unit: 1.0
    constraints: NeuCoins redeem at INR 1 on eligible Tata Neu transactions and are not cash convertible. Until 24-Nov-2026, card-earned NeuCoins are automatically transferred within 7 working days of statement generation; from 25-Nov-2026, primary cardholders must claim in-app within 12 months or unclaimed coins expire. After transfer to Tata Neu, claimed coins are valid another 12 months. Welcome and promotional coins follow their offer terms.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/tata-neu-infinity-credit-card/pdf/tata_neu_infinity_card_tnc.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated.grocery-insurance-utility-telecom-base.effective_rate
    - rewards.accelerated.grocery-insurance-utility-telecom-base.cap_per_cycle
    - rewards.accelerated.tata-partner-brand-non-emi.effective_rate
    - rewards.accelerated.tata-partner-brand-non-emi.merchants
    - rewards.reward_cap.max_units
    local_refs:
    - docs/sources/hdfc/tata-neu-infinity/tata-neu-infinity-terms-updated-2026-10-24.pdf
    - docs/sources/hdfc/tata-neu-infinity/neu-pass-additional-5-percent-terms.pdf
    - docs/sources/hdfc/_shared/mitc-v4.15-retrieved-2026-10-27.pdf
    notes: HDFC card-specific T&C updated 24-Oct-2026. NeuPass additional 5% is limited to selected app categories, requires registration and primary account matching; excluded brand list and category eligibility can change. Partner-specific caps are documented but not scored. Tata Pay monthly limit is INR 100,000 effective 1-Aug-2024.

benefits:
- effective_from: 2025-06-10
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: Two domestic lounge vouchers per calendar quarter after 50,000 spend in that same calendar quarter; claim within 120 days of qualification and use within 180 days of issue; maximum eight per year.
    international:
      visits_per_cycle: 4
      cycle: annual
      guests_per_visit: 0
      via:
      - rupay
      notes: Four visits per calendar year, one per quarter; a US$3.25 temporary debit is reversed by RuPay.
  welcome:
  - condition: First transaction within 30 days of issuance; not available on lifetime-free or first-year-free accounts. Claim within 60 days of the first transaction under the card-specific terms; issuer product page also states a 180-day-from-statement window for eligible customers.
    benefit: 1,499 NeuCoins (joining-fee reversal)
    value_inr: 1499
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 500
    cycle: statement
  insurance:
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: Primary cardholder only; cover starts on card activation and applies to accidental death following bodily injury within 12 months, subject to policy terms.
  - type: travel-medical
    sum_insured_inr: 1500000
    conditions: Primary cardholder only; international travel outside India, activated from first POS transaction/cash withdrawal; pre-existing illness excluded, subject to policy terms.
  - type: lost-card-liability
    sum_insured_inr: 900000
    conditions: Primary cardholder only; up to INR 900,000, with the policy specifying 2 days before blocking through 30 days after blocking; subject to claim notice and policy terms.
  concierge: false
  source:
    url: https://www.hdfc.bank.in/credit-cards/tata-neu-infinity-hdfc-bank-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hdfc/tata-neu-infinity/domestic-lounge-terms.pdf
    - docs/sources/hdfc/tata-neu-infinity/insurance-policy-2026-07-23-to-2027-07-22.pdf
    - docs/sources/hdfc/tata-neu-infinity/tata-neu-infinity-terms-updated-2026-10-24.pdf
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.domestic.spend_threshold_inr
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.welcome.value_inr
    - benefits.welcome.window_days
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.insurance
    notes: HDFC product page currently states the limits and primary feature. The linked insurance PDF gives policy period 23-Jul-2026 to 22-Jul-2027 but internally also says features valid only until 22-Jul-2026; retained the cover amounts with this date conflict noted. International lounge is RuPay-network access; the $3.25 transaction is reversed. Domestic voucher requires INR 50,000 quarterly spend and the linked page provides 120-day claim/180-day use windows.


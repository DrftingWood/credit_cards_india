  redemption:
  - type: statement-credit
    rate_inr_per_unit: 1.0
    constraints: Automatic cashback credit to the card account within 45 days of the statement date. Reversed,
      cancelled or nullified transactions can have cashback recovered.
  notes: No reward points; rewards are cashback only. Current 10% categories share one INR1,200 monthly
    cap. International purchases earn no cashback under the product page; the Service Guide retains an
    older inconsistent passage stating international spend is eligible. Cashback is credited within 45
    days of statement date. Excluded MCC and eligible MCCs follow the archived Live+ Service Guide (pages
    22-24); wallet, rent, insurance, fuel, government/education, financial, quasi-cash, business-to-business,

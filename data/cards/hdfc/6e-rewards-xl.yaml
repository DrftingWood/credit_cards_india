  capping_rules:
  - HDFC MITC caps XL grocery-category points at 2,000 per month.
  - Utility and telecom-category reward points are each capped at 2,000 per month under HDFC MITC.
  - Insurance reward points are capped at 2,000 per day for this card class.
  - Rent, wallet loads, EMI and government transactions do not earn reward points under HDFC MITC.

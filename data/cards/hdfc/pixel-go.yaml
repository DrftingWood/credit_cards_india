  fee_waiver:
    spend_inr: 50000
    cycle: annual
    conditions: Renewal fee waived on eligible spend of INR 50,000 in the preceding 12 months before renewal; cash withdrawals are excluded from waiver spend. Joining fee is waived on INR 10,000 eligible spend in the first 90 days.
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.75
  gst_applicable: true
  notes: RuPay variant supports UPI linkage. Interest-free credit period is up to 50 days. Current Pixel MITC also lists 1.75% dynamic currency conversion markup effective 20 May 2026; schema has no dedicated DCC fee field.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/personal-mitc/MITC-PIXEL-Credit-Card-12Aug-26-1.pdf

    program: cash credit
    rate_inr_per_unit: 0.75
    min_units: 500
    fee_inr: 149
    constraints: Maximum 2,500 points per calendar month. MITC cash-credit redemption fee from 1 April 2025; check current redemption terms for additional balance restrictions.
  - type: other
    program: Pay with Rewards at POS
    rate_inr_per_unit: null
    min_units: 500
    constraints: Current Pay by Rewards terms say ₹0.75 per point; the Dec-2025 benefit guide says ₹1 per point. Value remains unresolved pending issuer clarification.

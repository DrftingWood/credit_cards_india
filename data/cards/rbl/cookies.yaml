    - online
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    notes: Terms specify 5 points per INR100 on eligible online spend (not 5 bonus points plus base); settled transactions
      only. Select MCC exclusions apply.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - insurance-premiums
  - education
  - government
  - emi
  - cash-advance
  - utilities

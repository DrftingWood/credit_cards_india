  capping_rules:
  - Grocery, utility and telecom rewards share a combined 2,000-point monthly cap; the calculator applies this conservatively as one shared cap.
  - Weekend dining earns 2X total (10 points per INR 150) on Saturday/Sunday at standalone restaurants MCC 5812, 5813 or 5814, with an INR 150 minimum and direct card payment. Current card-specific terms dated 1-Jun-2026 state no numerical reward cap; the previous record carried daily/monthly caps that are not stated in these current terms. Calculator cannot filter by day and merchant.
  - Insurance transactions earn points up to 5,000 per month for this card, effective 1-Jul-2025. The current MITC and issuer SMS notice identify MCCs 1411, 1235, 5960, 6300 and 6381; the monthly cap replaces the older daily cap.
  - Reward points expire three years after accumulation. SmartBuy flight/hotel redemption is capped at 75,000 points/month and at 70% of booking value. Products/vouchers redeem at up to 0.50 per point and cashback at 0.30 per point.

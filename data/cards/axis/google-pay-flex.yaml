      fields_verified:
      - rewards.accelerated[0].effective_rate
      notes: Issuer terms specify 2 Stars per cumulative INR 500 in the first cycle and subsequent cycles after at least INR 100 net eligible spend in the prior cycle.
  exclusions:
  - rent
  - cash-advance
  - financial-institutions
  - insurance-premiums
  - education
  - government

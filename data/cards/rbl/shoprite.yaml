  notes: INR500 joining/first-year and renewal annual fee plus GST. The INR150,000
    eligible membership-year spend waives the following year's annual fee; category,
    EMI, fee, charge and GST exclusions apply. MITC publishes up to 3.99% monthly
    finance charge and 2.5% cash advance fee, minimum INR500; forex markup up to
    3.5%. Values are current review snapshots; current exact card launch date was
    not found and is left unknown.

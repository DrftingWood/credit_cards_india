discontinued_on: null

fees:
  - effective_from: 2022-06-01
    effective_until: null
    joining_fee_inr: 250
    annual_fee_inr: 0
    fee_waiver: null
    forex_markup_pct: 3.0
    finance_charge_monthly_pct: 2.50

    notes: 10 points per INR200 on eligible Dining MCCs 5812/5813/5814 (including food delivery), Travel MCCs 3000-3350, 3501-3853, 7011, 4511, 4722, 4723, and birthday purchases. Effective 2026-06-18, the old INR20,000 monthly threshold was removed. Birthday cannot be represented as a merchant category. International transactions stopped earning points effective 2026-10-26, despite conflicting stale issuer page text that still advertises 10X international points.
    source:

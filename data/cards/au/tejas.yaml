    - rewards.base.per_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.multiplier
    - rewards.accelerated.effective_per_inr
    - rewards.capping_rules
    - rewards.base.unit_value_inr
    - rewards.reward_cap.max_units
    - rewards.redemption.rate_inr_per_unit
    - rewards.redemption.min_units
    - rewards.redemption.fee_inr
    notes: >-
      Base 1 point/INR 100; 5 points/INR 100 through AU Rewardz portal. Current AU card-member agreement (24 March 2026): https://www.au.bank.in/credit-cards/credit-card-member-agreement.pdf. It sets a 25,000-point statement cap and utility/telecom earn of 1 point/INR 100 with a 100-point transaction maximum. It excludes rent, education/government, BBPS on AU 0101, EMI, fuel, cash withdrawal and quasi-cash; Tejas product FAQ additionally lists BBPS and transportation exclusions. The card's current product FAQ says BBPS without specifying channel, so channel scope remains unresolved. Cashback offers are separate from points. AU Rewardz FAQ values ordinary catalog points at 0.25 paise (INR 0.0025) and e-vouchers at 0.20 paise (INR 0.002); redemption fee INR 99 plus GST and 200-point minimum.

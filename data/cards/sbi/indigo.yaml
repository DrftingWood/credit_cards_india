id: sbi-indigo
name: IndiGo SBI Card
issuer: sbi
network: visa
network_tier: signature
tier: mid
card_type: credit
co_brand:
  partner: IndiGo
  category: airline
  partner_website: https://www.goindigo.in
status: active
launched_on: 2025-09-27
discontinued_on: null

# Base variant of IndiGo × SBI Card partnership (launched Sept 2025).
# Uses BluChip loyalty. Companion premium variant at sbi/indigo-elite.yaml.

fees:
  - effective_from: 2025-09-27
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/indigo-sbi-card.html
      retrieved_on: 2026-07-03
      notes: "Annual/renewal fee ₹1,499 + taxes per SBI Card product page. No fee waiver on base variant."

rewards:
  - effective_from: 2025-09-27
    effective_until: null
    currency: miles
    currency_name: IndiGo BluChips
    loyalty_program: indigo-bluchip
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.6
      unit_value_inr_realized: 0.45
    accelerated:
      - category: indigo-flights-direct
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 19
        card_attributable_rate: 3
        card_attributable_per_inr: 100
        stacks_with_program: true
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
        merchants: [indigo-web, indigo-app]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [indigo-app, indigo-web]
        notes: "Receipt-visible total can reach ~19 BluChips per ₹100 on IndiGo bookings via app/web. Of that, ~3 is the card's own contribution; the remainder (BluChip baseline + channel bonus + tier) comes from the loyalty programme and is stacked at calculator time via loyalty_program: indigo-bluchip."
      - category: hotels-travel
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 2
        card_attributable_rate: 2
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
        notes: "Card-side reward denominated in BluChips but does not stack with IndiGo programme earn (hotels don't earn BluChips just from holding the card)."
    exclusions:
      - fuel
      - rent
      - government
      - utilities
      - insurance-premiums
    redemption:
      - type: voucher
        program: IndiGo flights + 6E Prime add-ons
        rate_inr_per_unit: 0.6
        constraints: "IndiGo BluChip floats ~Rs0.40-0.60 toward IndiGo fares (min 500); no fixed value."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/indigo-sbi-card.html
      retrieved_on: '2026-07-05'

      confidence: high
      notes: 'BluChip voucher rate corrected 1.0->0.6 to match floating value (2026-07-05).'
    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2025-09-27
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        spend_threshold_inr: 50000
        spend_threshold_cycle: quarterly
        notes: "4 complimentary domestic lounge visits per year (max 1 per quarter) on Rs. 50,000 spend in the previous quarter."
    welcome:
      - condition: "Annual fee paid and first transaction within 60 days of account opening"
        benefit: "2,500 IndiGo BluChips welcome voucher — renews annually on fee payment"
        value_inr: 2500
        window_days: 60
    milestones:
      - spend_inr: 200000
        cycle: annual
        benefit: "2,500 IndiGo BluChips bonus voucher"
        value_inr: 2500
      - spend_inr: 400000
        cycle: annual
        benefit: "2,500 IndiGo BluChips bonus voucher"
        value_inr: 2500
      - spend_inr: 600000
        cycle: annual
        benefit: "2,500 IndiGo BluChips bonus voucher"
        value_inr: 2500
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: 200
      cycle: monthly
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/indigo-sbi-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 360000
    self_employed: 360000
  credit_score_min: 720
  residency: resident-indian
  notes: "Eligibility requires active IndiGo BluChip membership."

application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/travel/indigo-sbi-card.page

metadata:
  last_verified_on: '2026-07-05'
  tags: [co-branded, airline, indigo, mid, miles, bluchip]

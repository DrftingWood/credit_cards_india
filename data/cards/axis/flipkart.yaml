    notes: Current cashback T&C (version b55a0e1a_5) confirms 7.5% Myntra, 5% Flipkart and Cleartrip (each capped INR 4,000 per statement quarter), 4% unlimited on preferred partners, and 1% unlimited on other eligible merchants. Quarters follow the statement cycle. Accelerated eligibility is based on partner merchant IDs; unmatched MIDs may require partner confirmation. Swiggy's accelerator is Food Delivery on the Swiggy app only, excluding Instamart and Genie. Current preferred-partner PDF visually lists Cult.fit, PVR, Swiggy and Uber; the list can change. Cashback is credited shortly before the following statement; same-cycle refunds/EMI conversions reduce cashback and later reversals debit it. Cashback exclusions include utilities/telecom, education, rent, wallet loads, government, insurance, gold/jewellery, fuel, financial institutions, cash advances, repayments, fees and charges.
  mcc_exclusions:
  - '6513'
  capping_rules:
  - Current issuer terms retrieved 2026-10-27 confirm INR 4,000 per statement-quarter per merchant for Flipkart, Myntra and Cleartrip; preferred and other eligible spend is unlimited. Statement quarters follow the individual card billing cycle, not calendar quarters.
  - Accelerated cashback depends on partner merchant IDs; preferred merchant identities can change. Current list is Cult.fit, PVR, Swiggy and Uber.

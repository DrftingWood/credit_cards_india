    cycle: monthly
  concierge: false
  other:
  - name: Activation voucher
    description: INR 250 gift voucher after one transaction within 37 days of card issuance.
  - name: Credit liability cover
    description: INR 3 lakh credit liability cover; policy terms apply.
  - name: Lost-card liability
    description: Zero liability for fraudulent transactions if the lost or stolen card is reported immediately to HDFC customer care.
  - name: Optional business insurance
    description: Optional business insurance package starts at INR 3,785 per year including GST; this is a paid add-on, not complimentary card cover.
  - name: Dining offer
    description: 10% extra discount on dining bills at participating restaurants through Swiggy Dineout; offer terms apply.
  - name: SmartPay offer
    description: Current issuer page advertises up to INR 1,800 first-year cashback and e-vouchers up to INR 800 for adding two or more bills; offer terms apply.

benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: quarterly
      guests_per_visit: null
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      via:
      - rupay
      notes: Unlimited domestic lounge access after INR 75,000 net eligible spend
        in the preceding calendar quarter, effective 15-Jul-2026. New-card issue-quarter
        waiver applies under shared BOBCARD lounge terms; upgrade waiver is not available.
  welcome:
  - condition: Spend INR 5,000 or more within 60 days of issuance
    benefit: 500 bonus BOBCARD Reward Points
    value_inr: 125
    window_days: 60
  milestones:
  - spend_inr: 100000
    cycle: annual
    benefit: 12-month Amazon Prime membership after at least INR 100,000 spend within
      90 days of issuance; activation code is delivered after milestone and time limited.
    reward_kind: other
    trigger_window: first-year
    is_repeatable: false
  insurance:
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: Air accidental-death cover; product page states INR 1 crore. Full
      insurance policy terms apply.
  - type: personal-accident
    sum_insured_inr: 1000000
    conditions: Non-air accidental-death cover, including sea accidents; product page
      states INR 10 lakh. Full policy terms apply.

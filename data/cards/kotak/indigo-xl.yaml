id: kotak-indigo-xl
name: IndiGo Kotak Premium Credit Card
issuer: kotak
network: mastercard
network_tier: world
tier: premium
card_type: credit
co_brand:
  partner: IndiGo
  category: airline
  partner_website: https://www.goindigo.in
status: active
launched_on: 2025-06-01
discontinued_on: null

# Premium variant of IndiGo's 2025 Kotak partnership — BluChip currency.
# Companion base variant at kotak/indigo.yaml.

fees:
  - effective_from: 2025-06-01
    effective_until: null
    joining_fee_inr: 3000
    annual_fee_inr: 3000
    fee_waiver: null
    forex_markup_pct: 2.5
    finance_charge_monthly_pct: 3.5
    cash_advance_fee:
      pct: 2.5
      min_inr: 300
    gst_applicable: true
    source:
      url: https://www.kotak.bank.in/en/personal-banking/cards/credit-cards/indigo-xl-credit-card.html
      retrieved_on: 2026-07-03
      notes: "Joining + annual fee ₹3,000 per Paisabazaar (2026-04-18 article). Forex markup 2.5% (preferential vs 3.5% on base variant)."

rewards:
  - effective_from: 2025-06-01
    effective_until: null
    currency: miles
    currency_name: IndiGo BluChips
    loyalty_program: indigo-bluchip
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.5
    accelerated:
      - category: indigo-flights-direct
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 21
        card_attributable_rate: 5
        card_attributable_per_inr: 100
        stacks_with_program: true
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
        merchants: [indigo-web, indigo-app]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [indigo-app, indigo-web]
        notes: "Up to 21 visible BluChips per ₹100 on IndiGo web/app bookings. Decomposes as ~5 card + 4 channel-bonus + 8 BluChip-member + up to 4 tier; only the 5 is card-attributable. Higher visible rate than the base XL variant comes from the elevated card-side bonus, not stacking — the rest is the same programme math."
      - category: dining-entertainment
        canonical_categories: [dining, entertainment]
        multiplier: 1
        effective_rate: 2
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - education
      - government
      - utilities
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: voucher
        program: IndiGo flights + 6E Prime add-ons
        rate_inr_per_unit: 1.0
        constraints: "Redeemable 1:1 on IndiGo bookings and 6E Prime add-ons only. No airline / hotel transfer partners."
    source:
      url: https://www.kotak.bank.in/en/personal-banking/cards/credit-cards/indigo-xl-credit-card.html
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2025-06-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [dreamfolks]
        notes: "2 complimentary domestic lounge visits per quarter (8 per year) via Dreamfolks."
    welcome:
      - condition: "Joining fee paid"
        benefit: "2,500 IndiGo BluChips welcome voucher — renews annually on fee payment"
        value_inr: 2500
        window_days: 90
    milestones:
      - spend_inr: 150000
        cycle: annual
        benefit: "4,000 IndiGo BluChips bonus voucher"
        value_inr: 4000
      - spend_inr: 400000
        cycle: annual
        benefit: "Additional 4,000 IndiGo BluChips bonus voucher"
        value_inr: 4000
      - spend_inr: 750000
        cycle: annual
        benefit: "Additional 4,000 IndiGo BluChips bonus voucher"
        value_inr: 4000
      - spend_inr: 1200000
        cycle: annual
        benefit: "Additional 4,000 IndiGo BluChips bonus voucher"
        value_inr: 4000
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 3500
      cycle: annual
    other:
      - name: IndiGo priority check-in
        description: Priority check-in counter access on IndiGo bookings.
      - name: IndiGo preferred seat selection
        description: Complimentary preferred seat selection on IndiGo.
      - name: IndiGo baggage assistance
        description: Baggage assistance services at select airports via IndiGo.
    concierge: false
    source:
      url: https://www.kotak.bank.in/en/personal-banking/cards/credit-cards/indigo-xl-credit-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 18
  max_age: 65
  income_inr_annual:
    salaried: 600000
    self_employed: 600000
  credit_score_min: 750
  residency: resident-indian

application:
  apply_url: https://www.kotak.bank.in/en/personal-banking/cards/credit-cards/indigo-credit-card-xl.html

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, airline, indigo, premium, miles, bluchip, low-forex]

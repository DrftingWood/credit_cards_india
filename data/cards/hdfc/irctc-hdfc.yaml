# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : HDFC per-card T&C/MITC PDFs (docs/sources/hdfc/)
#   Verified   : 2026-07-04   Confidence: HIGH (pdf)
#   Fees, reward rate, forex & caps cross-checked vs the source above where extractable.
# Eligibility income bands, min credit score & some launch dates are tier-standard
# defaults (not individually source-verified). Exact monthly caps on some cashback
# cards remain source/HTML-noted. See docs/sources/<issuer>/ for evidence.
# ---------------------------------------------------------------------------
id: hdfc-irctc-hdfc
name: IRCTC HDFC Bank Credit Card
issuer: hdfc
network: rupay
network_tier: select
tier: entry
card_type: credit
co_brand:
  partner: IRCTC
  category: railway
  partner_website: https://www.irctc.co.in
status: active
launched_on: 2022-08-01
discontinued_on: null

fees:
  - effective_from: 2022-08-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 500
    fee_waiver:
      spend_inr: 150000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.hdfc.bank.in/credit-cards/irctc-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2022-08-01
    effective_until: null
    currency: points
    currency_name: IRCTC Reward Points
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.9
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 5
        card_attributable_rate: 5
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: 1000
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "IRCTC rail accelerator capped at 1,000 Reward Points per month (12,000 per year)."
    capping_rules:
      - "Grocery/departmental spends earn base 1× only (no 3× accelerator), subject to a monthly cap."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    redemption:
      - type: voucher
        program: IRCTC
        rate_inr_per_unit: 1.0
    source:
      url: https://www.hdfc.bank.in/credit-cards/irctc-credit-card
      retrieved_on: 2026-07-03

    mcc_exclusions: ['5816', '6540']
benefits:
  - effective_from: 2022-08-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [issuer-direct]
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: 250
      cycle: statement
    other:
      - name: IRCTC transaction charge waiver
        description: 1% + GST transaction charge waiver on IRCTC ticket bookings.
    concierge: false
    source:
      url: https://www.hdfc.bank.in/credit-cards/irctc-credit-card
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 60
  income_inr_annual:
    salaried: 300000
    self_employed: 600000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.hdfc.bank.in/credit-cards/irctc-credit-card

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, railway, irctc, rupay, entry]

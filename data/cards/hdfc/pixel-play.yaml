rewards:
- effective_from: '2026-07-30'
  effective_until:
  currency: cashback
  currency_name: CashPoints
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: 1% on other eligible transactions; shared maximum 15,000
      CashPoints per calendar month under the current Pixel MITC. Minimum
      transaction INR 100; fractional points round down.
  accelerated:
  - category: user-chosen-packs
    multiplier: 1
    effective_rate: 5
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    over_cap_earns_base: false
    notes: Cardholder selects two fixed issuer-defined packs from
      BookMyShow/Zomato, MakeMyTrip/Uber, Blinkit/Reliance Smart Bazaar,
      Croma/Reliance Digital, or Nykaa/Myntra. Each merchant must match
      issuer-supplied merchant IDs; Croma and Reliance Digital qualify only in
      physical stores and Blinkit/Reliance Smart Bazaar only in the stated
      channels. Shared 500 CashPoint calendar-month cap; beyond the cap earns no CashPoints. Uber 5%
      requires travel/commute MCC 4121 or 7512. Choices can change every three
      months.
    canonical_categories:
    - online
    - dining
  - category: smartbuy
    canonical_categories:
    - travel
    - online
    multiplier: 1
    effective_rate: 5
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      class: issuer-portal
      merchants:
      - smartbuy
    notes: 5% on successful full-payment SmartBuy IGP, flights, hotels, bus,
      rail, instant vouchers and Apple Imagine Tresor transactions; 500
      CashPoint calendar-month cap, with no points beyond cap. Cannot combine
      with merchant cashback features.
    over_cap_earns_base: false
  - category: upi
    multiplier: 1
    effective_rate: 1
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      class: online-any
      merchants:
      - any
    notes: 1% on eligible UPI transactions using PIXEL RuPay, capped at 500
      CashPoints/calendar month; transactions beyond the cap earn no points.
    canonical_categories:
    - other
    over_cap_earns_base: false
  - category: online-other
    canonical_categories:
    - online
    multiplier: 1
    effective_rate: 3
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    over_cap_earns_base: false
    notes: One chosen platform (Amazon, Flipkart or PayZapp); 500 CashPoint
      calendar-month cap; transactions beyond the cap earn no CashPoints. Selection can change every three months; eligibility depends on
      partner merchant IDs, and Amazon Pay wallet loads are excluded.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - emi
  - government
  - cash-advance
  redemption:
  - type: cashback-bank
    program: PayZapp CashPoints balance
    rate_inr_per_unit: 1.0
    min_units: 1000
    constraints: Redeem through PayZapp; CashPoints transfer to PayZapp
      CashPoints balance, not as statement credit. Unredeemed points expire two
      years after accumulation.
  source:
    url:
      https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/fifa-pixel-credit-card/pdf/terms-and-conditions-pixel-play-credit-card-08072026.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/hdfc/pixel-play/terms-and-conditions-pixel-play-credit-card-08072026.pdf
    - docs/sources/hdfc/pixel-play/MITC-PIXEL-Credit-Card-12Aug-26-1-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
    - rewards.accelerated.cap_unit
    - rewards.accelerated.cycle
    - rewards.accelerated.over_cap_earns_base
    - rewards.category_caps
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption.rate_inr_per_unit
    - rewards.redemption.min_units
    - rewards.mcc_exclusions
    notes: Product-specific terms dated 30-Jul-2026 detail fixed merchant packs,
      exact monthly caps, no-earn treatment beyond accelerator caps, settlement/MID
      eligibility, exclusions and redemption. Current Pixel MITC updated 15-Oct-2026 confirms the 15,000
      CashPoint monthly cap for the base 1% feature and two-year expiry. Older
      product terms described the all-other earn as unlimited; current MITC is
      modeled.
  mcc_exclusions:
  - '1361'
  - '5172'
  - '5541'
  - '5542'
  - '5983'
  - '9752'
  - '6513'
  - '6540'
  - '7349'
  - '9211'
  - '9222'
  - '9223'
  - '9311'
  - '9399'
  - '9402'
  - '9405'
  - '9950'
  category_caps:
  - category: eligible-other-spends
    cap_per_cycle: 15000
    cap_unit: cashback-inr
    cycle: monthly
    conditions: Current Pixel MITC caps the all-other-spend 1% feature at 15,000
      CashPoints/calendar month. Product-specific terms say selected-pack and
      selected-ecommerce spend beyond their accelerator caps earns no CashPoints.
  capping_rules:
  - Transactions below INR 100 do not earn CashPoints; fractional CashPoints are
    rounded down.
  - Eligible transactions must settle; merchant settlement date determines
    calendar-month caps. Returns and reversals adjust/reverse points.
  - CashPoints expire two years after accumulation. Points can be nullified
    after 365 days of card inactivity; a negative balance persisting beyond 60
    days may be debited at INR 1 per CashPoint.
  - Online skill-based gaming, card fees/charges, outstanding-balance payments,
    and the listed excluded transaction types do not earn points.
benefits:
- effective_from: '2026-07-30'
  effective_until:
  lounge_access:
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  concierge: false
  other:
  - name: Digital card management
    description: Manage the card, rewards, repayments and controls in PayZapp.
      Issuance may include a digital RuPay card and a physical Visa card; the
      cardholder can select Visa, RuPay or both during the available setup
      window.
  dining:
    program: Swiggy Dineout
    discount_pct: 10
    notes: Current HDFC product page advertises up to 10% off restaurant bills paid via Swiggy app, inclusive of restaurant and Swiggy discounts. Current page gives no cap or end date. The linked 30-Jul-2026 terms still contain an older offer that expired 31-Dec-2025 (twice monthly, INR 200 per transaction); current offer mechanics are unresolved.
  source:

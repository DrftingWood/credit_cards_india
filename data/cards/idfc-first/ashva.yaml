fees:
- effective_from: 2026-09-17
  effective_until: null
  joining_fee_inr: 2999
  annual_fee_inr: 2999
  fee_waiver: null
  forex_markup_pct: 0
  finance_charge_monthly_pct: null
  cash_advance_fee:
    flat_inr: 199
  gst_applicable: true
  notes: >-
    The primary metal card has a non-refundable joining fee payable upfront before
    dispatch. The current product page does not state a fixed finance-charge rate;
    no rate is asserted here. The product page separately says international ATM
    withdrawals attract a 1% markup, a cash-withdrawal charge distinct from the
    zero-markup policy for international card purchases. ATM withdrawals carry a
    flat INR 199 + GST fee per transaction, including overseas withdrawals; the
    page states up to 45 interest-free days when the bill is repaid by the due date.
    The INR 8 lakh annual spend benefit awards 7,500 points after annual fee payment;
    it does not waive the annual fee. Add-on cards separately cost INR 2,000 +
    GST joining for metal or INR 1,500 + GST joining for plastic, plus INR 1,000 +
    GST annual fee for either variant.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/metal-credit-card/ashva
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - fees.joining_fee_inr
    - fees.annual_fee_inr
    - fees.fee_waiver
    - fees.forex_markup_pct
    - fees.cash_advance_fee.flat_inr
    local_refs:
    - docs/sources/idfc-first/ashva/zero-forex-announcement-2026-09-17.pdf
    notes: >-
      Zero forex markup applies bank-wide effective 17-Sep-2026. The current Ashva
      FAQ separately says foreign ATM cash withdrawals attract 1% forex markup,
      which conflicts with the zero-markup announcement's bank-wide wording; the
      possible ATM-specific exception is retained in notes pending clearer terms.
      The product page lists a flat INR 199 + GST ATM charge, up to 45 interest-free
      days if fully repaid by the due date, and a INR 10,000 per-transaction limit.
      No fixed Ashva-specific purchase APR is published in the reviewed material.

    notes: Card-specific Prime terms and annexure. Shared 750-point accelerated cap; insurance MCC 6300 earns 0.5%
      on up to ₹25,000 per cycle. RuPay variant earns 0.5% UPI on eligible transactions in both accelerated and
      non-accelerated categories, subject to exclusions. Visa/RuPay variants described; variant-specific network
      earn rules not split in this record. MCC schedule governs accelerated eligibility.

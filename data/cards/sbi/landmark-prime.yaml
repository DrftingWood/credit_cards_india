    multiplier: 5
    effective_rate: 10
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    notes: 10 Reward Points per INR 100 on International spends per the current card page; the cap clause does not name this category.
  capping_rules:
  - "Current SBI Cardholder Agreement caps cumulative 5X accrual on SBI Card PRIME dining, movies, departmental stores and grocery at 7,500 points/month, and says caps apply to corresponding co-brand variants. The 10-point dining/movie rate is modeled with that cap. The 25-point/INR100 Landmark store rate (12.5X relative to the 2-point base) is not expressly mapped to the generic cap's 5X wording; its cap applicability is modeled at 7,500/month because it is a departmental-store co-brand category; the agreement does not expressly name the 12.5X Landmark rate, so this cap mapping is conservative. After the 5X cap, base 2 points/INR100 continue. Sources: https://www.sbicard.com/en/cardholder-agreement.page and Landmark PRIME T&C clause 11.4."
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  redemption:
  - type: catalog
    program: Landmark Rewards
    rate_inr_per_unit: 0.25
    constraints: "Closed-loop redemption only by converting SBI Reward Points to Landmark Rewards (4 points = ₹1 equivalent). ₹99 + GST redemption fee applies below 1,000 points."
  source:
    url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card-prime.html
    retrieved_on: '2026-11-01'
    type: issuer-page
    confidence: high
    method: rendered-page
    local_refs: [docs/sources/sbi/_shared/Landmark-PRIME-Booklet.pdf]
    fields_verified: [rewards.base.rate, rewards.accelerated, rewards.capping_rules, rewards.redemption]
    notes: "Current product page and Landmark PRIME booklet clause 11.4 confirm 25 points/₹100 at Landmark stores, 10 points/₹100 on dining/movies/international spends, and 2 points/₹100 on other retail spends; clause 11.5 gives closed-loop conversion and fees. Current SBI Cardholder Agreement separately applies a 7,500-point monthly cap to cumulative 5X PRIME categories and extends caps to corresponding co-brand variants; dining/movie cap applied. Whether this 5X cap also limits the distinct 12.5X Landmark-store rate is not specified, so the 7,500 cap applied to Landmark stores is a conservative interpretation of the general co-brand cap rather than an explicit Landmark-specific cap statement."

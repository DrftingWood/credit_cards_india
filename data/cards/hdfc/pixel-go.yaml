    notes: Current Pixel MITC updated 15 Oct 2026 was checked; it supports the 1% category cap and current insurance cap. The live card page and product-specific terms (https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/pixel-go-credit-card/pdfs/terms-n-conditions-pixel-go-credit-card.pdf) support the earn rates, SmartBuy/UPI caps, exclusions and redemption. Older feature terms say 1% is unlimited and insurance cap is 2,000/day; the current Pixel MITC says 15,000/month and 2,000/month. The current card page also calls the 1% feature unlimited. The effective date uses the latest MITC update date as the snapshot because feature-level effective dates are not published here.

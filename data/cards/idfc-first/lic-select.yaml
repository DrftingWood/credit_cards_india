      class: cobrand-merchant
      merchants:
      - lic-official-website
    notes: >-
      10 points per INR 125 on LIC of India premium payments made through licindia.in only. Only the first five
      eligible LIC premium transactions per statement cycle earn the accelerated rate; non-LIC premiums are excluded.
    source:
      url: https://www.idfcfirst.bank.in/credit-card/lic-credit-card
      retrieved_on: 2026-10-27

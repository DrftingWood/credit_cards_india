benefits:
- effective_from: '2026-08-28'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: annual
      guests_per_visit: 0
      notes: 4 complimentary domestic airport lounge visits per calendar year, subject to at least INR50,000 eligible spend
        in previous 3 calendar months.
      via:
      - visa
  welcome:
  - condition: Complete 3 card transactions of any value within 30 days of card issuance; welcome benefit available once per
      Axis cardholder
    benefit: 2,500 EDGE Reward Points
    value_inr: 500
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 500
    cycle: statement
    notes: 1% surcharge waiver, max INR500 per statement cycle. Detailed page says INR400-INR4,000 qualifying band; the summary
      heading elsewhere says INR400-INR5,000. GST on surcharge not refunded; fuel earns no cashback.
  concierge: false
  other:
  - name: Samsung purchase cashback
    description: 10% cashback on eligible Samsung products/services via Samsung eStore, Samsung Shop App, specified Samsung
      retail brand-EMI terminals and authorized service-center channels; capped INR2,500/month and INR10,000/year from card
      issuance. Flipkart purchases excluded effective 2024-12-20; Amazon excluded effective 2026-01-01. Cashback can take
      up to 60 days and reverses on returns.
  - name: EMI conversion
    description: Purchases of INR2,500 or more may be converted to EMI.
  source:
    url: https://www.axis.bank.in/cards/credit-card/samsung-axis-bank-signature-credit-card

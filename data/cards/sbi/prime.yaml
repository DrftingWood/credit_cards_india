rewards:
- effective_from: 2026-10-25
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 2
    per_inr: 100
    unit_value_inr: 0.25
    unit_value_inr_realized: null
  accelerated:
  - category: dining-grocery-departmental-movies
    canonical_categories:
    - groceries
    - dining
    - entertainment
    multiplier: 1
    effective_rate: 10
    cap_per_cycle: 7500
    cap_unit: points
    cycle: monthly
    over_cap_earns_base: true
    notes: Total 10 points per INR 100 (including 2 base points) for dining MCC 5812/5813/5814, departmental stores
      MCC 5311, grocery/supermarkets MCC 5411 and movie theatres MCC 7832. Cardholder terms cap accelerated points
      at 7,500 per calendar month; after that, base 2 points per INR 100 continue on these eligible purchases.
  - category: birthday-spend
    canonical_categories: []
    multiplier: 1
    effective_rate: null
    cap_unit: points
    cycle: annual
    notes: Issuer page advertises total 20 points per INR 100 for eligible purchases on the day before, day of and
      day after the primary cardholder birthday, with 2,000 points per calendar year cap. Current PRIME cardholder
      booklet states a 1,800-point annual cap. No birthday rate or cap is used in estimates until SBI resolves this
      conflict; the spend profile also has no birthday-date/channel input.
  exclusions:
  - fuel
  - wallet-loads
  - cash-advance
  - emi
  redemption:
  - type: statement-credit
    rate_inr_per_unit: 0.25
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/personal/credit-cards/rewards/sbi-card-prime/prime-tnc-booklet-combined.pdf
    retrieved_on: 2026-11-01
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
    - rewards.accelerated.cap_unit
    - rewards.accelerated.cycle
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.mcc_exclusions
    notes: Current PRIME-specific issuer booklet supports 2 points/INR 100 base, total 10/INR 100 in dining, grocery,
      departmental and movie MCCs, the 7,500-point calendar-month accelerator cap, and the fuel/wallet exclusions.
      The live PRIME page (https://www.sbicard.com/en/personal/credit-cards/sbi-card-prime.html) gives 4 points
      = INR 1 on outstanding-bill redemption and currently advertises a birthday cap of 2,000, conflicting with
      the booklet 1,800 cap. Current MITC (https://www.sbicard.com/en/most-important-terms-and-conditions.page)
      supplies general 24-month points validity and applicable INR 99 + tax statement-credit redemption fee. The
      source does not state effective commencement dates; 2026-10-25 is the observation date.
  mcc_exclusions:
  - '5172'
  - '5541'
  - '5542'
  - '5983'
  - '6540'
  - '6541'
  capping_rules:
  - The dining, departmental, grocery and movie accelerator is 10 total points per INR 100 and has a shared 7,500-point-per-calendar-month
    accelerated-points cap. After this cap, eligible transactions continue to earn 2 base points per INR 100.
  - Birthday earn is 20 total points per INR 100 over three days (birthday minus one day through plus one day);
    no other accelerated points accrue during this period. The current product page says 2,000 points/year, while
    the current cardholder booklet says 1,800; omitted from estimation pending issuer clarification.
  - Utility standing instructions registered through SBI Card platforms earn 20 points per INR 100, capped at 3,000
    points/month, but new autopay registrations on SBI Card platforms were discontinued from 1-Apr-2021. Only registrations
    made by 31-Mar-2021 may continue; this conditional legacy benefit is not modeled.
  - Card-specific terms exclude fuel MCCs 5172, 5541, 5542 and 5983; wallet loads MCC 6540/6541 do not earn points.
    Current MITC states SBI Reward Points expire after 24 months; redemption against the outstanding card bill is
    4 points per INR 1 and carries a INR 99 plus applicable tax fee per qualifying redemption request.

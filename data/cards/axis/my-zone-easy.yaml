  notes: 'Card-specific product page lists standard joining and annual fees of INR 500; the Oct-2026 Axis KFS secured-card row confirms INR 500 each and 49.36% p.a. The Axis comparison tile advertises nil joining/annual fees, conflicting with the detailed product page and KFS; no offer terms or eligibility were found, so standard fees are modeled and the discrepancy is retained here. Current card page lists 3.40% monthly finance charge (49.36% p.a.), cash advance 2.5% (minimum INR 500), foreign currency fee 3.5%, cash payment INR 175, nil replacement, waived mobile alerts and balance enquiry, nil hotlisting, overlimit 2.5% (minimum INR 500), cheque/auto-debit reversal 2% (minimum INR 500, maximum INR 1,522), railway surcharge as prescribed, and reward redemption fee (amount unspecified). Generic Axis KFS/MITC gives DCC 3.5% for other retail cards, while the card-specific page still displays 1.5% + tax; the August-2026 revision notice and current general schedule support 3.5%, but the card-specific published table is stale/conflicting. Current general terms late-fee table: nil below INR 500, INR 500 for INR 501-5,000, INR 750 for INR 5,001-10,000, INR 1,200 for INR 10,001-50,000 and INR 1,300 above INR 50,000, plus INR 100 MAD charge after two consecutive missed cycles. Exactly INR 500 is not assigned. Current generic schedules also publish 1% rent (product page identifies MCC 6513), 1% third-party education, 1% wallet loads at cumulative INR 10,000 per statement, 1% fuel at INR 50,000, 1% utilities at INR 25,000, and 1% online skill gaming at INR 10,000. Card-specific applicability of any generic changes that conflict with its detailed page remains uncertain; amounts are not separately modeled in the schema.'


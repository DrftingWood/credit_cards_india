benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: New primary HSBC Visa Platinum cardholders applying 2025-09-15 through 2026-12-31; activate
      card, download HSBC India app, maintain updated KYC and spend at least INR5,000 in eligible sales transactions
      within 30 calendar days of issuance. Cannot combine with another welcome/intro offer.
    benefit: 2,000 reward points
    value_inr: null
    window_days: 30
  - condition: Visa Platinum card activation with one transaction of INR300 or more; Visa Signature offer terms
      apply and are subject to change.
    benefit: Voucher worth up to INR500 for Amazon Pay, Zomato or Swiggy
    value_inr: 500
    window_days: null
  - condition: Online application, successful Video KYC and card issuance during 2026-01-01 to 2026-10-31;
      offer terms apply.
    benefit: INR250 Amazon eGift Card
    value_inr: 250
    window_days: null
  - condition: Activate HSBC Visa Platinum during the EazyDiner offer period 2026-10-01 to 2026-12-31. Register
      with EazyDiner; offer code/voucher sent within 60 days after eligible month end.
    benefit: Complimentary EazyDiner Prime membership for 2 months
    value_inr: null
    window_days: null
  dining:
    program: District by Zomato
    discount_pct: 10
    notes: Current HSBC offer terms for Visa Platinum list 10% dining discount up to INR200 on minimum transaction
      INR2,500, once per card per calendar month; BOGO movie ticket benefit up to INR200 off second ticket
      on Fridays and Saturdays. Current offer term runs through 2026-10-31; dynamic merchant/offer conditions
      apply.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 250
    cycle: monthly
    notes: Current Service Guide confirms 1% fuel surcharge waiver for INR400-INR4,000 inclusive, capped at
      INR250 per calendar month per primary card. Not available during first 90 days after card issuance; eligible
      fuel transactions do not earn points.

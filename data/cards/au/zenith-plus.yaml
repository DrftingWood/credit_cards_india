  capping_rules:
  - Current cardmember agreement lists a 25,000-point statement-cycle cap for Zenith+ applicable to Rent, Education & Government, Insurance, Utility and Telecom MCCs (other card variants are marked All). The same agreement says Rent, Education & Government and BBPS earn no points; utility/telecom earn 1 point per INR 100 with a 100-point per-transaction cap; a separate table lists a 1,000-point cycle cap for each named special category. This interaction is internally unclear, so no global cap is modeled.
  - The agreement excludes EMI, fuel, cash withdrawal, quasi-cash, charges and BBPS; it also explicitly excludes Rent and Education & Government. Utilities are not blanket-excluded and earn base points under the stated rule. Wallet-load and blanket insurance-premium exclusions are not established by current card-specific terms reviewed.
  - The product page states up to 2 points per INR 100 on dining, travel and international spend but does not publish a card-wide base rate. The issuer's older product-features PDF stating 1 point per INR 100 on other eligible retail spend is no longer available at its issuer URL, so the base rate remains unknown pending current issuer confirmation.

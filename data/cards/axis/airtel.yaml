    cap_unit: cashback-inr
    cycle: statement
    over_cap_earns_base: false
    merchants:
    - airtel-thanks-telecom
    channel:
      class: cobrand-merchant
      merchants:
      - airtel-thanks-telecom
    notes: 25% on Airtel mobile, broadband, WiFi and DTH bills/recharges via Thanks app, capped at 2x base cashback in the same statement cycle. Active connections only. New or inactive connections, hardware, installation and advance recharge are ineligible. MID/VPA recognition applies; disputed reconciliation may take up to 90 days.
  - category: zomato-value-back
    canonical_categories:

id: yes-paisabazaar
name: YES Bank Paisabazaar PaisaSave Credit Card
issuer: "yes"
network: rupay
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: Paisabazaar
  category: other
  partner_website: https://www.paisabazaar.com
status: active
launched_on: 2023-01-01
discontinued_on: null

fees:
  - effective_from: 2026-06-15
    effective_until: null
    joining_fee_inr: 0
    annual_fee_inr: 499
    fee_waiver:
      spend_inr: 120000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.99
    cash_advance_fee:
      pct: 2.5
      min_inr: 300
    gst_applicable: true
    notes: "Zero joining fee; lifetime-free on limited-time offer, else renewal ₹499 waived on ₹1,20,000 annual spend. Co-branded with Paisabazaar (PB Fintech)."
    source:
      url: https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards/paisabazaar-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2026-06-15
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 200
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: dining-travel
        canonical_categories: [dining, travel]
        multiplier: 6
        effective_rate: 12
        cap_per_cycle: 3000
        cap_unit: cashback-inr
        cycle: monthly
        # The 6% is an explicit 24-MCC ALLOWLIST, not a broad dining/travel
        # category. Verified 2026-07-28 against the Paisabazaar product page.
        # 5812/5813/5814 are the restaurant codes food-delivery aggregators bill
        # under, and the issuer names Swiggy, Zomato and Dineout outright.
        mcc_list: ['4511', '4582', '4722', '7011', '5812', '5813', '5814', '3020', '3501', '3509',
                   '3513', '3520', '3530', '3543', '3553', '3583', '3637', '3640', '3642', '3649',
                   '3657', '3659', '3690', '3812']
        notes: >-
          6% cashback on an explicit allowlist of 24 dining & travel MCCs, capped Rs 3,000/month,
          then flat 1%. The issuer states the dining side covers "Dining, including Swiggy, Zomato,
          Dineout, restaurants, fast food joints, etc." CRITICAL: "UPI spends on dining & travel do
          NOT qualify for 6% cashback" - a Swiggy order paid by UPI earns 1%, not 6%, which matters
          most on the RuPay variant whose whole point is UPI. Pay by card number to earn the 6%.
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
      - utilities
      - education
      - government
      - jewellery
    mcc_exclusions: ['6513']
    capping_rules:
      - "6% cashback applies ONLY to the 24 allowlisted dining/travel MCCs; everything else earns the 1% base."
      - "6% dining/travel cashback capped at Rs 3,000 per month, then flat 1%."
      - "UPI-routed dining & travel spends are excluded from the 6% rate and earn the 1% base instead."
      - "No cashback on rent, utilities, education, insurance, EMI, wallet loads, cash advance, toll, government, fuel, hospitals or pharmacies"
    redemption:
      - type: statement-credit
        program: PaisaSave
        rate_inr_per_unit: 1.0
    source:
      url: https://www.paisabazaar.com/yes-bank/paisabazaar-paisasave-credit-card/
      retrieved_on: '2026-07-28'

      notes: Added missing accelerated-category cap(s) (were uncapped) - 2026-07-05.
benefits:
  - effective_from: 2026-06-15
    effective_until: null
    lounge_access: null
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: null
      cycle: monthly
    concierge: false
    source:
      url: https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards/paisabazaar-credit-card
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 60
  income_inr_annual:
    salaried: 300000
    self_employed: 300000
  credit_score_min: 700
  residency: resident-indian

application:
  apply_url: https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards/paisabazaar-credit-card


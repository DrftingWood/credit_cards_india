  movies:
    type: discount
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 100
    notes: 25% off up to INR 100 on at least two tickets, twice monthly. From 1-Apr-2026 BookMyShow requires INR 25,000 spend in the preceding quarter; dual-network customers may have one offer per month per variant. Current HPCL Coral page does not advertise the separate INOX benefit listed for regular Coral.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: null
    cycle: monthly
    notes: 1% waiver on HPCL fuel transactions between INR 400 and INR 4,000 when swiped on an ICICI Bank POS machine; issuer does not state a separate monthly cap for this card-specific waiver.
  concierge: null
  other:
  - name: HPCL fuel cashback
    description: 2.5% cashback on fuel purchases at HPCL pumps, capped at INR 100 per month. This is separate from the 1% surcharge waiver, which requires an ICICI Bank POS machine.
    value_inr: null

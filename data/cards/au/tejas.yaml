    cap_status: not-published
    notes: Current AU card-member agreement gives 1 Reward Point per INR 100 on utility and telecom spend, maximum 100 points per transaction. The overall 25,000-point statement cap applies; no separate category-cycle cap is stated.
    source:
      url: https://www.au.bank.in/credit-cards/credit-card-member-agreement.pdf
      retrieved_on: '2026-11-01'
      type: issuer-pdf
      confidence: high

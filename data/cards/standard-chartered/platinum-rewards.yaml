rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: 360 Reward Points
  base:
    rate: 1
    per_inr: 150
    unit_value_inr: 0.25
    unit_value_inr_realized: null
    notes: One point per INR150 for other eligible spend; catalogue value per point is INR0.25.
  accelerated:
  - category: dining-fuel
    canonical_categories:
    - dining
    - fuel
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    notes: Card-specific terms specify Hotels, Restaurants and Fuel; current product page describes fine dining
      and fuel and says there is no monthly cap. Merchant-category coding by Visa determines eligibility.
      The T&C also says card-level caps apply without specifying a numeric amount, which conflicts with the
      product page's no-monthly-cap statement. Hotel earn is therefore documented but the narrow category
      schema cannot represent it separately.
  exclusions:
  - cash-advance
  redemption:
  - type: catalog
    program: 360 Rewards
    rate_inr_per_unit: 0.25
  source:
    url: https://www.sc.bank.in/content/dam/sc/in/credit-cards/docs/in-sc-platinum-rewards-credit-card-tcs.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/standard-chartered/platinum-rewards/product-terms-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated.multiplier
    - rewards.accelerated.effective_rate
    - rewards.redemption
  notes: The card-specific T&C excludes cash advances, fees/charges, returns, disputed, unauthorized or fraudulent
    transactions, cardholder-non-initiated transactions and charged-back transactions. It says primary and
    supplementary cardholders each have a card-level maximum without stating the amount. The product page
    calls the accelerated earn uncapped monthly; this source conflict is unresolved. Unsupported legacy
    category exclusions have been removed.

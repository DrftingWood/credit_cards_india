benefits:
- effective_from: 2026-06-18
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Primary card spend of INR 5,000 within 30 days from issue confirmation
    benefit: INR 500 voucher from a selected top brand; voucher claim link sent after qualification
    value_inr: 500
    window_days: 30
  - condition: First EMI conversion within 30 days from issue confirmation
    benefit: 5% cashback on first EMI transaction, capped at INR 1,000
    value_inr: 1000
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: null
    max_txn_inr: null
    cap_per_cycle_inr: 200
    cycle: monthly
    notes: Issuer communication confirms 1% fuel surcharge waiver up to INR 200 per
      month; eligible transaction range is not captured in the reviewed current source.
  movies:
    type: discount
    partner: District by Zomato
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 100
    notes: 25% discount up to INR 100 once per month; requires at least one purchase
      or ATM transaction in the previous calendar month.
  other:
  - name: Railway lounge access
    description: Four complimentary railway lounge visits per quarter. Spend INR 20,000 in the current calendar month to unlock access for the following month; primary and add-on cards share access.
    value_inr: null
  - name: Travel-booking bonus Reward Points
    description: 20% bonus points on hotel bookings and 10% on flight bookings through the IDFC FIRST Bank mobile app, over applicable base rewards.
    value_inr: null
  - name: Roadside assistance
    description: Up to four services per year through Global Assure, available to an active card with a purchase or ATM transaction in the previous 30 days.
    value_inr: 1399
  - name: Card liability cover
    description: Lost-card liability, counterfeit/skimming and online-fraud cover; active-card condition applies.
    value_inr: 25000
  - name: Personal accident cover
    description: Personal accident / permanent disability cover; active-card condition applies.
    value_inr: 200000
  - name: Credit shield cover
    description: Cover for qualifying card debit on accidental death.
    value_inr: 50000
  - name: Purchase protection
    description: Residential-premises fire/allied-perils and burglary protection for 60 days from purchase.
    value_inr: 25000
  - name: FIRST Digital RuPay UPI add-on
    description: Optional virtual RuPay card linked to Millennia for UPI; activation is INR 199. Separate UPI points schedule is recorded in reward notes.
    value_inr: null
  concierge: false
  source:
    url: https://www.idfcfirst.bank.in/content/dam/IDFCFirstBank/credit-cards/FIRSTMillenniaCreditCard/FIRST-Millennia-Privileges.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - benefits.other.description
    - benefits.welcome.value_inr
    - benefits.welcome.window_days
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.movies.cap_inr
    - benefits.movies.max_per_cycle
    - benefits.other.value_inr
    local_refs:
    - docs/sources/idfc-first/millennia/millennia-privileges.pdf
    - docs/sources/idfc-first/millennia/millennia-communication-may-26.pdf
    notes: Current product page and May-2026 cardmember communication also confirm
      welcome offer exclusions, movie terms, monthly fuel waiver cap and railway
      lounge threshold. Insurance table lists the above limits; travel insurance and
      personal air accident are marked unavailable. RSA value is INR 1,399 for the
      package, with up to four annual call-outs.
eligibility:
  min_age:
  max_age: null
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: >-
    The issuer's 16-Sep-2026 Millennia eligibility article says age 21+, while its
    current lifetime-free-card comparison lists age 18 for Millennia; minimum age
    is left unknown pending issuer clarification. Both sources give annual income
    of INR 300,000, but do not split salaried and self-employed thresholds. The
    comparison lists Indian residents, while general issuer guidance also says NRIs
    may apply subject to card criteria. No numeric bureau-score floor or upper age
    limit is published in the reviewed card-specific sources.

rewards:
- effective_from: 2025-10-11
  effective_until: null
  currency: cashback
  currency_name: Amazon Pay Balance
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    excluded_categories:
    - utilities
    - wallet-loads
    - government
  accelerated:
  - category: amazon-prime-shopping
    canonical_categories:
    - online
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    merchants:
    - amazon.in
    applicability_pct: 25
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - amazon-pay
    notes: 5% on Amazon.in shopping for Prime members; excludes Gold Coins and flight/hotel bookings via Amazon Pay, which have a separate travel earn rule. Gold, silver and other precious metals, tax payments, fuel and rent do not earn rewards.
  - category: amazon-nonprime-shopping
    canonical_categories:
    - online
    multiplier: 3
    effective_rate: 3
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    merchants:
    - amazon.in
    applicability_pct: 25
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - amazon-pay
    notes: 3% on Amazon.in shopping for non-Prime members; digital products and gift cards earn 2% regardless of Prime status. Gold Coins and flight/hotel bookings via Amazon Pay are excluded from this rule.
  - category: amazon-pay-eligible-categories
    canonical_categories:
    - online
    - utilities
    - telecom
    - wallet-loads
    multiplier: 2
    effective_rate: 2
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - amazon-pay
    notes: 2% on digitally fulfilled Amazon Pay categories, Login and Pay with Amazon partner transactions, and physical gift cards on Amazon.in. Includes specified digital products/gift cards regardless of Prime status; excludes rent, tax, and education.
  - category: amazon-pay-travel-prime
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - amazon-pay
    notes: 5% on flight and hotel bookings made via Amazon Pay for Prime members.
  - category: amazon-pay-travel-nonprime
    canonical_categories:
    - travel
    multiplier: 3
    effective_rate: 3
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - amazon-pay
    notes: 3% on flight and hotel bookings made via Amazon Pay for non-Prime members.
  - category: eligible-other-domestic-spend
    canonical_categories:
    - other
    multiplier: 1
    effective_rate: 1
    cap_per_cycle: unlimited
    cap_unit: cashback-inr
    cycle: monthly
    notes: 1% on otherwise eligible purchases. No reward on fuel, rent, tax, education, utilities outside Amazon, or international transactions; Amazon Pay category transactions use their separate rate.
  exclusions:
  - fuel
  - rent
  - education
  - international
  - emi
  - cash-advance
  redemption:
  - type: cashback-bank
    program: Amazon Pay
    rate_inr_per_unit: 1.0
    constraints: Automatically credited as Amazon Pay balance within 2 working days after the billing cycle; usable for partial or full payment of Amazon and Amazon Pay purchases.
  source:
    url: https://www.icici.bank.in/personal-banking/cards/credit-card/amazon-pay-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page
    confidence: high
    local_refs:

  capping_rules:
  - Base earning is 2 points per INR100 eligible retail spend; enhanced total earn is 10 points per INR100 on eligible
    dining, entertainment, grocery and international transactions, with 1,000 bonus-category points per billing
    cycle maximum.
  - Milestone points are additional to base rewards and awarded on settled eligible spend during membership year.
  - Reward points credited within 45 days of purchase settlement. Current product page illustration values 67,600
    points at INR16,900 (INR0.25 each); actual redemption value may depend on portal option.
  - Reward redemption fee INR99 + GST applies per day of redemption; no points on excluded MCC groups, EMI or cash
    transactions.
  - The issuer page prints MCC 711 under contracted services; the value is not a valid four-digit MCC, so it is
    not included in the structured MCC list pending clarification.

rewards:
- effective_from: 2026-01-18
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 5
    per_inr: 125
    unit_value_inr: 0.25
    unit_value_inr_realized: 0.25
    applies_to_categories:
    - online
    - groceries
    - dining
    - travel
    - utilities
    - telecom
    - international
    - entertainment
    - government
    - education
    - other
    notes: >-
      1X is 1 point per INR 125. Points are worth INR 0.25 each under the current LIC Select Travel & Shop terms
      and have a three-year validity from earn date. The issuer's current page/T&C states points reverse for a
      billing cycle when at least MAD is not paid by the due date.
  accelerated:

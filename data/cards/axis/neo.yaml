  notes: 1 EDGE point per INR 200. Current issuer reward T&Cs exclude utilities, education, insurance, government, wallet, rent, fuel, gift cards, bridge fees and road fees/tolls. The June 2025 NEO-specific revision also excludes utility/telecom, cash advances and repayments; cash advance is structured, repayment has no schema enum and is recorded here. Rent points are excluded up to INR 50,000/month per the card-specific revision. Point balance may be forfeited 30 days after card closure or when MAD is overdue more than 90 days. No universal point value is published.
  mcc_exclusions: []
benefits:
- effective_from: 2026-08-28
  effective_until: null
  lounge_access: null
  welcome:
  - condition: First utility bill payment within 30 days of issuance; one-time first-year offer
    benefit: 100% cashback on the first utility payment, up to INR 300; issuer lists eligible utility MCCs 4814, 4812, 4899 and 4900; cashback within 5 days
    value_inr: 300
    window_days: 30
  movies:
    type: discount
    partner: BookMyShow
    max_per_cycle: null
    cycle: monthly
    cap_inr: 100
    notes: 10% discount per transaction on direct BookMyShow site/app, capped at INR 100 per month. From 1-Nov-2026 eligibility requires INR 25,000 settled spend in the preceding 3 calendar months; new-card gate waived during issuance month plus next 3 calendar months. Only billed/settled spends count; fees, interest, reversals/refunds excluded. EMI spend counts only billed instalments. Current page provides the 10% offer; no distinct movie MCC is published.
  concierge: false
  other:
  - name: Zomato discount
    description: INR 120 off per order, twice per card per month, minimum INR 499 item total, code AXISNEO. Not available on UPI-linked NEO RuPay card; excludes GST, restaurant charges and delivery fee.
  - name: Paytm utility discount
    description: 5% off mobile recharge, broadband and DTH; min INR 299, maximum INR 150 per month, once monthly, code AXISNEO.
  - name: Blinkit discount
    description: 10% off once per card per month on minimum INR 750 transaction, maximum INR 250, code AXISNEO. Excludes milk, tobacco, cigarettes and baby needs.
  - name: Cleartrip travel discount
    description: 7% off domestic/international flights up to INR 2,000 and 18% off hotels up to INR 4,000; each once per use per month, code CTAXISNEO.
  - name: Zero lost-card liability
    description: Issuer states protection against fraudulent use from time loss is reported, subject to cardmember terms.
  - name: EMI conversion
    description: Eligible purchases exceeding INR 1,500 may be converted to EMI through the bank.
  - name: Wednesday Delight
    description: Rotating offers; current product page lists up to 15% off flights/hotels via MakeMyTrip, 10% off Swiggy and 10% off Tira up to INR 1,000. Offers vary and are not encoded as fixed savings.

eligibility:
  min_age: null
  max_age: null
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: HSBC Premier Credit Card is available only to HSBC qualified Premier customers with a Premier relationship
    in India. Current Premier qualification route is average quarterly TRB INR50 lakh, net monthly salary credit
    INR3 lakh, or mortgage relationship INR1.15 crore plus INR50 lakh TRB within 12 months; existing Premier
    accounts opened before 2026-01-01 may have a INR40 lakh TRB threshold. These are Premier banking relationship
    criteria, not a card-specific minimum-income guarantee. Card approval remains subject to bank underwriting;
    age and bureau-score cutoffs are unpublished.

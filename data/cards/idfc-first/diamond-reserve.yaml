    program: IDFC FIRST Rewards
    rate_inr_per_unit: 0.25
    fee_inr: 99
    constraints: INR 99 + GST redemption fee; points may be used toward eligible online and in-store payments.
  source:
    url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/Diamond-Reserve-Terms%26Conditions.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    local_refs:
    - docs/sources/idfc-first/diamond-reserve/diamond-reserve-privileges-2026-06-18.pdf
    - docs/sources/idfc-first/diamond-reserve/diamond-reserve-may-2026-communication.pdf
    - docs/sources/idfc-first/diamond-reserve/revised-international-rewards-notice-2026-09-13.pdf
    notes: >-
      The current Diamond Reserve FAQ and June-2026 card terms explicitly exclude
      international spends from rewards. IDFC's revised 13-Sep bank-wide notice says
      international rewards continue as applicable for each card, creating an
      unresolved broad-versus-card-specific conflict; this record follows the
      specific Diamond terms. Birthday 10X wording and redemption fee also appear
      in the current FAQ. App-booking bonuses are not scored: the May-2026 notice and
      live product page describe 20%/10% percentage bonuses, while detailed terms
      give 30/15 bonus points per INR150 and an 8,000 monthly cap; the terms' flight
      illustration is inconsistent with the rate table.
benefits:
- effective_from: 2026-06-18
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - visa
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: >-
        Two visits at Indian airport terminals (domestic and international terminals
        within India) per quarter, unlocked by at least INR 20,000 eligible spend in
        the current calendar month for access in the following month. Primary and
        add-on cards share the quota; guests/additional services may be charged.
    international:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: >-
        Two visits per quarter at select global airport terminals, with the same
        monthly spend gate and shared primary/add-on quota. Guests/additional services
        may be charged.
  insurance:
  - type: other
    sum_insured_inr: null
    conditions: >-
      Issuer currently advertises trip cancellation cover up to INR 25,000/year,
      but the linked card-specific policy ended 7-May-2026. No replacement active
      policy was located in this review, so current coverage is unresolved and this
      amount is not treated as confirmed active insurance.
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: >-
      INR 1 crore personal air accident cover. Ticket must be bought using the
      covered card, and the card must have had at least one purchase or ATM
      withdrawal in the prior 30 days; policy terms/exclusions apply.
  - type: personal-accident
    sum_insured_inr: 500000
    conditions: >-
      INR 5 lakh personal accident cover in the Aug-2026 insurer schedule; the Jan-2026
      launch announcement advertised INR10 lakh. The later schedule supersedes that
      amount. At least one purchase or ATM withdrawal
      in the prior 30 days is required; the claim is payable once across the
      cardholder's IDFC FIRST cards.
  - type: credit-shield
    sum_insured_inr: 50000
    conditions: >-
      INR 50,000 cover for eligible card debits following accidental death. The
      card must have had at least one purchase or ATM withdrawal in the prior
      30 days; detailed insurer terms apply.
  - type: lost-card-liability
    sum_insured_inr: 50000
    conditions: >-
      INR 50,000 card liability cover including lost card, counterfeit/skimming,
      phishing and online fraud. Active-card requirement and detailed terms apply.
  - type: purchase-protection
    sum_insured_inr: 50000
    coverage_duration_days: 60
    conditions: >-
      INR 50,000 purchase protection for fire/allied perils and burglary at the
      cardholder's recorded residence. Purchases must be made on the card and it
      must have been used at least once in the prior 30 days; detailed conditions apply.
  - type: baggage-loss
    sum_insured_inr: null
    sum_insured_amount: 500
    sum_insured_currency: USD
    conditions: >-
      Loss of checked-in baggage; travel ticket must be purchased using the covered
      card and active-card requirements apply.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: Flight delay cover; travel ticket must be purchased using covered card.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 100
    sum_insured_currency: USD
    conditions: Checked-in baggage delay cover; travel ticket must be purchased using covered card.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: Loss of passport and other travel documents; ticket must be purchased using covered card.
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 300
    cycle: monthly
  movies:
    type: bogo
    partner: District by Zomato
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 250
    notes: >-
      Twice per calendar month; up to INR 250 off the second ticket per transaction,
      INR 500 monthly maximum. Spend INR 20,000 in the current calendar month to
      unlock next-month use.
  welcome:
  - condition: Joining fee paid; active primary card; claim through IDFC FIRST app; merchant-specific terms apply
    benefit: Multiple claim-based brand offers advertised by issuer as worth over INR 5,000
    value_inr: null
    window_days: null
  concierge: true
  other:
  - name: Railway lounge access
    description: >-
      Four complimentary participating Indian railway lounge visits per quarter,
      shared by primary and add-on cards. At least INR 20,000 eligible spend in the
      current calendar month unlocks next-month access; a valid train ticket is required.
    value_inr: null
  - name: Roadside assistance
    description: >-
      Complimentary roadside assistance up to four times per year for active cards;
      issuer-stated value INR 1,399; exclusions and conditions apply.
    value_inr: 1399
  - name: Airport meet and greet
    description: Issuer launch announcement lists one complimentary service annually subject to annual-spend qualification; current full terms need confirmation.
    value_inr: null
  - name: Golf
    description: >-
      Up to two complimentary golf rounds or golf lessons monthly: first after
      INR 20,000 fresh statement spend, second after INR 40,000. Benefit appears
      next month and expires after 60 days. The terms do not guarantee two rounds
      and two lessons independently.
    value_inr: null
  - name: Hotel privileges
    description: >-
      Current card page advertises hotel partner privileges, including third-night
      offers and 900+ luxury hotel benefits. Current partner-specific eligibility,
      rates and offer periods vary; verify at booking.
    value_inr: null
  source:
    url: https://www.idfcfirst.bank.in/credit-card/diamond-reserve-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.domestic.spend_threshold_inr
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.lounge_access.international.spend_threshold_inr
    - benefits.insurance
    - benefits.fuel_surcharge_waiver
    - benefits.movies
    - benefits.welcome
    local_refs:
    - docs/sources/idfc-first/diamond-reserve/diamond-reserve-privileges-2026-06-18.pdf
    - docs/sources/idfc-first/diamond-reserve/diamond-reserve-may-2026-communication.pdf
    - docs/sources/idfc-first/diamond-reserve/diamond-reserve-product-guide-2025-12-12.pdf
    - docs/sources/idfc-first/diamond-reserve/insurance-privileges-2026-08-31.pdf
    notes: >-
      The current insurer schedule (Aug-2026) sets Diamond Reserve personal accident
      cover at INR500,000, superseding the INR1,000,000 figure in the Jan-2026 launch
      release; the schedule also supports the listed baggage, delay, air-accident,
      lost-card and purchase-protection covers. The June-2026 privileges document
      contains a CFAR policy that ended 7-May-2026; the current product page and
      May-2026 communication continue to advertise cover, but no replacement policy
      period was found, so active CFAR remains unresolved. Detailed card-specific
      benefits are in the linked privileges document:
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/Diamond-Reserve-Terms%26Conditions.pdf
      The issuer's general insurance page also confirms credit-shield cover, while
      the archived card-specific schedule supplies the INR50,000 limit.

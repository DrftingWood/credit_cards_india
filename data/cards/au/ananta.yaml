      - issuer-direct
      notes: A flight booking of at least INR 5,000 through AU Rewardz qualifies for lounge access in the same calendar quarter. Only primary-cardholder bookings qualify. Each one-way ticket generates one QR and a round trip generates two, with four QR visits maximum per customer per calendar quarter. Guests pay the lounge fee. Canceled/refunded bookings invalidate the QR; QR is single-entry and valid through travel date.

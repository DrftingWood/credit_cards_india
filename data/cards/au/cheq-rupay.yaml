  reward_cap: null
  capping_rules:
  - Minimum eligible transaction is INR 200; points are calculated on each INR 200
    increment, so partial increments do not earn points. Refunds/reversals reverse
    points.
  - 12% and 5% earn groups share one 12,000-point cap per statement cycle. 1% base
    and 2.5% CheQ UPI are uncapped. No points on fuel, education, gold/jewellery,
    insurance, rent, wallet reload, government-service MCCs, EMI-converted, gaming,
    or cash transactions.
  - RuPay UPI earns only when routed through CheQ App; UPI through other TPAPs earns
    zero. Base accrual is not earned on RuPay POS/ECOM purchases at partner brands
    or 5% MCCs where terms specify the base rate; the schema cannot scope base exclusions
    by transaction channel, so the generic base estimate may overstate these cases.
  redemption:
  - type: voucher
    program: CheQ Travel and gift cards
    rate_inr_per_unit: 0.5
    constraints: 2 CheQ points = INR 1; value is limited to eligible CheQ Travel or
      gift-card redemption.
  - type: other
    program: CheQ App bill payments
    rate_inr_per_unit: 0.25
    constraints: 4 CheQ points = INR 1; no cash-out or bank transfer.

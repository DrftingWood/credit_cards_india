fees:
- effective_from: '2026-05-15'
  effective_until: null
  joining_fee_inr: 1000
  annual_fee_inr: 1000
  renewal_fee_inr: 1000
  fee_waiver:
    spend_inr: 300000
    cycle: annual
    conditions: Renewal spend threshold is INR 300,000 in the anniversary year before renewal.
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.75
  cash_advance_fee:
    pct: 2.5
    min_inr: 500
  gst_applicable: true
  notes: Current HDFC fee page confirms INR 1,000 joining/renewal, INR 3 lakh renewal waiver, 3.5% foreign-currency
    markup, 3.75% monthly finance charges and cash-advance fee 2.5% or INR 500 minimum. The May-2026 notice sets
    1.75% DCC on INR transactions at overseas/foreign-registered merchants and INR 199 reissuance from 15-May-2026;
    current personal MITC dates DCC from 20-May and sets reissuance at INR 199 + GST, while the current fee-page FAQ
    separately says INR 100 reissue. Reissue amount and DCC effective date therefore conflict across issuer pages.
    Current MITC also sets a 1% rent transaction fee (cap INR 4,999/transaction), 1% fuel fee above INR 15,000 (cap
    INR 4,999/transaction), 1% wallet fee above INR 10,000/month (cap INR 4,999/month), utility fee above INR 50,000/
    month, third-party education-app fee, and 1% balance-transfer fee or INR 250 minimum. These transaction charges,
    DCC and reissuance are not separately modeled. The 15-May effective date is the product-update date, not
    independently confirmed as the start date of all listed membership fees.
  source:
    url: https://www.hdfc.bank.in/credit-cards/diners-privilege-credit-card/fees-and-charges
    retrieved_on: '2026-10-27'
    type: issuer-page

  capping_rules:
  - Shopping, Dining and Travel earning has a separate 5,000-point statement-cycle cap; total Reward Points are separately capped at 25,000 per statement cycle.
  - The current Ananta page also excludes BBPS, transportation and quasi-cash transactions. The schema has no dedicated exclusions for BBPS, transportation or quasi-cash, so transaction-level classification is not inferred from broad spend categories.
  - Fuel, cash and non-retail spends do not count toward anniversary milestones. The exact MCCs for Shopping/Dining/Travel are not published on the card page; broad category scoring uses only the available spend-profile proxies.
  - Points are valid for 2 years from accrual; the issuer agreement also says points may be forfeited after 12 months without card use, on account closure, or after delinquency over 90 days.

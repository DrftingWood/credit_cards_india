rewards:
- effective_from: '2019-11-26'
  effective_until: '2026-03-31'
  currency: points
  currency_name: Club Vistara Points; migrated to Maharaja Points
  base:
    rate: 3
    per_inr: 200
    unit_value_inr: null
    unit_value_inr_realized: null
  exclusions:
  - wallet-loads
  - rent
  - government
  - emi
  - cash-advance
  - other
  mcc_exclusions:
  - '6513'
  - '6540'
  - '6541'
  - '9399'
  - '9311'
  redemption:
  - type: airmiles
    program: Air India Maharaja Club
    ratio: '1:1'
    constraints: Club Vistara balances were migrated to linked Maharaja Club accounts at 1:1 after 12-Nov-2024.
      This migration does not establish a fixed cash value or general card-points transfer option.
  notes: 'SBI card T&C: 3 CV Points for every INR200 on eligible spend; points have no cash or monetary value. Excludes
    balance transfers, cash advances, financial charges, disputed transactions, Flexipay, merchant EMI, e-wallet
    loads (MCC 6540/6541), rent (6513 from 15-Apr-2024), government transactions (9399/9311 from 15-Jul-2024). Air
    India confirms outstanding balances transferred 1:1 to Maharaja Points after 12-Nov-2024. Air India says existing
    co-brand cardholders continued current benefits to 31-Mar-2026; continuation of 3/INR200 accrual after 12-Nov-2024
    is inferred from the continued card-program terms, since no post-merger SBI rate table was found. CV Points
    were valid 36 months; migrated balances were guaranteed at least one year from migration.'
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/media/images/personal/credit-cards/travel/club-vistara-SBI-Card-PRIME/club-vistara-tnc.pdf

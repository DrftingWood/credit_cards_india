    - docs/sources/idfc-first/wealth/travel-rewards-terms-retrieved-2026-10-26.pdf
  notes: "Airport lounges and golf privileges changed effective 2026-04-01: one domestic (India) and one global visit per quarter, with INR20,000 current-calendar-month spend activating the following month; airport benefit shared with add-on cards. Railway lounge FAQ and privilege PDF conflict on quota (4 annually vs up to 4 quarterly); current terms otherwise say the same monthly spend activates next month. Movie BOGO requires INR20,000 spend in prior month since 2026-06-18. Fuel-waiver fee guide states 1% for INR200-INR5,000 transactions, monthly maximum INR300. The current card page still inconsistently advertises international rewards after stating that international purchases earn no points effective 2026-10-26."

    reward_units: 1000
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
    is_repeatable: true
  insurance:
  - type: air-accident
    sum_insured_inr: 5000000
    conditions: AU advertises up to INR 50 lakh. Generic AU insurance terms require an active card and an airline ticket purchased using an AU credit card; passenger-only coverage and policy exclusions apply.
  - type: lost-card-liability
    sum_insured_inr: null
    conditions: Vetta page advertises zero liability for fraudulent transactions on a lost card after the loss is reported to AU; reporting and policy terms apply.
  other:
  - name: Railway lounge access
    description: 2 complimentary railway lounge visits per calendar quarter; add-on cardholders can use the shared complimentary visits.
  - name: Quarterly and yearly milestone benefits
    description: AU advertises quarterly and yearly milestone benefits but publishes no qualifying spend thresholds or award details in accessible current Vetta page text; not modeled.
  - name: Xpress EMI
    description: EMI conversion is available on eligible transactions of INR 2,000 or more; tenures are selected by the cardholder. Processing fees and complete eligibility conditions are not stated on the Vetta page.
  - name: Contactless usage
    description: Pin-free payments at participating merchants up to INR 5,000.
  - name: Add-on cards
    description: AU advertises free add-on cards; quantity and eligibility conditions are not detailed on the Vetta page.
  - name: Curated offers and priority support
    description: Current page advertises selected ITC Hotels, Elivaas and Visa offers and priority customer support; offer terms and availability can vary.

id: sbi-irctc-platinum
name: IRCTC SBI Platinum Card
issuer: sbi
network: visa
network_tier: null
tier: entry
card_type: credit
co_brand:
  partner: IRCTC
  category: railway
  partner_website: https://www.irctc.co.in
status: active
launched_on: null
discontinued_on: null

fees:
  - effective_from: 2018-01-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 500
    renewal_fee_inr: 500
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    supplementary_card_fee_inr: 0
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-sbi-platinum-card.html
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2018-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    redemption_scope: closed-loop
    ecosystem_label: IRCTC
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 125
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 10
        card_attributable_rate: 10
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "Up to 10% value back (as reward points) on AC1/AC2/AC3/Executive Chair Car/Chair Car bookings via IRCTC app and website."
    exclusions:
      - fuel
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-sbi-platinum-card.html
      retrieved_on: '2026-07-05'
      notes: "Closed-loop: IRCTC rewards redeem only within the IRCTC ecosystem (not cash/transfer). Valued at full in-ecosystem face Rs1.0; realized set = face and redemption_scope=closed-loop so the UI shows an ecosystem-only badge instead of an arbitrary haircut (was realized 0.9). | prior: Aligned with sbi/irctc-premier 2026-07-05: IRCTC AC-rail points ~Rs1 nominal, realized ~0.9 for a rail user (was 0.5)."

      confidence: medium
    mcc_exclusions: ['6513']
    redemption:
      - type: voucher
        program: IRCTC AC-class fare
        rate_inr_per_unit: 1.0
        constraints: Rs1/pt against AC-class IRCTC rail fare only (link to IRCTC ID); closed-loop, no cash.
benefits:
  - effective_from: 2018-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [issuer-direct]
        notes: "Complimentary railway lounge access (not airport lounges); max 1 per quarter, primary cardholder only."
    milestones:
      - spend_inr: 0
        cycle: annual
        benefit: "500 Reward Points on payment of renewal fee"
        value_inr: 500
        reward_kind: points
        reward_units: 500
        reward_currency_name: Reward Points
        trigger_window: anniversary-year
    welcome:
      - condition: "Single transaction of Rs.500 or more within 60 days of card issuance"
        benefit: "350 activation bonus Reward Points"
        value_inr: 350
        window_days: 60
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: statement
    other:
      - name: Travel offers from IRCTC
        description: "Discounted airline tickets and tailor-made holiday packages via IRCTC."
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-sbi-platinum-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 300000
    self_employed: 300000
  credit_score_min: 700
  residency: resident-indian

application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/irctc-sbi-platinum-card.html

metadata:
  last_verified_on: '2026-07-05'
  tags: [co-branded, railway, irctc, travel, points, entry]

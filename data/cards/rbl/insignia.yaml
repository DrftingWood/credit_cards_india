  notes: Standard Insignia Preferred Banking card fee is INR7,000 + GST, waived
    for subsequent membership years after INR10 lakh eligible spend in the
    preceding membership year. Schedule of Charges also states NIL fee for
    Insignia Banking customers; the welcome offer and spend waiver do not apply
    to those NIL-fee customers. Central MITC lists up to 3.99% monthly finance
    and 2.5% cash advance/min INR500; MITC lists 1.5% forex for Insignia. Values
    represent standard Preferred Banking card; customer-segment fee exception
    documented.

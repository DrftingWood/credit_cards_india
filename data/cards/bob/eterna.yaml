    notes: Accelerated earn applies to e-commerce online-flag transactions, international-flag transactions, dining
      MCC 5812, and travel MCC 4722. Points under ₹100 do not earn; fuel earns no points; UPI receives core points
      only. Utility MCC 4900 earns core points but is not accelerated. Eterna points do not expire by age, but
      points carried over from a prior card keep their former expiry; card closure, NPA, delinquency over 90 days,
      settlement, fraud, death, 365 days' inactivity, or failure to activate a replacement card within six months
      can forfeit points. Refunds/reversals reduce earned points.
      A 1,000-point statement-redemption minimum applies. BOBCARD SmartDeal adds 12 points/₹100 on flights and
      30 points/₹100 on hotels booked in the logged-in app/portal. Catalog redemption is not valued here because
      the issuer page confirms ₹0.25 specifically for cashback/statement credit.
benefits:
- effective_from: 2026-07-15
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: quarterly
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      guests_per_visit: null
      notes: Unlimited visits require at least INR 75,000 spend in the preceding calendar quarter, effective 15-Jul-2026.
  milestones:
  - spend_inr: 50000
    cycle: annual
    benefit: 10,000 bonus Reward Points after INR 50,000 eligible settled spend within 60 days of issuance; points credited within 30 days after the offer window.

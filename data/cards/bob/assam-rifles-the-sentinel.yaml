benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: null
      via:
      - rupay
      spend_threshold_inr: 20000
      spend_threshold_cycle: quarterly
      notes: Two domestic visits per quarter; requires INR 20,000 net eligible settled
        spend in the preceding calendar quarter. Fresh-card issue-quarter spend gate
        is waived; upgrades are excluded from this waiver.
  welcome:
  - condition: Spend INR 5,000 or more within 60 days of card issuance
    benefit: 500 bonus BOBCARD Reward Points
    value_inr: 125
    window_days: 60
  milestones:
  - spend_inr: 100000
    cycle: annual
    benefit: 12-month Amazon Prime membership on spending at least INR 100,000 within
      90 days of issuance; activation code is delivered after milestone and is time
      limited.
    reward_kind: other
    trigger_window: first-year
    is_repeatable: false
  insurance:
  - type: personal-accident
    sum_insured_inr: 2000000
    conditions: Personal accidental-death cover for air/non-air accidents; product
      page states INR 20 lakh. Full insurance conditions not verified.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
    notes: 1% waiver on INR 400-5,000 fuel transactions up to INR 250 per statement;
      GST on surcharge is not reversed. Fuel earns no reward points.
  other:
  - name: FITPASS PRO
    description: 12-month membership for primary cards issued on or after 1-Aug-2026;
      code is sent to registered email within 30 days.
  - name: Smart EMI
    description: Eligible purchases above INR 2,500 may be converted to 6-48 month
      EMIs; charges apply.
  - name: RuPay concierge
    description: 24/7 domestic and international booking/scheduling assistance powered
      by RuPay; booked services are paid by cardholder.
  - name: Add-on cards
    description: Up to three lifetime-free add-on cards for spouse, parents, siblings
      or children above 18.
  - name: Lost-card liability
    description: Issuer advertises zero liability on fraudulent transactions after
      immediate loss reporting; detailed conditions apply.
  - name: Network representation
    description: The dedicated and universal issuer application forms list The Sentinel
      under RuPay; no network tier is established.

        benefit: "E-voucher for renewal of Paytm First Membership on annual retail spends of Rs. 1 Lakh."
        reward_kind: voucher
        trigger_window: anniversary-year
    welcome:
      - condition: "Card issued"
        benefit: "Complimentary Paytm First Membership."
    insurance:

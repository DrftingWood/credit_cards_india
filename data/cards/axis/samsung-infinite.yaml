  concierge: null
  other:
  - name: Samsung purchase cashback
    description: 10% cashback on Samsung purchases (full-swipe or EMI), capped at INR 5,000 per month and INR 20,000
      per year. Flipkart channel excluded from 20-12-2024; Current published Axis campaign terms include Amazon; no current primary-source support was found for a 01-Jan-2026 Amazon exclusion, so that unsupported exclusion is removed.
  - name: Complimentary Priority Pass membership
    description: Complimentary Priority Pass membership advertised as worth USD 99. Current card page lists six complimentary international visits; the linked archived terms state six complimentary plus six additional visits annually. Guest and excess visits are chargeable; the quota conflict remains unresolved.

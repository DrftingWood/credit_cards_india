  - '8249'
  - '8211'
  - '8241'
  - '8299'
  - '6011'
  - '6010'
  - '5960'
  capping_rules:
  - Reward rate is 1 point per INR100 eligible offline spend and 5 points per INR100 eligible online spend; points
    post within 60 days of settlement.
  - Current issuer page states redemption value up to INR0.20 per point; a redemption fee of INR99 + GST applies
    per the current schedule of charges.
  - Reward points are not awarded on excluded MCCs, cash withdrawals or EMI; issuer terms list category/MCC exclusions
    effective 15-Oct-2024.
  redemption:
  - type: catalog
    program: RBL Rewards
    rate_inr_per_unit: 0.2
    constraints: Current issuer page says redeem up to INR0.20 per point; INR99 + GST redemption fee per schedule
      of charges.
  - type: statement-credit
    program: RBL Rewards
    rate_inr_per_unit: 0.2
    constraints: Current issuer page states up to INR0.20 per point; actual realization can vary by redemption option.
  source:
    url: https://webassets.rbl.bank.in/document/credit-cards/terms-conditions-cookies.pdf
    retrieved_on: '2026-10-26'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    local_refs:
    - docs/sources/rbl/cookies/cookies-terms-retrieved-2026-10-26.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated.multiplier
    - rewards.accelerated.effective_rate
    - rewards.exclusions
    - rewards.mcc_exclusions
    - rewards.redemption
    notes: Card T&Cs specify 5/INR100 online and 1/INR100 offline. Redemption value is up to INR0.20 per point;
      RBL Rewards redemption fee is separate.
benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Make an eligible transaction within 30 days of card issuance and pay first month membership fee by
      due date
    benefit: INR1,000 voucher from Amazon, Flipkart, Myntra, Croma or Shoppers Stop; delivered within 90 days of
      issuance
    value_inr: 1000
    window_days: 30
  milestones:
  - spend_inr: 200000
    cycle: annual
    benefit: INR1,000 voucher at eligible spend of INR2 lakh in membership year
    value_inr: 1000
    reward_kind: voucher
    trigger_window: anniversary-year
    is_repeatable: true
    max_awards_per_cycle: 1
  - spend_inr: 500000
    cycle: annual
    benefit: INR5,000 voucher at eligible spend of INR5 lakh in membership year
    value_inr: 5000
    reward_kind: voucher
    trigger_window: anniversary-year
    is_repeatable: true
    max_awards_per_cycle: 1
  other:
  - name: 10% cashback at Myntra, Uber and Zomato
    description: 10% cashback on settled purchases over INR100, capped at INR300 per merchant per calendar month
      (INR900 aggregate); credited to statement within 60 days.
  - name: BookMyShow movie discount
    description: 10% instant discount on one eligible movie booking per calendar month, capped at INR300; primary
      card only.
  - name: Monthly membership fee waiver
    description: INR100 + GST subsequent-month membership fee waived after at least INR5,000 eligible settled spend
      in the previous calendar month.
  fuel_surcharge_waiver:
    pct: null
    min_txn_inr: 500
    max_txn_inr: 4000
    cap_per_cycle_inr: 150
    cycle: monthly
    notes: Eligible fuel surcharge is first charged then reversed; max INR150 monthly. GST on fuel purchase/surcharge
      is not reversed; fuel transaction surcharge waived from qualifying transaction only.
  concierge: null
  source:
    url: https://www.rbl.bank.in/personal-banking/cards/credit-cards/cookies-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high
    method: rendered-page

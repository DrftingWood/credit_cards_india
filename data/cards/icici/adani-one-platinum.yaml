    min_txn_inr:
    max_txn_inr: 4000
    cap_per_cycle_inr:
    cycle: monthly
    notes: 1% waiver on fuel transactions up to INR4,000 transaction value;
      issuer does not publish a monthly rupee cap.
  concierge:
  other:
  - name: Premium lounge upgrades
    description: 2 premium lounge upgrades per quarter at Adani-managed and
      operated airports; 8 annually. Subject to lounge admission terms.
  - name: Valet parking
    description: 2 voucher-linked valet parking services per year at
      Adani-managed airports, on card activation.
  - name: Premium car parking
    description: 2 voucher-linked premium car parking services per year at
      Adani-managed airports, on card activation.
  - name: Porter services
    description: 2 services for each INR100,000 annual spend, up to 4 per year
      (through INR200,000 spend).

    canonical_categories:
    - other
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  capping_rules:
  - UPI NeuCoins total across eligible UPI transactions is capped at 500 per calendar
    month; 0.25% from HDFC on any UPI ID plus 0.75% posted by Tata Neu for Tata Neu
    UPI ID payments.
  - 2% partner Tata Brand earn has brand-specific monthly and annual eligible-spend
    ceilings in the current card reward and redemption program; do not apply a single
    shared rule-level cap.
  - 'Other published caps: grocery 1,000 NeuCoins/month; insurance 2,000/month; utility
    2,000/calendar month; telecom and cable 2,000/calendar month.'
  - No NeuCoins on fuel, wallet/gift/prepaid/voucher loads, cash advance, outstanding
    balance, card fees, Smart EMI/Dial-an-EMI, rent, government payments, third-party-app
    education payments (direct school/college website or POS may earn), or online
    skill-based gaming MCC 5816.

        sum_insured_inr: 100000
        conditions: "Cyber Fraud Insurance cover of Rs. 1,00,000."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: statement
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/paytm-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high


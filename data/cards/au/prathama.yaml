    notes: >-
      Current FAQ says 1 point/INR 100 on other eligible spend and 2/INR 100 on contactless. Fuel, EMI, cash/cash-like,
      rent, transportation, education and government payments excluded. Point value is modeled at the general AU
      Rewardz catalog proxy and may vary by redemption. Issuer FAQ describes 2 RP/INR 100 rate
      on incremental spend after INR 5,000 statement-cycle spend; member agreement section 23.5.2 describes 2 RP/INR 100 after crossing INR 5,000 and
      a 1,000-point total cycle cap. Schema cannot establish whether this threshold rate stacks with contactless; threshold
      behavior is kept as a milestone note and not modeled as a second accelerator to avoid double counting. General
      AU Rewardz terms value a point at 0.25 paise (INR 0.0025) outside e-vouchers, which are 0.20 paise (INR 0.002); see https://www.au.bank.in/personal-banking/credit-cards.
      The card-member agreement also sets a INR 99 + GST redemption fee and 200-point minimum: https://www.au.bank.in/credit-cards/credit-card-member-agreement.pdf.
  capping_rules:
  - Prathama earns at most 1,000 Reward Points across all earn categories per statement cycle per section 23.5.2 of the current AU Card Member Agreement; this card-specific cap is lower than the generic 25,000-point table.
  - The separate threshold language after INR 5,000 and contactless earn may overlap; the issuer does not state
    whether they stack.

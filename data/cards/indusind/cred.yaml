  notes: 'Issuer page distinguishes earning from redemption: 1 CRED point per INR100 base; e-commerce and qualifying online CRED/UPI transactions earn 5% points, capped at 5,000 points per statement cycle. CRED Scan & Pay earns uncapped 1%; CRED app utility/insurance payments earn 1%, while utility/insurance outside CRED earn zero. Other eligible transactions, international transactions, and travel/gift card purchases outside CRED earn 1%. 1 point is worth INR1 for CRED flights/hotels, Store and eligible CRED Pay; 1 point is worth INR0.50 for bill and utility payments. The displayed overview says “5% on CRED transactions” broadly, while the detailed table and notes specify categories; detailed table governs.'

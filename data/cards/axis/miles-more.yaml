      notes: Four domestic Mastercard lounge visits per quarter, subject to INR50,000 eligible card spend in the previous three calendar months. For new cards, the spend test is waived in the issuance month and following three calendar months. Lounge availability is subject to the current participating-lounge list.
    international:
      visits_per_cycle: 2
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Two complimentary Priority Pass visits per card membership year for the primary cardholder only; guests are chargeable. This allowance is separate from domestic Mastercard visits.

  effective_until: null
  joining_fee_inr: 500
  annual_fee_inr: 500
  fee_waiver:
    spend_inr: 150000
    cycle: annual
    conditions: Renewal fee waived on spends of INR 150,000 or more before renewal date; excludes Cash on Call,
      Balance Transfer and Cash Withdrawal.
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.75
  cash_advance_fee:

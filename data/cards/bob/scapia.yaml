    notes: Cardholder terms specify unlimited domestic lounge access after
      INR20,000 in a billing cycle plus monthly activity. Fuel waiver is 1% up
      to INR5,000, max INR500/month. Airport privilege caps and international
      booking gate are stated on the product page and cardholder terms.
      Effective date is not stated; 2026-10-26 is this verification snapshot.
  other:
  - name: Domestic airport privileges
    description: At eligible domestic airport outlets, Scapia Coins equal to
      eligible spend are credited, capped at 5,000 coins in Delhi, Mumbai,
      Bengaluru, Chennai, Kolkata and Hyderabad, and 2,500 coins elsewhere. The
      current coin value makes the upper cap INR1,000 in those six cities and
      INR500 elsewhere.
    value_inr: 1000
  - name: International airport privileges
    description: Up to INR2,000 in privileges at international terminals for
      international bookings above INR50,000 made on the Scapia app.
    value_inr: 2000

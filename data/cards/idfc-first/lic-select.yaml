    description: 4 complimentary visits per calendar quarter at participating Indian railway lounges through DreamFolks; shared with add-on cards. Cardholder needs a valid train ticket; one guest may use a visit quota.
  - name: Roadside assistance
    description: Up to 4 complimentary roadside-assistance services per year through Global Assure; towing/parts/service terms and coverage areas apply.

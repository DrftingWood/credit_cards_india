    notes: Current product terms and product page differ on point-credit timing
      (60 days in T&Cs; 45 days on product page). “One month” in the T&Cs is a
      card billing cycle, while the product page describes the cap in monthly
      terms; exact cap-cycle basis remains ambiguous. Product page states points
      are redeemable for up to INR0.25 each, but the schema's fixed unit-value
      fields are left blank because this is a maximum and actual redemption
      varies by option. Reward exclusions also include railways, quasi-cash,
      contracted services, cash, Bills2Pay, miscellaneous transactions, fees,
      charges and GST; EMI conversion is excluded. Generic RBL reward terms
      impose INR99 plus GST per redemption request and points expire after 24
      months. Current card/network pages conflict over RuPay availability.

  notes: Base 4 points per INR150 on eligible online/offline/international spends. One point per INR150 on utility, railway, FASTag and insurance. Digital RuPay UPI earns 3 points per INR150 above INR2,000 and 1 point at/below INR2,000; 1 point per INR150 on listed utility/railway/FASTag/insurance regardless of transaction size. No points on fuel, EMI or cash withdrawal; transactions below INR150 do not earn points. Rewards accrue only up to the credit limit per cycle; points can be reversed if MAD is unpaid by due date. Points never expire. The travel-bonus UI copy uses percentages but examples specify the amount of bonus points per INR100; the modeled total rates are calculated from those examples, with medium confidence due to wording ambiguity.

  gst_applicable: true
  notes: >-
    Current card page states the INR 499 first-year membership fee is reversed after INR 5,000 spend within one month
    of setup, and INR 499 renewal fee is reversed after INR 50,000 spend in the preceding 12 months. Current MITC
    sets the cash-advance charge at 2.5% or INR 650, whichever is higher, effective 15-Jun-2026; finance is 3.99%
    monthly for standard ACE and forex is 3.5% effective 15-Jun-2026. The separately issued FD-backed variant has
    2.49% monthly finance and is not represented here. General MITC also sets fees on high utility, rent, fuel,
    education, toll and railway transactions; see issuer terms for thresholds and conditions.

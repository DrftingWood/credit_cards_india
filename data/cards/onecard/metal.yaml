- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: OneCard Reward Points
  base:
    rate: 1
    per_inr: 50
    unit_value_inr: null
    unit_value_inr_realized: null
    notes: Current BOBCARD, CSB, Federal and South Indian Bank OneCard terms list 1 point per INR50 and fractional points. OneCard's public generic FAQ does not publish the base rate; bank-issued reward terms can vary.
  accelerated:
  - category: top two monthly spending categories
    multiplier: 5
    effective_rate: 5
    cap_unit: points
    cycle: monthly
    notes: The OneCard FAQ and partner-bank terms advertise 5x on the top two monthly spend categories. Bank terms reviewed require at least INR750 spend in each of three categories; bonus points post on the 10th of the following month. Categories are auto-assigned from MCC/network or issuer mapping and aren't a fixed pair.
  exclusions:

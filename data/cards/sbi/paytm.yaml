  category: other
status: active
launched_on: 2020-11-04
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 499
    annual_fee_inr: 499
    renewal_fee_inr: 499
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    supplementary_card_fee_inr: 0
    source:

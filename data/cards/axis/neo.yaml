  notes: 'Standard joining fee is INR 250; first-year annual fee is nil and INR 250 is charged from year two. Lifetime-free fees are available through select channels, whose eligibility is not published on the card page. Add-on fees nil. Finance 3.75% monthly (55.55% p.a.); cash advance 2.5% (min INR 500); forex 3.5%. Current product schedule also lists INR 175 cash payment, replacement nil, duplicate statement/charge slip/outstation cheque waived, mobile alerts free, hotlisting nil, balance enquiry waived, 2.5% overlimit (min INR 500), cheque/auto-debit reversal 2% (min INR 500), railway surcharge as prescribed, and reward redemption fee (amount unspecified). DCC revised from 1.5% to 3.5% plus tax effective 28-Aug-2026. Late fee from the same revision: nil below INR 500, INR 500 for INR 501-5,000, INR 750 for INR 5,001-10,000, INR 1,200 for INR 10,001-50,000, INR 1,300 above INR 50,000, plus INR 100 after two consecutive missed MAD cycles until cleared. Exactly INR 500 is not assigned. Payment allocation order: fees/taxes, EMIs, interest, purchases, then cash advances. Other transaction fees: rent 1% per transaction; third-party education 1%; wallet 1% at cumulative INR 10,000 per statement; fuel 1% at INR 50,000 per statement; utility 1% at INR 25,000 per statement; online skill gaming 1% at INR 10,000 per statement. Network selection may vary; current record does not assume Visa or RuPay.'

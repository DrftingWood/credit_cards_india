benefits:
- effective_from: 2025-01-01
  effective_until: null
  lounge_access: null
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: null
    max_txn_inr: null
    cap_per_cycle_inr: 450
    cycle: monthly
    notes: Current MITC v1.2 states 1% of eligible fuel transaction amounts, capped at INR 450/month and INR 5,400/year; GST on the surcharge is not reversed. Transaction thresholds are not stated in the accessible current issuer terms.
  concierge: null
  other:
  - name: Luxury memberships
    description: >-
      The current issuer MITC/agreement describes third-party luxury memberships, conditional on joining/annual fee
      payment or spend milestones: INR 120,000 in the first 3 months for year 1, then INR 480,000 annually from year 2
      (effective 24-Nov-2025). The accessible current terms do not name the membership brands or establish their
      specific benefit values; older product-page claims naming Club Marriott and EazyDiner remain unconfirmed.
  - name: Complimentary insurance covers
    description: >-
      Issuer insurance document lists air accident death cover up to INR 1 crore (air tickets must be purchased using an
      Equitas credit card), credit shield up to the credit limit or INR 8 lakh, whichever is higher, and lost card
      liability up to INR 10 lakh for the primary cardholder. The linked insurer wording limits air-accident cover to
      accidental death, requires death within 365 days of the covered accident, and requires claim documents within 30
      days. Cover is after card activation and for the primary cardholder only. Exact policy-schedule limits and other
      exclusions remain subject to the insurer certificate; see the 2026-11-01 policy review.
  source:
    url: https://equitas.bank.in/strapi-dev/uploads/MITC_V1_2_Track_change_8ed95eca57.pdf
    retrieved_on: 2026-11-01
    type: issuer-pdf
    confidence: medium
    fields_verified:

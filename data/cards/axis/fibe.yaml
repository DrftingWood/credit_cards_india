    - rewards[0].accelerated[0].cap_per_cycle
    - rewards[0].reward_cap.max_units
    - rewards[0].exclusions
    - rewards[0].redemption
    notes: Current cashback T&C PDF version 7cc42032_3 reviewed 2026-10-27. It specifies rates, eligible MCCs, transaction minimum, UPI limits, cap, reversal/EMI behavior, rounding and posting. The PDF does not state its effective date; the existing recorded effective-from date is retained.
benefits:
- effective_from: 2024-05-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 1
      cycle: quarterly
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      guests_per_visit: 0
      notes: One visit per quarter; at least INR 50,000 eligible settled spend in the previous three calendar months is required. Newly issued cards receive a waiver during the issuance month and following three calendar months. Lounge access is for the cardholder only; nominal network validation swipe charges may apply.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 400
    cycle: monthly
    notes: On certain transactions the surcharge may be INR 10 plus GST rather than 1% plus GST; GST charged on the surcharge is not refundable.
  concierge: false
  other:
  - name: Wednesday Delight
    description: Current issuer page lists up to 15% off MakeMyTrip flights/hotels, 10% off Swiggy orders, and 10% off Tira up to INR 1,000; merchant offer terms apply.
    value_inr: null
  dining:
    program: Axis Bank Dining Delights
    discount_pct: null
    notes: Current card page advertises the program and links general EazyDiner terms; no fixed card-specific discount rate is published on the page.
  source:

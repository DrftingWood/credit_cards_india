    cycle: monthly
    notes: 1% surcharge waiver at petrol pumps; max transaction INR 4,000 and eligible fuel spend capped at INR 50,000 per statement cycle per current ICICI MITC. GST on surcharge may not be reversed on off-us terminals.
  concierge: null
  other:

  capping_rules:
  - Card-wide maximum is 5,000 YES Rewardz points per statement cycle.
  - Utility MCC 4900 earning is capped at 150 points per statement cycle.
  - UPI transactions do not earn points effective 15-Jun-2026.
  - Effective 15-Jun-2026, issuer terms exclude rent, wallet, fuel, government and marketing/advertising, cash withdrawals, post-purchase/instant EMI, insurance, education, railways, toll, ferry and jewellery transactions from points.

benefits:
- effective_from: '2026-10-27'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Two complimentary IRCTC executive railway lounge visits per
        calendar quarter; primary cardholder only, must present valid card and
        train ticket; select lounges subject to availability. INR2 RuPay or
        INR25 Mastercard validation charge applies.
  fuel_surcharge_waiver:
  other:
  - name: Train ticket cancellation protection
    description: Up to INR5,000 reimbursement for eligible domestic
      confirmed/RAC train-ticket cancellation close to departure and qualifying
      alternative train rebooking. One claim per 6 months, up to three claim
      attempts. Ticket/cardholder/claim timing, eligible class and other
      detailed conditions apply.
    value_inr: 5000
  - name: IRCTC transaction charge waiver
    description: 1% transaction charge on IRCTC train ticket bookings up to
      INR5,000 transaction amount, with maximum reversal INR200/month; shown in
      the following statement. Cancellation may reverse the waiver.
    value_inr: 200
  concierge: false
  source:
    url:

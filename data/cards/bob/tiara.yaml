    notes: Product page confirms INR2,499 joining/annual fees, INR25,000 joining waiver spend in first 60 days, INR250,000 annual waiver spend, and 2% forex. BOBCARD's 15-Jul-2026 revision notice raises Tiara's monthly finance charge from 3.25% to 3.75%; the archived generic issuer MITC (document version 1.6, July 2025) lists cash advance at 2.5% or INR500 minimum. The issuer's current MITC index lists a 2026 edition, but that newer PDF could not be retrieved for this review; the cash advance fee retains the last locally verifiable issuer term. Finance charge effective date is 2026-07-15; fee effective_from here is the 2026-10-26 verification snapshot. All fees/charges are GST-applicable.

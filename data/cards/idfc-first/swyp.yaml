  notes: 'SWYP is a pay-in-full or EMI-conversion card; standard revolving finance is not applicable. EMI conversion has a dynamic flat monthly fee depending on amount/tenure; merchant EMI has merchant-set interest and processing fees. Cash-advance fee is flat INR199 + GST per transaction, irrespective of amount, not representable by the percentage/minimum fee schema. Joining fee is waived after the first successful SWYP referral; not a spend waiver. Annual fee is INR499, with a separate 2,000-point (INR500 nominal) reward after INR5,000 spend within 45 days of annual-fee levy. Prior to 2026-09-17, forex markup was 3.5%.'

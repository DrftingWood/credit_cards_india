    cap_per_cycle: 5000
    cap_unit: points
    cycle: statement
    notes: Eligible dining MCC 5812, travel MCC 4722 and international transactions earn 15 points per INR100; subsequent eligible spend earns the core rate after the 5,000-point statement-cycle cap.

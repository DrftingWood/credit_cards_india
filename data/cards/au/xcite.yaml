    notes: AU's current page advertises 2X Reward Points on retail spend from the 1st to 5th of each month but does not state the base/category earn rate, so no absolute rate is modeled. AU's generic page states ordinary point value is 0.25 paise; e-vouchers are 0.20 paise.

fees:
- effective_from: 2024-07-01
  effective_until: null
  joining_fee_inr: 3000
  annual_fee_inr: 3000
  fee_waiver: null
  forex_markup_pct: 3.5
  finance_charge_monthly_pct: 3.75
  cash_advance_fee:
    pct: 2.5
    min_inr: 500
  gst_applicable: true
  notes: Current issuer page lists DCC markup 3.5% plus taxes (separate from 3.5% non-DCC forex markup); additional transaction charges are 1% on each rent transaction, 1% wallet load fee once cumulative wallet spend reaches INR 10,000 per statement, 1% fuel transaction fee at INR 50,000 cumulative per statement, 1% education fee through third-party apps, 1% utility fee at INR 25,000 cumulative per statement, and 1% online skill-gaming fee at INR 10,000 cumulative per statement. These conditional fees are not individually modeled by the current fee schema.
  source:
    url: https://www.axis.bank.in/cards/credit-card/axis-horizon-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/axis/_shared/mitc-credit-cards.pdf
    - docs/sources/axis/horizon/terms-and-conditions-horizon-2026-10-27.pdf
    - docs/sources/axis/horizon/revision-terms-and-conditions-horizon-2026-10-27.pdf
    fields_verified:
    - fees.joining_fee_inr
    - fees.annual_fee_inr
    - fees.finance_charge_monthly_pct
    - fees.forex_markup_pct
    - fees.cash_advance_fee.pct
    - fees.cash_advance_fee.min_inr
    notes: Standard fee is INR 3,000 plus GST. NIL joining and annual fees are currently offered to customers with a Burgundy Savings Account opened on or after 1-Jul-2026, subject to the one-LTF-card limit, exclusions for existing LTF Select/Magnus/Horizon holders, relationship maintenance, and bank discretion. Published late-fee thresholds conflict for INR 50,000 exactly, and the generic schedule was not normalized into this card's fixed fee fields.
rewards:
- effective_from: 2024-07-01
  effective_until: null
  currency: miles
  currency_name: EDGE Miles
  base:
    rate: 2
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: null
  accelerated:
  - category: travel-edge-portal
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: unlimited
    cap_unit: miles
    cycle: monthly
    channel:
      required: false
      class: issuer-portal
      merchants:
      - edge-travel
    notes: 5 EDGE Miles per INR 100 on the Axis Travel EDGE website and direct airline purchases at airline websites, counters or helplines (MCC identified). Online travel agencies and agents earn the 2-mile base rate.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - insurance-premiums
  - utilities
  - telecom
  - road-fees-and-tolls
  - education
  - gift-cards
  redemption:
  - type: airmiles
    program: Multiple (EDGE Miles transfer)
    ratio: dynamic
    constraints: Current Axis transfer program uses partner-specific ratios and lists a 500,000 EDGE Miles annual cap per Customer ID, split into 100,000 Group A and 400,000 Group B. Minimum transfer is 500 EDGE Miles. Partner roster and ratios are subject to change; check current Axis Miles Transfer terms before redemption.
    rate_inr_per_unit: null
  - type: catalog
    program: Axis Travel EDGE
    rate_inr_per_unit: 1.0
    constraints: The issuer value chart illustrates 1 EDGE Mile = INR 1 for Travel EDGE bookings; the chart is illustrative and does not establish a guaranteed minimum redemption value.
  source:
    url: https://www.axis.bank.in/cards/credit-card/axis-horizon-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.redemption.airmiles.constraints
    - rewards.base.unit_value_inr
    - rewards.redemption.catalog.rate_inr_per_unit
    - rewards.base
    - rewards.accelerated
    - rewards.exclusions
    notes: Current Axis transfer roster and ratios are dynamic; current Travel EDGE transfer terms (https://traveledge.axis.bank.in/travel/common/termsandcondition) list a Horizon annual cap of 500,000 EDGE Miles per Customer ID, split into 100,000 for Group A and 400,000 for Group B; minimum transfer is 500 EDGE Miles. Check live program terms before transfer. The issuer value chart shows INR 1 per EDGE Mile for Travel EDGE as an illustration, not a guaranteed floor.
  capping_rules:
  - No per-cycle cap on accelerated EDGE Miles earning on Travel EDGE / airline spend per the current Horizon T&C; the transfer cap is separate and currently 500,000 miles per Customer ID per calendar year across Groups A and B.
benefits:
- effective_from: 2024-07-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 6
      cycle: quarterly
      guests_per_visit: null
      notes: Current issuer terms specify 8 complimentary visits per calendar quarter for Visa Signature or 6 for Mastercard World. This shared record stores the lower guaranteed quota; Visa Signature holders receive 2 additional visits per quarter.
    international:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: null
      notes: Two visits per calendar quarter; USD 1 authorization is required and reversed after successful authorization. Current card-specific terms do not identify a lounge operator or establish a fixed guest quota.
  milestones:
  - spend_inr: 0
    cycle: annual
    benefit: 1,500 EDGE Miles from second anniversary year onwards for primary cardmember; credited within 30 days. Not applicable to LTF cards.
    value_inr: 1500
    reward_kind: miles
    reward_units: 1500
    reward_currency_name: EDGE Miles
    trigger_window: anniversary-year
  welcome:
  - condition: First transaction must be INR 1,000 or above within 30 days of issuance; paid cards only. If the first transaction is below INR 1,000, a later transaction does not qualify. Cards issued from 1 Sep 2026 may take up to 60 days for credit.
    benefit: 5,000 EDGE Miles
    value_inr: 5000
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 400
    cycle: statement
  concierge: false
  insurance:
  - type: lost-card-liability
    sum_insured_inr: 1000000
    conditions: Covers specified lost/stolen, skimming and counterfeit card fraud up to two days before blocking; PIN-authenticated transactions, known-person fraud, negligence, delayed reporting and claims without police complaint/FIR are excluded.
  source:
    url: https://www.axis.bank.in/cards/credit-card/axis-horizon-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/axis/horizon/terms-and-conditions-horizon-2026-10-27.pdf
    fields_verified:

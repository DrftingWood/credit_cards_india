        notes: "10 total Reward Points per INR 100 on eligible INR online partner transactions; an SBI 2020 notice capped exclusive-partner accelerated points at 10,000/month, then standard base points continue; the newer Advantage T&C states the 5X cap but does not restate this partner cap, so this record retains the last explicit cap pending issuer clarification. Advantage-specific terms list Apollo 24x7, BookMyShow, Cleartrip, Domino's, GyFTR, IGP, Myntra, Netmeds, Swiggy and Yatra. Cleartrip/Yatra affiliate channels are excluded; Amazon gift-card purchases do not earn 10X. GyFTR voucher earn requires the SimplyCLICK GyFTR portal. Partner merchant IDs and network/acquirer online flags determine eligibility on a best-effort basis."

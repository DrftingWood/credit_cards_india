benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - dreamfolks
      notes: Unlimited visits for primary and supplementary cardmembers at participating lounges in India; each eligible cardholder must present their card. Guests are chargeable.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Unlimited Priority Pass visits outside India for primary and supplementary members. Up to 12 complimentary guest visits outside India are shared under card-specific T&Cs; additional guest visits may be charged up to USD35 each.
  golf:
    rounds_per_cycle: unlimited
    lessons_per_cycle: unlimited
    cycle: monthly
    notes: Unlimited complimentary domestic games and lessons for primary cardholder at specified locations, subject to at least INR50,000 spend in the latest statement. Four complimentary international games annually, also subject to the INR50,000 latest-statement spend. Supplementary cardholders are not eligible for complimentary golf.
  milestones:
  - spend_inr: 100000
    cycle: annual
    benefit: Welcome bonus for primary cardholder after eligible settled retail spend within 30 days of issuance.
    reward_kind: points
    reward_units: 6000
    reward_currency_name: Reward Points
    trigger_window: first-year
    is_repeatable: false
  - spend_inr: 7500000
    cycle: annual
    benefit: Taj hotel experiences e-gift card after eligible spend in the membership year.
    reward_kind: voucher
    reward_units: 100000
    reward_currency_name: INR
    trigger_window: anniversary-year
    is_repeatable: true
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: 500
    max_txn_inr: 10000
    cap_per_cycle_inr: null
    cycle: monthly
  movies:
    type: free
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: null
    notes: Two complimentary movie tickets per month with no ticket-price cap. Three complimentary non-movie tickets per quarter, capped at INR1,000 per ticket. Card-account quota is shared with add-on cards; primary cardmember eligibility applies.
  insurance:
  - type: travel-medical
    sum_insured_inr: null
    conditions: Overseas health insurance up to USD25,000 and accidental death aggregate limit USD100,000 per incident under international travel cover; cardholder and accompanying spouse, eligible card-booked travel, up to 60 days/trip and age up to 65. Policy exclusions apply.
  - type: baggage-loss
    sum_insured_inr: null
    conditions: International travel insurance includes checked-baggage loss; current public card guide does not state the cover amount. Policy terms apply.
  - type: other
    sum_insured_inr: null
    conditions: International travel insurance includes passport loss; current public card guide does not state the cover amount. Policy terms apply.
  - type: other
    sum_insured_inr: null
    conditions: International travel insurance includes ticket loss and missed flight connection; current public card guide does not state the cover amounts. Policy terms apply.
  - type: other
    sum_insured_inr: 20000
    conditions: Hole-in-one insurance for golf, up to INR20,000; policy terms apply.
  - type: fraud-liability
    sum_insured_inr: null
    conditions: Total Protect for lost card, counterfeiting/skimming, phishing and online fraud; numeric limit not established in reviewed card sources.
  concierge: true
  other:
  - name: Dining vouchers
    description: Two INR3,000 EazyDiner vouchers every six months for primary cardmember, subject to card terms.
  - name: Taj Epicure Preferred membership
    description: First-year complimentary membership; renewal requires INR50 lakh previous-year spend and must be claimed. Partner terms apply.
  - name: Club ITC Culinaire Select membership
    description: Issuance currently on hold according to the live issuer page; do not treat as currently issuable until the bank resumes it.
  - name: EazyDiner Prime
    description: First-year complimentary EazyDiner Prime membership; renewal requires INR50 lakh previous-year spend.
  - name: Postcard Hotels
    description: Two complimentary hotel vouchers per year, issued on request; voucher terms apply.
  - name: Airport transfers
    description: Two complimentary domestic and two international airport pick-up/drop services per year for primary cardmember; booking and service terms apply.
  - name: Airport meet and greet
    description: Two complimentary domestic and two international meet-and-greet services per year for primary cardholder, subject to booking, location and issuer/partner terms.
  - name: Concierge
    description: 24x7 concierge; services requested may be chargeable and location-limited.

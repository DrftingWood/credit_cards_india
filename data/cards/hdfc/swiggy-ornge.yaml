  notes: HDFC's current Ornge product page states Indian nationality, salaried net monthly income greater than
    INR 20,000 and self-employed ITR greater than INR 600,000 per annum. The annual amounts stored here are the
    numeric thresholds; the strict greater-than operator is preserved in this note. The source specifies nationality,
    not resident/NRI status, so residency remains unknown. No fixed credit-score cutoff is published.

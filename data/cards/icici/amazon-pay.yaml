    fields_verified:
    - rewards.base
    - rewards.accelerated
    - rewards.exclusions
    - rewards.redemption
  mcc_exclusions:
  - '6513'
  capping_rules:
  - 'Issuer states no earning limit. Tax and precious-metal exclusions are documented in rule notes because the schema has no sufficiently precise category for these product-level exclusions; merchant/MCC classification may affect estimates. The base 1% is excluded from utilities, wallet loads, and government-category transactions while the Amazon Pay 2% scoped rule remains eligible.'

    notes: Current IMA-specific terms and SBI's reward-accrual cap policy confirm the separate monthly 7,500-point caps. The specific terms' redemption restrictions conflict with the brochure's outstanding-balance wording and SBI's general statement-credit page; catalog redemption is retained, but statement-credit eligibility and fixed point value remain unresolved.

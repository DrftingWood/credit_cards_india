    notes: 10% online value back at Blinkit, up to Rs 200 per primary card per calendar month. Minimum order Rs 499; credited to Blinkit wallet with no expiry and usable only there. E-commerce payment only; UPI excluded. This is not card cashback.
  - category: district-movies-value-back
    canonical_categories:
    - entertainment
    multiplier: 1
    effective_rate: 10
    cap_per_cycle: 200
    cap_unit: cashback-inr
    cycle: monthly
    over_cap_earns_base: false

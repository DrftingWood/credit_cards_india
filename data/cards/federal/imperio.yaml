        - rewards.base.unit_value_inr
        - rewards.accelerated
        - rewards.exclusions
        - rewards.mcc_exclusions
        - rewards.category_caps
        - rewards.redemption
      notes: Issuer advertises 3x (total earn) on healthcare/grocery and 2x on utilities; no accelerator caps published. Base is 1 point per INR 150. Shared current MITC exclusions include cash, fuel, wallet, government, financial institution/quasi-cash and rent; listed MCCs include rent 6513. Insurance MCCs 6300/5960 cap at 250 points per card per calendar month. Federal Reward Point face value is INR 0.25; statement credit is INR 0.10. MITC says INR 99 redemption fee per request, while product FAQ says minimum INR 99 and actual fee depends on redemption type. The calculator does not deduct the fee.
benefits:
  - effective_from: 2026-10-25
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        spend_threshold_inr: 40000
        spend_threshold_cycle: quarterly
        guests_per_visit: 0
        via: [visa]
        notes: Primary cardholder only; INR 40,000 spend in immediately preceding qualifying quarter unlocks two domestic visits in the next quarter. Quarter spend windows run 21st-20th. Add-on spending aggregates toward eligibility, but add-on holders cannot access lounges. INR 2 domestic validation charge is non-refundable; guests are chargeable.
    welcome:
      - condition: Spend at least INR 5,000 within 30 days of issuance for the INR 400 Amazon voucher; Federal Bank offer terms apply.
        benefit: Amazon voucher worth INR 400
        value_inr: 400
        window_days: 30
    milestones:
      - spend_inr: 50000
        cycle: quarterly
        benefit: BigBasket voucher after at least INR 50,000 spend in a quarter; only once per financial year. Eligible spend is POS/e-commerce; ATM withdrawals excluded. Voucher value is set by the bank/vendor and not published.
        value_inr: null
        reward_kind: voucher
        trigger_window: rolling
        is_repeatable: null
    movies:
      type: bogo
      partner: INOX
      max_per_cycle: 1
      cycle: quarterly
      cap_inr: 100
      notes: Up to ₹100 off; food/beverages and taxes excluded. Active card in good standing required.
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: 150
      cycle: monthly
      notes: 1% surcharge waiver excluding GST; ₹150 monthly cap.
    other:
      - name: Add-on cards
        description: Up to 4 add-on cards for INR 100 plus GST per card.
      - name: Credit Card EMI
        description: EMI conversion is available; the current product page does not state an Imperio-specific minimum transaction or tenure.
    source:
      url: https://www.federal.bank.in/visa-imperio-credit-card
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      method: rendered-page
      fields_verified:
        - benefits.lounge_access
        - benefits.welcome
        - benefits.milestones
        - benefits.movies
        - benefits.fuel_surcharge_waiver
        - benefits.other
      notes: Amazon voucher offer is INR 400 after INR 5,000 spend within the first 30 days; issuer describes it as an onboarding offer for eligible/notified cardholders. Current BigBasket T&Cs require INR 50,000 minimum quarterly spend, permit the voucher only once per financial year, exclude ATM cash withdrawals, and limit eligibility to customers individually notified. Voucher amount is not specified and validity is up to 12 months. No international lounge benefit is advertised for Imperio.

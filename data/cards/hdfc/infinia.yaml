    currency: points
    currency_name: Reward Points
    base:
      rate: 5
      per_inr: 150
      unit_value_inr: 1.1
      unit_value_inr_realized: 1.0
    accelerated:
      - category: smartbuy-flights-hotels
        canonical_categories: [travel]
        multiplier: 10
        cap_per_cycle: 15000
        cap_unit: points
        cycle: monthly
        channel:
          required: true
          class: issuer-portal
          merchants: [smartbuy]
        notes: "10x reward points on flight + hotel bookings via HDFC SmartBuy. Rate applies only when booked via SmartBuy; direct/OTA bookings drop to the base 5/₹150."
    exclusions:

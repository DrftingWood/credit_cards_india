benefits:
- effective_from: 2022-04-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      notes: Up to 2 domestic visits per 90-day feature period, only when the paid lounge feature is activated. This is not included automatically with the lifetime-free base card; the in-app feature fee and any selected option are not exposed in the calculator.
  fuel_surcharge_waiver: null
  concierge: false
  other:
  - name: Paid configurable features
    description: Features are selected in AU 0101 and generally run for 90 days, auto-renewing unless disabled. Activation fee is charged for each period plus GST. Feature pricing is displayed in the app; pricing may vary by selected combination.
  - name: Conditional fuel surcharge waiver
    description: A separately selected feature waives 1% on eligible fuel transactions â‚¹400â€“â‚¹5,000, up to â‚¹1,500 per 90-day feature period. AU KFS says the standard LIT card has no fuel surcharge waiver; this benefit requires feature activation and is not represented as a default card waiver.
  - name: Category cashback features
    description: Optional 5% grocery and apparel cashback features have a â‚¹500 cap per category in each 30-day period. Milestone options include additional 5% cashback (â‚¹10,000 minimum eligible retail spend, â‚¹500 cap per 30 days) or 2% cashback (â‚¹15,000 minimum, â‚¹1,000 cap per 30 days); feature fees and category/MCC eligibility apply. Only one milestone cashback feature may be selected. Calculator inputs do not capture the selected option or its fee.
  - name: Membership features
    description: Optional 3-month ZEE5 and Amazon Prime memberships carry a spend condition of â‚¹5,000 and â‚¹10,000 respectively within 90 days; failure incurs â‚¹50 and â‚¹299 plus GST. Optional â‚¹200 Amazon Pay voucher feature unlocks after â‚¹10,000 spend in 30 days; feature fee is â‚¹50.
  - name: Card liability cover
    description: Zero liability for eligible fraud after reporting card loss, up to â‚¹1.5 lakh or the credit limit, whichever is lower; counterfeit/skimming and online fraud protection also described. Full limits and terms should be reviewed before reliance.
  source:
    url: https://www.au.bank.in/lit-terms-and-conditions
    retrieved_on: '2026-10-27'
    type: issuer-page
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.domestic.guests_per_visit
    - benefits.fuel_surcharge_waiver
    notes: Current LIT features page describes up to 2 airport lounge visits per 90-day period. Official terms specify these are feature-based; selected fee is shown in app. Terms specify conditional fuel waiver of 1% on â‚¹400â€“â‚¹5,000 up to â‚¹1,500 per 90-day feature period, while KFS lists no default LIT fuel waiver. Modelled as paid optional benefit in prose, not as standard waiver.

  notes: 'Effective 15-Jun-2026 issuer exclusions: rental, wallet, fuel, government,
    marketing/advertising, cash withdrawals, post-purchase and instant EMI, insurance,
    education, railways, toll, ferry and jewellery. Online/offline/select rates are
    8/4/2 points per INR200. Total cap 5,000 points per statement; utility MCC 4900
    cap 150. Points value is up to INR0.25, not a guaranteed or realized value. UPI
    transactions are not eligible for the standard physical card; issuer offers a
    separate virtual RuPay variant.'

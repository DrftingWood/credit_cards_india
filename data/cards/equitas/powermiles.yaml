    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.other
    notes: 'MITC v1.2/agreement supports the generic third-party luxury-membership feature and its spend conditions; current accessible issuer terms do not identify brands or quantify lounge visits. Previously listed 2 domestic/1 international quarterly visit counts are unverified and have been removed pending access to the product-page terms. Insurance summary and linked policy wording were reviewed 2026-11-01; the current per-card certificate/schedule and exact limits/deductibles remain unavailable. The product page returns HTTP 503.'

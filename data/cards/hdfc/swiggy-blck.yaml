  capping_rules:
  - 1% cashback on other eligible categories is capped at INR 1,000 per billing/statement cycle;
    minimum transaction INR 100.
  - 10% cashback on Swiggy food ordering, Instamart and Dineout is capped at INR 1,500 per
    billing/statement cycle; minimum transaction INR 249; Swiggy Money Wallet and Swiggy Liquor do
    not qualify.
  - 5% cashback on eligible online MCCs/selected merchants is capped at INR 1,500 per
    billing/statement cycle; minimum transaction INR 100. Eligible MCCs and merchant IDs determine
    recognition.
  - Overall cashback maximum is INR 4,000 per statement cycle. Refunds/reversals adjust cashback and
    posted/settled date determines its cycle.
  - No cashback on prepaid/gift cards and wallets, rent, government, gaming, education, fuel,
    jewellery, SmartPay, SmartBuy, EMI, cash advances, traveller's cheques, foreign currency and
    fees. Specific MCCs control table-based categories; online skill/gaming exclusions and MCC
    5816/7995 discrepancy remain noted.
  - Cleartrip and Nykaa additional instant discounts are limited-time offers in the current issuer
    T&Cs; their offer end dates are not stated. Birthday-week Dineout offer is up to 10%/INR 500 on
    minimum INR 3,000 order, for seven days around the registered birthday, once per cardholder and
    only after 30 days from activation.

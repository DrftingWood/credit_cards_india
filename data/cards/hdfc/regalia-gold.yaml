    - benefits.milestones.value_inr
    - benefits.welcome.value_inr
    - benefits.insurance.sum_insured_inr
    - benefits.dining.discount_pct
    notes: 'Milestone/welcome terms checked against current card-specific T&Cs and live product page.
      Lounge timing/source: https://www.hdfc.bank.in/credit-cards/regalia-gold-credit-card; current feature
      notice: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/pdf/common/Credit-Cards/Regalia-Gold-Product-feature-change.pdf.
      Insurance cross-checked against active policy https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/regalia-credit-card/pdfs/hdfc-ergo-general-insurance-company-limited.pdf
      (23-Jul-2026 to 22-Jul-2027). Live product page claims annual milestone awards at INR 500,000 and
      INR 750,000; the specific milestone T&Cs only document the INR 750,000 award. The shared MITC and
      old fuel-waiver entry conflict; no fuel waiver was found in the current card-specific material.'
eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 1200000
    self_employed: 1800000
  credit_score_min:
  residency:
  age_ranges:
    salaried:
      min_age: 21
      max_age: 60
    self_employed:
      min_age: 21
      max_age: 65
  notes: >-
    Official eligibility page lists Indian nationality, salaried age 21-60 and
    self-employed age 21-65; residence requirement is not stated, so residency
    is null. Government salaried minimum monthly income >INR 100,000 and private
    salaried >INR 150,000; the schema stores the lower annualized threshold INR
    1,200,000, so it cannot encode the occupation split. Self-employed ITR >INR
    1,800,000/year. The page's headline and FAQ use net monthly income, while
    the detailed eligibility section calls salaried income gross; this wording
    conflict is unresolved. No numerical bureau-score floor is published.
    Source: https://www.hdfc.bank.in/credit-cards/regalia-gold-credit-card/eligibility.
  source:
    url: https://www.hdfc.bank.in/credit-cards/regalia-gold-credit-card/eligibility

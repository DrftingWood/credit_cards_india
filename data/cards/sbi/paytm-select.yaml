id: sbi-paytm-select
name: "Paytm SBI Card SELECT"
image_path: /cards/sbi/paytm-select.webp
issuer: sbi
network: visa
network_tier: signature
tier: mid
card_type: credit
co_brand:
  partner: "Paytm"
  category: other
status: active
launched_on: 2020-11-04
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    renewal_fee_inr: 1499
    fee_waiver:
      spend_inr: 200000
      cycle: annual
      conditions: "Renewal fee waived if annual spends in the previous year >= Rs. 2 Lakhs."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    supplementary_card_fee_inr: 0
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/paytm-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee
    notes: "Annual Fee Rs. 1,499 + taxes; Renewal Fee Rs. 1,499 + taxes from second year onwards; Add-on card fee Nil."

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: cashback
    currency_name: Paytm Cashback Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      # Paytm-app-only categories per the issuer's card booklet.
      - category: paytm-travel-movies-mall
        canonical_categories: [travel, entertainment, other]
        multiplier: 5
        effective_rate: 5
        channel:
          required: true
          class: cobrand-merchant
          merchants: [paytm-app]
        notes: "5% cashback on travel, movies and mall purchases through the Paytm App. Requires booking through the Paytm app â€” does not apply to travel booked anywhere else. Cap not stated on crawl."
      - category: other-paytm-app-spends
        canonical_categories: [online]
        multiplier: 2
        effective_rate: 2
        channel:
          required: true
          class: cobrand-merchant
          merchants: [paytm-app]
        notes: "2% cashback on all other purchases through the Paytm App, excluding the 5% travel, movies and mall category. Requires transacting inside the Paytm app. Cap not stated on crawl."
    redemption:
      - type: catalog
        rate_inr_per_unit: 1.0
        program: Paytm Gift Voucher balance
        constraints: "Reward Points are automatically converted to Paytm Gift Voucher balance in the cardholder's linked Paytm Wallet; not statement credit. Minimum eligible transaction is INR 100."
    exclusions:
      - fuel
      - wallet-loads
      - rent
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/paytm-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
    notes: "1% valueback everywhere else; 2% on other Paytm App purchases and 5% on Paytm App travel, movies and mall purchases. UPI transactions earn 1% valueback."

    mcc_exclusions: ['6513']
    capping_rules:
      - No monthly or statement cap stated in the Paytm SBI Card SELECT booklet for the 5% Paytm App category.
benefits:
  - effective_from: 2026-07-03
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        via: [issuer-direct]
        notes: "Complimentary 4 domestic lounge visits per year (max. 1 per quarter)."
    milestones:
      - spend_inr: 400000
        cycle: annual
        benefit: "E-voucher worth Rs. 2,000 on annual retail spends of Rs. 4 Lakhs."
        value_inr: 2000
        reward_kind: voucher
        trigger_window: anniversary-year
      - spend_inr: 600000
        cycle: annual
        benefit: "E-voucher worth Rs. 4,000 on annual retail spends of Rs. 6 Lakhs."
        value_inr: 4000
        reward_kind: voucher
        trigger_window: anniversary-year
    welcome:
      - condition: "Card issued"
        benefit: "Complimentary Paytm First Membership."
      - condition: "Card issued"
        benefit: "Reward Points worth Rs. 750 (1 Reward Point = Re. 1)."
        value_inr: 750
    insurance:
      - type: fraud-liability
        sum_insured_inr: 200000
        conditions: "Cyber Fraud Insurance cover of Rs. 2,00,000."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: 250
      cycle: statement
    concierge: false
    other:
      - name: "Priority Pass Membership"
        description: "2-year complimentary Priority Pass Membership worth US $99 (international lounge program; per-visit charges may apply)."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/paytm-sbi-card-select.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high

eligibility:
  min_age: 21
  max_age: 70
  age_ranges:
    salaried: {min_age: 21, max_age: 65}
    self_employed: {min_age: 25, max_age: 70}
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: "Eligibility criteria not published on the product page. SBI Card policy states age 21?65 for salaried applicants and 25?70 for self-employed applicants; the broad 21?70 range preserves the occupation-specific detail in age_ranges. No card-specific minimum income or fixed credit-score cutoff is published; approval depends on SBI Card underwriting."
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/who-we-are/notices/policy-for-the-issuance-and-conduct-of-credit-cards-2023.pdf
    retrieved_on: '2026-10-25'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified: [eligibility.min_age, eligibility.max_age, eligibility.age_ranges]
    notes: "Issuer policy section 3 gives the occupation-specific age ranges. SBI states card-specific income minimums vary; this policy does not publish a fixed credit-score cutoff."

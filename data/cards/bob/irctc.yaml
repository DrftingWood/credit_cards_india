id: bob-irctc
name: IRCTC BOBCARD Credit Card
issuer: bob
network: rupay
network_tier: platinum  # TODO verify
tier: entry
card_type: credit
co_brand:
  partner: IRCTC
  category: railway
  partner_website: https://www.irctc.co.in
status: active
launched_on: 2020-01-01  # TODO verify launch date
discontinued_on: null

fees:
  - effective_from: 2020-01-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 350
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.49
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.bobcard.co.in/credit-card-types/irctc-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2020-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.18
    accelerated:
      - category: irctc-train-booking
        canonical_categories: [travel]
        multiplier: 20
        effective_rate: 40
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: statement
        channel:
          class: utility-rail
          merchants: [irctc-rail]
        notes: "Up to 40 RP per ₹100 on train tickets via IRCTC website/app (varies by travel class); requires IRCTC BOBCARD loyalty number linked to IRCTC login."
      - category: departmental-stores
        canonical_categories: [groceries]
        multiplier: 2
        effective_rate: 4
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: statement
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    redemption:
      - type: statement-credit
        program: BOBCARD Rewards
        rate_inr_per_unit: 0.25
        constraints: "Reward points redeemable only as statement cashback @ 1 RP = ₹0.25."
    source:
      url: https://www.bobcard.co.in/credit-card-types/irctc-credit-card
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2020-01-01
    effective_until: null
    lounge_access: null
    welcome:
      - condition: "Spend ₹5,000 or more within 60 days of issuance"
        benefit: "500 joining bonus reward points"
        value_inr: 125
        window_days: 60
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: monthly
    other:
      - name: Railway lounge access
        description: "4 complimentary partner railway-lounge visits per year (1 per quarter)."
      - name: Add-on cards
        description: "Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+)."
    concierge: false
    source:
      url: https://www.bobcard.co.in/credit-card-types/irctc-credit-card
      retrieved_on: 2026-07-03


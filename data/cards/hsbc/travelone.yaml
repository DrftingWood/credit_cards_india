benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 6
      cycle: annual
      guests_per_visit: 0
    international:
      visits_per_cycle: 4
      cycle: annual
      guests_per_visit: 0
  welcome:
  - condition: New primary TravelOne cardholders who apply 1 July?31 December 2026, download and log in to the HSBC
      India Mobile app, and spend at least INR25,000 within 30 calendar days of opening the account; KYC must be
      updated and minimum due paid within 30 days of its due date.
    benefit: INR1,000 cashback, INR3,000 Postcard Hotels voucher and 3 months EazyDiner Prime membership.
    value_inr: 4000
    window_days: 30
  - condition: Apply online and complete video self-verification with card issuance during 1 January?31 October
      2026.
    benefit: INR250 Amazon eGift Voucher; offer is limited-period and voucher is delivered within 45 days after
      offer end.
    value_inr: 250
    window_days: null
  milestones:
  - spend_inr: 1200000
    cycle: annual
    benefit: 10,000 bonus Reward Points after net eligible spend of INR1,200,000 in a card anniversary year. T&C
      says spend of INR1,200,000; product page says more than INR1,200,000.
    value_inr: null
    reward_kind: points
    reward_units: 10000
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
    is_repeatable: true
    max_awards_per_cycle: 1
  insurance:
  - type: purchase-protection
    sum_insured_inr: null
    sum_insured_amount: 20000
    sum_insured_currency: USD
    conditions: Up to USD20,000 purchase protection every year; terms, covered items and claims conditions apply.
  other:
  - name: Travel booking discounts
    description: Issuer product page advertises 15% savings on domestic and international holiday bookings through
      Yatra, EaseMyTrip, Paytm Travel and Cleartrip; booking-specific terms and promo codes apply.
  - name: StayVista hotel discount
    description: Issuer page lists StayVista savings; maximum 2 bookings per card per year and INR3,000 maximum
      saving per booking.
  - name: AdaniOne duty-free discount
    description: Issuer page advertises up to 20% off at select duty-free stores in India; offer terms apply.
  - name: Dining, events and movies
    description: Issuer page advertises up to 10% off events and dining via District by Zomato and buy-one-get-one
      movie tickets twice per month; offer terms and codes apply.
  - name: Mastercard World platform
    description: Issuer page advertises Mastercard World platform privileges including complimentary golf and holiday

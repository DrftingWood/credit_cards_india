    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.fuel_surcharge_waiver.cycle
    - benefits.insurance
    - benefits.other
    notes: >-
      Welcome requires paid joining fee, activation and first successful transaction within 30 days; benefit must be claimed within six months. The 500-point milestone requires five transactions of INR 500 or more per statement cycle. Fuel waiver is 1% on INR 400-5,000 transactions, capped INR 100 per statement cycle. Partner offers have separate caps and timing by merchant; the two app-based cashback offers cap per statement cycle. Offer terms: https://www.au.bank.in/pdf/TnC-TEJAS_Welcome-Benefit.pdf; District https://www.au.bank.in/pdf/District-by-Zomato-AU-Tejas-Credit-Card.pdf; Amazon Fresh https://www.au.bank.in/pdf/Amazon-FreshNow-AU-Tejas-Credit-Card.pdf; Zomato https://www.au.bank.in/pdf/Zomato-AU-Tejas-Credit-Card.pdf; cab https://www.au.bank.in/pdf/Cab-Services-AU-Tejas-Credit-Card.pdf; AU 0101 bill payment https://www.au.bank.in/pdf/Bill-Payments-AU-Tejas-Credit-Card.pdf.
  milestones:
  - spend_inr: 2500
    cycle: statement
    benefit: 500 bonus Reward Points after at least 5 transactions of INR 500 or more within one statement cycle.
      Valued at approximately INR 1.25 using the general catalog point conversion; schema requires whole-INR milestone
      values, so the numeric value is left null.
    value_inr: null
    reward_kind: points
    reward_units: 500
    reward_currency_name: Reward Points
    trigger_window: rolling
    is_repeatable: true
  insurance:
  - type: other
    sum_insured_inr: null
    conditions: AU's current Tejas product FAQ advertises Card Liability Cover; card-specific liability amount and claim conditions are not stated on the page.
  - type: credit-shield
    sum_insured_inr: null
    conditions: AU's current Tejas product FAQ advertises Credit Shield; card-specific insured amount and policy conditions are not stated on the page.
  other:
  - name: District movie discount
    description: 10% off movie tickets, minimum INR 150, maximum INR 50, once per card per month; use promo code AUTEJ50 online. Offer applies to eligible Tejas card BINs and cannot be combined with other offers or paid from wallet balance.
  - name: Amazon Fresh/Now grocery discount
    description: 10% off, minimum INR 150, maximum INR 50, once per card per month; automatic discount in eligible Amazon Fresh/Now checkout. Issuer terms list BINs 406977506 and 653024929 and serviceable locations only.
  - name: Zomato food-delivery discount
    description: 10% off, minimum INR 150, maximum INR 50, once per card per month; promo code AUTEJAS10. Issuer terms list card BIN 406977506; online only and cannot be paid with wallet balance or combined with other offers.
  - name: Cab-booking cashback
    description: 10% cashback on eligible India cab bookings, minimum INR 150 per transaction, maximum INR 50 per card per statement cycle; eligible MCC 4121 and providers include Uber, Ola and Rapido. Cashback is credited within 60 days.
  - name: AU 0101 bill-payment cashback
    description: 10% cashback on eligible AU 0101 app Bill Payments, minimum INR 150 per transaction, maximum INR 50 per card per statement cycle; eligible billers include utilities, telecom, broadband, DTH, FASTag and municipal payments. Cashback is credited within 60 days; bill payments outside AU 0101 are excluded.
  - name: Xpress EMI
    description: Convert eligible transactions of INR 500 or more when the total conversion value is at least INR 2,000; up to 20 billed or unbilled transactions may be combined. Current KFS Xpress EMI processing charge is 1% of amount converted, minimum INR 99 plus GST.
  - name: Contactless payments
    description: POS payments up to INR 5,000 can be made without entering a PIN, including digitally added card payments.
  - name: Add-on cards
    description: AU's Tejas guide says add-on cards are lifetime-free for family members above 18; general AU materials state up to three lifetime-free add-on cards.
  - name: Device Protection Plan
    description: Current AU Tejas FAQ advertises this plan; coverage, eligibility, premium and claim conditions are not stated on the page.

    notes: >-
      Current issuer terms published 18-Sep-2026 confirm cashback caps of INR 1,500, INR 1,500 and INR 500 per
      billing cycle. Swiggy transactions need a minimum INR 249; 5% and 1% transactions need a minimum INR 100.
      Posting date determines eligibility; refunds and reversals adjust cashback. Online 5% applies only to selected
      merchants under the listed MCCs, and Swiggy earn requires partner MID/TID recognition. Other T&C exclusions:
      SmartPay, SmartBuy, travellers' cheques, foreign currency and fees, interest and penalties. The product page says activation within 30 days; detailed card terms say within 37 days, modeled here from the detailed terms. The 18-Sep-2026 terms narrow 10% cashback to Food, Instamart and Dineout (Genie removed), add Cleartrip
      cashback by merchant name (not modeled as an MCC accelerator), and describe daily cashback posting settled against
      the statement by settlement date. Total caps sum to INR 3,500 per statement cycle.
benefits:
- effective_from: 2026-05-22
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Activate within 37 days of card issuance and claim in Swiggy app
    benefit: Three-month Swiggy One membership; existing memberships are extended by three months. In-app claim opens
      2â€“3 days after activation.
    value_inr: null
    window_days: 37
  other:
  - name: Swiggy Dineout birthday offer
    description: Additional 10% discount up to INR 500 on a minimum INR 3,000 Dineout order during a seven-day window (three days before through three days after the recorded birthday), once per cardholder and available only after 30 days from card activation, subject to offer terms.
    value_inr: 500
  - name: Swiggy One extended welcome promotion
    description: "Limited-period offer for qualifying applications through Swiggy app on or after 22-May-2025: an additional nine months after claiming the standard three-month membership, subject to in-app claim timing and offer terms."
    value_inr: null

    so no category-level cap is encoded. Cash credit terms explicitly set INR0.50/point and 5,000 points/calendar
    month cash redemption. Reduced categories earn 0.7 point/INR100; medical, automobile and telecom earn 1 point/INR100
    weekdays and weekends. All rewards limited to assigned credit limit per statement cycle.

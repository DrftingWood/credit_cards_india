    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.insurance.sum_insured_inr
    notes: Current product page confirms 3 lounge visits per quarter subject to INR40,000 prior-calendar-quarter spend, welcome and quarterly milestone awards (4,000 points when quarter spend exceeds the higher of INR100,000 or credit limit), fuel waiver, insurance amounts, add-ons, smart EMI and the FITPASS issue-date gate. Professional-indemnity cover is limited to practicing ICMAI members with a current Certificate of Practice at issuance and claim. The product page says the 500-point welcome award requires INR5,000 spend in 60 days. FITPASS terms only apply to primary cards issued from 01-Aug-2026.

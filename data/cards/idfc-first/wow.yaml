  - effective_from: 2021-06-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 1
        cycle: quarterly
        guests_per_visit: 0
        via: [visa, dreamfolks]
        spend_threshold_inr: 20000
        spend_threshold_cycle: monthly
    welcome:
      - condition: "On card activation / early spends"
        benefit: "Welcome benefits worth ₹5,000+"
        value_inr: 5000

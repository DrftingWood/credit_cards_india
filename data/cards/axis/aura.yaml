benefits:
- effective_from: 2026-10-25
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Welcome voucher issued with eligible card issuance
    benefit: Decathlon OMNI Gift Card worth INR 750; card page also mentions Amazon but the detailed welcome T&C names Decathlon only
    value_inr: 750
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: Free doctor consultations
    description: Four free Practo video consultations per month (48/year), shared across the cardholder and up to three family members; unused consultations do not carry over. Practo Plus also provides 20% off eligible prescriptions, lab tests and health check-ups, with delivery charges applicable.
  - name: Free fitness sessions
    description: Four interactive personal training sessions and 16 prerecorded fitness sessions per month via Fitternity.
  - name: Health checkup discount
    description: Annual discount up to ₹500 on health checkup.
    value_inr: 500
  - name: Nutrition consultation discount
    description: At least 30% discount on nutritional or diet consultations and nutritional foods.
  dining:
    program: Axis Bank Dining Delights
    discount_pct: 15
    notes: Current Aura page lists 15% off up to INR 500, minimum order INR 2,500, once per card per month at participating restaurants; offer conditions and restaurant availability apply.

    description: Up to 4 services per year through Global Assure; active card and recent transaction conditions apply.
    value_inr: 1399
  - name: HP Pay Happy Coins
    description: 6 Happy Coins per INR 100 eligible HP Pay fuel spend, up to 600 coins/month (INR 10,000 spend); separate from card Reward Points and subject to HP Pay terms.
    value_inr: null
  - name: Merchant offers
    description: Current issuer page advertises merchant offers worth INR 1,000+; actual merchants, savings, eligibility and offer periods vary, so no fixed cash value is asserted.

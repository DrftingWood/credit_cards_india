rewards:
- effective_from: 2026-07-03
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
  accelerated:
  - category: medical-supplies-travel
    canonical_categories:
    - travel
    - other
    multiplier: 5

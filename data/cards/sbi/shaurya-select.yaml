id: sbi-shaurya-select
name: SBI Card SHAURYA Select
issuer: sbi
network: visa
network_tier: null
tier: mid
card_type: credit
co_brand: null           # defence-personnel card, not a co-brand partnership
status: active
launched_on: null
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    renewal_fee_inr: 1499
    fee_waiver:
      spend_inr: 150000
      cycle: annual
      conditions: "First year fee waived. Renewal fee reversed if annual spends of last year >= Rs. 1,50,000."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee: null
    supplementary_card_fee_inr: 0
    gst_applicable: true
    notes: "First-year annual fee waived off."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/shaurya-select-sbi-card.html
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.22
    accelerated:
      - category: csd-dining-movies-departmental-grocery
        canonical_categories: [dining, groceries, entertainment]
        multiplier: 2.5
        effective_rate: 5
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        notes: "5X Reward Points (5 per Rs. 100) on CSD, Dining, Movies, Departmental Stores and Grocery spends. Base is 2 per Rs. 100, so 5X headline resolves to 5 points per Rs. 100."
    exclusions:
      - wallet-loads
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
        constraints: "Pay card outstanding with Reward Points; 4 Reward Points = Rs. 1."
      - type: catalog
        program: SBI Card Rewards Catalogue
        rate_inr_per_unit: 0.25
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/shaurya-select-sbi-card.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2026-07-03
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [rupay]
        notes: "4 complimentary domestic airport lounge visits per year (max. 1 per quarter)."
    milestones:
      - spend_inr: 50000
        cycle: quarterly
        benefit: "Rs. 500 Pizza Hut e-Voucher"
        value_inr: 500
        reward_kind: voucher
        trigger_window: rolling
      - spend_inr: 500000
        cycle: annual
        benefit: "Rs. 7,000 e-Gift Voucher from Yatra or Pantaloons"
        value_inr: 7000
        reward_kind: voucher
        trigger_window: anniversary-year
    welcome:
      - condition: "Renewal fee paid"
        benefit: "1,500 Reward Points on payment of Renewal Fee"
        value_inr: 375
        window_days: null
    insurance:
      - type: personal-accident
        sum_insured_inr: 1000000
        conditions: "Complimentary Personal Accidental Insurance Cover offered by RuPay."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: 250
      cycle: statement
    concierge: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/shaurya-select-sbi-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 70
  income_inr_annual:
    salaried: 600000
    self_employed: 600000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/shaurya-select-sbi-card.html

metadata:
  last_verified_on: 2026-07-03
  tags: [defence, rewards, mid, points, lounge]

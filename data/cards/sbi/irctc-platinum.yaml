rewards:
  - effective_from: 2024-12-26
    effective_until: null
    currency: points
    currency_name: Reward Points
    redemption_scope: closed-loop
    ecosystem_label: IRCTC
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 125
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 4
        effective_per_inr: 100
        card_attributable_rate: 4
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: statement
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "The issuer specifies 4 RP/₹100 for travel dates 1 Apr–14 Jul and 16 Sep–14 Jan, and 10 RP/₹100 for 15 Jan–31 Mar and 15 Jul–15 Sep. The calculator cannot model date seasons, so the rule uses the lower 4 RP/₹100 throughout to avoid overstating the year-round rate. Applies to AC1/AC2/AC3/Executive Chair Car/Chair Car fare on IRCTC app/site; booking conditions apply."
    exclusions:
      - fuel
      - rent
      - government
      - wallet-loads
      - cash-advance
      - emi
    source:
      url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/IRCTC-VISA-HandShak-TnC.pdf
      retrieved_on: '2026-10-27'
      type: issuer-pdf
      confidence: high
      method: pdf-extract
      fields_verified: [rewards.base, rewards.accelerated, rewards.capping_rules, rewards.redemption]
      notes: "Current card terms specify seasonal travel value-back: 4% for travel dates 1-Apr to 14-Jul and 16-Sep to 14-Jan; 10% for 15-Jan to 31-Mar and 15-Jul to 15-Sep. Because the schema cannot represent travel-date seasons, the structured rule uses 4% conservatively. Eligible AC-class ticket points accrue five days after completed travel and transfer to the linked IRCTC loyalty account. No monthly/annual travel value-back cap is stated."
    mcc_exclusions: ['5172','5541','5983','5542','6540','6541','6513','7349','9399','9311']
    redemption:
      - type: voucher
        program: IRCTC AC-class fare
        rate_inr_per_unit: 1.0
        constraints: INR 1 per point against eligible AC-class IRCTC fare only after linking the IRCTC loyalty account; closed-loop, no cash redemption.
    capping_rules:
      - "IRCTC travel reward value-back is uncapped monthly and annually. IRCTC loyalty points expire two years after member registration/renewal; unredeemed SBI Card points also face 13-month inactivity forfeiture and may be lost after account closure as detailed in card terms."
benefits:
  - effective_from: 2024-12-26
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [issuer-direct]
        notes: "Complimentary railway lounge access (not airport lounges); max 1 per quarter, primary cardholder only."
    welcome:
      - condition: "First retail transaction of INR 500 or more within 60 days of issuance; fuel and cash spends are excluded"
        benefit: "350 activation bonus Reward Points, credited within 45 days of eligible transaction"
        value_inr: 350
        window_days: 60
      - condition: "Realization of annual renewal fee"
        benefit: "500 Reward Points"
        value_inr: 500
        window_days: null
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 3000
      cap_per_cycle_inr: 100
      cycle: statement
    other:
      - name: IRCTC online railway booking transaction charge waiver
        description: "Waives 1% transaction charges on eligible bookings made directly at irctc.co.in; issuer reviews eligible MID/TID list monthly. A 1% charge on the total refund amount applies if a railway ticket is cancelled."
      - name: Travel offers from IRCTC
        description: "Discounted airline tickets and tailor-made holiday packages via IRCTC."
    concierge: null
    source:
      url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/IRCTC-VISA-HandShak-TnC.pdf
      retrieved_on: 2026-10-27
      type: issuer-pdf
      confidence: high


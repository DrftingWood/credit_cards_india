rewards:
- effective_from: '2013-09-16'
  effective_until: null
  currency: points
  currency_name: Reward Points
  loyalty_program: air-india-flying-returns
  base:
    rate: 4
    per_inr: 100
  accelerated:
  - category: air-india-bookings
    canonical_categories:
    - travel
    multiplier: 2.5
    effective_rate: 10
    card_attributable_rate: 10
    card_attributable_per_inr: 100
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: monthly
    merchants:
    - air-india
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - air-india-direct
    notes: From 31-Mar-2025, earn 10 Reward Points per INR100 of eligible base fare on Air India website, app, booking offices or call centres, using primary or add-on card. 4 points post initially; 6 points post within 60 working days after merchant-ID mapping, subject to Maharaja Club number and exact name/KYC match.
    stacks_with_program: false
  exclusions:
  - fuel
  - cash-advance
  - rent
  - government
  - wallet-loads
  - emi
  redemption:
  - type: airmiles
    program: Air India Maharaja Club
    ratio: '1:1'
    constraints: Current Air India co-brand terms specify 1 SBI Reward Point = 1 Maharaja Point. Signature conversion requires at least 10,000 points. Converted points post within 7 days and expire 24 months after credit. SBI terms also say redemption minimums of 5,000 or 10,000 may apply; no fixed INR value is published.
  source:
    url: https://www.sbicard.com/sbi-card-en/assets/docs/pdf/Air-India-Signature-Combined-TC-16JULY2025.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    notes: Current Air India co-brand page confirms the 1:1 transfer and 24-month Maharaja Points validity; SBI combined terms confirm 4 base points, Air India exclusions including balance transfers and charges, and accelerated earn conditions. SBI terms explicitly state Reward Points have no cash or monetary value.
    local_refs:
    - docs/sources/sbi/air-india-signature/signature-combined-terms.pdf
    - docs/sources/sbi/air-india-signature/signature-air-india-reward-terms.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated
    - rewards.exclusions
    - rewards.redemption
  mcc_exclusions:
  - '5172'
  - '5541'
  - '5542'
  - '5983'
  - '6513'
  - '6540'
  - '6541'
  - '9311'
  - '9399'
  capping_rules:
  - No per-month/statement/annual cap on Air India accelerated Reward Points per the
    card's own Combined T&C (Air-India-Signature-Combined-TC-16JUL2025, sec 11.4);
    earn is 10 RP/₹100 (cut from 30 RP w.e.f. 31-Mar-25).
benefits:
- effective_from: '2013-09-16'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 8
      cycle: annual
      guests_per_visit: 0
      via:
      - visa
      notes: 8 complimentary domestic Visa lounge visits per year, maximum 2 per quarter. The 10-Jan-2026 quota revision explicitly excludes this card, and SBI says other card quotas remain unchanged.
    international:
      visits_per_cycle: 0
      cycle: annual
      via:
      - priority-pass
      notes: One complimentary Priority Pass membership, valid 24 months. No complimentary visits; all visits are chargeable up to USD27 plus taxes. Complimentary visits do not apply to Priority Pass lounges inside India.
  milestones:
  - spend_inr: 500000
    cycle: annual
    benefit: 20,000 bonus Reward Points
    reward_kind: points
    reward_units: 20000
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
  - spend_inr: 1000000
    cycle: annual
    benefit: 30,000 bonus Reward Points
    reward_kind: points
    reward_units: 30000
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
  - spend_inr: 2000000
    cycle: annual
    benefit: 50,000 bonus Reward Points
    reward_kind: points
    reward_units: 50000
    reward_currency_name: Reward Points
    trigger_window: anniversary-year
  welcome:
  - condition: Joining fee paid
    benefit: 20,000 Reward Points and complimentary Air India Maharaja Club membership
  fuel_surcharge_waiver: null
  insurance:
  - type: lost-card-liability
    sum_insured_inr: 100000
    conditions: Current SBI card terms cover up to INR100,000 for fraudulent loss; reporting terms specify 3 days before and 7 days after reporting, subject to policy terms. Air India's co-brand page states 48 hours before reporting, creating a source conflict.
  concierge: false
  other:

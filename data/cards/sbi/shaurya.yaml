      type: issuer-pdf
      confidence: high
      fields_verified: [rewards.base.rate, rewards.accelerated, rewards.exclusions, rewards.mcc_exclusions, rewards.redemption]
      notes: "Card-specific issuer booklet clauses 11.3-11.4: base 1 point and total 5 points per INR 100 on dining, departmental stores, grocery including CSD, and movies; 5,000-point monthly cap and base earning thereafter. Minimum redemption 2,000 points; 2,000 points offsets INR 500."

    mcc_exclusions: ['5172', '5541', '5542', '5983', '6513', '9311', '9399']
    capping_rules:
      - "Accelerated 5X-category points cap at 5,000 per month. After the cap, standard 1 point per INR 100 continues. Points expire after 24 months."

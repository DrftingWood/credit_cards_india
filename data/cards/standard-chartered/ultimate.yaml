benefits:
- effective_from: '2026-10-25'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: 0
      via:
      - mastercard
      notes: 4 complimentary domestic lounge visits per calendar quarter.
    international:
      visits_per_cycle: 1
      cycle: monthly
      guests_per_visit: 0
      via:
      - priority-pass
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: One complimentary Priority Pass visit outside India per month if previous calendar-month spend exceeds
        INR 20,000; Priority Pass membership for primary and supplementary cardholders, usage otherwise chargeable.
  golf:
    rounds_per_cycle: 1
    cycle: monthly
    lessons_per_cycle: 1
    notes: Current linked Ultimate-specific terms section 11 grants one complimentary domestic golf game and one coaching session per month per valid card. Booking is subject to course/instructor availability, requests normally require four days' advance notice, and convenience/other charges may apply even for complimentary sessions. The product story's twice-monthly wording is consistent with counting the game and coaching session; the product value chart's four annual golf sessions is an illustrative valuation, not the entitlement quota.
  welcome:
  - condition: Primary cardholder pays the INR 5,000 joining fee; supplementary cardholders are excluded.
    benefit: 6,000 Reward Points
    value_inr: 6000
    window_days: 60
  insurance:
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: Primary cardholder only; international air travel fare must be paid using the card; subject to policy

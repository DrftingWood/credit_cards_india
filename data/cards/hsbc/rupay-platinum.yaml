benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Primary or add-on eligibility is specified by the offer terms; new RuPay Platinum cardholder
      must download HSBC India Mobile Banking app, have updated KYC, and make at least INR5,000 in eligible
      sales transactions within 30 calendar days of issuance. Offer runs 2025-07-15 through 2026-12-31; no
      other welcome/intro offer may be combined.
    benefit: INR500 cashback
    value_inr: 500
    window_days: 30
  - condition: Online application with successful Video KYC and card issuance during 2026-01-01 through 2026-10-31;
      subject to offer terms.
    benefit: INR250 Amazon eGift Voucher
    value_inr: 250
    window_days: null
  - condition: Activate HSBC RuPay credit card during the offer period; register as an EazyDiner user. Add-on
      cards are not eligible; voucher/code is sent within 60 days from month end of eligibility.
    benefit: Complimentary EazyDiner Prime membership for 2 months
    value_inr: null
    window_days: null
  dining:
    program: District by Zomato
    discount_pct: 10
    notes: Current issuer page lists 10% savings on dining, activities and shopping, plus buy-one-get-one cinema
      tickets. Offer terms apply; offer listing states validity through 2026-10-31.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 3000
    cycle: annual
    notes: Fuel transaction INR400-INR4,000 inclusive; issuer product page advertises annual savings up to
      INR3,000. Fuel does not earn reward points.
  concierge: false
  source:
    url: https://www.hsbc.bank.in/credit-cards/products/rupay-platinum-credit-card/
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hsbc/rupay-platinum/rupay-platinum-welcome-offer-retrieved-2026-10-27.pdf
    - docs/sources/hsbc/rupay-platinum/rupay-eazydiner-terms-retrieved-2026-10-27.pdf
    - docs/sources/hsbc/rupay-platinum/rupay-platinum-service-guide-retrieved-2026-10-27.pdf
    fields_verified:
    - benefits.welcome[0].value_inr
    - benefits.welcome[0].window_days
    - benefits.welcome[1].value_inr
    - benefits.welcome[2].window_days
    - benefits.dining.discount_pct
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    notes: The card is branded RuPay Platinum; issuer material says international acceptance is powered by
      JCB, which the single network field cannot fully represent. Current lounge benefit is not advertised
      on the RuPay Platinum product page; none asserted.
  other:
  - name: RuPay UPI and JCB international acceptance
    description: HSBC says the card can be linked to UPI apps and earn reward points on eligible card-linked
      UPI transactions. International ATM/POS acceptance is powered by JCB in over 160 countries/regions; HSBC
      Service Guide says international usage must be enabled.

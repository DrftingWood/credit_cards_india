benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 1
      cycle: quarterly
      guests_per_visit: null
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: One domestic visit is available in the calendar quarter after at least INR 50,000 of net retail spend in the preceding calendar quarter. Primary cardholders only; add-on cards are ineligible. A non-reversible INR 2 validation charge applies. This replaced same-quarter language in the prior record.
    international:
      visits_per_cycle: 4
      cycle: annual
      guests_per_visit: null
      notes: One visit per calendar quarter outside India (four annually) using Priority Pass; Priority Pass use within India costs USD 35 plus GST, and excess international visits cost USD 35 plus applicable taxes. Priority Pass membership is issued on request for Vetta.
  milestones:
  - spend_inr: 0
    cycle: annual
    benefit: 1,000 Reward Points on any retail transaction on your birthday
    value_inr: null

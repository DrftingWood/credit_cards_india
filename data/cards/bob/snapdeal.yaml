benefits:
- effective_from: 2026-04-01
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Card usage within first 30 days of issuance
    benefit: Snapdeal vouchers worth up to INR 500 on card usage within first 30 days; offer applies only where joining fee is paid.
    value_inr: 500
    window_days: 30
  - condition: Spend INR 5,000 or more within 60 days of issuance
    benefit: 500 bonus reward points on at least INR 5,000 eligible spend within 60 days; RuPay UPI transactions do not qualify for this bonus or the voucher activation benefit.
    value_inr: 125
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+).
  - name: Reward point expiry and redemption
    description: Points expire 24 months after accrual. Auto-redemption was discontinued from 1-Jul-2025; manual redemption is required, with at least 1,000 points for statement credit.
  - name: Smart EMI
    description: Eligible purchases above INR 2,500 can be converted to Smart EMI for 6–48 months.

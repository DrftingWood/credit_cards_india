  capping_rules:
  - Transactions below INR 100, the listed MCC categories, fuel, ATM cash withdrawals and quasi-cash earn no cashback. At least four transactions in a statement cycle are required to receive the accelerated domestic online cashback. Cashback is posted to the following statement; returns and reversals debit the associated cashback. Merchant online/international flags and MCC coding determine eligibility. Pending cashback may be forfeited on cancellation, conversion to another BOBCARD variant, non-payment blockage or breach of card terms.

id: idfc-first-gaj
name: IDFC FIRST Gaj Credit Card
image_path: /cards/idfc-first/gaj.webp
issuer: idfc-first
network: visa
network_tier: infinite
tier: super-premium
card_type: credit
co_brand: null
status: invite-only
launched_on: 2025-12-29
discontinued_on: null
fees:
- effective_from: 2025-12-29
  effective_until: null
  joining_fee_inr: 12500
  annual_fee_inr: 12500
  fee_waiver:
    spend_inr: 1000000
    cycle: annual
    conditions: Spend threshold is measured in the card anniversary year; fee is waived for the next year.
  forex_markup_pct: 0
  finance_charge_monthly_pct: null
  cash_advance_fee:
    flat_inr: 199
  gst_applicable: true
  notes: >-
    Invite-only metal card for select IDFC FIRST Private Banking customers. Joining fee
    is payable upfront after approval; annual fee starts from the second card-anniversary
    year. The current issuer page says ATM advances cost INR 199 + GST per withdrawal,
    are interest-free for up to 45 days, and are limited to INR 10,000 per transaction.
    A card-specific purchase APR was not found in the current issuer material; the old
    3.5% monthly value is therefore not asserted. Annual-fee waiver is at INR 10 lakh
    in the preceding card-anniversary year.
      Merchant DCC is separate from issuer forex markup; linked Gaj terms state
      merchants may impose DCC charges up to 5%.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/metal-credit-card/gaj
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - fees.joining_fee_inr
    - fees.annual_fee_inr
    - fees.fee_waiver.spend_inr
    - fees.forex_markup_pct
    - fees.cash_advance_fee.flat_inr
    local_refs:
    - docs/sources/idfc-first/gaj/gaj-launch-2025-12-29.pdf
    - docs/sources/idfc-first/gaj/gaj-privileges-retrieved-2026-10-27.pdf
    - docs/sources/idfc-first/gaj/current-customer-mitc.pdf
    notes: >-
      Card launch date and invitation-only status are also confirmed in the issuer's
      29-Dec-2025 release:
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/news-media/press-release/Press-Release-Gaj-Credit-Card-29122025.pdf
      Issuer page states the Gaj cash advance charge and 45-day interest-free period.
      The amount is a flat fee per transaction irrespective of withdrawal amount
      or location.
rewards:
- effective_from: 2025-12-29
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 5
    per_inr: 150
    unit_value_inr: null
    unit_value_inr_realized: null
    notes: >-
      5 points per INR 150 on eligible domestic spends; 3 points per INR 150 on international
      transactions. The special 1-point categories are represented separately below.
      Rewards are limited to spends up to the credit limit in each billing cycle.
      Points do not expire while the card remains active; unpaid minimum due reverses
      rewards for the cycle. Transactions below INR150 earn no points.
  accelerated:
  - category: app-hotel-booking
    canonical_categories:
    - travel
    multiplier: 10
    effective_rate: 50
    effective_per_inr: 150
    cap_per_cycle: 15000
    cap_unit: points
    cycle: monthly
    notes: >-
      Total 50 points per INR 150 on hotel bookings through Travel & Shop in the
      IDFC FIRST mobile app: 5 regular points plus 45 bonus points. The shared monthly
      limit is 15,000 bonus points (the issuer's dated reward terms specify the cap
      for bonus points, not total points).
  - category: app-flight-booking
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 25
    effective_per_inr: 150
    cap_per_cycle: 15000
    cap_unit: points
    cycle: monthly
    notes: >-
      Total 25 points per INR 150 on flight bookings through Travel & Shop in the
      IDFC FIRST mobile app: 5 regular points plus 20 bonus points. The 15,000 monthly
      limit is shared with hotel bookings and applies to bonus points.
  - category: international-spend
    canonical_categories:
    - international
    multiplier: 0.6
    effective_rate: 3
    effective_per_inr: 150
    cap_status: not-published
    cap_unit: points
    cycle: monthly
    notes: >-
      3 points per INR 150 on international transactions, including international
      merchants/acquirers processing INR transactions in India.
  - category: reduced-rate-categories
    canonical_categories:
    - insurance
    - utilities
    - rent
    - government
    - wallet-loads
    - education
    - other
    effective_rate: 1
    effective_per_inr: 150
    cap_status: not-published
    cap_unit: points
    cycle: monthly
    notes: >-
      1 point per INR 150 for insurance, utilities, rent/property management,
      government, wallet loads, education, railways and FASTag. Applies to domestic
      and international transactions. The category schema has no separate entries
      for railways and FASTag.
  exclusions:
  - fuel
  - emi
  - cash-advance
  - other
  mcc_exclusions:
  - '5172'
  - '5541'
  - '5542'
  - '5552'
  - '5983'
  - '6020'
  - '6011'
  - '6012'
  redemption:
  - type: other
    program: IDFC FIRST Rewards - Travel & Shop app bookings
    rate_inr_per_unit: 1
    constraints: >-
      1 point = INR 1 for eligible app flight and hotel bookings; points can cover up
      to 70% of booking value. Travel redemption is capped at 150,000 points/month and
      300,000 points/year.
  - type: catalog
    program: IDFC FIRST Rewards - other redemptions
    rate_inr_per_unit: 0.25
    constraints: >-
      INR 0.25 per point for gift vouchers, products and eligible online purchases
      using points.
  source:
    url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/GAJ-CC-Rewards-Structure-TnC-22-12-25.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
    - rewards.redemption.rate_inr_per_unit
    notes: >-
      The issuer page duplicates the detailed reward structure. Current May-2026
      cardmember notice adds a credit-limit-per-billing-cycle accrual ceiling effective
      18-Jun-2026. The bonus-point cap applies only to app hotel/flight bonus points;
      redemptions have separate monthly and annual caps.
    local_refs:
    - docs/sources/idfc-first/gaj/gaj-rewards-terms-retrieved-2026-10-27.pdf
    - docs/sources/idfc-first/gaj/gaj-may-2026-communication.pdf
    - docs/sources/idfc-first/gaj/gaj-product-guide-2025-12-22.pdf
benefits:
- effective_from: 2025-12-29
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: null
      via:
      - visa
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: >-
        Four visits total per quarter, including one guest visit per quarter; guest
        access is included in the overall quota. At least INR 20,000 spend in the
        current calendar month unlocks visits in the next month.
    international:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: 0
      via:
      - dreamfolks
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      notes: >-
        Four global lounge visits per quarter via DreamFolks. At least INR 20,000
        spend in the current calendar month unlocks visits in the next month; some
        lounges require advance booking.
  golf:
    rounds_per_cycle: null
    cycle: monthly
    lessons_per_cycle: null
    notes: >-
      Up to 24 rounds/lessons per year as a shared pool: spend INR 20,000 in a
      statement cycle to unlock one round or lesson, or INR 40,000 to unlock two.
      Each unlocked visit is valid for up to 60 days. Terms do not promise two
      rounds plus two lessons independently, so their separate counts are unknown.
  welcome:
  - condition: Joining fee paid; first Gaj application only
    benefit: 12,500 reward points; plus spend INR 1 lakh within 60 days of card generation for 25% off a select 5-star hotel voucher, capped at INR 5,000
    value_inr: 12500
    window_days: 60
  insurance:
  - type: other
    sum_insured_inr: 25000
    conditions: >-
      Trip cancellation reimbursement for non-refundable flight costs, up to INR
      25,000; flight and hotel limits are separate. Two cancellations maximum per
      year across primary and add-on cardholders.
  - type: other
    sum_insured_inr: 25000
    conditions: >-
      Trip cancellation reimbursement for non-refundable hotel costs, up to INR
      25,000; flight and hotel limits are separate. Two cancellations maximum per
      year across primary and add-on cardholders; INR 50,000 total maximum.
  - type: air-accident
    sum_insured_inr: 10000000
    conditions: >-
      INR 1 crore personal air accident cover; detailed current public issuer terms
      state the amount but full policy conditions should be confirmed with insurer.
  - type: personal-accident
    sum_insured_inr: 1000000
    conditions: INR 10 lakh accidental death/permanent disability cover; policy terms apply.
  - type: credit-shield
    sum_insured_inr: 50000
    conditions: >-
      INR50,000 cover for eligible card debits following accidental death; active-card
      requirement and detailed issuer/insurer terms apply.
  - type: lost-card-liability
    sum_insured_inr: 50000
    conditions: Covers lost-card liability, counterfeit, skimming and online fraud protection; policy terms apply.
  - type: purchase-protection
    sum_insured_inr: 50000
    conditions: Purchase protection against standard fire/allied perils and burglary at residential premises; policy terms apply.
  - type: baggage-loss
    sum_insured_inr: null
    sum_insured_amount: 500
    sum_insured_currency: USD
    conditions: Travel insurance for loss of checked-in baggage; policy terms apply.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: Travel insurance for flight delay; policy terms apply.
  - type: trip-delay
    sum_insured_inr: null
    sum_insured_amount: 100
    sum_insured_currency: USD
    conditions: Travel insurance for delay of checked-in baggage; policy terms apply.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 300
    sum_insured_currency: USD
    conditions: Travel insurance for loss of passport and other documents; policy terms apply.
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: null
    max_txn_inr: null
    cap_per_cycle_inr: 300
    cycle: monthly
    notes: 1% fuel surcharge waiver, capped at INR 300 per statement cycle; transaction range is not published in the linked Gaj privileges terms.
  other:
  - name: Railway lounge access
    description: Four complimentary visits per quarter at select Indian railway terminals, unlocked by INR 20,000 spend in the current calendar month for the following month.
  - name: Airport meet and greet
    description: One complimentary service annually at major Indian airports after USD 1,000 international POS spend in the prior 12 months; 10% discount applies to other bookings and additional guests.
  - name: Airport transfers
    description: Discounts on limousine airport transfers in over 3,000 cities across 83 countries; discount amount is not specified.
  - name: Hotel stay offer
    description: ITC Hotels offers a complimentary third night after two consecutive paid nights and 50% off the second night; Elivaas offers the same two-night/third-night and second-night promotions, subject to offer terms.
  - name: Luxury hotel privileges
    description: Benefits at 900+ luxury hotels may include room upgrades, Wi-Fi, continental breakfast, VIP status, and late checkout, subject to hotel availability and terms.
  - name: Roadside assistance
    description: Complimentary roadside assistance service described by issuer as worth INR 1,399.
  - name: FIRST Digital RuPay Credit Card
    description: Lifetime-free companion RuPay card for UPI; earns 1 Reward Point per INR 150 on eligible UPI spends, redeemable at INR 1 per point on app travel.
  - name: Movie and merchant offers
    description: Current issuer page advertises movie-ticket discounts and offers across 300+ brands but does not publish a Gaj-specific movie partner, value or conditions.
    value_inr: null
  - name: Annual fee payment benefit
    description: 12,500 Reward Points worth up to INR12,500 are credited on annual-fee payment if the INR10 lakh waiver milestone is not reached.
    value_inr: 12500
  concierge: true
  source:
    url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/IDFC-Gaj-Card-TC-Revised-dec25-v3-dec24.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - benefits.lounge_access.domestic.visits_per_cycle
    - benefits.lounge_access.international.visits_per_cycle
    - benefits.golf.rounds_per_cycle
    - benefits.insurance
    - benefits.fuel_surcharge_waiver
    local_refs:
    - docs/sources/idfc-first/gaj/gaj-privileges-retrieved-2026-10-27.pdf
    - docs/sources/idfc-first/gaj/gaj-product-guide-2025-12-22.pdf
    - docs/sources/idfc-first/gaj/gaj-launch-2025-12-29.pdf
    notes: >-
      Current Gaj privileges PDF (still linked by the live card page) specifies the
      spend-gated lounge quotas, trip-cancellation sublimits, insurance schedule,
      fuel cap and lifestyle offers. It does not include a full policy wording or
      detailed eligibility/exclusion clauses for the insurance amounts.

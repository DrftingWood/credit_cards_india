    cycle: annual
    benefit: 15,000 bonus Zen Points on INR600,000 eligible anniversary-year spend instead of the INR300,000 milestone award.
    value_inr: 3000
    reward_kind: points
    reward_units: 15000
    reward_currency_name: Zen Points

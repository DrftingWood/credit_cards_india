rewards:
- effective_from: 2026-08-28
  effective_until: null
  currency: points
  currency_name: Stars
  base:
    rate: 1
    per_inr: 500
    unit_value_inr: 1.0
    unit_value_inr_realized: null
  accelerated:
  - category: spend-active
    multiplier: 2
    effective_rate: 2
    cap_unit: points
    cycle: monthly
    notes: First reward cycle earns 2 Stars per cumulative INR 500. In later cycles, earn 2 per cumulative INR 500 when previous-cycle net eligible spend is at least INR 100; otherwise the base is 1 per cumulative INR 500. Reward cycle runs from the 16th to the 15th.
    canonical_categories:
    - other
    source:
      url: https://www.axis.bank.in/cards/credit-card/google-pay-flex-axis-bank-credit-card
      retrieved_on: 2026-10-26
      type: issuer-page
      confidence: high
      local_refs:

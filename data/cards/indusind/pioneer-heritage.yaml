      - issuer-direct
      notes: Newer Heritage variant has unlimited access; erstwhile variant is limited to 2 visits per quarter. Select lounges and network eligibility apply; no spend gate is stated for Heritage.
    international:
      visits_per_cycle: unlimited
      cycle: quarterly
      guests_per_visit: 0

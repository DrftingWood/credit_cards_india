    notes: >-
      IDFC FIRST Bank's 17-Sep-2026 announcement confirms zero forex markup for all
      existing and new cards, superseding the older general 3.5% MITC entry. The
      announcement: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/news-media/press-release/Press-Release-IDFC-FIRST-Bank-introduces-Zero-Forex-Markup-across-all-its-Credit-Cards-existing-and-new-1709.pdf.
      product page gives dynamic APR 0.71%-3.85% monthly (8.5%-46.2%
      p.a.), so there is no single current monthly rate. It states interest-free ATM
      withdrawals until the due date with a flat INR 199 per withdrawal, represented
      as a flat cash advance fee. The older 2.5%/INR 500 cash fee and fixed
      3.5% monthly interest are removed. Page states 15% of total due late fee, min
      INR 100/max INR 1,300. Source references: current product page and
      https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/MITC-Document-Customer.pdf?77=
rewards:
- effective_from: 2026-06-18
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 3
    per_inr: 150
    unit_value_inr: 0.25
    unit_value_inr_realized: null
    excluded_categories:
    - fuel
    - groceries
    - utilities
    - insurance
    - emi
    notes: >-
      The source's accelerator schedule separately awards points on HPCL fuel,
      grocery/utility and IDFC FASTag. Ordinary retail and UPI purchases earn 3 points
      per INR 150. The issuer describes HP Pay Happy Coins as a separate loyalty-wallet
      reward, not card Reward Points. Reward Points are earned only up to the credit
      limit per billing cycle; they are withheld/reversed for a cycle when at least the
      Minimum Amount Due is not paid by the due date. The INR 0.25 point value is
      directly stated for travel-booking redemption; universal realized value is not
      asserted.
  accelerated:
  - category: hpcl-fuel
    canonical_categories:
    - fuel
    effective_rate: 30
    effective_per_inr: 150
    cap_per_cycle: 2400
    cap_unit: points
    cycle: statement
    channel:
      required: false
      class: fuel-network
      merchants:
      - hpcl
    notes: Up to INR 12,000 eligible HPCL fuel spend per statement cycle; cap 2,400 points. HP Pay app is not required for card points.
  - category: grocery-utility
    canonical_categories:
    - groceries
    - utilities
    effective_rate: 30
    effective_per_inr: 150
    cap_per_cycle: 400
    cap_unit: points
    cycle: statement
    cap_group: grocery-utility-combined
    notes: Combined eligible grocery and utility spend capped at INR 2,000 per statement cycle (400 points), identified by MCC.
  - category: idfc-first-fastag
    canonical_categories:
    - other
    effective_rate: 30
    effective_per_inr: 150
    cap_per_cycle: 200
    cap_unit: points
    cycle: statement
    notes: IDFC FIRST FASTag recharges through IDFC FIRST Mobile Banking or FIRST Forward App; eligible recharge spend capped at INR 1,000 per statement cycle.
  - category: travel-gallery-hotel-flight-bonus
    canonical_categories:
    - travel
    effective_rate: null
    effective_per_inr: 150
    cap_per_cycle: 8000
    cap_unit: points
    cycle: monthly
    notes: >-
      Since 18-Jun-2026, issuer terms state 26.7% bonus Reward Points on hotels and
      13.3% on flights booked in the IDFC FIRST mobile app, capped at 8,000 bonus
      points per calendar month. The percentage's calculation basis is not encoded
      because the terms' displayed “up to” rate is not safely convertible to the
      schema's absolute earn units. EMI transactions and Cash+Points bookings do not
      earn this bonus; credited after travel/check-in.

    rate_inr_per_unit: 1.0
    constraints: 1 Reward Point = INR1. Statement-credit redemption via YES Rewardz, with no redemption charge.
  notes: Current terms apply to transactions from 15-Dec-2025; the issuer page states that through 14-Dec-2025 the

- effective_from: '2026-06-15'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via: []
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      notes: Two complimentary visits per quarter for the primary cardmember. Domestic access requires INR 75,000 eligible spend in the previous quarter; international lounge access has no spend threshold under the current general MITC.
    international:
      visits_per_cycle: 4
      cycle: annual
      guests_per_visit: 0
      via: []
      notes: Four complimentary visits per year for the primary cardmember; no previous-quarter spend gate applies to international lounge access. The current issuer product page references Priority Pass and third-party lounge terms.
  golf:
    lessons_per_cycle: 1
    cycle: monthly
    notes: One golf lesson per calendar month and four additional green-fee-waiver sessions at selected golf courses; the issuer page does not specify the period for the four additional sessions.

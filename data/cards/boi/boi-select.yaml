        description: "3-month Swiggy One membership per annum (free deliveries + discounts)."
      - name: Health check-up
        description: "Annual customised health check-up package (once per annum)."
    source:
      url: https://bankofindia.bank.in/credit-card/rupay-select
      retrieved_on: 2026-07-04
      type: issuer-pdf
      confidence: high
      local_refs:
        - docs/sources/boi/rupay-select/Rupay_Select.pdf
      fields_verified:

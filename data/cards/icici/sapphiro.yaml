benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 4
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      notes: Primary cardholder only; INR75,000 or more in preceding quarter unlocks following quarter. FAQ says
        paired Mastercard+Amex dual variants receive 2 visits/quarter per variant.
    international:
      visits_per_cycle: 2
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Primary cardholder only; two complimentary international visits per year.
  golf:
    rounds_per_cycle: 4
    lessons_per_cycle: 4
    cycle: monthly
    notes: One round or lesson for every INR50,000 retail spend in previous calendar month, maximum 4/month. Credited
      by 10th of following month and usable for next two months; primary cardholder.
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 500
    notes: Buy one ticket and get up to INR500 off the second ticket, twice monthly. From Apr 1, 2026 requires INR25,000+
      spend in preceding quarter to unlock following quarter; add-on cardholder must individually meet threshold.
      Paired dual-network products get one offer per month per variant per issuer FAQ.
  welcome:
  - condition: Joining fee paid; issuer emails within 45 days; claim through ICICI Rewards.
    benefit: 'Core vouchers: Tata CLiQ INR3,000; EaseMyTrip domestic flights INR4,000 (four INR1,000); Croma INR1,500
      (three INR500). Da Milano coupon offers INR5,000 off purchases INR19,999+, plus 3-month EazyDiner Prime membership.
      Da Milano is a conditional discount, not unconditional cash voucher value.'
    value_inr: 8500
    window_days: 45
  milestones:
  - spend_inr: 400000
    cycle: annual
    benefit: 4,000 Reward Points on INR400,000 spend; 2,000 points for each additional INR100,000, up to 20,000
      points in an anniversary year.
    reward_kind: points
    reward_units: 4000
    reward_currency_name: ICICI Reward Points
    trigger_window: anniversary-year
    is_repeatable: false
  - spend_inr: 100000
    cycle: annual
    benefit: 2,000 points per additional INR100,000 annual spend after INR400,000 initial milestone, subject to
      20,000 points/year maximum.
    reward_kind: points
    reward_units: 2000
    reward_currency_name: ICICI Reward Points
    trigger_window: anniversary-year
    is_repeatable: true
  insurance:
  - type: air-accident
    sum_insured_inr: 30000000
    conditions: Primary cardholder, international travel only, ticket purchased using card. Product FAQ says card
      used at least once in prior 60 days; linked policy updated Dec 2025 defines active card as transaction within
      prior 90 days. Preserve conflict; policy excludes on-duty armed forces, pilots, police and air crew and terrorism.
  - type: personal-accident
    sum_insured_inr: 200000
    conditions: RuPay variant only, per current product page.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: null
    max_txn_inr: 4000
    cap_per_cycle_inr: null
    cycle: monthly
    notes: 1% waiver on fuel transactions up to INR4,000 at fuel outlets in India; primary and Plus/supplementary

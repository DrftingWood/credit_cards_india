  capping_rules:
  - Accelerated card SuperCoins are capped at 300 per transaction for Plus members and 150 per transaction for non-Plus members. These are card-issued coins; Flipkart platform coins are separate and may also apply.
  - Flipkart Plus/non-Plus status is supplied by Flipkart and is not a user-selectable condition in the card schema; calculator results cannot distinguish the two rates. SuperCoins are credited 30 days after Flipkart moves them to pending status.
  - Cashback/reward terms exclude fuel, Flipkart gift cards, EMI/post-facto EMI, wallet loads, jewellery, cash advances, outstanding-balance repayment, fees/charges, Flipkart Health third-party integrated purchases, rent MCC 6513, and the documented excluded MCCs.

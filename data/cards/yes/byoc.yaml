  gst_applicable: true
  notes: 'For regular plastic BYOC, one-time card fee is nil; eco-friendly card is INR249 and metal card INR3,499.
    There is no annual membership fee in current MITC. Ongoing monthly module fees are not represented in the
    schema: BYOC Cashback INR99/month or BYOC Rewards INR49/month. Optional merchant subscription costs
    INR99/149/249 per month for Silver/Gold/Platinum and is separate from the module fee. All fees plus GST.
    Cash advance fee is 2.5% or INR650, whichever is higher, effective 15-Jun-2026. This record represents
    standard BYOC with cashback module, not every configurable combination.'

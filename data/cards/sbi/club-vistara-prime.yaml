  - '6541'
  - '9399'
  - '9311'
  redemption:
  - type: airmiles
    program: Air India Maharaja Club
    ratio: '1:1'
    constraints: Club Vistara balances were migrated to linked Maharaja Club accounts at 1:1 after 12-Nov-2024.
      This was a merger migration of existing account balances, not a cash conversion or a general card-points transfer
      option.
  notes: 'SBI Card T&C: 4 CV Points per INR200 on eligible spend; points have no cash or monetary value. Excludes
    balance transfers, cash advances, financial charges, disputed transactions, Flexipay, merchant EMI, e-wallet
    loads (MCC 6540/6541), rent (6513 from 15-Apr-2024) and government transactions (9399/9311 from 15-Jul-2024).
    Air India says existing CV points migrated 1:1 to Maharaja Points after 12-Nov-2024. Air India further says
    existing Vistara co-brand cardholders continued current benefits through 31-Mar-2026; ongoing 4-per-INR200 earning
    through that date is inferred from continuation of current card-program terms, as no post-merger SBI reward
    schedule was found. CV Points were valid 36 months under the Club Vistara terms; migrated balances were guaranteed
    at least one year from migration under Air India terms.'
  source:

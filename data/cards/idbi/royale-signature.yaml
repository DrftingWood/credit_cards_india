    sum_insured_inr: null
    conditions: Zero lost-card liability is advertised after immediate reporting/blocking; the cardholder remains liable for transactions before reporting.
  - type: fraud-liability
    sum_insured_inr: 500000
    conditions: General IDBI credit-card overview says fraudulent transactions on a lost/stolen card reported within 48 hours are covered up to INR 5 lakh.
  - type: fraud-liability

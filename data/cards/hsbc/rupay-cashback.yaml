  finance_charge_monthly_pct: 3.75
  cash_advance_fee:
    pct: 2.5
    min_inr: 500
  gst_applicable: true
  notes: >-
    Standard foreign currency conversion markup is 3.5%. HSBC currently waives it under a
    card-specific offer on eligible foreign currency transactions from 2025-07-15 through
    2026-12-31; the current snapshot therefore records 0% through that offer period. HSBC
    charges the annual fee when eligible anniversary-year spend does not exceed INR200,000;
    the fee is reversed in full when eligible primary plus add-on spend exceeds that threshold.
    Finance charge is 3.75% monthly (45% p.a.).

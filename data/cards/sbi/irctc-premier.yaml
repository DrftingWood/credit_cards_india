id: sbi-irctc-premier
name: IRCTC SBI Card Premier
issuer: sbi
network: rupay
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: IRCTC
  category: railway
  partner_website: https://www.irctc.co.in
status: active
launched_on: 2021-01-01
discontinued_on: null

fees:
  - effective_from: 2021-01-01
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    fee_waiver:
      spend_inr: 200000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-premier-card.html
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2021-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 125
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.9
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 10
        card_attributable_rate: 10
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "10% value-back (as points) on AC class bookings via IRCTC."
      - category: dining-utilities
        canonical_categories: [dining, utilities]
        multiplier: 1
        effective_rate: 3
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        notes: "3 Reward Points per ₹125 on Dining and on standing-instruction Utility spends."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    redemption:
      - type: voucher
        program: IRCTC
        rate_inr_per_unit: 1.0
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-premier-card.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2021-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [issuer-direct]
        notes: "8 complimentary railway lounge visits per year in India (max. 2 per quarter), primary cardholder only."
    welcome:
      - condition: "1st annual fee paid"
        benefit: "1,500 Reward Points worth ₹1,500"
        value_inr: 1500
        window_days: 45
    milestones:
      - spend_inr: 50000
        cycle: annual
        benefit: "2,500 Reward Points on annual travel spends of ₹50,000"
        value_inr: 2500
      - spend_inr: 100000
        cycle: annual
        benefit: "5,000 Reward Points on annual travel spends of ₹1 lakh"
        value_inr: 5000
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: 250
      cycle: monthly
    other:
      - name: IRCTC transaction charge waiver
        description: 1% + GST transaction charge waiver on IRCTC ticket bookings.
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/irctc-premier-card.html
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.sbicard.com/en/personal/credit-cards/irctc-premier-card.html

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, railway, irctc, rupay, entry]

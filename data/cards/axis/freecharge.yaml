  notes: 'Issuer schedule: joining fee ₹250, first-year annual fee nil, second-year annual fee ₹250. A spend-based annual-fee
    waiver exists, but the product page does not publish its threshold; rent and wallet-load spends are excluded from waiver
    calculation. Card replacement nil; cash payment ₹175; duplicate statement, charge-slip retrieval, outstation cheque,
    mobile alerts and balance inquiry waived/free; overlimit 2.5% (minimum ₹500); cheque return 2% (minimum ₹500); railway
    ticket surcharges as prescribed; EDGE portal redemption ₹99 per transaction and partner transfer ₹199; rent 1%; wallet
    1% on cumulative ₹10,000+ per statement; fuel 1% on cumulative ₹50,000+; education 1% on third-party payments; utilities
    1% on cumulative ₹25,000+; online skill gaming 1% on cumulative ₹10,000+; DCC 3.5% plus taxes. Late fee amount at exactly
    ₹500 total due is not specified on the page. Invite-only: eligible customers see a banner in the Freecharge app. The issuer states a spend-based annual-fee waiver exists, but the current page does not publish its threshold. Current generic terms effective 28 Aug 2026 set DCC markup at 3.5%; rent and wallet-load fees/waiver exclusions remain category-based.'

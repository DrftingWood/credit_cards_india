rewards:
- effective_from: 2022-08-24
  effective_until: null
  currency: points
  currency_name: NeuCoins
  redemption_scope: closed-loop
  ecosystem_label: Tata Neu
  loyalty_program: tata-neu-points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
  accelerated:
  - category: tata-neu-partner-brands
    canonical_categories:
    - online
    - groceries
    - travel
    - dining
    - utilities
    - telecom
    - entertainment
    - other
    effective_rate: 2
    card_attributable_rate: 2
    card_attributable_per_inr: 100
    stacks_with_program: false
    merchants:
    - bigbasket
    - 1mg
    - croma
    - westside
    - tata-cliq
    - ihcl
    - air-india
    - air-india-express
    - cult
    - tata-play
    - titan
    - tanishq
    - qmin
    - tata-pay
    notes: 2% total on non-EMI transactions at eligible partner Tata brands (1% base plus 1% additional), including eligible in-store transactions when merchant IDs qualify. Merchant-specific monthly and annual fair-usage spend ceilings apply; see the archived 24-Oct-2026 card terms. UPI transactions on the RuPay variant earn the UPI rate instead. The separate conditional NeuPass/Tata Neu Rewards benefit can add 5% on selected Tata Neu categories; current eligible categories change and the full program earn is not represented as card-attributable reward here.
  exclusions:
  - fuel
  - wallet-loads
  - cash-advance
  - rent
  - government
  capping_rules:
  - 2% partner Tata-brand benefit is restricted by merchant-specific monthly and annual eligible-spend ceilings; exact limits vary by partner. The current schedule is archived in tata_neu_plus_card_tnc-retrieved-2026-10-27.pdf.
  - Non-UPI grocery earns 1% and is capped at 1,000 NeuCoins per month; insurance 2,000/month; utility 2,000/month; telecom and cable 2,000/month.
  - From 1-Jul-2025, online skill-based gaming MCC 5816 earns no NeuCoins.
  - RuPay-only UPI rewards are not applicable to this Visa variant.
  - Wallet loads, gift/prepaid card loads, voucher purchases (MCC 6540), Smart EMI/Dial-an-EMI, outstanding balances, and card fees/charges are excluded. The card terms list Tata Pay bill payments and eligible gift-card purchases under the separate partner-merchant schedule; those transactions remain subject to its caps.
  - Education payments through third-party apps are excluded; direct school/college website or on-premises POS education payments remain eligible. Smart EMI and Dial-an-EMI are excluded, while eligible merchant EMI earns 1% on principal. These detailed exclusions are recorded here because the exclusion enum cannot express them without over-excluding eligible transactions.
  - Effective 25-Nov-2026, HDFC will require manual in-app claiming of card-earned NeuCoins; unclaimed points expire after 12 months from statement, and claimed points expire 12 months after credit to Tata Neu. Up to three successful claims/day, minimum claim 100 points. This is an announced future change and is not applied to the current pre-effective-date behavior.
  redemption:
  - type: voucher
    program: Tata Neu App/Website and eligible Tata brands
    rate_inr_per_unit: 1.0
    constraints: NeuCoins redeem at INR 1 on eligible Tata Neu transactions; not cash convertible. Before 25-Nov-2026, card-earned NeuCoins are automatically transferred to Tata Neu within 7 working days of statement generation and are valid for 12 months (including lock period) from the end of the credit month. Promotional and welcome coins follow their offer terms.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/tata-neu-plus-hdfc-bank-credit-card/pdfs/tata_neu_plus_card_tnc.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/hdfc/tata-neu-plus/tata_neu_plus_card_tnc-retrieved-2026-10-27.pdf
    - docs/sources/hdfc/tata-neu-plus/tata_neu_plus_card_faq-retrieved-2026-10-27.pdf
    - docs/sources/hdfc/tata-neu-plus/tata-neu-pass-neucoins-tnc-retrieved-2026-10-27.pdf
    - docs/sources/hdfc/tata-neu-plus/TATA_Neu_List_Brands-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.currency
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.card_attributable_rate
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption
    notes: Card-specific terms updated 24-Oct-2026 confirm NeuCoins are reward points; 1% non-Tata, 2% partner Tata (base plus additional 1%), RuPay-only UPI rates and current exclusions/caps. Visa record excludes UPI rewards. Product page currently advertises additional conditional 5% NeuPass/Tata Neu Rewards earn on selected categories; program-side amount and dynamic eligibility are noted, not modeled as a card-attributable rate. The 25-Nov-2026 claim-process change is future-dated. Card terms and NeuPass rules are archived locally.
  mcc_exclusions:
  - '5816'

      categories with INR 100 minimum transaction; both 5% categories have separate INR 1,500 billing-cycle caps
      and INR 249 minimum transaction. Select online merchants qualify only when merchant mapping/MCC meets the
      issuer's terms; the MCC and merchant list is in the archived May 2026 inclusion PDF. All categories exclude
      prepaid/gift cards and wallets, rent, government, gaming, education, fuel, jewellery, EMI, cash advances,
      traveller's cheques, foreign-currency purchases and fees; SmartPay and SmartBuy transactions also do not earn.
      Gaming, SmartPay, SmartBuy, foreign-currency purchases and fees are documented here because the schema has no
      specific exclusion values for all of them. Cashback is posted as statement credit. The 12-month Swiggy One
      benefit conflicts with a sentence in the April terms that says
      three months; the product page and the same terms' welcome table say 12 months, so the 12-month value is
      retained and the inconsistency remains documented. 1% exclusion MCC details in the February issuer PDF
      differ from the later April terms' MCC table; the later terms table is reflected in mcc_exclusions.

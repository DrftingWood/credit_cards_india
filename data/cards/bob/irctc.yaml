    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.other
    notes: Live BOBCARD page reviewed 2026-10-26. The product page says 4 railway lounge visits annually (one per
      quarter) but does not publish participating lounge list or guest allowance. 1% IRCTC booking charge cashback
      applies to stated MCCs; fuel waiver GST is not reversed. Lounge/offer and loss-liability limits remain subject
      to the linked full terms.

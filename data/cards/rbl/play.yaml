benefits:
- effective_from: '2026-10-27'
  effective_until:
  movies:
    type: discount
    partner: BookMyShow
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 500
    notes: Monthly benefit requires INR5,000 eligible settled spend in billing
      cycle, excluding the issuer-listed categories, fees/charges/GST and EMI
      conversion. One redemption transaction per cycle; movie booking requires
      at least two tickets and discount is lower of INR500 or value of two
      tickets. Stream category discount up to INR500. Activation starts after 6
      PM on the day after billing cycle begins and lasts through cycle end.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 500
    max_txn_inr: 4000
    cap_per_cycle_inr: 100
    cycle: monthly
    notes: Fuel purchase amount excludes surcharge. GST is not reversed. Not
      available on delinquent, over-limit or closed cards.
  concierge: false

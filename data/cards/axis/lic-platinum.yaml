    notes: Current product page confirms nil joining and annual fees, 3.75% monthly finance, 2.5% cash advance (minimum INR 500), and 3.5% foreign-currency markup. The 2026-08-28 bankwide terms revision sets DCC markup to 3.5% (from 1.5%) and raises late fee to INR 1,300 for balances of INR 50,000 or more. Other published charges include INR 30 + GST per reward redemption, rent 1%, 1% education-app fee, and statement-cycle charges after wallet/fuel/utility/gaming spend thresholds; no dedicated schema fields exist for these charges.
rewards:
- effective_from: 2026-08-28
  effective_until: null
  currency: points
  currency_name: LIC Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: null

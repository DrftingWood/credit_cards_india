id: standard-chartered-easemytrip
name: EaseMyTrip Standard Chartered Credit Card
issuer: standard-chartered
network: visa
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: EaseMyTrip
  category: travel-agency
  partner_website: https://www.easemytrip.com
status: active
launched_on: 2022-09-01
discontinued_on: null

fees:
  - effective_from: 2022-09-01
    effective_until: null
    joining_fee_inr: 350
    annual_fee_inr: 350
    fee_waiver:
      spend_inr: 50000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sc.bank.in/credit-cards/easemytrip-credit-card/
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2022-09-01
    effective_until: null
    currency: points
    currency_name: 360 Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.5
      unit_value_inr_realized: 0.5
    accelerated:
      - category: travel-bookings
        canonical_categories: [travel]
        multiplier: 10
        effective_rate: 10
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        notes: "10 Reward Points per ₹100 on standalone hotel & airline bookings; 1 RP per ₹100 on all other retail (1 RP = ₹0.50). Instant booking discounts (20% hotels / 10% flights via EaseMyTrip app, promo EMTSCB) are separate — see benefits."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 1.0
        constraints: "Instant discount at EMT checkout; general cashback as statement credit."
    source:
      url: https://www.sc.bank.in/credit-cards/easemytrip-credit-card/
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2022-09-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [visa]
        notes: "International lounge access (both within and outside India) discontinued w.e.f. 15-Oct-2024; domestic only remains."
    other:
      - name: "EaseMyTrip booking discounts"
        description: "Flat 20% instant discount on hotels + 10% off domestic/international flights (capped) on EaseMyTrip website/app with promo code EMTSCB; ₹125 off bus bookings."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: null
      cycle: monthly
    concierge: false
    source:
      url: https://www.sc.bank.in/credit-cards/easemytrip-credit-card/
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 360000
    self_employed: 360000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.sc.bank.in/credit-cards/easemytrip-credit-card/

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, travel, easemytrip, entry, cashback]

benefits:
- effective_from: 2023-09-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      via:
      - issuer-direct
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: Requires INR50,000 spend in the previous 3 calendar months; waived for issuance month and the following 3 months. Effective 28-Aug-2026, domestic Indian lounges require the Magnus credit card; Priority Pass is not valid domestically.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - priority-pass
      notes: Up to 4 additional guest visits per year with Priority Pass; guest must travel with the primary cardholder. International lounge visits are unlimited.
  welcome:
  - condition: Joining fee paid; first purchase made within 30 days of issue; primary cardholder only
    benefit: 'Choose one voucher worth INR12,500: Luxe gift card / The Postcard Hotels voucher / Yatra gift voucher'
    value_inr: 12500
    window_days: 180
  insurance:
  - type: purchase-protection
    sum_insured_inr: 200000
  - type: baggage-loss
    sum_insured_inr: null
    conditions: USD500 cover for loss/delay in baggage and personal documents per current issuer benefits page.
  - type: credit-shield
    sum_insured_inr: 500000
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 400
    cycle: monthly

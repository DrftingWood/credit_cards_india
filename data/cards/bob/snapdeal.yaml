        description: "Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+)."
    concierge: false
    source:
      url: https://www.bobcard.co.in/credit-card-types/snapdeal-bobcard
      retrieved_on: 2026-07-03


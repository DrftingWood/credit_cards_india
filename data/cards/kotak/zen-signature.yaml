    - rewards[0].base.per_inr
    - rewards[0].base.unit_value_inr
    - rewards[0].base.unit_value_inr_realized
    - rewards[0].accelerated[0].effective_rate
    - rewards[0].reward_cap.max_units
    - rewards[0].mcc_exclusions
    - rewards[0].redemption[0].rate_inr_per_unit
    - rewards[0].redemption[1].rate_inr_per_unit
    - rewards[0].redemption[1].min_units

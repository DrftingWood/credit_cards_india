  redemption:
  - type: other
    program: IDFC FIRST Rewards
    rate_inr_per_unit: 0.4
    fee_inr: 99
    constraints: INR 0.40 per point for flight/hotel bookings through Travel & Shop; INR 99 + GST redemption fee per transaction. Travel-booking redemptions are capped at 100,000 points per calendar month and 200,000 per calendar year.
  - type: catalog
    program: IDFC FIRST Rewards
    rate_inr_per_unit: 0.25
    fee_inr: 99
    constraints: INR 0.25 per point on other redemption options; INR 99 + GST redemption fee per transaction.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/metal-credit-card/ashva
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated.eligible-incremental-spend-above-20000.effective_rate
    notes: >-
      Effective 18-Jun-2026, reward points accrue only on spends up to the credit
      limit per billing cycle. The 5X rate applies to eligible monthly spend up to
      INR 20,000; eligible incremental spend above INR 20,000 earns 10X. The schema
      cannot represent that cumulative monthly threshold exactly, so these rates
      are retained here rather than scored as if they applied to all spend.
      The May-2026 cardmember notice says app hotel bookings earn a 20% bonus and
      flights a 10% bonus over applicable rewards. The current product page and
      Ashva reward T&Cs still show fixed bonuses of 30 points per INR 150 on hotels
      and 15 per INR 150 on flights (the T&C illustration instead says 10 on
      flights) with a 15,000-point monthly bonus cap. This issuer conflict is
      unresolved; no app-booking bonus rate is modeled. The issuer's general
      rewards page also says Ashva earns 10X on birthday purchases, but card-specific
      birthday terms are not published.
      The associated FIRST Digital RuPay UPI card earns 1 point per INR 150 on
      transactions up to INR 2,000 and 3 points per INR 150 above INR 2,000;
      UPI spend contributes to the Ashva threshold. Other exclusions include
      fees/charges and GST, loan-on-card, balance transfer, and transactions below
      INR 150. Reward points are credited on statement generation and may be
      reversed if the Minimum Amount Due is unpaid. Points do not expire while
      the card remains active. Reward history before 18-Jun-2026 was not rebuilt
      from a complete series of dated issuer notices.

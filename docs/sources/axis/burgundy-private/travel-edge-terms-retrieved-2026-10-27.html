r their respective brand names, as listed on the Axis Bank’s Travel EDGE Platform.\u003c/li\u003e \u003cli\u003eVisitor A Visitor is a user of Axis Bank’s Travel EDGE Platform.\u003c/li\u003e\u003c/ol\u003e \u003cp\u003eThe following terms and conditions apply to all visitors or Axis Bank Members of Axis Bank’s Travel EDGE Platform.\u003c/p\u003e\u003cbr\u003e \u003col\u003e\u003cli\u003eThese terms and conditions (Terms) shall apply to the Bank Member who agrees to be bound by the same and shall regulate the provisions of the specified products and services provided by Axis Bank Limited. Any Bank Member participating in the EDGE REWARD Program shall be deemed to have read, understood, and accepted these terms and conditions and these terms shall be in addition to and not in derogation of other applicable terms and conditions of any account or any other facility/services offered by Axis Bank and/or such other terms and conditions as may be specified by Axis Bank.\u003c/li\u003e \u003cli\u003eBank Member is accessing the Axis Bank’s Travel EDGE Platform, https://traveledge.axis.bank.in (the Site) for his or her booking and hence Axis Bank shall not be responsible or liable for any loss or damage, or for any personal injury that may be suffered, to the Bank member directly or indirectly, as a result of this transaction. For all transactions carried out at https://traveledge.axis.bank.in, any refunds due to Bank Member’s account (including those on account of transaction failure) will be processed within 15 to 20 working days, subject to the detailed refund terms \u0026 conditions as mentioned on this Axis Bank’s Travel EDGE Platform. The Bank Member acknowledges \u0026 accepts that prices quoted on the Axis Bank’s Travel EDGE Platform can change dynamically and in the event of a transaction failure the prices may increase or decrease in the subsequent booking attempt of the Bank Member. Any such price difference has to be fully borne by the Bank Member. This offer is Travel EDGE platform","content":"","content_point":["\u003col\u003e \u003cli\u003e \u003cp\u003e The following terms and conditions apply to all visitors or users of Axis Bank's Travel EDGE Platform. Please read these Axis Bank's Travel EDGE Platform Terms and Conditions carefully. By accessing or using this platform you explicitly agree to comply with and be bound by the Terms and Conditions of Axis Bank's Travel EDGE Program. When you access any information or purchase/avail any services/offers of any merchant through this platform then the Terms \u0026amp; Conditions of the said merchants apply. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Bank members should have a minimum point balance of 300 EDGE REWARD Points and minimum 500 EDGE MILES to do a redemption on the Axis Bank's Travel EDGE Platform with the specific Redemption product. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e The Bank Registered Email Id \u0026amp; the Mobile No is required to redeem for Services on Axis Bank's Travel EDGE Platform. The Bank Member can redeem services offered by participating merchants, partially with EDGE Points/EDGE MILES \u0026amp; Card together or individually, on the Axis Bank's Travel EDGE Platform. In the case of EDGE Points/EDGE MILES + Pay by Card, the amount can only be paid with Axis Bank Credit \u0026amp; Debit cards. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e While redeeming services at the Axis Bank's Travel EDGE Platform, if EDGE REWARD Points/EDGE MILES get deducted and the redemption does not go through, the EDGE Points/EDGE MILES will be credited into the Bank Member Account in 5-7 working days If the services are being redeemed partially by EDGE Points/EDGE MILES and pay by card, the amount paid by card will be credited to your Bank Member Account in 15 – 20 working days, however, due to any technical reason if the refund does not happen in the stipulated timeline mentioned then we would request you to contact our customer support. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp \u003e Payment of Fees/Service charges/all other amounts due from an Axis Bank Credit/Debit Card Customer to Axis Bank from the usage of the Axis Bank Credit/Debit Card on using the Axis Bank's Travel EDGE Platform and/or otherwise will be governed by the detailed Axis Bank Credit and Debit Card Terms \u0026amp; Conditions.\u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank may suspend Bank Member's redemption of EDGE Points/EDGE MILES where the Axis Bank Credit/Debit Card account is not in good standing (overdue or in the collection) at its sole discretion. Only Bank Member Account having active Axis Bank's Travel EDGE Platform Account can redeem EDGE REWARD points/EDGE MILES on Axis Bank's Travel EDGE Platform. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank is not undertaking the business of online retail trading or shopping by hosting the \u003cq\u003eAxis Bank's Travel EDGE\u003c/q\u003e Platform or anywhere else. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank is merely facilitating the payment to its Bank Members by providing the payment gateway Services. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e By hosting the ‘Axis Bank's Travel EDGE' platform, Axis Bank is neither guaranteeing nor giving any warranty nor making any representation with respect to the offers made by merchants. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank is neither endorsing the merchants or any product/service nor is it responsible for the sale/quality/features of the products/ services under the offer. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank will not be liable or responsible for any information on the ‘Axis Bank's Travel EDGE' Platform whether about the merchant/partners or the services being offered. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Bank will not bear any obligation or liability if the Bank Member purchases/avails of a product/service under an offer. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e If you choose to avail the purchase/a product/service, Axis Bank will neither be a party to nor in any manner concerned with such purchase/availment nor be liable or responsible for any act or omission of the merchant or the Bank Member. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e All service-related queries/complaints will be addressed by Axis Bank's Travel EDGE Bank member customer support. The list of participating merchants is subject to change and will be updated on Axis Bank's Travel EDGE Platform from time to time. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e This facility is subject to applicable law and regulations and would be modified/ discontinued based on the prevailing law/ regulation at any point of time and neither party shall be under any liability or obligation or continue implementation of the said facility till such time the terms are modified by the parties as per the prevailing/ amended law at that point of time. In the event, that the facility cannot be continued without total compliance with the prevailing law at any point in time, this facility shall be deemed to be terminated forthwith from the date when the amended law restricting/prohibiting the facility comes into force. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e These Terms and Conditions shall be governed by the laws of India and the parties to submit to the exclusive jurisdiction of courts of Mumbai. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e All other terms \u0026amp; conditions of Axis Bank, Axis Bank's Travel EDGE Program \u0026amp; related products apply. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e These terms and conditions of use and any additional terms posted on Axis Bank's Travel EDGE Platform, together constitute the entire agreement between Axis Bank and the Bank Member concerning the use of Axis Bank's Travel EDGE Platform. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e The payment gateway used by Axis Bank's Travel EDGE Platform is safe and secure and the Bank Members can make the online payments via a safe transaction process which ensures their personal security codes will not be revealed in any circumstances. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Axis Banks Travel EDGE Platform is not responsible for any content or price errors, omissions, or representations on any of its pages, links or any linked websites since such information is updated or provided directly by the supplier/s. Hence, in no event shall Axis Bank's Travel EDGE Platform be liable for any amendment or cancellation done by the supplier/s without any consent of the customer. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e Vernost Marketing Services Pvt. Ltd. acts as a mere facilitator and the liability is limited to providing the User with a confirmed booking as selected by the user for Flights, Hotels or Experiences. Vernost Marketing Services Pvt. Ltd assumes no liability for the standard of services as provided by the respective Travel Suppliers, neither holds any liability or guarantee with respect to the quality or fitness as represented by the Travel Suppliers. \u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e The User agrees to indemnify and hold harmless Axis Bank Ltd. and/or Vernost Marketing Services Pvt. Ltd, its employees and agents from any liability, claims or damages that may arise from a price discrepancy between the Axis Bank's TRAVEL EDGE platform and/or invoice received from the airline or hotel.\u003c/p\u003e \u003c/li\u003e \u003cli \u003e \u003cp \u003e By making a booking, User understands Vernost Marketing Services Pvt. Ltd merely provides a technology platform for booking of services and the ultimate liability rests on the respective Travel Suppliers only. Thus, the ultimate contract of service is between User and Travel Suppliers. \u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e"]},{"title":"Pay by EDGE Points/EDGE MILES | Pay by EDGE Points+ Card/EDGE Miles + Card ","content":"","content_point":["\u003col\u003e \u003col\u003e \u003cli\u003e \u003cb\u003ePay by EDGE REWARD Points/EDGE MILES \u003c/b\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e \u003cp\u003eRedemption of EDGE REWARD Points/EDGE MILES is subject to:\u003c/p\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e \u003cp\u003eAxis Bank approval and terms \u0026amp; conditions as relevant to the reward.\u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Availability of the reward at the time of redemption request.\u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Restrictions imposed by any supplier or issuer of the reward. \u003c/p\u003e \u003c/li\u003e \u003c/ul\u003e \u003cli\u003e \u003cp\u003e Whenever deemed necessary, Axis Bank may, without notice, cancel the EDGE REWARD Program order or substitute the EDGE REWARD Program with another, of comparable nature and value, as determined by Axis Bank. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Axis Bank reserves the right to introduce new services and replace the existing ones at any point in time without prior intimation to the member. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Only Bank Members having an active EDGE REWARD Program account can request for redemption of EDGE REWARD Points/EDGE MILES. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e The EDGE REWARD Points/EDGE MILES accrued can only be redeemed by the primary relationship-holder, and not by an additional account holder. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Any additional costs incurred in connection with the redemption of EDGE Reward shall be the sole responsibility of the member. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Issuance of a redemption certificate for travel or hotel accommodation does not constitute a reservation. The member is responsible for making all reservations and notifying the participating merchant establishments of the EDGE Reward(s) he/she is going to redeem. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Other Axis Bank benefits, which are activated by use of the EDGE REWARD Programs relationships, do not apply to goods or services received as rewards under the Program. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Axis Bank may suspend redemption of EDGE REWARD Points/EDGE MILES where the Axis Bank Credit Card account is not in good standing (overdue or in the collection). \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Axis Bank shall in no event be responsible or liable for the services redeemed from the EDGE REWARD Points/EDGE MILES, in any manner whatsoever including but not limited to any defect or deficiency in, or in respect to any claim arising out of non-use or use of the EDGE Points/EDGE MILES, or in the usage of redemption certificate for Experience, travel or hotel accommodation or in usage, the durability of any service acquired by the redemption of EDGE REWARDS Points/EDGE MILES. \u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e \u003cli\u003e \u003cb\u003e Pay by EDGE REWARD Points + Card/EDGE MILES + Card \u003c/b\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e \u003cp\u003e ‘EDGE REWARD Points/EDGE MILES plus Card feature allows the member the option to redeem rewards using a combination of EDGE REWARD Points/EDGE MILES and Card payment through Axis Bank Credit/ Debit Card. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e ‘EDGE REWARD Points/EDGE MILES plus Card’ can be used for Experience, Flight \u0026amp; Hotel Bookings on Axis Bank’s Travel EDGE Platform. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e Payment of Card using ‘EDGE REWARD Points/EDGE MILES plus Card feature will only be allowed using Axis Bank payment gateway. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e A minimum redemption of 300 EDGE Points and 500 EDGE MILES is applicable to use ‘EDGE REWARD Points/EDGE MILES plus Card’ feature. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e On cancelation of rewards redeemed, the EDGE REWARD Points/EDGE MILES or plus Card will be refunded in 15 -20 working days. In case there is a failure of the transaction while redeeming the EDGE REWARDS, the EDGE REWARD Points/EDGE MILES will be refunded in 1 working day and cash will be refunded in 7 working days. \u003c/p\u003e \u003c/li\u003e \u003cli\u003e \u003cp\u003e If the member does not cancel the order but raises a chargeback on the Card payment done with Axis Bank, then it is the bank's discretion to allow or reject such requests. \u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/ol\u003e \u003cbr\u003e \u003c/ol\u003e"]},{"title":"Flight Booking","content":"","content_point":["\u003col\u003e \u003col\u003e \u003c/ol\u003e \u003c!-- \u003c/p\u003e --\u003e \u003c/ol\u003e \u003cp\u003e\u003cstrong\u003e \u003cb\u003eAirlines - Generic Conditions\u003c/b\u003e\u003c/strong\u003e\u003c/p\u003e \u003col\u003e \u003cli\u003e The airline tickets available through Axis Bank's Travel EDGE Platform are subject to the terms \u0026amp; conditions of the concerned airline, including but not limited to cancellation and refund policies. \u003cbr\u003e \u003cbr\u003e \u003c/li\u003e \u003cli\u003e Axis Bank’s Travel EDGE Platform merely acts as a facilitator to enable the User to book a flight ticket. The contract of service for utilization of the flight is always between the User and the concerned airline. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Airlines retain the right to reschedule flight times, route, change or cancel flights or itineraries independent of and without prior intimation to Axis Bank’s Travel EDGE Program. As a facilitator Axis Bank’s Travel EDGE Program has no control or authority over the logistics of the airlines and therefore is not liable for any loss, direct or incidental, that a Bank member may incur due to such change or cancellation of a flight.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Different tickets on the same airline may carry different restrictions or include different services and prices. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c!-- \u003cli\u003e EDGE REWARD Points/EDGE MILES earned for the transaction will be credited within 7 working days from the Travel Date of your flight booking. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Credited EDGE REWARD Points/EDGE MILES will be reversed in case the Flight booking is cancelled by the Airline or if the customer contacts the airline directly for cancellation. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e --\u003e \u003cli\u003e The baggage allowance on the given fare is as per the terms decided by the airline, and Axis Bank's Travel EDGE Program has no role to play in the same. Some of the fares shown in the booking flow are hand baggage which do not entitle the User for free check-in baggage and therefore the User will be required to pay separately for check-in baggage. The prices of check-in baggage may vary from airline to airline. The Bank member is advised to contact the airlines for detailed costs. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eName corrections are strictly governed by airline policies and permitted only at the discretion of the airline.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e \u003cb\u003eAncillary Services:\u003c/b\u003e\u003cbr\u003e \u003cul\u003e \u003cli\u003e Axis Bank's Travel EDGE Program allows Bank Member to book additional items related to a flight such as baggage, meals, and seats. \u003c/li\u003e \u003c/ul\u003e \u003cbr\u003e \u003col\u003e \u003cli\u003e \u003cb\u003ePricing: - \u003c/b\u003e \u003cbr\u003e \u003cul\u003e \u003cli\u003e The total price displayed on the Axis Bank’s Travel EDGE Platform on the payment page usually includes base fare, applicable government taxes and convenience fee. It never comprises any personal expense or other additional charges like telephone calls, personal-man services, entrance fees of any monuments and bar charges, etc.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Bank members are required to pay the entire amount prior to the confirmation of their booking(s). In the event the User does not pay the entire amount, Axis Bank’s Travel EDGE Program reserves its right to cancel the booking. Bank member agrees to pay all statutory taxes, surcharges, and fees, as applicable on the date of travel.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e To avail infant fares, any infants or children must be accompanied by an adult as per the terms of the airlines. The age of the infants must be under 0-2 years and Children 2-12 years throughout the entire itinerary. This includes both onward and return journeys.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003c/li\u003e \u003cli\u003e \u003cb\u003eTravel Documents: - \u003c/b\u003e\u003cbr\u003e \u003cul\u003e \u003cli\u003e It shall be the sole responsibility of the Bank Member to ensure they are in possession of valid travel documents such as identity proof, passport, visa (including transit visa), etc. to undertake the travel. Bank Member agrees that in case of inability to travel for not carrying valid travel documents, Axis Bank's Travel EDGE Program shall in no way be held liable.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Bank member understands that the information (if any) provided by Axis Bank’s Travel EDGE Platform, the requirements of travel with the respective airlines of the respective jurisdictions the User may transit through or choose to visit.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003c/li\u003e \u003cli\u003e \u003cb\u003eAvailability, Rules of Service: -\u003c/b\u003e\u003cbr\u003e \u003cul\u003e \u003cli\u003e Some services displayed on Axis Bank's Travel EDGE Platform may not be available for booking in your location or country. So, the reference to any such services on the site does not imply in your geographical location. Services also are subject to availability and the Axis Bank’s Travel EDGE Program is not responsible if any product is unavailable or sold out.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Each service offered by Axis Bank's Travel EDGE platform is governed by the rules and regulations of the respective service provider. You are requested to refer to their rules and regulations as well, before booking with us.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003c/li\u003e \u003cli\u003e \u003cb\u003eVisa Guidelines: - \u003c/b\u003e\u003cbr\u003e \u003cul\u003e \u003cli\u003e Please carry an applicable visa for the respective country you are visiting or transiting through. Please check out the concerned airline and embassy for concerned Visa requirements. \u003c/li\u003e \u003c/ul\u003e \u003cbr\u003e \u003c/li\u003e \u003cli\u003e \u003cb\u003eOther rights: - \u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003col\u003e \u003cli\u003eAny communication or materials sent by you to the Axis Bank’s Travel EDGE Platform by electronic mail or otherwise, including any comments, data, questions, suggestions, or the like will be treated by Axis Bank/merchant as non-confidential.\u003c/li\u003e\u003cbr\u003e \u003cli\u003eAny material submitted to this platform may be adapted, broadcast, changed, copied, disclosed, licensed, performed, posted, published, sold, transmitted, or used by Axis Bank/merchant anywhere in the world, in any medium.\u003c/li\u003e\u003cbr\u003e \u003cli\u003eAll cancellations will be governed by the T \u0026amp; C of the 3rd party service provider and will be subject to a cancellation fee. This fee will vary for different service providers for different cancellations. The fee is subject to change. Only if the 3rd party vendor has a cancellation policy can this be actioned by the service provider only.\u003c/li\u003e\u003cbr\u003e \u003cli\u003eAxis Bank/merchant reserves the right to deny any Bank member access to Axis Bank's Travel EDGE platform if found suspicious or any portion thereof without notice.\u003c/li\u003e\u003cbr\u003e \u003cli\u003eAxis Bank/merchant is merely providing the intermediary service to its Bank members and therefore not be held responsible for the acts, errors, omissions, representations, warranties, breaches, or negligence of any content with regards to the flights, hotels and other categories that can result in damages of any kind, expenses, personal injuries, etc. resulting therefrom.\u003c/li\u003e\u003cbr\u003e \u003cli\u003eAxis Bank and their respective merchants have no liability and will make no refund in the event of any delay, cancellation, overbooking, strike, force majeure, or other causes beyond their direct control and have no responsibility for any additional expense, omissions, delays, re-routing or acts of any government or authority. \u003c/li\u003e\u003cbr\u003e\u003cbr\u003e \u003c/ol\u003e \u003c/ol\u003e \u003c!-- \u003c/p\u003e --\u003e \u003c!--Airlines  Flight Booking Conditions private inventory start --\u003e \u003cp\u003e\u003cstrong\u003e\u003cb\u003eAirlines – Discounted Fare Flight Booking Conditions\u003c/b\u003e \u003c/strong\u003e\u003c/p\u003e \u003col\u003e \u003cli\u003e \u003cb\u003eDOMESTIC (ONE WAY)\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003eDiscount fares are only available for domestic flights (Within INDIA) \u003c/li\u003e \u003cbr\u003e \u003cli\u003e Discount fares can only be availed for one way journey.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares are only available for Adult and Child passengers.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares can only be availed on non-stop flights.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares are non-refundable.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Ancillaries (Meal, Seats and extra baggage) cannot be booked for Discount fares flight bookings.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e GST cannot be claimed on tickets booked under Discount fares.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Frequent flyer number cannot be updated on the tickets booked under discounted fares.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Under Manage booking cancellation TAB will not be available for tickets booked under Discount fares as tickets are non-refundable.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares cannot be clubbed with any other offers or Promotional code (Promo Code).\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares can only be booked using Axis Bank's Credit or Debit card for cash bookings.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Passenger can check the booking details on Airline website one day prior to departure.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Discount fares cannot be collaborated with special fares (Senior citizen, Students, Defence force and Doctors and Nurses).\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Date change is not permitted on bookings done under Special Discount fares .\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003cbr\u003e \u003c!-- \u003c/ol\u003e --\u003e \u003c!-- Sr. Citizen Offer Start --\u003e \u003c!-- \u003col\u003e --\u003e \u003cli\u003e \u003cb\u003eComplimentary Travel EDGE Discount Voucher of Rs. 1500\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e Silver Linings Program customers who have opened their account on or after 22nd November, 2022 will be eligible for a complimentary Travel EDGE Discount Voucher of Rs. 1500, which can be redeemed against domestic air travel bookings subject to meeting the eligibility criteria as mentioned below:\u003cbr\u003e \u003col\u003e \u003cli\u003e Activate their Axis Bank Debit Cards through any spend amount within 45 days of account opening.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e This offer is valid till 31st March, 2025 \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003cli\u003e Travel EDGE discount voucher will have a validity of 12 months from receipt and can be redeemed against any Domestic Travel Booking made through Axis Bank Travel EDGE platform for travels within a month (Eg. If ticket booking on 30th October, 2023, then the travel date should be by 1st December, 2023. Tickets post 1st December, 2023 will not be eligible for discounted voucher offer). \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Flight tickets booked through concierge services are non-refundable. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e In case of Joint account, activation of the Debit Card of the Primary Account holder will be considered. Eligibility will be considered at an account level. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Debit Card will be considered as active if customer uses Axis Debit Card to make a transaction, which can be done either online or offline (POS transactions). ATM transactions or withdrawals will not be considered under successful debit card transactions. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Redemption Process of the Voucher:\u003cbr\u003e\u003cbr\u003e \u003col\u003e \u003cli\u003e Customer will need to call Travel EDGE Concierge Number on 022-6855 4000 and share the Customer ID ,Travel EDGE Discount voucher code and other details required for Booking the Travel with the agent (Travel destination, travel dates and Name as per Aadhaar/ Pan card are to be provided). Post flight selection, a payment link which includes the discounted price post application of Voucher code will be sent on the registered or requested Mobile number and registered email ID of the customer. On payment through an Axis Bank Card only (Debit or Credit card), customer will receive ticket details on their registered email/mobile number.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Customers will not be able to use Axis Edge Reward Points or Edge Miles for payment of tickets booked using these discounted vouchers. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Customers will be eligible to earn Edge Points and Edge Miles basis their Card variant for bookings done using this voucher code.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Only Debit Card activation of card linked to the Senior Savings Account, will be considered. Senior Savings account means accounts under scheme codes SBSPA, SSPRP, PBSPA, BGSPA. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The rewards will be calculated at an account level \u0026amp; the customer has to be a Senior Savings Account Holder as defined in the above point.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Travel EDGE Discount Voucher shall be sent to the registered email/ mobile number of the Primary account holder within 75 days of Account Opening, subject to the customer meeting qualification criteria.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Axis Bank reserves the sole right to decide on whether a purchase transaction meets the eligibility criteria as mentioned in the above Terms \u0026amp; Conditions. All decisions with respect to the offers shall be at the sole and exclusive discretion of Axis Bank and the same shall be final, binding and non-contestable.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003c/ol\u003e \u003cli\u003e \u003cb\u003eTravel EDGE Concierge Services\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e Travel EDGE Concierge services will be available for all Axis Bank Silver Linings Program customers as defined in this document to book flight tickets available on the Axis Travel EDGE Platform. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The Concierge services are available on 022-6855 4000 from 10 am to 10 pm (Monday to Sunday) \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Customers to select “Silver Linings Program” from the IVR option to connect directly with an executive who will help them with their bookings. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Payment for all bookings made through the Travel EDGE Concierge Service will need to be made through an Axis Debit or Credit Card. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003cli\u003e \u003cb\u003eWaiver of Convenience fee and discounts for Senior Citizens on Travel Bookings made through Travel EDGE\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e All Axis Silver Linings Program customers will be eligible for waiver of convenience fee for flight tickets booked through Travel EDGE Platform/Concierge. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Additionally, Silver Lining customers will also be able to avail special pricing on Travel EDGE platform for domestic flight tickets. Special Pricing is dependent on flight sectors and airlines selected and is subject to change on a daily basis. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003cli\u003e \u003cb\u003eCommon Terms \u0026amp; Conditions for Travel EDGE offer \u0026amp; services\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003e Axis Bank reserves the right to add, alter, modify, change or vary all or any of these Terms and Conditions or to replace, wholly or in part, this offer by another offer, whether similar to this offer or not, or to withdraw it altogether at any point in time by providing appropriate notice to customers. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Axis Bank will not be responsible or liable, in any manner whatsoever, in case the above offers are not configured or could not be availed due to any restrictions including DNC/ NDNC or any delay, congestion on any telephone network or line or issues related to computer on-line system, servers or providers, website or mobile app or any other reason beyond the control of Axis Bank. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e In case of any issues relating to the above offers including any dispute or discrepancy or non-receipt of Travel EDGE Discount Voucher / discounted fares or on the eligibility, Axis Bank’s decision shall be final and binding in all respects and the same shall not be disputed by the customer. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e All issues pertaining to this offer to be raised to Axis Bank within 90 days from the last day of fulfillment/ qualification. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The terms and conditions governing the offer shall be in addition to and not in substitution / derogation to the existing Primary Terms and Conditions governing the Axis Savings Account and Debit Card. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The Senior Citizen special discounted fare is not guaranteed. This can be availed only if there are special senior citizen fares given by the Airline for the requested date, flight and destination.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The participation in the offer is entirely voluntary and it is understood, that the participation by the customer shall be deemed to have been made on a voluntary basis. ∙ For more details on Axis Travel EDGE its services/ benefits/ term \u0026amp; conditions visit \u003ca style=\"text-decoration: none;cursor: pointer;color: #97144D;\" href=https://traveledge.axis.bank.in/travel/common/termsandcondition\u003ehttps://traveledge.axis.bank.in/travel/common/termsandcondition\u003c/a\u003e \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ol\u003e \u003c!-- Sr. Citizen Offer End --\u003e \u003c/ol\u003e \u003c!-- second anc start --\u003e \u003cp\u003e\u003cstrong\u003e\u003cb\u003eAirlines – Flight Booking Conditions\u003c/b\u003e \u003c/strong\u003e\u003c/p\u003e \u003col\u003e \u003cli\u003e \u003cb\u003eDOMESTIC\u003c/b\u003e\u003cbr\u003e \u003c/li\u003e \u003col\u003e \u003cli\u003eThe total price displayed on the Axis Bank’s Travel EDGE platform includes all applicable government taxes. \u003c/li\u003e \u003cbr\u003e \u003cli\u003e You are required to pay the entire amount prior to the confirmation of your booking.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Refund against no-show tickets is subject to all the applicable cancellation charges including any promo discount availed at the time of booking.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e To avail of infant fares, an infant must be under 24 months throughout the entire itinerary you are booking. This includes both onward and return journeys. If the infant is 24 months or above on the return journey, you will need to make a separate booking using a child fare.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e All Tickets/Bookings issued by the Bank Member shall additionally be governed under the terms and conditions as laid out by the respective Airlines/supplier.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Bank member should refer to airline T\u0026amp;C before booking/travel to avoid any confusion and/or Dispute afterwards.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e \u003cb\u003eCheck-in:\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003eAs per the airline rules, the standard check-in time begins 2 hours before departure for domestic flights. \u003c/li\u003e\u003cbr\u003e \u003cli\u003eFor international flights, the check-in time is 3 hours before departure.\u003c/li\u003e \u003cbr\u003e \u003cli\u003eInfants must have valid proof-of-age documents showing that the infant is less than two years old.\u003c/li\u003e \u003cbr\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003e Flight Schedule Reconfirmation: -\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003eWe recommend Bank Members to reconfirm their flight schedule timings 24 hours prior to departure to avoid the inconvenience which could be caused due to last-minute schedule change made by the airlines. . \u003c/li\u003e\u003cbr\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003e Airline bookings:-\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003eFor Airline bookings, a Successful Payment deduction does not guarantee a confirmed booking. .\u003c/li\u003e\u003cbr\u003e \u003cli\u003eIn case the booking is not being confirmed by the airline, the entire money would be refunded back to the Bank Member as per the normal refund process. .\u003c/li\u003e\u003cbr\u003e \u003cli\u003eThe liability of the airline is only limited to the payment charged to the card of the Bank Member. . \u003c/li\u003e\u003cbr\u003e \u003cli\u003eIn case of successful payment from Bank Member, and subsequent fare increase, any difference has to be paid by the Bank Member. If Bank Member is not willing to share the fare jump difference, then the booking would be aborted, and the money refunded back to the Bank Member card. .\u003c/li\u003e\u003cbr\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003eCancellations:- \u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003eDiscounted Return Fares: Partial cancellation (Cancellation of One Segment) or segment change is not permitted for Discounted Return Fares. \u003c/li\u003e\u003cbr\u003e \u003c!-- \u003cul\u003e --\u003e \u003cli\u003e\u003cb\u003eCancellation of tickets within 24 hours of the flight:\u003c/b\u003e Cancellation of tickets can be done either by logging on the Axis Bank's Travel EDGE platform account (online) or by calling on the customer care number toll-free number (offline). To cancel the tickets online, Bank members shall have to complete the following procedure:\u003c/li\u003e\u003cbr\u003e \u003cli\u003e*For all non-refundable class tickets, the airline cancellation fee will be equal to Base Fare, YQ and YR charges. \u003c/li\u003e\u003cbr\u003e \u003cli\u003ePlease note as per the latest amendments in the GST effective 1st Jul 2017, there will be a Service Tax levied @ 5% (Other than economy @18%) for all travel originating from India. \u003c/li\u003e\u003cbr\u003e \u003cli\u003eThis is not applicable on any promotional fares offered by airlines as cancellations charges for those will depend on the promotional offer. Each airline has promotional fares also where this cancellation policy does not apply. \u003c/li\u003e\u003cbr\u003e \u003cli\u003eEvery booking made on Axis Bank’s Travel EDGE Platform is subject to cancellation charges levied by the airline, which may vary by flight and booking class. \u003c/li\u003e\u003cbr\u003e \u003cli\u003ePassenger wise cancellation is not permitted. \u003c/li\u003e\u003cbr\u003e \u003c!-- \u003c/ul\u003e --\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003eAmendments:- \u003c/b\u003e \u003cbr\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003eAll amendments come at a fee that varies from airline to airline. In addition to this fee, EDGE REWARD Points/EDGE MILES do not charge any amendment handling fee. \u003c/li\u003e\u003cbr\u003e \u003cli\u003eIf you amend your booking, the difference of fare if any will be charged, over and above the amendment fee. However, if the new fare is lower than the Original fare, the difference in the amount will not be refunded, but the amendment charges as applicable will be collected. \u003c/li\u003e\u003cbr\u003e \u003cli\u003eThe charges levied by the service provider or Airline is Non-Refundable in case of any cancellation that is done post amendment of the booking. \u003c/li\u003e \u003cbr\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003eRefund:-\u003c/b\u003e \u003cbr\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e The refund shall be processed within 15 – 20 working days from the date of the cancellation request being made. The refund will be credited back to the same account from where the payment was made. For example, if the Bank member used a credit card, Axis Bank’s Travel EDGE Program would make an appropriate charge reversal. If the Bank Member used a debit card, Axis Bank’s Travel EDGE Program would credit the money back to the debit card. \u003c/li\u003e\u003cbr\u003e \u003cli\u003e Where the Bank Member has cancelled his/her booking directly with the airlines, he/she will need to inform Axis Bank's Travel EDGE Program with valid documentation to initiate the refund process. It is advisable to contact Axis Bank's Travel EDGE platform within 48 hours of the cancellation request. Any time later would require the Bank member to send a scanned copy of your E-Ticket endorsed by the airlines to Axis Bank's Travel EDGE Program. \u003c/li\u003e\u003cbr\u003e \u003cli\u003e Axis Bank’s Travel EDGE Program will be able to transact the Bank Member's refund only after receipt and/or confirmation of refund from the airline. \u003c/li\u003e\u003cbr\u003e \u003cli\u003e Refund shall be validated only after the airline / OTA accepts the cancellation confirmation/endorsement copy sent by the Bank Member. \u003c/li\u003e\u003cbr\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003e Meal Option :\u003c/b\u003e \u003cbr\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e The meal amount is non-refundable. (Refundable only if the flight is cancelled by the airlines). \u003c/li\u003e \u003cbr\u003e \u003cli\u003e The meal would be served only once in case of connecting flights. \u003c/li\u003e\u003cbr\u003e \u003cli\u003e The meal option is as per the flight's menu and availability. \u003c/li\u003e\u003cbr\u003e \u003cli\u003e The meal option is allowed only for adults and children (above 2 years of age). \u003c/li\u003e\u003cbr\u003e \u003c/ul\u003e \u003c/ol\u003e \u003cbr\u003e \u003cb\u003e \u003cli\u003e INTERNATIONAL\u003c/li\u003e \u003c/b\u003e \u003col\u003e \u003cli\u003e The total price displayed includes all applicable government taxes. However, excludes applicable airport taxes or other charges payable at the airport.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e \u003cli\u003eBank Member is required to pay the entire amount prior to the confirmation of their booking.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e \u003cli\u003e Refund against a partially utilized ticket is completely up to airline discretion and the validation and refund application process may take up to 90 days from the day of notification to the Axis Bank's Travel EDGE Program.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Refund against no-show tickets is subject to all the applicable cancellation charges including any promo discount availed at the time of booking.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Meals, frequent flyer and special service are on a request basis only and are subject to airlines terms and conditions and confirmation.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eFor any information regarding your Frequent Flyer or promotion/ tie-ups, please contact the airline directly. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e The Bank Member should ensure that they have the relevant visa, transit visa (if applicable), immigration clearance and travel with a passport, with a validity of at least 6 months as on date of travel.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e To avail infant fares, an infant must be under 24 months throughout the entire itinerary you are booking. This includes onward and return journeys. If the infant is 24 months or above on the return journey, the Bank Member will be required to make a separate booking using a child fare.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e In case your complete name is more than 29 characters, the processing of the booking will be done manually and can lead to fare-jumps that will be charged to you. In case of non-payment of fare jump charges, the full refund will be processed, and a ticket will not be issued. \u003c/li\u003e \u003cli\u003e Axis Bank's Travel EDGE Program is not responsible for any schedule change and/ or cancellation, clubbing of flights by any airline after issuance of the ticket, but will inform you of the same if informed by the airlines. It is advisable to reconfirm your flight timings 24 hours prior to your flight departure. \u003c/li\u003e \u003cli\u003e Axis Bank’s Travel EDGE Program reserves the right to charge transaction fees for availing the booking, cancellation, alterations, etc. services provided on Axis Bank’s Travel EDGE Platform, Axis Bank’s Travel EDGE Program further reserves the right to revise any and all fees from time to time, without notice. Bank member shall be liable to pay all applicable charges, fees, duties, levies, and taxes for availing the aforementioned services. \u003c/li\u003e \u003cli\u003e \u003cb\u003eCheck-in:\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e The Bank member is required to check-in at least 3 hours prior departure for international flights, else will be considered as a no-show.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e As per various airlines, the standard check-in time begins 3 hours before departure.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Bank Member needs to carry appropriate travels permissions/documents (Valid Passport, Visa, Transit Visa, Immigration clearance, etc.) done before departure. Axis Bank's Travel EDGE Program shall not be responsible for any issues resulting from invalid or inappropriate travel documents.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003e Cancellations :\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e Every booking made on Axis Bank’s Travel EDGE is subject to cancellation charges levied by the airline, which may vary by flight and booking class.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eSome booked fares may be non-refundable per the specific airline's policy.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Cancellation requests can be made online on Axis Bank's Travel EDGE Platform or via email or telephonically through our customer support center. Axis Bank's Travel EDGE Program shall not be liable to entertain any cancellation requests made through any other medium including but not limited to SMS. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eIf your cancellation request is made less than 48 hours prior to departure, you will need to contact our customer support team.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eIf you have done a 'Web/Tele Check-in' with the airline, you are requested to get in touch with the airline for cancellation. Axis Bank’s Travel EDGE Programme will not be able to process your cancellation and will not take any responsibility for the same. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003eAll Cancellations should be done at least 24 hours (1 day) prior to the departure date. Certain airlines do not allow any changes or cancellations within 24 hours and treat the booking as a No Show. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003cli\u003e \u003cb\u003eRefunds:\u003c/b\u003e \u003c/li\u003e \u003cul\u003e \u003cli\u003e It is mandatory to contact Axis Bank’s Travel EDGE customer care for all refunds, as the airline will not be able to refund your tickets booked at the Axis Bank’s Travel EDGE Platform. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli\u003e Processing times for cancellation and refund requests vary and shall be done within 15 to 20 working days however due to any technical reason if the refund does not happen in the stipulated timeline mentioned then we would request you to contact our customer support. \u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003c/ul\u003e \u003c/ol\u003e \u003c/ol\u003e"]},{"title":"Hotel Booking","content":"","content_point":["\u003col\u003e         \u003cli\u003e           The total EDGE REWARD Points/EDGE MILES displayed include all applicable government taxes.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e Bank member is required to pay the entire amount prior to the confirmation of           their           booking.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           The primary guest must be at least 12 years old and above and Children 0 – 12 years to be able to check           into the hotel.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           Check-in time is 12 pm and check-out time is 12 pm. Early check-in or late check-out is subject to           availability and the hotel might charge you extra for it.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           Bank members stay does not include additional personal expenses like telephone charges, meals that are not           part of Bank Members meal plan, any hotel services they use (like laundry and room service), or tips. The           hotel will           charge the Bank Member directly for these when you are checking out.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           It is mandatory for Bank Members to present valid photo identification at the time of check-in. According to           government regulations, a valid photo Id has to be carried by every person above the age of 18 staying at           the hotel.           The identification proofs accepted are driver’s license, voters’ card, and passport. Without a valid photo           Id, the           guest will not be allowed to check in. Please note PAN card will not be accepted as a valid ID card.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           The hotel reserves the right of admission. Accommodation can be denied to guests posing as a 'couple' if           suitable proof of identification is not presented at check-in. Axis Bank or the participating hotel partners           will           not be responsible for any check-in denied by the hotel due to the aforesaid reason.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e All distances (airport/ station etc.) are approximate and the actual driving           distances may           vary based on           the route taken.\u003cbr\u003e\u003cbr\u003e\u003c/li\u003e         \u003cli\u003e           All other terms \u0026amp; conditions of Axis Bank Debit \u0026amp; Credit card and of the participating merchants           apply.\u003cbr\u003e\u003cbr\u003e         \u003c/li\u003e         \u003cli\u003e           \u003cb\u003eCancellation Policy:\u003c/b\u003e         \u003c/li\u003e         \u003cul\u003e           \u003cli\u003e             Every hotel has its cancellation policy, and the Bank member shall be charged according to the             Hotel/Room             cancellation policy.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             For all the bookings, the cancellation has to be initiated on the Axis Bank's Travel EDGE platform only.             To             initiate cancellation of your booking, log in to your account and select the My Transactions section and             follow the steps: Upcoming --\u0026gt; Select Hotel --\u0026gt; Cancel. Post successful cancellation, Bank Member shall             receive the refund within 15 -20 working days.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             If Bank Member is contacting the hotel partners directly for cancellation they are still liable to call             the             Axis Bank's Travel EDGE Platform's Customer Support to process your refund. In case we receive the             amount             back from the supplier the same, will be credited to the Bank Member accounts. Please call Axis Bank's             Travel EDGE Platforms Customer Support on + 91 22-68554000 within 24 hours from the time of             cancellation.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             The cancellation policy will be governed by the terms \u0026amp; conditions of the participating hotel partners.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             In case you have opted for the 'EDGE Points + Pay by Card/EDGE MILES + Pay by Card' facility while hotel             booking, the cancellation             fees             will be deducted from the EDGE Points/EDGE MILES first and then the card amount will be paid in the             refund process.           \u003c/li\u003e         \u003c/ul\u003e\u003cbr\u003e         \u003cli\u003e           \u003cb\u003eModifications \u0026amp; Refund\u003c/b\u003e         \u003c/li\u003e         \u003cul\u003e           \u003cli\u003e             Normally, no changes can be made to the hotel booking once the reservation is confirmed. If well outside             the             cancelation window the member can make a fresh booking and cancel his existing booking. EDGE Points/EDGE             Miles or cash             will             be refunded as per the stipulated period.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             Post your comments in Contact Us option and follow the step: Contact Us \u0026gt;\u0026gt; Name \u0026gt;\u0026gt; Email ID \u0026gt;\u0026gt; Select             Enquiry Type \u0026gt;\u0026gt; Enter your message \u0026gt;\u0026gt; Submit your comments. Alternatively, you can also connect with us             on +             91 22-68554000 we request you to please do not call the hotel directly for these changes/amendments.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             The post-cancellation request is processed by the participating hotel partner; the applicable refunds             will             be credited in 15 – 20 working days However due to any technical reason if the refund does not happen in             the             stipulated timeline mentioned then we would request you to contact our customer support.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             The booking amount paid by the Bank member is only for stay at the hotel. Some bookings may include             breakfast and/ or meals as confirmed at the time of booking. Any other services utilized by the Bank             member             at the hotel, including laundry, room service, internet, telephone, extra food, drinks, beverages, etc.             shall be paid by the Bank member directly to the hotel.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             Hotels may charge a mandatory meal surcharge on festive periods like Christmas, New Year's Eve, or other             festivals as decided by the hotel. All additional charges (including mandatory meal surcharges) need to             be             cleared directly at the hotel. Axis Bank's Travel EDGE Program will have no control over waiving the             same.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             If the services are being redeemed partially by EDGE Points/EDGE MILES and cash, the amount paid by Card             will be             credited to             your account in 15 – 20 working days. The balance amount paid by EDGE Points/EDGE MILES will be refunded             in 15 – 20             working             days to Axis Bank Travel EDGE Platform account However due to any technical reason if the refund does             not             happen in the stipulated timeline mentioned then we would request you to contact our customer support.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             While redeeming for hotel bookings at Axis Bank’s Travel EDGE platform, if EDGE REWARD Points/EDGE MILES             get             deducted and the redemption does not go through, the EDGE Points/EDGE MILES will be credited into your             account in             5-7 working days. If the services are being redeemed partially by EDGE Points/EDGE MILES and cash, the             amount paid             by cash will be credited to your account in 5-7 working days. However due to any technical reason if the             refund does not happen in the stipulated timeline mentioned then we would request you to contact our             customer support.           \u003c/li\u003e\u003cbr\u003e         \u003c/ul\u003e         \u003cli\u003e           \u003cb\u003eResponsibilities of the user\u003c/b\u003e         \u003c/li\u003e         \u003cul\u003e           \u003cli\u003e             The Bank Member would be liable to pay for any damage(s) caused by any act of him/ her/ or their             accompanying guests (willful/negligent) to the property of the hotel in any manner whatsoever. The             extent and the amount of the damage so caused would be determined by the concerned hotel. Axis Bank’s             Travel EDGE Program would not, in any way, intervene in the same.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             The primary guest must be at least 12 years old to be able to check into the hotel.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             The Bank Member should be in possession of valid identity proof and address proof, at the time of             check-in. The             hotel shall be within its rights to deny check-in to the Bank Member if a valid identity proof is not             presented             at the time of check-in.           \u003c/li\u003e\u003cbr\u003e           \u003cli\u003e             Check-in time, check-out time, and any changes in those timings will be as per hotel policy \u0026amp; terms.             Early             check-in or late check-out request is subject to availability and the hotel may charge an additional fee             for             providing such services.           \u003c/li\u003e         \u003c/ul\u003e       \u003c/ol\u003e"]},{"title":"Experience Booking","content":"","content_point":["\u003cp\u003eDefinitions \u0026 Understanding: The following words and phrases shall have the meanings set out herein below in this document unless repugnant to the context: \u003cbr\u003e Bank Member shall mean a person who holds Axis bank product and who can shop on the Axis Bank Travel EDGE Platform. Offer shall mean the cashback or EDGE REWARD Points/EDGE MILES that Axis Bank will provide the Bank member upon completing transactions via Axis Bank's Travel EDGE Platform basis certain conditions listed under Terms of Offer below. Axis Bank Travel EDGE Program is an Axis Bank offering, specially designed and initiated for Axis Bank Members, to bring them the latest, easiest, and best offers on Hotels, Flights and Experiences on a single universal Travel platform, Axis Bank Travel EDGE. Axis Bank’s Travel EDGE Products and Services The Product that can be brought on the Axis Bank’s Travel EDGE Platform are Flights, Hotels, Experiences, \u0026 ancillary services like Insurance and Cancellation Protection. The Axis Bank’s Travel EDGE Platform is powered and maintained by Vernost Marketing Technology Solutions Pvt. Ltd (Vernost) on behalf of Axis Bank. Travel Suppliers are the Suppliers/ Fulfillers of individual or Aggregated Travel products/services which are operated by them, under their respective brand names, as listed on the Axis Bank’s Travel EDGE Platform. Visitor A Visitor is a user of Axis Bank’s Travel EDGE Platform.\u003c/p\u003e"]},{"title":"Axis Points/Miles Transfer","content":"","content_point":["\u003cdiv class=\"panel-1\" style=\" margin: 0; \"\u003e \u003col class=\"li_style-ol\" type=\"1\"\u003e \u003cp class=\"li_heading\"\u003e\u003cstrong\u003e Terms \u0026amp; Conditions for Points/Miles Transfer Program: \u003c/strong\u003e\u003c/p\u003e \u003cdiv class=\"ml-30\"\u003e \u003cli class=\"head-p list-tc-foot\" style=\"padding: 10px 0; list-style-type: decimal;\"\u003eThis program is applicable, exclusively, for Axis Bank Credit and Debit Cardholder's. \u003col class=\"li_style-ol\" type=\"1\"\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eBurgundy Private Credit Card, Magnus Credit Card for Burgundy. \u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eReserve Credit Card, Olympus Credit Card, Magnus Credit Card. \u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eAtlas Credit Card, Horizon Credit Card.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eSelect Credit Card, Privilege Credit Card and REWARDS Credit Card.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eIndianOil Axis Bank Premium Credit Card \u0026amp; Other Cards (including Debit Cards)*\u003c/p\u003e \u003c/li\u003e \u003cp style=\"padding:15px 0;\"\u003e*Please refer for the detailed list of eligible cards \u003ca href=\"https://campaign.axis.bank.in/generic/list-of-eligible-cards.pdf\" style=\"color:#000000;text-decoration: underline;\" target=\"_blank\"\u003ehere\u003c/a\u003e\u003c/p\u003e \u003c/ol\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003eUnder this program, credit cardholders can transfer EDGE REWARD Points/EDGE MILES to Domestic \u0026a \u003c/td\u003e \u003ctd style=\"border: 1px solid #000001; width: 15%; padding: 5px;\"\u003e \u003cp style=\"padding:11px 0;margin: 0;\"\u003e\u003cspan\u003e2:1\u003c/span\u003e\u003c/p\u003e \u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/table\u003e \u003c/div\u003e \u003c!-- \u003cp style=\"padding: 15px 0;\"\u003e IndiGo BluChip miles transfer will be available under an introductory offer for a period of two (2) months commencing from the date of launch. During this period, select card variants may be eligible for promotional conversion ratios as given in the table above. Upon completion of the introductory period, standard conversion ratios shall apply as outlined in the consolidated conversion table above. Axis Bank reserves the right to modify, withdraw, or extend the offer at its discretion.\u003c/p\u003e --\u003e \u003cp style=\"margin-top: 15px;\"\u003e\u003cstrong\u003e2.2 Miles \u0026amp; More Partner Conditions\u003c/strong\u003e\u003c/p\u003e \u003cp style=\"padding: 10px 0;\"\u003eA maximum of 2,00,000 Miles \u0026amp; More can be transferred in a calendar year (Jan to Dec). The number of EDGE REWARD Points or Miles required will depend on your card's conversion ratio. Please note that the annual transfer limit applicable to your card will also continue to apply.\u003c/p\u003e \u003cp style=\"padding: 10px 0;\"\u003e\u003cstrong\u003eExample 1:\u003c/strong\u003e If you are holding the Select card with a ratio of 10:1, transferring upto 2,00,000 Miles \u0026amp; More would require 20 lakh Axis Bank Edge Reward Points. However, as per the Group B capping, you can transfer only up to 4 lakh Axis Bank Edge Reward Points annually, which would convert to 40,000 Miles \u0026amp; More at the 10:1 ratio.\u003c/p\u003e \u003cp style=\"padding: 10px 0;\"\u003e\u003cstrong\u003eExample 2:\u003c/strong\u003e If you are holding the Olympus card with a ratio of 1:4, transferring upto 2,00,000 Miles \u0026amp; More require 50,000 Axis Bank Edge Miles. Accordingly, only 50,000 Axis Bank Edge Miles can be transferred to Miles \u0026amp; More (equivalent to 2,00,000 miles), while the remaining 5.5 lakh reward currency may be utilized for redemption with other group B partners.\u003c/p\u003e \u003col class=\"li_style-ol\" type=\"1\" style=\"margin-top: 5px; padding-left: 20px;\"\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"text-align:left; padding: 5px 0;\"\u003e\u003cstrong\u003eMiles \u0026amp; More Transaction Level Limit\u003c/strong\u003e\u003c/p\u003e \u003cul style=\"padding-left: 20px; list-style-type: disc;\"\u003e \u003cli style=\"padding: 5px 0;\"\u003eMinimum transfer per transaction: 3,000 Miles \u0026amp; More miles and Maximum annual transfer: 2,00,000 Miles \u0026amp; More miles\u003c/li\u003e \u003c/ul\u003e \u003cp style=\"padding: 8px 0;\"\u003e\u003cstrong\u003eIllustrative Example (For customer holding Select/Reward card with 10 : 1 transfer rate)\u003c/strong\u003e\u003c/p\u003e \u003cul style=\"padding-left: 20px; list-style-type: disc;\"\u003e \u003cli style=\"padding: 5px 0;\"\u003eMinimum transfer: 30,000 Edge Points per transaction (equivalent to 3,000 Partner Miles at 10:1 ratio)\u003c/li\u003e \u003cli style=\"padding: 5px 0;\"\u003eMaximum annual transfer: 4,00,000 Edge Points (equivalent to 40,000 Miles \u0026amp; More miles)\u003c/li\u003e \u003c/ul\u003e \u003cp style=\"padding: 8px 0;\"\u003e\u003cstrong\u003eIllustrative Example (For customer holding Olympus card with 1 : 4 transfer rate)\u003c/strong\u003e\u003c/p\u003e \u003cul style=\"padding-left: 20px; list-style-type: disc;\"\u003e \u003cli style=\"padding: 5px 0;\"\u003eMinimum transfer: 750 Edge Miles per transaction (equivalent to 3,000 Miles \u0026amp; More miles at 1:4 ratio)\u003c/li\u003e \u003cli style=\"padding: 5px 0;\"\u003eMaximum annual transfer: 50,000 Edge Miles (equivalent to 2,00,000 Miles \u0026amp; More miles)\u003c/li\u003e \u003c/ul\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"line-height: 1.25; padding: 10px 0;\"\u003eAll existing Miles transfer partners are divided in two groups (Group A \u0026amp; Group B). The number of EDGE MILES/REWARD points that a customer can transfer will be capped basis the group in which the partner lies, ie per customer id, customers can transfer only a specific amount of their total EDGE MILES/Points cumulatively to partners in Group A, and rest of the EDGE MILES/Points in total to partners in Group B.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"line-height: 1.25; padding: 10px 0;\"\u003eThe capping will be applicable as per calendar year cycle, i.e., from 01 Jan to 31 Dec. Please note post 31 Dec the capping will be reset without any extension or advance notification as per the existing program guidelines.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"line-height: 1.25; padding: 10px 0;\"\u003ePlease note the Group A \u0026amp; Group B classification and the partners list are subject to change at banks discretion without notice \u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"line-height: 1.25; padding: 10px 0;\"\u003eThe updated list of airline and hotel loyalty partners classified under Group A and Group B is provided below:\u003c/p\u003e \u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; text-align: center; color: grey;\"\u003e \u003ctbody\u003e \u003ctr\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eGroup A\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eGroup B\u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eAll - The limitless hotel loyalty programme\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eAir Asia\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e /tr\u003e \u003c/tbody\u003e \u003c/table\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003eFor Example, if you hold a MAGNUS Credit Card, the overall annual capping for Miles Transfer will be 5 lakh EDGE REWARD Points per Customer ID, this means a customer can transfer a maximum of 1,00,000 EDGE REWARD Points per Customer ID in total to partners in Group A and rest 4,00,000 EDGE REWARD Points per customer ID in total to partners in Group B in a calendar year.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003eSimilarly, if you hold an ATLAS Credit Card, the overall annual capping for Miles transfer will be 1.5 lakh EDGE Miles per customer id, this means that a customer can transfer a maximum of 30,000 EDGE Miles per customer id in total to partners in Group A and rest 1,20,000 EDGE Miles per customer id in total to partners in Group B in a calendar year.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003ePlease note this capping is basis the highest credit card the customer holds in case of multiple cards, for eg\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003eIf a customer holds Burgundy Private The One Metal + Magnus + Reserve (all Edge Reward Points), the overall capping and Group A \u0026amp; Group B capping will be applicable as per the highest card i.e. for Burgundy Private, which means that customer will be able to transfer maximum 15,00,000 annually for all the cards combined.\u003c/p\u003e \u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; text-align: center; color: grey;\"\u003e \u003ctbody\u003e \u003ctr\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eCard type\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eOverall annual capping per customer id (Group A+B)\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group A per customer id\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group B per customer id\u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eBurgundy Private The One Metal\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e15,00,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e3,00,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e12,00,000\u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/table\u003e \u003cp style=\"padding-top: 10px;\"\u003eIf a customer holds Burgundy Pvt debit card/Burgundy debit card + Magnus Burgundy credit card (all Edge Reward Points), the overall capping and Group A \u0026 Group B capping, along with applicable partner conversion ratios will be applicable as per the highest card i.e. for Magnus Burgundy, which means that customer will be able to transfer maximum 10,00,000 annually for all the cards combined. \u003c/p\u003e \u003cp\u003e Alternatively, if customer only holds a Burgundy Pvt debit card/Burgundy debit card/any other credit or debit cards not specified under the grid against respective card details, will fall under criteria of 'other cards' and respective cappings and ratios will be applicable. \u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003eIf a customer holds Reserve (currency: Edge Reward Points) and Atlas (Currency: Miles), the capping will be the sum of the individual cappings which means that overall annual capping will be 5,00,000 for Reserve and 1,50,000 for Atlas i.e. a total of 6,50,000. Bifurcation as below.\u003c/p\u003e \u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; text-align: center; color: grey;\"\u003e \u003ctbody\u003e \u003ctr\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eCard type\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eOverall annual capping per customer id (Group A+B)\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group A per customer id\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group B per customer id\u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eReserve\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e5,00,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,00,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e4,00,000\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eAtlas\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,50,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e30,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,20,000\u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/table\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e \u003cp style=\"padding:15px 0;\"\u003eKindly Note , If a Customer hold two Miles currency cards that is Atlas (Edge Miles) \u0026amp; Olympus (Edge Miles) , the total capping will considered as the highest capping amongst the two cards which Customer holds i.e. Customer will be able to transfer 7,50,000 miles annually for all Edge miles combined.\u003c/p\u003e \u003ctable cellspacing=\"0\" style=\"border-collapse:collapse; text-align: center; color: grey;\"\u003e \u003ctbody\u003e \u003ctr\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eCard type\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eOverall annual capping per Cust ID (Group A+B)\u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group A \u003c/th\u003e \u003cth style=\"border: 1px solid #000001;padding: 5px;\"\u003eAnnual Capping for partners in Group B \u003c/th\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eAtlas\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,50,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e30,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,20,000\u003c/td\u003e \u003c/tr\u003e \u003ctr\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003eOlympus\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e7,50,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e1,50,000\u003c/td\u003e \u003ctd style=\"border: 1px solid #000001;padding: 5px;\"\u003e6,00,000\u003c/td\u003e \u003c/tr\u003e \u003c/tbody\u003e \u003c/table\u003e \u003cbr\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e Linking of partner membership IDs with Axis Bank Customer ID \u003col class=\"li_style-ol\" type=\"1\"\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eFor each of the airline/hotel transfer partners, customers can only link 1 partner program loyalty ID for each partner at a given point of time.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eIf a customer wishes to link another ID, the primary/existing linked ID will then get delinked by default.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eFor every individual partner program, the customer needs to wait for a period of 60 days after updating partner loyalty ID with Axis Bank Travel EDGE in order to update secondary/new partner loyalty ID.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eOnce the customer has updated their partner loyalty ID, please wait for a period of 5 working days, before attempting any transfer.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eAll the above rules are not applicable for Burgundy Private customers.\u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e For Burgundy Private credit card customers \u003col class=\"li_style-ol\" type=\"1\"\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eFor the following partners, customers can transfer EDGE REWARD Points only to 1 membership ID: All - The limitless hotel loyalty programme, airasia rewards, Aeroplan, Flying Blue, Air India Maharaja Club, The British Airways Club, Cathay, ShebaMiles, Etihad Guest, Finnair Plus, Hilton Honors, IHG One Rewards, IndiGo BluChip, JAL Mileage Bank, Miles \u0026amp; More, Orchid Rewards, The Postcard Sunshine Club, Qantas Frequent Flyer, Privilege Club, Radisson Rewards, KrisFlyer, SpiceClub, Royal Orchid Plus, Miles\u0026amp;Smiles, United MileagePlus, Lotusmiles (Vietnam Airlines), Wyndham Rewards.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eThis is due to the restriction at partner end.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eTo link a new membership ID, please send the details traveledge.support@axis.bank.in and we will get back to you within 3 working days with the timeline as to when you can make transfers to the new membership ID.\u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e \u003c!-- \u003cli class=\"head-p list-tc-foot\"\u003e EDGE REWARD Points transferred to Partner Points: \u003col class=\"li_style-ol\" type=\"1\"\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eTotal EDGE Reward Points that can be converted to Partner Points in a calendar year is capped to 5,00,000 EDGE Reward Points per customer ID. For the year 2023, customer can convert 5,00,000 EDGE Reward Points from 1st September 2023  31st December 2023.\u003c/p\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-disc\"\u003e \u003cp style=\"text-align:left;padding: 10px 0;\"\u003eThe above capping limit is applicable for all eligible cards in the program except Burgundy Private and Atlas credit card. For these 2 cards, there is no limit on the number of EDGE REWARD Points/ EDGE Miles that can be transferred to partner points.\u003c/p\u003e \u003c/li\u003e \u003c/ol\u003e \u003c/li\u003e --\u003e \u003cli class=\"head-p list-tc-foot\"\u003e The Points/Miles transferred would be debited from the accumulated EDGE REWARD Points/EDGE MILES in the Cardholder's EDGE REWARD Points/EDGE MILES Account.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e The minimum EDGE MILES required for transfer request is 500.\u003cbr\u003e\u003cbr\u003e The minimum EDGE REWARD Points required for transfer request is 300.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e Cardholders can only transfer EDGE REWARD Points/EDGE MILES to their own membership accounts held as per Loyalty Program of the Partners. Transfer to other Accounts are not permitted.\u003cbr\u003e\u003cbr\u003e \u003c/li\u003e \u003cli class=\"head-p list-tc-foot\"\u003e EDGE REWARD Points/EDGE MILES transfer can only be done to the above mentioned program partne

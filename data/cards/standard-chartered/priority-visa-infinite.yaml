    - benefits.insurance
    - benefits.golf
    notes: Current consolidated T&C dated/updated with 1-Oct-2026 golf helpdesk terms supplies lounge quotas/FUM
      eligibility, chargeable guest/extra visits, detailed insurance terms, and golf games/coaching quotas. The
      product page describes complimentary Priority Banking relationship, but no separate concierge or fuel surcharge
      benefit is published there.
  golf:
    rounds_per_cycle: 2
    cycle: monthly
    lessons_per_cycle: 1
    notes: Current consolidated T&C grants 2 complimentary domestic golf games and 1 coaching session per month
      per valid cardholder, plus 1 complimentary guest game/month (not represented by current golf fields). Booking
      is subject to 7-day advance request and availability; convenience/other charges may apply.

  capping_rules:
  - 6% cashback applies ONLY to the 24 allowlisted dining/travel MCCs; everything else earns the 1% base.
  - FOOD DELIVERY (Swiggy/Zomato/aggregators) is field-reported to earn the 1% base, NOT the 6%, despite marketing
    copy to the contrary. Unverified against the MITC.
  - 6% dining/travel cashback capped at Rs 3,000 per month, then flat 1%.
  - UPI-routed dining & travel spends are excluded from the 6% rate and earn the 1% base instead.
  - No cashback on rent, utilities, education, insurance, EMI, wallet loads, cash advance, toll, government, fuel,
    hospitals or pharmacies

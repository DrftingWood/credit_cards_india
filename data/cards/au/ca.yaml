rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 2
    per_inr: 100
    unit_value_inr: 0.0025
    unit_value_inr_realized: null
    excluded_categories:
    - utilities
    - telecom
    - insurance
    - dining
    - travel
  accelerated:
  - category: dining-travel-tax-software
    canonical_categories:
    - dining
    - travel
    multiplier: 4
    effective_rate: 8
    cap_per_cycle: 5000
    cap_unit: points
    cycle: statement
    over_cap_earns_base: false
    notes: '8 points per INR 100 is the total rate, not additive to the 2-point retail base. Issuer caps this MCC group at 5,000 points per statement cycle; whether base points resume after the group cap is not specified, so post-cap base points are suppressed. OTA accelerated rewards apply only to airline and hotel bookings. MCC 9311 appears both under eligible tax and excluded education/government MCCs in the same issuer PDF, so affected tax transactions remain ambiguous.'
  - category: insurance-utility-telecom
    canonical_categories:
    - utilities
    - telecom
    - insurance
    effective_rate: 1
    effective_per_inr: 100
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: statement
    notes: Utility and telecom earn is capped at 100 points per transaction; insurance earns at the same 1 RP/INR100 rate. Category MCCs are specified in issuer terms.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - emi
  - education
  - government
  - cash-advance
  mcc_exclusions:
  - '6513'
  - '6540'
  - '6010'
  - '6011'
  reward_cap:
    max_units: 25000
    cap_unit: points
    cycle: statement
  capping_rules:
  - Accelerated dining/travel/tax/software group is capped at 5,000 points per statement cycle; utility/telecom are additionally capped at 100 points per transaction; overall AU card agreement cap is 25,000 points per statement cycle.
  - Transportation MCCs stopped earning on 1 Apr 2026. Exact applicability is determined by acquiring-bank MCC. Issuer CA T&C lists MCC 9311 as both eligible tax and excluded education/government; ambiguous instances should not be confidently scored.
  - Redemption requires at least 200 points; INR 99 plus GST is charged per successful redemption per current KFS.
  redemption:
  - type: catalog
    program: AU Rewardz
    rate_inr_per_unit: 0.0025
    constraints: AU general FAQ states 0.25 paise per point (INR 0.0025); e-voucher value is 0.20 paise (INR 0.002). Values depend on redemption option.
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards/ca-credit-card
    retrieved_on: '2026-10-25'
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.effective_per_inr
    - rewards.accelerated.multiplier
    - rewards.accelerated.cap_per_cycle
    - rewards.reward_cap.max_units
    - rewards.redemption.rate_inr_per_unit
    notes: 'Card-specific MCC terms dated 6 Mar 2026 define eligible MCCs, 5,000 accelerated cap, utility/telecom transaction cap and exclusions: https://www.au.bank.in/content/dam/aubank/in/en/pdf/ca-credit-card/AU-CA-Credit-Card-Reward-Points-Terms-and-Conditions.pdf. AU Rewardz point value is 0.25 paise per point for catalogue and 0.20 paise for e-vouchers (INR 0.0025 and INR 0.002 respectively). Current KFS charges INR 99 + GST per successful redemption. AU member agreement sets a 25,000 overall statement cap. Point expiry differs between the generic FAQ (two years from statement month) and 16 May 2026 member agreement (two years after accrual); no expiry field exists in this schema.'
benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: null
      via:
      - issuer-direct
      notes: 'Two domestic visits per calendar quarter. From 1 Oct 2026, access requires INR 50,000 spend in the previous calendar quarter. Card must remain purchase-active during the qualifying quarter; access applies only within India.'
  welcome:
  - condition: Spend INR 5,000 within 30 days of card activation
    benefit: 2,000 bonus Reward Points
    value_inr: 5
    window_days: 30
  - condition: Spend INR 10,000 within 30 days of card activation
    benefit: Dining membership; issuer sends a claim link via email/SMS. Membership type and duration are not specified in the card welcome terms.
    value_inr: null
    window_days: 30
  insurance:
  - type: air-accident
    sum_insured_inr: 5000000
  other:
  - name: ICAI membership renewal cashback
    description: Flat 25% cashback on annual ICAI membership renewal fee; card-specific transaction conditions and a cashback cap are not stated on the issuer page.
  - name: Xpress EMI
    description: Zero processing fee for eligible Xpress EMI conversions of transactions of at least INR 2,000; up to 20 billed or unbilled transactions can be clubbed. Interest and other EMI terms still apply.
  - name: Protection covers
    description: Card page lists INR 5 lakh credit shield, INR 25,000 purchase protection, card liability and travel covers (baggage loss/delay, flight delay, passport loss and plane hijack). Insurance applies to primary cardholders with active card; air accident death cover requires ticket purchase on the AU card. Detailed limits for travel covers not established.
  - name: Curated merchant offers
    description: Issuer lists offers on MakeMyTrip, Times Prime and Alaya stays; offer values, dates and eligibility vary and are not specified on the core card page.
  fuel_surcharge_waiver:

  capping_rules:
  - UPI spends on the RuPay variant earn 0.50% on any UPI app and an additional 1.00%
    (1.50% total) when paid via Tata Neu UPI ID; total UPI NeuCoins are capped at
    500 per calendar month (w.e.f. 01-Aug-2024).
  - Partner Tata Brand transactions paid via UPI earn the UPI rate (up to 1.5% capped
    at 500/mo), not the 5% non-UPI Tata brand rate.
  - Non-UPI grocery, insurance, utility, and telecom/cable transactions are each capped
    at 2,000 NeuCoins per calendar month.

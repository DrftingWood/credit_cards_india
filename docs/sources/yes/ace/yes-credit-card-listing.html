    "header": "<script type=\"application/ld+json\">\n{\n\"@context\":\"http://schema.org\",\n\"@type\":\"FinancialProduct\", \n\"name\":\"Credit Card\", \n\"url\":\"https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards\", \n    \"category\":\n{\n                  \"@type\": \"LoanOrCredit\", \n                  \"name\": \"Credit Card\",\n\"mainEntityOfPage\": \n{\n\"@type\":\"WebPage\", \n\"@id\":\"https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards\"\n},\n\"brand\":\n{\n\"@type\":\"Organization\", \n\"name\":\"YES BANK\", \n\"url\":\"https://www.yes.bank.in\"\n}, \n\"description\":\"Credit Card- Get flexible credit cards options with competitive rewards and benefits. Apply for credit card online & get instant approval with no annual fees\", \n\"category\":\"Credit Card\"\n}\n}\n</sc\x72ipt>\n<script type=\"application/ld+json\">\n            {\n                \"@context\": \"https://schema.org/\",\n                \"@type\": \"Product\",\n                \"name\": \"Credit Card\",\n                  \"image\": \"https://www.yes.bank.in/content/published/api/v1.1/assets/CONT04F29B82EA8B403F997A098DAD8C1EEB/native/Hero-Image-with-YES-Bank-Logo-_-Hand.webp?channelToken=21f7ccfa2fc3401091938f541a6f8f2a\",\n              \"description\":\"Credit Card- Get flexible credit cards options with competitive rewards and benefits. Apply for credit card online & get instant approval with no annual fees\",\n\n                \"aggregateRating\": {\n                    \"@type\": \"AggregateRating\",\n                    \"ratingValue\": \"4.7\",\n                    \"reviewCount\": \"1500\"\n                }\n            }\n</sc\x72ipt>\n<script type=\"application/ld+json\">\n        {\n            \"@context\": \"http://schema.org\",\n            \"@type\": \"CreditCard\",\n            \"brand\":\"YES Bank\",\n             \"name\": \"Credit Card\",\n             \"description\": \"Credit Card - Get flexible credit cards options with competitive rewards and benefits. Apply for credit card online & get instant approval with no annual fees\",\n            \"url\": \"https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards\",\n           \"image\":\"https://www.yes.bank.in/content/published/api/v1.1/assets/CONT339926101C9B44E19F39FA05C86111DE/native/Mobile.webp?channelToken=580bc0ffbe3a47d690505e5f6d06e1c8\",\n          \"logo\":\"https://www.yes.bank.in/static_cache/img/new-logo.png\"\n  }\n</sc\x72ipt>\n<script type=\"application/ld+json\">\n{\n  \"@context\": \"https://schema.org/\", \n  \"@type\": \"BreadcrumbList\", \n  \"itemListElement\": [{\n    \"@type\": \"ListItem\", \n    \"position\": 1, \n    \"name\": \"Home\",\n    \"item\": \"https://www.yes.bank.in/\"  \n  },{\n    \"@type\": \"ListItem\", \n    \"position\": 2, \n    \"name\": \"Personal Banking\",\n    \"item\": \"https://www.yes.bank.in/\"  \n  },{\n    \"@type\": \"ListItem\", \n    \"position\": 3, \n    \"name\": \"Yes Individual\",\n    \"item\": \"https://www.yes.bank.in/\"  \n  },{\n    \"@type\": \"ListItem\", \n    \"position\": 4, \n    \"name\": \"Cards\",\n    \"item\": \"https://www.yes.bank.in/personal-banking/yes-individual/cards\"  \n  },{\n    \"@type\": \"ListItem\", \n    \"position\": 5, \n    \"name\": \"Credit Cards\",\n    \"item\": \"https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards\"  \n  }]\n}\n</sc\x72ipt>\n<script type=\"application/ld+json\">\n\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"FAQPage\",\n  \"mainEntity\": [{\n    \"@type\": \"Question\",\n    \"name\": \"What is a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"A credit card is a payment card issued that allows the cardholder to borrow funds to make purchases or pay for services. The borrowed amount is to be repaid to the credit card issuer within a specified time, typically with interest charged on the outstanding balance.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How does a credit card work?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"A credit card works by allowing cardholders to make purchases or pay for services with borrowed funds from the card issuer. When a cardholder uses a credit card for a transaction, the card issuer pays the merchant on behalf of the cardholder. The cardholder is then required to repay the borrowed amount to the credit card issuer within a specific time, usually on a monthly billing cycle.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How do I apply for a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"To apply for a credit card, follow these steps:\n\nCompare credit card options based on interest rates, fees, rewards, and benefits\nReview the eligibility criteria, such as age, income, employment, and credit history, specified by the credit card issuer.\nCollect required documents like ID proof, address proof, income proof, and others mentioned by the issuer.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What are the eligibility criteria for a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"The eligibility criteria for a credit card may vary depending on the credit card type. However, some common factors considered for credit card eligibility include:\n\nAge: Typically, the minimum age requirement is 18 years or above\nIncome: Most issuers require a minimum income level to ensure the cardholder's ability to repay the borrowed funds\nEmployment status: Regular employment, self-employment, or a steady source of income may be required.\nCredit history: A good credit history demonstrates responsible credit behaviour, increasing the chances of approval.\nResidency: Some issuers may require applicants to be residents or citizens of the country where they are applying for the credit card\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What documents are required to apply for a credit card with YES Bank?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"When applying for a credit card with YES Bank, you will typically need to provide the following documents:\n\nIdentity proof: Any government-issued ID card such as Aadhaar, PAN card, or passport\nAddress proof: Documents like Aadhaar, utility bills (electricity, water, gas), passport, or driving license that establish your residential address\nIncome proof: Depending on your employment type, you may need to submit salary slips, bank statements, IT returns, or Form 16 as proof of income\nPassport-size photographs: Recent passport-size photographs for identification purposes\nApplication form: The completed and signed credit card application form provided by YES Bank\nIt's important to note that specific documentation requirements may vary based on factors such as the type of credit card and the individual's profile. It is advisable to check with the bank directly or visit the website to obtain accurate and up-to-date information on the required documents for credit card applications.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How long does it take to get approved for a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"Within 4-5 business days, your credit card will be approved and shipped to your mailing address. To check the progress of your application, go to credit card application status  at YES Bank and enter your Application Reference number.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What is the credit limit on a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"The credit limit is determined by the credit card issuer based on various factors such as the cardholder's income, credit history, repayment behaviour, and other relevant criteria.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How can I increase my credit card limit?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"To increase your credit card limit with YES Bank, you can contact their customer service or visit a branch to inquire about the process. The bank will assess various factors such as your credit history, income, and repayment behaviour before considering a credit limit increase.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What are the different types of credit cards available at YES Bank?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"YES Bank offers a range of credit cards to suit different needs and preferences. These are Super Premium Credit Cards, Premium Cards, Featured Cards, Thematic Cards & Business Cards\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What are the benefits and rewards offered by credit cards?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"Credit cards often come with various benefits and rewards. These may include cashback offers, reward points on purchases, discounts on partner merchants, travel benefits like airport lounge access or air miles, fuel surcharge waivers, and insurance coverage. The specific benefits and rewards vary depending on the type of credit card you have.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How can I earn and redeem credit card rewards points?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"You can earn Reward Points by making eligible purchases using your Credit Card. To redeem the accumulated Reward Points, you can check the redemption options provided by YES Bank, such as bill payments, gift vouchers, merchandise, or airline miles. The redemption options may vary, visit https://credit.yesrewardz.com/\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What fees and charges are associated with a credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"Credit cards may have various fees and charges associated with them. These can include an annual fee, joining fee, late payment fee, cash advance fee, foreign currency transaction fee, over-limit fee, and more. Additionally, interest charges may apply if the outstanding balance is not paid in full by the due date.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How do I make payments on my credit card?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"You can make payments on your YES Bank credit card through various methods. These include online payment through the bank's website or mobile app, setting up auto-debit instructions, using electronic fund transfer (NEFT/RTGS/IMPS) from your bank account, paying through cash or cheque at bank branches or ATMs, and other payment channels specified by the bank. Refer to YES Bank's guidelines or contact our customer service for details.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What happens if I miss a credit card payment and how can you avoid that?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"If you miss a credit card payment, you may be charged a late payment fee and interest on the outstanding amount. You can pay your credit card bills at bill payment You may pay the MAD (Minimum Amount Due) against the Outstanding amount to avoid late payment fees.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How do I dispute a credit card transaction?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"If you need to dispute a credit card transaction with YES Bank, you should promptly contact our customer service email at yestouchcc@yesbank.in or dialling us at 1800-103-6000.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How can I manage and track my credit card expenses?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"You can use our Net Banking portals, Mobile Banking (under Credit Card Dashboard section), or monthly statements to monitor your transactions, view spending patterns, set spending limits, and categorize expenses.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What is a credit card balance transfer and how does it work?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"A credit card balance transfer allows you to transfer the outstanding balance from one credit card to another, usually at a lower interest rate. This can help you consolidate your debts and save on interest payments. The specific process and terms may vary, so it's advisable to check with YES Bank website at yesbank for detailed information on balance transfers and any applicable offers.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How can I protect my credit card from fraud and unauthorized use?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"To protect your YES Bank credit card from fraud and unauthorized use, you should keep your card safe, not sharing your card details like your CVV, Expiry Date or OTPs with anyone, regularly monitoring your transactions, signing up for transaction alerts, using secure payment gateways, and reporting any suspicious activity or loss of the card immediately to the bank's customer service.\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"What should I do if my YES Bank credit card is lost or stolen?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"If your YES Bank credit card is lost or stolen, you must immediately block it. You can do so by reporting it to 1800-103-6000 or write us at yestouchcc@yesbank.in . You can also report it at credit card block dispute\"\n    }\n  },{\n    \"@type\": \"Question\",\n    \"name\": \"How can I cancel or close my credit card account?\",\n    \"acceptedAnswer\": {\n      \"@type\": \"Answer\",\n      \"text\": \"You can close or cancel the credit card through phone banking (1800 103 6000 for those in India and +91 22 4935 0000 for those abroad) or by sending a request letter to the bank's official address - yestouchcc@yesbank.in, through net banking, through iris App or clicking on link available on the footer of this page.\"\n    }\n  }]\n}\n</sc\x72ipt>\n<script type=\"application/ld+json\">\n\n        {\n            \"@context\": \"http://schema.org\",\n            \"@type\": \"CreditCard\",\n            \"brand\":\"YES Bank\",\n             \"name\": \"Credit Card\",\n             \"description\": \"Credit Card - Get flexible credit cards options with competitive rewards and benefits. Apply for credit card online & get instant approval with no annual fees\",\n            \"url\": \"https://www.yes.bank.in/personal-banking/yes-individual/cards/credit-cards\",\n           \"image\":\"https://www.yes.bank.in/content/published/api/v1.1/assets/CONT339926101C9B44E19F39FA05C86111DE/native/Mobile.webp?channelToken=580bc0ffbe3a47d690505e5f6d06e1c8\",\n          \"logo\":\"https://www.yes.bank.in/static_cache/img/new-logo.png\"\n  }\n</sc\x72ipt>",

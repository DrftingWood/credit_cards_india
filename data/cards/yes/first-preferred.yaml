  capping_rules:
  - Utility transactions on MCC 4900 are capped at 300 YES Rewardz points per statement cycle.
  - The current issuer card page excludes rent, wallet and fuel transactions, cash withdrawals, post-purchase and instant EMI, government, marketing/advertising, insurance, education, railways, toll, ferry and jewellery. Its MCC table is indicative; post-purchase/instant EMI has no listed MCC.
  redemption:
  - type: catalog
    program: YES Rewardz
    rate_inr_per_unit: 0.25
    fee_inr: 100
    constraints: Point value is up to INR 0.25 and depends on redemption channel. MITC v18 charges INR 100 plus GST per redemption request, an additional INR 99 plus GST for flight bookings, and states points expire three years after earning. An older issuer page says points do not expire; the current MITC v18 is followed here.
  notes: The current product page states 8 points per INR 200 on all categories except select categories, which earn 4 points per INR 200. Effective 15-Jun-2026 select MCCs are 4121, 4131, 4900, 5411 and 5499; the historical select-MCC list changed on that date. Point value is a maximum, not a realized redemption value. The issuer's legacy page says points do not expire, conflicting with the current general MITC v18; the current MITC is followed.

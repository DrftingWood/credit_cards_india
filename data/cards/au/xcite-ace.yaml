benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: null
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: 2 domestic visits per quarter after at least INR 50,000 spend in the previous quarter. Guest entitlements are not published.

  insurance:
  - type: air-accident
    sum_insured_inr: 5000000
    conditions: Current product page advertises INR 50 lakh air-accident cover. The linked policy (last updated 16-Apr-2021) says primary cardholder only, active card required, and the air ticket must be purchased with the AU card; it covers accidental death only. Treat detailed conditions as stale pending a current policy.
  - type: credit-shield
    sum_insured_inr: 200000
    conditions: Current product page advertises cover up to INR 2 lakh. The linked 16-Apr-2021 policy describes cover for card debits resulting from cardholder accidental death; confirm current policy before relying on it.
  - type: purchase-protection
    sum_insured_inr: 25000
    conditions: Current product page advertises cover up to INR 25,000. The linked 16-Apr-2021 policy limits this to specified household/electronic goods (excluding mobiles, laptops and tablets), fire/allied perils or burglary at the registered residence, within 90 days; current applicability is unconfirmed.
  - type: lost-card-liability
    sum_insured_inr: null
    conditions: Current product page advertises zero liability after reporting loss and counterfeit/skimming/online-fraud protection. The linked 16-Apr-2021 policy adds activation, reporting deadlines and exclusions; it does not state a monetary limit in the accessible text. Confirm current terms.
  - type: baggage-loss
    sum_insured_inr: null
    conditions: Current product page advertises baggage loss and delay cover. The linked 16-Apr-2021 policy requires an international-airline international flight booked with the AU card; baggage delay is over 12 hours and limited to emergency essentials. Current limits/terms remain unconfirmed.
  - type: trip-delay
    sum_insured_inr: null
    conditions: The current product page describes delay of flight cover but publishes no limit. The linked 16-Apr-2021 policy text accessible from that page details baggage delay, not a separate flight-delay benefit; current terms are unconfirmed.
  - type: other
    sum_insured_inr: null
    conditions: Current product page advertises loss-of-passport and plane-hijack cover. The linked 16-Apr-2021 policy describes reimbursement for replacement passport/visa and up to USD 250 per hour for hijacking, capped at an unspecified sum insured; current limits/terms are unconfirmed.
  other:
  - name: Device Protection Plan
    description: Complimentary protection plan for mobile phones and one-year extended warranty for mobiles, tablets, laptops and white goods. AU's detailed-plan link redirects to a registered-mobile-number login, so coverage values and terms are not publicly accessible.
  - name: Railway lounge access
    description: 8 complimentary visits per annum, maximum 2 per calendar quarter. Active AU Visa/RuPay card and valid train ticket required; INR 2 validation fee applies, guests are chargeable.
  - name: Xpress EMI
    description: Eligible individual transactions of INR 500 or more; total conversion must be at least INR 2,000. Up to 20 billed or unbilled transactions can be clubbed.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 100
    cycle: statement
    notes: Product page states INR 100 per statement cycle effective 1-Oct-2026. The 30-Sep-2026 KFS still lists INR 200 for the SwipeUp-Xcite series; the newer card page explicitly dates the reduction.
  concierge: true
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards/swipeup-program/xcite-ace-credit-card
    retrieved_on: '2026-10-26'

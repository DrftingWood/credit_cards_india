    - rewards.redemption.fee_inr
    notes: "Current card terms exclude wallet loads and all EMI transactions from earning effective 1-Sep-2024; direct school/college website and POS education payments earn, while third-party education-app payments do not. The Jul-2026 linked terms conflict internally on gift/prepaid/voucher purchases: summary table calls them 1% other spend, while detailed sections variously say they earn 1% and that MCC 6540 loads do not. The source says transactions over the 5% cap do not post CashPoints, but does not state whether they fall back to base earn; removed the previous affirmative fallback flag. For current fee/reward/benefit rows without a published start date, the schema-required effective_from is the product launch-date anchor, not a claim that current terms applied from launch. Wallet loads are excluded from base earn as stated in the current summary; MCC 6540 is explicitly barred from 5% but conflicting issuer language prevents a reliable blanket 1% exclusion rule for gift/prepaid/voucher purchases. Product and eligibility pages conflict on headline ages/income; the card-page criteria and eligibility FAQ agree on 21-40 and income thresholds."

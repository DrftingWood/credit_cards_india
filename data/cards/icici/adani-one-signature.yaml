      merchants/domestic/international/utility+insurance), floor rounding, and
      exclusions for cash advance, fuel, rent, charges/interest, card fees,
      EMI/BT/PLCC, gambling and business spend. Points post within 45 business
      days after statement; current webpage says end of billing cycle. Adani

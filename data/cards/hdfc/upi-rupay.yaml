  other:
  - name: UPI-linked virtual credit card
    description: Virtual RuPay credit card linkable to any UPI app (PayZapp, GPay, PhonePe, Paytm, BHIM, etc.) via
      a UPI PIN; earns CashPoints on UPI transactions. Managed through MyCards.
  - name: Fuel transaction charge
    description: HDFC says UPI payments have no fuel surcharge, but separately states that from 1-Oct-2025 a 1% fee applies to fuel transactions above INR 15,000, capped at INR 4,999 per transaction. The scope of the separate fee (UPI-only or all fuel transactions) is unclear in issuer wording.

  capping_rules:
  - 6% only on issuer-listed Dining & Travel MCCs and non-UPI transactions.
  - Maximum 3,000 Reward Points per statement cycle across accelerated cashback; after that, base points continue.
  - UPI transactions above INR2,000 earn 1% on non-excluded spends including Dining & Travel; UPI transactions below

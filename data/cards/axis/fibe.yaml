rewards:
- effective_from: 2026-08-28
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: 1% cashback on other eligible spend; the advertised INR 1,500 statement cap applies across all cashback categories.
  accelerated:
  - category: food-delivery-entertainment-local-commute
    canonical_categories:
    - dining
    - entertainment
    - travel
    multiplier: 3
    effective_rate: 3
    channel:
      class: online-any
      merchants:
      - any
    mcc_list:
    - '5499'
    - '5812'
    - '5814'
    - '7841'
    - '7829'
    - '7832'
    - '7922'
    - '4121'
    - '4131'
    - '4111'
    - '7512'
    cap_per_cycle: 1500
    cap_unit: cashback-inr
    cycle: statement
    notes: 3% applies to online food delivery, online entertainment and online local-commute transactions on the listed MCCs; the rule is both channel- and MCC-scoped, not limited to named apps.
  exclusions:
  - fuel
  - rent
  - wallet-loads
  - jewellery
  - gift-cards
  - emi
  - insurance-premiums
  - education
  - government
  - cash-advance
  - bridge-fees
  - road-fees-and-tolls
  reward_cap:
    max_units: 1500
    cap_unit: cashback-inr
    cycle: statement
  capping_rules:
  - Total cashback is capped at INR 1,500 per statement cycle across all categories.
  - No cashback on transactions below INR 100.
  - CC-on-UPI transactions below INR 2,000 and CC-on-UPI transactions at small merchants are excluded.
  - Same-statement refunds reduce net eligible spend; later reversals adjust subsequent periods. EMI purchases and post-facto EMI conversions earn no cashback. Per-transaction cashback rounds down and posts T+3 days after statement generation.
  - 'Cashback excludes wallet load, fuel, cash withdrawal, gold/jewellery, gift cards, EMI, rent, repayments, insurance, education, government services, qualifying low/small-merchant CC-on-UPI, and bridge/road fees and tolls. Terms specify excluded categories, not their exact MCCs.'
  redemption:
  - type: statement-credit
    rate_inr_per_unit: 1.0
  source:
    url: https://www.axis.bank.in/docs/default-source/default-document-library/credit-cards/terms-and-conditions-cashback-on-fibe-axis-bank-credit-card.pdf?sfvrsn=7cc42032_3

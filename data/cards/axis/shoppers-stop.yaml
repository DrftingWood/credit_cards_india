    notes: First Citizen points are distinct from Axis EDGE points and from similarly named loyalty currencies. Base 2/INR200
      applies outside specified Shoppers Stop family merchants; retailer and bank contribution split is documented in local
      T&C. Category exclusions include transport/bridge/road/tolls, utilities, insurance, education, government, wallet, rent,
      fuel and gift cards. The T&C refers to MCCs but text extraction provides no numeric MCC list; none is asserted.
  mcc_exclusions: []
  capping_rules:
  - No published earn cap on the listed reward rates. Points remain valid while the card is active; after closure, accrued
    points transfer to the First Citizen loyalty account and expire 365 days after closure.

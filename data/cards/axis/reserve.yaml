rewards:
- effective_from: 2026-10-25
  effective_until: null
  currency: points
  currency_name: EDGE Reward Points
  base:
    rate: 15
    per_inr: 200
  accelerated:
  - category: international-spend
    canonical_categories:
    - international
    multiplier: 2
    effective_rate: 30
    cap_unit: points
    cycle: monthly
    notes: Earn 30 EDGE Reward Points per INR 200 on eligible international spend up to the assigned credit limit per calendar month; 15 per INR 200 above that limit. Temporary credit limit increases are excluded. Base points post within T+7 days; accelerated points post on the 45th day after month-end. The schema cannot express a spend cap equal to the card-specific credit limit.
  exclusions:
  - wallet-loads
  - government
  - insurance-premiums
  - utilities
  - telecom
  - gift-cards
  - jewellery
  - fuel
  - bridge-fees
  - road-fees-and-tolls
  - cash-advance
  redemption:
  - type: catalog
    program: EDGE Rewards
    rate_inr_per_unit: null
    constraints: Redemption value varies by catalogue item; current issuer page does not state a universal INR per point value.
  source:
    url: https://www.axis.bank.in/cards/credit-card/reserve-credit-card/beyond-expectations-always
    retrieved_on: 2026-10-27
    type: issuer-page
    notes: Rent earns EDGE points up to INR 100,000 monthly; the issuer lists dynamic transfer ratios, so stale fixed partner ratios and point valuations were removed pending current partner-specific verification.
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated.multiplier
    - rewards.accelerated.effective_rate
    local_refs:
    - docs/sources/axis/reserve/reserve-revision-effective-2025-06-20.pdf
    - docs/sources/axis/reserve/reserve-revision-effective-2026-08-28.pdf
    notes: Current issuer terms exclude utility/telecom, rent (points earned only up to INR 100,000 per calendar month), wallet, gift cards, government, insurance, gold/jewellery, fuel, bridge fees, road fees/tolls, cash advances and repayments. EMI-converted transactions have points debited; cancelled EMIs do not restore points. Fee-waiver spend additionally excludes reversals, fees/charges and EMI transactions, among the other listed categories. No universal point redemption value is published.
  mcc_exclusions: []
benefits:
- effective_from: 2026-10-25
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - issuer-direct
      notes: Unlimited visits for primary and add-on cardholders at eligible domestic lounges. Up to 12 accompanying guest visits per calendar year are complimentary. Present the physical Reserve card and boarding pass; Priority Pass is not valid for domestic lounge entry in India effective 28 Aug 2026. The card-specific lounge PDF in the archive describes an older program valid only through Mar 2022, so it was not used for current terms. Guest quota is annual, not per visit.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - priority-pass
      notes: Complimentary Priority Pass for primary and add-on cardholders; unlimited international visits per card anniversary year and 12 guest visits per anniversary year. Guest quota is annual, not per visit.
  golf:
    rounds_per_cycle: 50
    cycle: annual
    notes: Issuer golf terms state 50 complimentary rounds per year. Booking is through Extraordinary Weekends/Golflan at least four days ahead, subject to availability; maximum two confirmed slots at once and one per day. This is not a golf-club membership.
  welcome:
  - condition: First transaction within 30 days of card creation; not applicable to first-year-free or lifetime-free issuance

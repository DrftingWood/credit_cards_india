  - Cash-credit redemption capped at 2,500 points per calendar month effective 2024-09-01. Current general
    reward-update table lists Duo 2,500 monthly reward-point cap, but the current Duo benefit guide states
    no cap on credit-card points earned; unresolved issuer wording conflict.

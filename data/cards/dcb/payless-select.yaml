eligibility:
  min_age: 18
  max_age: 75
  credit_score_min: null
  residency: resident-indian
  notes: DCB PayLess FAQ requires a DCB Fixed Deposit of at least INR15,000; eligible
    deposits must be held in one applicant name and excludes HUF, NRI, partnership/society/trust,
    minor, joint and tax-saver deposits. Income proof is not required, but bank credential
    assessment applies; no numeric credit-score threshold is published. FAQ gives
    up to 90% of linked deposit as credit limit subject to bank determination. Minimum
    FD requirement is stated generically for PayLess, not separately by variant.
  source:
    url: https://www.dcbbank.com/api/dcb/assets/2024-12/DCB-Bank-Payless-Credit-Credit-Card-FAQs_0.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/dcb/payless-platinum/payless-faq-2024-12-retrieved-2026-10-27.pdf
    fields_verified:
    - eligibility.min_age
    - eligibility.max_age
    notes: FAQ states age 18-75, Indian residency, minimum DCB FD INR15,000 and no
      income-proof requirement; account issuance remains subject to internal assessment.

    effective_until: null
    joining_fee_inr: 999
    annual_fee_inr: 999
    fee_waiver:
      spend_inr: 200000
      cycle: annual
      conditions: "Renewal fee waived on annual spends of INR200,000 or more in the preceding year."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/cashback-sbi-card.html
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/mitc-english.pdf
        - docs/sources/sbi/cashback/cashback-brochure.pdf
      fields_verified:
        - fees.joining_fee_inr
        - fees.annual_fee_inr
        - fees.fee_waiver.spend_inr
        - fees.forex_markup_pct
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee.pct
        - fees.cash_advance_fee.min_inr
      notes: "Current SBI application flow requires INR999 + taxes as joining fee and INR999 + taxes annually; the current MITC lists renewal fee INR999, waived at preceding-year annual spends of INR2 lakh or more. MITC confirms 3.5% foreign-currency markup, unsecured finance charges up to 3.75% monthly, and cash-advance fee of 2.5% with INR500 minimum. Historical start dates for current fees are not independently established. Application flow: https://www.sbicard.com/eapply/campaign.page?CHN=901&GEMID1=e&GEMID2=f&path=personal%2Fcredit-cards%2Frewards%2Fcashback-sbi-card.dcr"

rewards:
  - effective_from: 2026-04-01
    effective_until: null
    currency: cashback
    currency_name: Cashback
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
      # 1% offline earn is ALSO capped at Rs 2,000/cycle; with the 5% online cap
      # that puts a hard Rs 4,000/cycle ceiling on the whole card (1 Apr 2026).
      cap_per_cycle: 2000
      cap_unit: cashback-inr
      cycle: statement
    accelerated:
      - category: online-spend
        # Channel-scoped (card-not-present), so it covers anything bought online —
        # food delivery and online groceries included, not just the `online`
        # shopping bucket. Same defect class as axis-cashback (fixed 2026-07-28).
        canonical_categories: [online, dining, groceries]
        multiplier: 5
        effective_rate: 5
        cap_per_cycle: 2000
        cap_unit: cashback-inr
        cycle: statement
        notes: >-
          5% on eligible online transactions, capped at INR 2,000 per statement cycle; this cap
          is reached at INR 40,000 eligible online spend. SBI identifies online transactions using
          online indicators sent by the card network and acquirer; any transaction not classified
          as online is offline. This is a payment-channel rule rather than an MCC/merchant allowlist.
          Classification is best-effort, network-defined and can change. The calculator's current
          spend profile does not capture this channel for every category; see E17. Cashback accrues
          on posting/settlement date, reversals/returns may reverse cashback, and credit occurs within
          two working days after statement generation. Cashback above the online cap does not earn
          the offline 1% rate.
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - utilities
      - insurance-premiums
      - education
      - jewellery
      - emi
      - government
      - other
    capping_rules:
      - "Current structure effective 1-Apr-2026: 5% online transactions (network/acquirer online indicator), capped at INR 2,000 per statement cycle; 1% offline/POS transactions, separately capped at INR 2,000 per statement cycle; aggregate cashback cannot exceed INR 4,000 per statement cycle."
      - "Online transactions beyond the online cap do not earn the offline 1% rate; the two channel caps are independent."
      - "Transactions below INR 100 do not earn cashback. Cashback is rounded down separately for each transaction, so estimates from aggregated spend can overstate the result; the calculator currently cannot reproduce per-transaction rounding without transaction detail."
      - "Cashback accrues by posting/settlement date, is reduced/reversed for returns, refunds and reversals, and is automatically credited within two working days after statement generation."
      - "Excluded transactions include fuel, balance transfers, cash advances, financial charges, wallet loads, rent, jewelry, education, utilities, insurance, gift/novelty shops, railways, quasi-cash, SBI platform standing instructions/fetch-and-pay, Flexipay and merchant EMI. Effective 1-Apr-2026 additions: digital gaming MCC 7993/7994/5816, toll MCC 4784, and government MCC 9222/9311/9402. MCC assignment is network-defined and best-effort."
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 1.0
    source:
      url: https://www.sbicard.com/en/faq/cashback-sbi-card-faq.page
      retrieved_on: '2026-10-27'
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/cashback/cashback-terms-current.pdf
        - docs/sources/sbi/cashback/cashback-revision-apr-2026.pdf
      fields_verified: [rewards.base.rate, rewards.base.per_inr, rewards.base.unit_value_inr, rewards.base.cap_per_cycle, rewards.base.cap_unit, rewards.base.cycle, rewards.accelerated.effective_rate, rewards.accelerated.cap_per_cycle, rewards.accelerated.cap_unit, rewards.accelerated.cycle, rewards.exclusions, rewards.capping_rules, rewards.mcc_exclusions]
      notes: "SBI's current Cashback FAQ confirms 5% online and 1% offline rates, separate INR 2,000 statement-cycle caps, INR 4,000 aggregate cap, posting/settlement-date accrual, reversals and credit within two working days of statement generation. Cardholder terms define online/offline using network/acquirer online indicators. SBI's 25-Feb-2026 revision notice makes the current caps and additional MCC exclusions effective 1-Apr-2026."
    # 1 Apr 2026 additions: digital gaming (7993/7994/5816), tolls (4784),
    # government (9222/9311/9402). 6513 = real estate (pre-existing).
    mcc_exclusions: ['5172', '5541', '5542', '5983', '6540', '6541', '6513', '7349', '5051', '5094', '7631', '5944', '5111', '5192', '5942', '5943', '8211', '8220', '8241', '8244', '8249', '8299', '8351', '4900', '4814', '4816', '4899', '9399', '5960', '6300', '6381', '5947', '4011', '4112', '6011', '6012', '6051', '7993', '7994', '5816', '4784', '9222', '9311', '9402']

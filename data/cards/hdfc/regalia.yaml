    description: 2,500 Reward Points after renewal membership fee is realised;
      not applicable when the renewal fee is waived. INR value modeled at INR
      0.50/RP.
  - name: Application availability
    description: HDFC states sourcing of the classic Regalia card has been
      discontinued. Existing cardholder rewards and benefits remain documented;
      the cessation date is not stated.
  - name: Swiggy Dineout
    description: Current page advertises up to 7.5% discount at partner
      restaurants; cap and offer duration are not published on the product page.
eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 1200000
    self_employed: 1200000
  credit_score_min:
  residency:
  notes: HDFC eligibility page lists salaried Indian applicants aged 21-60 with
    net monthly income above INR 100,000, and self-employed Indian applicants
    aged 21-65 with annual ITR above INR 1,200,000. Annual income values here
    are annualized/entered as the stated annual ITR floor; no credit-score
    minimum is published. Residency is left unspecified because the legacy page
    also describes an NR Regalia autopay option.
  source:
    url: https://www.hdfc.bank.in/credit-cards/regalia-credit-card/eligibility
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: medium
    fields_verified:
    - eligibility.min_age
    - eligibility.income_inr_annual
    notes: HDFC's legacy eligibility page states salaried Indian applicants age
      21-60 with net monthly income above INR 100,000 and self-employed Indian
      applicants age 21-65 with annual ITR above INR 1,200,000. The shared age
      fields can only represent the overall 21-65 range; residency is left
      unspecified because the page also describes an NR Regalia payment option.
      No credit-score minimum is published.

rewards:
- effective_from: '2026-10-05'
  effective_until: null
  currency: cashback
  currency_name: BYOC Cashback
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1
    unit_value_inr_realized: 1
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: statement
    notes: 1% cashback on eligible retail transactions. Excludes fuel, utility, wallet and rental spends;
      maximum cashback INR1,000 per statement cycle. BYOC Rewards is an alternative module and earns points,
      not cashback; this entry models the Cashback module.
  accelerated:
  - category: chosen-merchants
    canonical_categories:
    - other
    multiplier: 10
    effective_rate: 10
    effective_per_inr: 100
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: statement
    notes: Optional Silver/Gold/Platinum subscription selects 2/3/5 merchants from Swiggy, Uber, PharmEasy,
      Bigbasket and BookMyShow. Cashback is 10% of net transaction value, capped at INR100 per customer per
      merchant per statement cycle and INR500 total per statement cycle; total value is limited to up to 2x
      the selected plan fee. Changes take effect from the next statement cycle.
  exclusions:
  - fuel
  - utilities
  - wallet-loads
  - rent
  - cash-advance
  redemption:
  - type: statement-credit
    program: BYOC Cashback
    rate_inr_per_unit: 1
    constraints: Cashback is credited to the card account. Cashback module cap is INR1,000 per statement cycle;
      optional selected-merchant plan has a separate INR500 total statement-cycle cap.
  source:
    url: https://www.yes.bank.in/sites/web/content/published/api/v1.1/assets/CONTAA57595B2EF245259C4C623B1F7D33B3/native/ybl_mitc_pdf.pdf?download=false
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.cap_per_cycle
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
  notes: The current MITC confirms BYOC Cashback has a separate INR1,000 statement-cycle cap, no cashback on
    utilities or wallet spend, and the optional merchant-plan rules. The indexed BYOC-specific issuer MITC
    states 1% cashback on retail transactions excluding fuel, utility, wallet and rental transactions. The
    alternative BYOC Rewards module charges INR49/month, earns 8 points per INR200 except fuel, caps utility
    points at 600 per statement cycle, and is not representable alongside cashback in this single-currency
    record. Current MITC refers to MCC-specific exclusions; detailed cash-back exclusions are summarized above.

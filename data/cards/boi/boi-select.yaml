    - benefits.lounge_access.international.visits_per_cycle
    - benefits.movies.cap_inr
    - benefits.other.value_inr
    notes: Current BOI page confirms current counts and terms for lounges, BookMyShow, Amazon Prime, Swiggy One, BigBasket, annual check-up, RuPay insurance and 24x7 concierge. No current issuer source found for the previously encoded fuel-waiver amount, so that benefit is no longer asserted.

    and age 25–55, with lower/higher age cutoffs possible at issuer discretion. The numeric income fields encode
    that threshold; no credit-score minimum is published. The issuer application form
    (https://media.bobcard.co.in/media/isqiuclw/bobcards_universal-application-form_14oct2024_15k.pdf) offers
    Eterna on Visa, Mastercard, and RuPay. This record represents Visa; the schema cannot model all three
    variants. Visa tier is unset because the reviewed issuer sources do not establish one.

    cap_unit: points
    cycle: monthly
  capping_rules:
  - Maximum 1,500 Stars per reward cycle across Axis and Google Pay promotional Stars; maximum 750 Stars are awarded by Axis Bank.
  - Base Stars are calculated on cumulative eligible spend; refunds, reversals and EMI-converted spends are handled as specified in the card T&Cs.
  redemption:
  - type: cashback-bank
    program: Google Pay
    rate_inr_per_unit: 1.0
    constraints: Each Star is INR 1. Redeem through Google Pay using this card for UPI payment; redemption options are controlled by Google Pay and may change. Stars expire after one year.
  source:
    url: https://www.axis.bank.in/cards/credit-card/google-pay-flex-axis-bank-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page

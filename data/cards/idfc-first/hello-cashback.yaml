# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : IDFC FIRST per-card Communication PDFs (docs/sources/idfc-first/)
#   Verified   : 2026-07-04   Confidence: HIGH (pdf)
#   Fees, reward rate, forex & caps cross-checked vs the source above where extractable.
# Eligibility income bands, min credit score & some launch dates are tier-standard
# defaults (not individually source-verified). Exact monthly caps on some cashback
# cards remain source/HTML-noted. See docs/sources/<issuer>/ for evidence.
# ---------------------------------------------------------------------------
id: idfc-first-hello-cashback
name: IDFC FIRST Hello Cashback Credit Card
issuer: idfc-first
network: visa
network_tier: platinum
tier: entry
card_type: secured
co_brand: null
status: active
launched_on: 2025-01-01
discontinued_on: null

fees:
  - effective_from: 2025-01-01
    effective_until: null
    joining_fee_inr: 0
    annual_fee_inr: 0
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.5
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    notes: "FD-backed secured card — credit limit = FD value (FD from ₹10,000); no joining fee. Interest-free cash withdrawal up to 45 days at ₹199 + GST per transaction."
    source:
      url: https://www.idfcfirst.bank.in/credit-card/hello-cashback-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2025-01-01
    effective_until: null
    currency: cashback
    currency_name: Cashback
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: incremental-online-above-10k
        canonical_categories: [online]
        multiplier: 5
        effective_rate: 5
        # The 5% is INCREMENTAL — it applies only to online spend above the
        # ₹10,000/month threshold, not to the whole bucket. Encoded as marginal
        # slabs (E3): the first ₹10,000 earns the 1% base, the excess earns 5%.
        # A flat 5% overstated the card ~2x for a mid-volume online spender
        # (₹15,000/month: ₹750 claimed vs ₹350 real).
        slabs:
          - upto_spend_inr: 10000
            rate_pct: 1
          - upto_spend_inr: null
            rate_pct: 5
        cap_per_cycle: 1000
        cap_unit: cashback-inr
        cycle: statement
        notes: "5% cashback on INCREMENTAL online spends above ₹10,000/month — the first ₹10,000 earns the 1% base, only the excess earns 5% (online cashback capped ₹1,000/statement, so the 5% slab saturates at ₹20,000 of incremental spend). Essentials & fuel do not count toward the ₹10,000 milestone."
      - category: hotel-flight-app
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 1
        cap_per_cycle: "unlimited"
        cap_unit: cashback-inr
        cycle: statement
        notes: "Additional 1% cashback on hotel & flight bookings via the IDFC FIRST Bank app (total up to 6%)."
    exclusions:
      - fuel
      - emi
      - wallet-loads
    mcc_exclusions: ['6513']
    reward_cap:
      max_units: 1500
      cap_unit: cashback-inr
      cycle: statement
    capping_rules:
      - "Online-spend cashback capped at ₹1,000/statement; total cashback capped at ₹1,500/statement."
      - "No cashback on fuel, ATM cash withdrawals, EMI, or UPI spends via third-party apps (GPay/PhonePe/Paytm)."
    redemption:
      - type: statement-credit
        program: IDFC FIRST Cashback
        rate_inr_per_unit: 1.0
    source:
      url: https://www.idfcfirst.bank.in/credit-card/hello-cashback-credit-card
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2025-01-01
    effective_until: null
    lounge_access: null
    welcome:
      - condition: "Introductory offer on early spends"
        benefit: "₹1,000 introductory cashback offer"
        value_inr: 1000
        window_days: 90
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 200
      max_txn_inr: 5000
      cap_per_cycle_inr: 300
      cycle: monthly
    other:
      - name: UPI on credit card
        description: "1% cashback on UPI spends made by scanning via the IDFC FIRST Bank app."
    concierge: false
    source:
      url: https://www.idfcfirst.bank.in/credit-card/hello-cashback-credit-card
      retrieved_on: 2026-07-03

eligibility:
  min_age: 18
  max_age: 70
  income_inr_annual:
    salaried: null  # secured against FD — no income requirement
    self_employed: null
  credit_score_min: null
  residency: resident-indian
  notes: "FD-backed — issued against a fixed deposit (from ₹10,000); no income/credit-score requirement."

application:
  apply_url: https://www.idfcfirst.bank.in/credit-card/hello-cashback-credit-card

metadata:
  last_verified_on: 2026-07-03
  tags: [entry, secured, cashback, online]

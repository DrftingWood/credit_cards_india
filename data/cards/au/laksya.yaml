    notes: 'Airport lounge: 2 per quarter after INR 50,000 prior-quarter retail spend (8/year); qualifying spend threshold is primary-cardholder spend and the threshold is used as a profile proxy in calculator estimates. The older lounge PDF states the threshold applies in the same calendar quarter and waives it for the first 30 days after activation, conflicting with the product page previous-quarter wording. Welcome is a customer choice between 4,000 Reward Points (worth INR 10 using the general AU Rewardz catalogue conversion) and a INR 1,000 voucher; no single option is assumed in the calculator. Fuel 1% on INR 400-5,000, capped INR 150 per statement cycle. Current issuer page advertises insurance coverage, card liability cover, credit shield and a device-protection plan, but does not publish limits, exclusions, insurer terms or claim conditions there; values remain unknown. Merchant offers, Xpress EMI and contactless terms are documented in other.'
  other:
  - name: Partner merchant offers
    description: 15% discount on Amazon Fresh/Amazon Now grocery and Zomato food delivery, capped INR 250 per month
      per category, once monthly; minimum transaction INR 500. District movie offer is Buy One Get One, max INR
      250 per month, once monthly; minimum transaction INR 250. Offers apply to add-on card spends.
  - name: Xpress EMI processing-fee waiver
    description: Issuer advertises zero processing fee for eligible Xpress EMI conversions of INR 2,000 or more; up to 20 billed or unbilled transactions may be clubbed. Other EMI products or charges may differ.
  - name: Contactless payments
    description: Contactless and digitally tokenized POS transactions up to INR 5,000 are advertised as PIN-free; these transactions earn 5 Reward Points per INR 100 under the card's contactless reward rule.

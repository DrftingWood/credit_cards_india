  other:
  - name: EaseMyTrip flight and hotel discounts
    description: 10% off domestic flights up to ₹1,000; 10% off international flights up to ₹5,000; 20% off domestic hotels up to ₹5,000; and 20% off international hotels up to ₹10,000. PNB lists no minimum order value for these discounts. Discount applies to at most four transactions per card per month.
  - name: EaseMyTrip bus discount
    description: ₹125 off bus bookings with a minimum order value of ₹500; discount applies within the shared limit of four discounted transactions per card per month.
  source:
    url: https://creditcard.pnb.bank.in/EMT.html
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: medium
    notes: 'PNB EMT page publishes welcome vouchers, travel discounts and lounge access. PNB Rewards page conditions the 300-point bonus on first retail/online transaction within 90 days. PNB current Schedule of Fees states 1% fuel surcharge refund on transactions ₹400–₹4,000, capped at ₹350 per statement cycle. PNB generic fuel waiver page shows a different lower transaction bound (₹500) for RuPay Platinum; discrepancy unresolved. Schedule: https://creditcard.pnb.bank.in/Documents/pnb_sofc.pdf. The EMT page does not state voucher category allocation or concierge.'

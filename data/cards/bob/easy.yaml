    notes: No points below ₹100 per transaction; fuel earns none. The 5X MCCs are departmental stores (5311)
      and cinemas (7832), capped at 1,000 accelerated points per statement cycle; UPI earns core points only.
      Eligibility depends on acquirer-reported MCC/flags. Points expire after two years; statement redemption
      requires 1,000 points. Other excluded MCC groups in BOBCARD Annexure 1 include transportation, government,
      education, hospitals, personal services, supermarkets/variety/retail, charity, and fast-food. BOBCARD
      SmartDeal adds 4 points/₹100 for flights and 10 points/₹100 for hotels booked in the logged-in app/portal.
benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Spend ₹5,000 within 60 days of issuance
    benefit: 500 reward points
    value_inr: 100
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+).
  - name: BOBCARD SmartDeal flight rewards
    description: Additional 4 reward points per ₹100 for eligible flight bookings in the logged-in BOBCARD app/portal.
  - name: BOBCARD SmartDeal hotel rewards
    description: Additional 10 reward points per ₹100 for eligible hotel bookings in the logged-in BOBCARD app/portal.
  - name: Smart EMI
    description: Purchases above ₹2,500 can be converted to Smart EMI for 6–48 months; applicable charges are not
      stated on the Easy product page.
  - name: Lost-card liability
    description: Issuer advertises zero liability for fraudulent transactions when the card loss is reported immediately.
  - name: Contactless payments
    description: Contactless-enabled card; issuer advertises wireless-chip payments.

    notes: "Current issuer page states one domestic and one international lounge visit per quarter. From 10 Apr 2026, INR 50,000 net retail spend in a calendar quarter unlocks domestic access in the next quarter; only primary cardholders qualify. International Priority Pass access is one per calendar quarter outside India; Priority Pass use within India and excess international visits are chargeable. Birthday benefit is 1,000 points on a retail transaction; spend_inr: 0 is a schema sentinel for an event-triggered benefit, not an issuer-published spend threshold. The product page advertises quarterly and yearly milestones without publishing their thresholds or award details. Fuel waiver is 1% on INR 400â€“5,000 transactions, capped at INR 100/statement. The current MITC lists 2 railway lounge visits/calendar quarter for Vetta; modeled separately as a card benefit note."

        multiplier: 1
        effective_rate: 10
        cap_per_cycle: 7500
        cap_unit: points
        cycle: monthly
        notes: "10 Reward Points per ₹100 on Dining, Departmental stores, Grocery & Movies (up to 7,500 points/month)."
    exclusions:
      - wallet-loads
      - rent
      - emi
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
      - type: catalog
        program: SBI Card Rewards
        rate_inr_per_unit: 0.25
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/bpcl-sbi-card-octane.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']

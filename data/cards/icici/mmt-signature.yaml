benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      notes: Two visits for primary cardholders; requires INR 75,000 or more card spend in the preceding calendar
        quarter for access in the following quarter. The linked Signature T&C PDF states one domestic visit per
        quarter, conflicting with the current product page, which is followed here.
      via:
      - priority-pass
    international:
      visits_per_cycle: 1
      cycle: annual
      guests_per_visit: 0
      notes: Primary cardholder only. The issuer states Priority Pass for applications on/after 2024-11-15 and DreamFolks
        for earlier applications.
      via:
      - priority-pass
      - dreamfolks
  milestones:
  - spend_inr: 250000
    cycle: annual
    benefit: Earn 1,100 myCash each anniversary year after INR 2.5 lakh qualifying card spend. Primary and add-on
      retail spend counts; reversals, cash advances, fees, charges, EMI, balance transfers and card personal loans
      are excluded. Credited within 10 business days after anniversary cycle completion if account is not delinquent
      or cancelled.
    reward_kind: points
    reward_units: 1100
    reward_currency_name: myCash
    trigger_window: anniversary-year
    value_inr: 1100
    is_repeatable: true
    max_awards_per_cycle: 1
  - spend_inr: 500000
    cycle: annual
    benefit: Earn 4,000 myCash each anniversary year after INR 5 lakh qualifying card spend; same qualifying-spend
      exclusions and credit conditions apply.
    reward_kind: points
    reward_units: 4000
    reward_currency_name: myCash
    trigger_window: anniversary-year
    value_inr: 4000
    is_repeatable: true
    max_awards_per_cycle: 1
  welcome:
  - condition: Primary cardholder; eligible joining fee payment. INR 1,500 myCash credited within 10 business days
      after fee payment if account is not delinquent or cancelled; holiday voucher is in welcome kit.
    benefit: INR 1,500 MakeMyTrip myCash and MakeMyTrip holiday voucher worth up to INR 2,500. Voucher applies once
      to domestic or international holiday packages booked through a MakeMyTrip executive; excludes individual bookings
      and has other restrictions.
    value_inr: 4000
    window_days: null
  - condition: Primary cardholder pays joining fee and registers using the MMTBLACK Exclusive code; programme terms
      and eligibility apply.
    benefit: Complimentary MMTBLACK Exclusive programme membership. Actual tier and benefits depend on programme
      eligibility; the associated holiday voucher of up to INR 20,000 has separate booking and spend conditions
      and is not counted as a fixed welcome value.
    value_inr: null
  movies:
    type: discount
    partner: BookMyShow / INOX
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 150
    notes: 25% discount up to INR 150 per transaction, minimum two tickets; card-specific T&C states up to twice
      a month.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: null
    cycle: monthly
    notes: At HPCL pumps on ICICI Bank POS machines in India; applies to primary and supplementary cards.
  concierge: false
  other:
  - name: MMTBLACK Exclusive programme membership
    description: Signature card welcome terms include access to register using a code after joining-fee payment.
      Tier and benefits remain governed by MMTBLACK programme eligibility. Issuer terms describe an Exclusive-tier
      holiday voucher up to INR 20,000 subject to conditions; do not count this headline value as guaranteed.
  - name: Railway lounge access
    description: One complimentary access per quarter to participating lounges in India, primary cardholder only.

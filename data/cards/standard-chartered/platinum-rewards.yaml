  gst_applicable: true
  notes: Standard tariff lists INR250 first-year and renewal fees. The current issuer product page and PRCXC
    Most Important Document advertise an electronically submitted application offer with INR0 first-year
    and renewal fees, subject to a transaction of at least INR500 within 30 days after setup; otherwise a
    one-time INR250 + GST is charged. The electronic offer excludes existing SC cardholders and carries
    no joining benefit. Supplementary card fees are nil. Generic current tariff rates are used for forex,
    monthly interest and cash advance fee.

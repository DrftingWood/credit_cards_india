rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: 360 Reward Points and cashback
  base:
    rate: 1
    per_inr: 150
    unit_value_inr: null
    unit_value_inr_realized: null
    notes: One reward point per INR150 on eligible other-category spending. The current card-specific terms do
      not establish a fixed rupee value per point.
  accelerated:
  - category: fuel
    canonical_categories:
    - fuel
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 200
    cap_unit: cashback-inr
    cycle: monthly
    notes: 5% cashback; maximum INR100 per transaction and INR200 per statement cycle; eligible fuel transaction
      amount must be INR2,000 or less. Fuel surcharge is included in the cashback percentage.
  - category: utilities
    canonical_categories:
    - utilities
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 100
    cap_unit: cashback-inr
    cycle: monthly
    notes: 5% cashback on electricity, water and gas payments; minimum INR750, maximum INR100 per transaction
      and per statement cycle; must be paid through Standard Chartered Billpay.
  - category: telephone
    canonical_categories:
    - utilities
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 200
    cap_unit: cashback-inr
    cycle: monthly
    notes: 5% cashback on telephone bills; minimum INR750, maximum INR100 per transaction and INR200 per
      statement cycle; must be paid through Standard Chartered Billpay.
  exclusions:
  - cash-advance
  redemption:
  - type: catalog
    program: 360 Rewards
    rate_inr_per_unit: null
    constraints: Cashback redemption requires at least INR1,000 and is in INR500 multiples. Reward-point
      redemption requires at least 500 points for catalogue products, vouchers or services. Current card-specific
      sources do not establish a fixed rupee value per reward point.
  source:
    url: https://www.sc.bank.in/credit-cards/super-value-titanium/
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/standard-chartered/super-value-titanium/product-terms-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
  notes: Current terms cap total cashback at INR500 per statement cycle across the customer's SC cards, including
    supplementary cards. The current product page gives INR100 per-transaction limits; the linked 2019 T&C
    states INR200 per fuel and telecom transaction, so the older terms conflict with the current product page.
    Product terms exclude returned, disputed, unauthorized/fraudulent, charged-back transactions, finance charges
    and card-account fees; cash advances and loans are ineligible for cashback. Cashback and points are both
    credited to Rewards360. Removed unsupported old wallet/rent/insurance/EMI exclusions and MCC 6513.

id: sbi-miles
name: SBI Card MILES
issuer: sbi
network: visa
network_tier: null
tier: mid
card_type: credit
co_brand: null
status: active
launched_on: null
discontinued_on: null

fees:
  - effective_from: 2024-01-01
    effective_until: null
    joining_fee_inr: 1499
    annual_fee_inr: 1499
    renewal_fee_inr: 1499
    fee_waiver:
      spend_inr: 600000
      cycle: annual
      conditions: "Annual fee reversed on spends of ₹6 lakhs in a membership year."
    forex_markup_pct: 3.0
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    supplementary_card_fee_inr: 0
    gst_applicable: true
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/sbi-card-miles.html
      retrieved_on: 2026-07-03
    notes: "Add-on card fee: Nil. Finance charge shown at SBI standard; TODO verify."

rewards:
  - effective_from: 2024-01-01
    effective_until: null
    currency: miles
    currency_name: Travel Credits
    base:
      rate: 1
      per_inr: 200
      unit_value_inr: 1.0
      unit_value_inr_realized: 0.5
    accelerated:
      - category: travel
        canonical_categories: [travel]
        multiplier: 2
        effective_rate: 2
        cap_per_cycle: "unlimited"
        cap_unit: miles
        cycle: monthly
        notes: "2 Travel Credits per ₹200 spent on travel (vs 1 per ₹200 on other spends)."
    exclusions:
      - fuel
    redemption:
      - type: airmiles
        rate_inr_per_unit: 1.0
        constraints: "1 Travel Credit = Re.1 when redeemed for Air Miles / Hotel Points."
      - type: hotel-points
        rate_inr_per_unit: 1.0
      - type: other
        rate_inr_per_unit: 0.5
        constraints: "1 Travel Credit = Rs.0.50 for travel bookings."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/sbi-card-miles.html
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2024-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [mastercard, rupay]
        notes: "Max 2 visits per quarter. Plus 1 extra visit per ₹1 lakh spent, capped at 8 additional visits per membership year."
    milestones:
      - spend_inr: 500000
        cycle: annual
        benefit: "5,000 Bonus Travel Credits on annual spends of ₹5 lakhs"
        value_inr: 5000
        reward_kind: miles
        reward_units: 5000
        reward_currency_name: Travel Credits
        trigger_window: anniversary-year
      - spend_inr: 100000
        cycle: annual
        benefit: "1 additional domestic airport lounge visit for every ₹1 lakh spent (capped at 8 additional visits per year)"
        trigger_window: rolling
        is_repeatable: true
    welcome:
      - condition: "Spends of ₹30,000 within 60 days of card issuance"
        benefit: "1,500 Travel Credits as Welcome Gift"
        value_inr: 1500
        window_days: 60
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 500
      max_txn_inr: 4000
      cap_per_cycle_inr: null
      cycle: monthly
      notes: "SBI standard 1% fuel surcharge waiver; exact slab/cap TODO verify."
    other:
      - name: Priority Pass Membership
        description: "Complimentary Priority Pass Membership worth $99, giving access to 1,000+ international lounges. Complimentary for first 2 years; $27 + taxes per visit thereafter."
        value_inr: null
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/sbi-card-miles.html
      retrieved_on: 2026-07-03


    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption
  capping_rules:
  - Domestic retail earn is 5 points per INR100; eligible international retail
    earn is 10 points per INR100. Reward points post within 45 days of
    settlement.
  - Reward program terms allow category and card-specific redemption rates,
    exempt Insignia from the 24-month point expiry, and exempt it from the
    reward redemption fee. Generic retail transactions exclude cash withdrawals
    and fund transfers.
  - Miles Transfer Programme conversion ratio for Insignia is 3 reward points
    per partner mile/point; primary cardmember only. Up to 50,000 points per
    request and two requests per month.
benefits:
- effective_from: '2026-10-27'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Two complimentary visits per calendar quarter. Primary/cardmember
        only; guests incur charge after complimentary visits are exhausted. Up
        to INR25 validation authorization is reversed in same month.
    international:
      visits_per_cycle: 6
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      - loungekey
      notes: Six complimentary visits per calendar year (not unlimited).
        Activate international online transactions and present card/Priority
        Pass membership. Up to USD1 validation authorization reversed. After
        complimentary visits, charges up to USD35 per visit; accompanying guests
        are charged after free visits are used. Additionally one Lounge Key
        voucher can be claimed for each calendar month with INR100,000 eligible
        spend in that month, over and above the six; voucher becomes available
        in first week of next month and is valid 180 days.
  golf:
    rounds_per_cycle: 4
    cycle: annual
    lessons_per_cycle: 1
    notes: 'Mastercard variant only: four complimentary rounds/year and one lesson/month;
      50% discount beyond four rounds. No free quota published for Visa variant.'
  welcome:
  - condition: Make an eligible retail transaction within 30 days of card
      issuance and pay annual membership fee shown on first statement by payment
      due date. Not available to Insignia Banking customers whose annual fee is
      nil.
    benefit: 28,000 reward points; credited within 60 days of issuance
    value_inr:
    window_days: 30

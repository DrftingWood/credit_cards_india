rewards:
- effective_from: 2024-08-01
  effective_until: null
  currency: cashback
  currency_name: NeuCoins
  redemption_scope: closed-loop
  ecosystem_label: Tata Neu
  loyalty_program: tata-neu-points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
  accelerated:
  - category: tata-neu-app-partners
    canonical_categories:
    - online
    multiplier: 2
    effective_rate: 2
    card_attributable_rate: 2
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_per_cycle: 100000
    cap_unit: spend-inr
    cycle: annual
    merchants:
    - tata-neu-app
    - bigbasket
    - 1mg
    - croma
    - westside
    - tata-cliq
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - tata-neu
    notes: 2% NeuCoins on non-EMI spends on partner Tata brands (1% base + 1% additional);
      additional 5% via Tata NeuPass on select categories. Subject to Annex 1 brand
      fair-usage spend caps.
  - category: upi-spends-tata-neu
    multiplier: 1
    effective_rate: 1
    card_attributable_rate: 1
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    merchants:
    - tata-neu
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - tata-neu
    notes: 1.00% NeuCoins on UPI spends routed via Tata Neu UPI ID (0.25% bank base
      + 0.75% Tata Neu UPI bonus, w.e.f. 01-Aug-2024), capped at 500 NeuCoins per
      calendar month across all UPI transactions.
    canonical_categories:
    - other
  - category: upi-spends-other
    multiplier: 0.25
    effective_rate: 0.25
    card_attributable_rate: 0.25
    card_attributable_per_inr: 100
    stacks_with_program: false
    cap_per_cycle: 500
    cap_unit: cashback-inr
    cycle: monthly
    notes: 0.25% NeuCoins on eligible UPI transactions via third-party UPI apps (Google
      Pay, PhonePe, CRED, BHIM, etc.), sharing the 500 NeuCoins/calendar-month UPI
      cap.
    canonical_categories:
    - other
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  - utilities
  capping_rules:
  - UPI spends on the RuPay variant earn 0.25% on any UPI app and an additional 0.75%
    (1.00% total) when paid via Tata Neu UPI ID; total UPI NeuCoins are capped at
    500 per calendar month (w.e.f. 01-Aug-2024).
  - Partner Tata Brand transactions paid via UPI earn the UPI rate (up to 1.00% capped
    at 500/mo), not the 2% non-UPI Tata brand rate.
  - 'Non-UPI category caps per calendar month: Grocery 1,000 NeuCoins; Insurance 2,000
    NeuCoins; Utility 2,000 NeuCoins; Telecom & Cable 2,000 NeuCoins.'
  - 'From 1-Jul-2025: no NeuCoins on online skill-based gaming (MCC 5816).'
  redemption:
  - type: cashback-bank
    program: Tata Neu wallet
    rate_inr_per_unit: 1.0
    constraints: NeuCoins redeemable across Tata Neu app ecosystem at 1 NeuCoin =
      Re. 1.
  source:
    url: https://www.hdfc.bank.in/credit-cards/tata-neu-plus-hdfc-bank-credit-card

    conditions: Annual fee waived on eligible spends of INR 25 lakh in the preceding card anniversary year. Rental, wallet, gift-card, Priority Pass, EMI, government, utility/telecom, insurance, gold/jewellery and fuel spends are excluded; fees and charges are excluded. INR12,500 pricing applies to new accounts from 1-Sep-2023; issuer terms describe legacy customer cohorts with different fee treatment.

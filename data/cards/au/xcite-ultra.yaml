  - type: trip-delay
    sum_insured_inr: null
    conditions: Product-page footer lists flight delay; current limit and detailed terms remain unverified because linked terms are dated 16-Apr-2021.
  other:
  - name: Device Protection Plan
    description: Complimentary device protection for mobile phones and a 1-year extended warranty for purchased mobile phones, tablets, laptops and white goods.
  - name: Railway lounge access
    description: 8 complimentary railway lounge visits per annum, maximum 2 per calendar quarter.
  - name: Xpress EMI
    description: Convert transactions of ₹500 or more, minimum total value ₹2,000, to EMI; up to 20 billed or unbilled transactions may be clubbed.
  - name: Contactless payments
    description: Tap-to-pay purchases up to ₹5,000 without PIN at a POS terminal, including digitally added mobile cards.
  - name: Add-on cards
    description: Issuer offers add-on cards; product page does not publish a card-specific numerical limit.
  - name: Curated offers
    description: Issuer advertises offers on MakeMyTrip, Times Prime membership and Alaya stays; offer terms vary.

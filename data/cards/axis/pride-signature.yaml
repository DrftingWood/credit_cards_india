  notes: 'Joining fee nil; first-year annual fee nil, then INR 500, waived at INR 40,000 eligible spend in the preceding year. MCC 6513 rent, MCC 6540 wallet loads, MCC 5947 gift cards and MCC 4784 toll/bridge fees do not count toward waiver. Other charges: cash payment INR 175; replacement/add-on nil; duplicate statement, charge-slip retrieval, outstation cheque and balance inquiry waived; mobile alerts free; late fees nil below INR 500, INR 500 for INR 501-5,000, INR 750 for INR 5,001-10,000, INR 1,200 for INR 10,001-50,000 and INR 1,300 above INR 50,000, plus INR 100 after two consecutive unpaid MAD cycles; overlimit 2.5% (minimum INR 500); cheque return/auto-debit reversal 2% (minimum INR 500); railway ticket surcharges per IRCTC; foreign currency 3.5%, DCC 3.5% plus tax; rent 1%, third-party education 1%, wallet 1% at cumulative INR 10,000 per statement, fuel 1% at INR 50,000 per statement, utility 1% at INR 25,000 per statement, and skill gaming 1% at INR 10,000 per statement. Reward redemption fee is listed as applicable, but its amount is not published on this card page. Exact INR 500 late-fee boundary is unspecified. No public numeric income or bureau-score minimum is given.'

rewards:
- effective_from: 2022-04-01
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 0.0025
    unit_value_inr_realized: null
    notes: Base earning is 1 Reward Point per â‚¹100 in eligible retail spend. Utility and telecom earn base points with a 100-point per-transaction cap; listed exclusions include fuel, rent, cash withdrawal, BBPS, EMI, and education/government services. Points are additional to feature cashback.
  accelerated:
  - category: toggle-reward-booster
    multiplier: 10
    effective_rate: 10
    cap_per_cycle: 10000
    cap_unit: points
    cycle: monthly
    notes: Conditional, paid, customer-selected feature. 5X or 10X can be selected for online and/or offline retail spends; base earning is included in the multiplier. The feature is valid for 90 days and can auto-renew. The calculator does not capture selected mode, feature price, or auto-renewal, so this rate must not be presented as an unconditional card earn rate.
    canonical_categories:
    - online
    - other
    source:
      url: https://www.au.bank.in/lit-terms-and-conditions
      retrieved_on: '2026-10-27'
      type: issuer-page
      confidence: high
      fields_verified:
      - rewards.accelerated[0].multiplier
      - rewards.accelerated[0].effective_rate
      - rewards.accelerated[0].cap_per_cycle
      notes: Issuer terms identify online and offline retail as separate feature choices, with 5X or 10X totals including the base point.
  exclusions:
  - fuel
  - rent
  - emi
  capping_rules:
  - The 10,000-point statement-cycle cap applies to total Reward Points across all earning, not just accelerated earning.
  - Boosted earning applies only when the matching paid feature is selected and active; customer configuration is not represented by the calculator inputs.

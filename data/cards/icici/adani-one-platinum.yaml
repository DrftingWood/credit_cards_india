    - rewards.accelerated[1].effective_rate
    - rewards.accelerated[2].effective_rate
    notes: Card T&Cs specify 3/1/1.5/0.5 points per INR100 (participating
      merchants/domestic/international/utility+insurance), floor rounding, and
      exclusions for cash advance, fuel, rent, charges/interest, fees,
      EMI/BT/PLCC, gambling and business transactions. Card terms say points
      post within 45 business days after statement; current product page says
      end of billing cycle. Adani Rewards T&Cs
      (https://www.adanione.com/terms-and-conditions/adani-rewards) state points
      are non-cash, have no monetary value and expire after 2 years; no fixed
      INR unit value is asserted.

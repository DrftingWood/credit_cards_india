benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 2
      via:
      - visa
      notes: Unlimited for primary and add-on cardholders. Primary cardholder has two guest lounge visits per year;
        both guest visits may be used at once. INR2 visit-validation charge applies.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 2
      via:
      - priority-pass
      notes: Unlimited for primary and add-on cardholders. Primary cardholder has two guest lounge visits per year;
        both guest visits may be used at once. USD1 validation charge is automatically reversed within 7 working
        days.

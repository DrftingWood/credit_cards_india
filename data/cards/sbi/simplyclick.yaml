rewards:
  - effective_from: 2026-10-25
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: null
    accelerated:
      - category: online-partner-merchants
        canonical_categories: [online]
        multiplier: 10
        effective_rate: 10
        cap_per_cycle: 10000
        cap_unit: points
        cycle: monthly
        merchants: [apollo-24-7, bookmyshow, cleartrip, dominos, igp, myntra, netmeds, swiggy, yatra, gyftr, tata-cliq]
        channel:
          class: cobrand-merchant
          merchants: [apollo-24-7, bookmyshow, cleartrip, dominos, igp, myntra, netmeds, swiggy, yatra, gyftr, tata-cliq]
        notes: "10 total Reward Points per INR 100 on INR-denominated online transactions identified with the listed eligible partner merchant IDs. An SBI notice effective 1-Oct-2020 explicitly capped the cumulative 10X partner stream at 10,000 points/month. The latest SimplyCLICK Reward Point T&C does not restate a partner cap while explicitly capping other-online 5X at 10,000; pending SBI clarification, the model retains the last explicit 10,000-point cap and does not claim an uncapped stream. Cleartrip/Yatra affiliate transactions are excluded; GyFTR e-gift-voucher purchases qualify only through the SimplyCLICK GyFTR portal. Partner eligibility depends on issuer/network merchant identification and is best-effort."
      - category: online-other
        canonical_categories: [online]
        multiplier: 5
        effective_rate: 5
        cap_per_cycle: 10000
        cap_unit: points
        cycle: monthly
        over_cap_earns_base: true
        notes: "5 total Reward Points per INR 100 on other eligible online spends, capped at 10,000 points per calendar month; eligible spend after that cap earns the 1-point base rate. Utility bill payments made through SBI Card website/app do not get 5X. Online classification relies on network/acquirer flags and is best-effort."
    exclusions:
      - wallet-loads
      - rent
      - government
      - cash-advance
      - emi
      - fuel
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
      - type: catalog
        program: SBI Card Rewards
        rate_inr_per_unit: null
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/simplyclick-sbi-card.html
      retrieved_on: 2026-10-25
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/simplyclick-sbi-card-rp-tnc.pdf
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - rewards.base.rate
        - rewards.base.per_inr
        - rewards.base.unit_value_inr
        - rewards.accelerated.effective_rate
        - rewards.accelerated.cap_per_cycle
        - rewards.accelerated.cap_unit
        - rewards.accelerated.cycle
        - rewards.accelerated.merchants
        - rewards.exclusions
        - rewards.mcc_exclusions
        - rewards.redemption.rate_inr_per_unit
        - rewards.capping_rules
      notes: Current product page lists 10X partner and 5X other-online rates, 1 point per INR 100 elsewhere, and 4 points = INR 1 for statement-credit redemption. Card-specific Reward Point T&C specifies INR spend, the 10,000-point monthly cap on other online spend and historical notice cap on partner spend (the current booklet omits the latter), excluded transaction/MCC classes, partner effective dates, partner/MID/network best-effort recognition, affiliate exclusions, and GyFTR portal restriction. Current SBI rewards FAQ/MITC states the INR 99 plus tax redemption fee, points expire after 24 months, and from 1-Apr-2026 statement-credit redemptions are in 4,000-point multiples with a 60,000-point monthly cap for eligible cards. Redemption fees depend on batch timing and redemption choice, so realized value is left unknown.
    mcc_exclusions: ['5172', '5541', '5542', '5983', '6513', '6540', '6541', '9311', '9399', '5816', '7993', '7994']
    capping_rules:
      - Other online spend earns 5 total points per INR 100 up to 10,000 points per calendar month; after that, eligible spend earns 1 base point per INR 100. An older SBI notice explicitly sets a 10,000-point monthly cap on partner 10X; the latest card-specific T&C does not restate that partner cap. The model conservatively retains the last explicit cap pending clarification.
      - 10X applies only to INR-denominated eligible transactions recognized under partner merchant IDs. Cleartrip and Yatra affiliate channels are excluded; GyFTR e-gift vouchers qualify only through the SimplyCLICK GyFTR portal. Online recognition depends on network/acquirer indicators and partner MID reporting.
      - SBI Card website/app utility bill payments do not earn 5X. Wallet loads MCC 6540/6541, rent MCC 6513, government MCCs 9311/9399, digital gaming MCCs 5816/7993/7994, cash advances, balance transfers, encash, Flexipay and offline fuel MCCs 5172/5541/5542/5983 do not earn Reward Points.
      - Statement-credit redemption is INR 0.25 per point before fees. From 1-Apr-2026 it requires 4,000-point multiples and is capped at 60,000 points per card per calendar month. The INR 99 plus tax fee is per daily processing batch and can repeat across batches; points expire after 24 months. Aggregate spend inputs cannot determine redemption batch count or realized net value.

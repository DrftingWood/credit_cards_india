rewards:
- effective_from: '2026-05-15'
  effective_until: null
  currency: points
  currency_name: CashPoints
  base:
    rate: 1
    per_inr: 200
    unit_value_inr: 0.15
    unit_value_inr_realized: 0.15
    excluded_categories:
    - fuel
    - rent
    - government
    - wallet-loads
    - emi
    notes: Since 15-May-2026, 1 CashPoint per INR 200 on other eligible spends. CashPoint redemption value is INR
      0.15 for catalogue/SmartBuy travel/cashback. Third-party app education MCCs are excluded, while direct school/college-site
      or POS education may earn; broad education exclusion removed.
  accelerated:
  - category: select-merchants
    canonical_categories:
    - groceries
    - dining
    - entertainment
    - travel
    effective_rate: 10
    effective_per_inr: 200
    cap_per_cycle: 2500
    cap_unit: points
    cycle: monthly
    merchants:
    - bigbasket
    - bookmyshow
    - oyo
    - swiggy
    - uber
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - bigbasket
      - bookmyshow
      - oyo
      - swiggy
      - uber
    notes: Current Freedom T&Cs dated 15-May-2026 state 10 CashPoints per INR 200 on non-EMI purchases at BigBasket, BookMyShow, OYO, Swiggy and Uber, capped at 2,500 per calendar month. Eligible merchant IDs/category assignment apply; settled transactions count and reversals can adjust points.
  exclusions:
  - fuel
  - rent
  - government
  - wallet-loads
  - emi
  - cash-advance
  - gift-cards
  capping_rules:
  - Overall reward points capped at 15,000 per statement cycle.
  - Utility MCC 4900 capped at 2,000 CashPoints per calendar month.
  - Telecom/cable MCCs 4812, 4814 and 4899 capped at 2,000 CashPoints per calendar month.
  - Education payments through third-party apps do not earn; direct school/college websites or POS may earn.
  redemption:
  - type: catalog
    program: HDFC Reward Catalogue
    rate_inr_per_unit: 0.15
  - type: other
    program: Unified SmartBuy flights/hotels
    rate_inr_per_unit: 0.15
  - type: cashback-bank
    program: Cashback
    rate_inr_per_unit: 0.15
    min_units: 3334
    fee_inr: 50
    constraints: Minimum redemption 3,334 CashPoints (INR 500); INR 50 redemption fee.
  - type: airmiles
    program: HDFC AirMiles
    rate_inr_per_unit: null
    constraints: 1 CashPoint converts to 0.15 AirMiles; INR value depends on redemption.
  source:
    url: https://v.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/freedom-credit-card/freedom-tncs.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption
    local_refs:
    - docs/sources/hdfc/freedom/freedom-tncs.pdf
    - docs/sources/hdfc/_shared/hdfc-card-changes-effective-2026-05-15.pdf
    notes: Current Freedom T&Cs dated 15-May-2026 state base 1/INR 200 and partner 10/INR 200 (10X) on the five named merchants; earlier 27-Feb-2026 T&Cs used the superseded 10/INR 150 rate. Rent, government, fuel, wallet/gift/prepaid/voucher loads, EMI, cash advances, unpaid statement balances and card fees do not earn. Utility and telecom/cable MCC caps are 2,000 CashPoints each per calendar month; overall earned points cap is 15,000 per statement cycle. Direct school/college web/POS education may earn; third-party app education does not. Cashback redemption requires 3,334 CashPoints (INR 500) and costs INR 50; SmartBuy/catalogue/cashback values are INR 0.15 per point. AirMiles conversion is 0.15 per point. Redemption routes vary and some have fees/limits.

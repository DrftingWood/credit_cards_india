  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - visa
      - dreamfolks
      notes: Two complimentary visits in the next calendar quarter after at least INR75,000 card spend in the preceding quarter. The product page does not specify guest entitlement.
    international:
      visits_per_cycle: 3
      cycle: annual
      guests_per_visit: 0
      via:
      - visa
      - priority-pass
      notes: Three complimentary visits per calendar year outside India, primary cardholder only. Guests are charged USD35 per person per visit. USD1 validation charge is credited back within seven working days.
  milestones:

      and AU member agreement confirm earn mechanics, 12,000 cap, redemption values
      and exclusions. The The 24-Mar-2026 AU Card Member Agreement explicitly says no fee is levied for CheQ Points redemption; AU's general INR 99 reward redemption fee does not apply to this program. INR

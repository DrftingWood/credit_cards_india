rewards:
- effective_from: 2001-01-01
  effective_until: null
  currency: points
  currency_name: Membership Rewards
  base:
    rate: 1
    per_inr: 40
    unit_value_inr: 0.5
    unit_value_inr_realized: null
    excluded_categories:
    - fuel
    notes: Face estimate is evidenced by the current Taj Experiences voucher example (INR 10,000 for 20,000 points);
      other redemption choices have different values.
  accelerated:
  - category: overseas-spend
    canonical_categories:
    - international
    multiplier: 3
    effective_rate: 3
    effective_per_inr: 40
    notes: 3x Membership Rewards on eligible overseas and foreign-currency purchases; issuer defines this as a total
      rate.
  - category: fuel-standard-points
    canonical_categories:
    - fuel
    effective_rate: 1
    effective_per_inr: 100
    notes: Uncapped standard point floor on eligible OMC fuel. An additional 4 bonus points per INR 100 is capped
      at 5,000 bonus points per calendar month and can take up to 90 days; this bonus is not included because the
      cap applies only to the bonus component and the calculator cannot yet model that split.
  exclusions:
  - wallet-loads
  - insurance-premiums
  - cash-advance
  - utilities
  mcc_exclusions:
  - '6513'
  redemption:
  - type: statement-credit
    rate_inr_per_unit: null
    constraints: Current public issuer material does not state a fixed INR value for paying card charges with points.
  - type: voucher
    program: Amex gift vouchers
    rate_inr_per_unit: 0.5
    constraints: Taj Experiences Gift Card worth INR 10,000 for 20,000 points (25,000 points before the current
      25% value enhancement); value varies by option.
  capping_rules:
  - Point value varies by redemption; calculator uses the current INR 10,000 / 20,000-point Taj voucher as its nominal
    face-value proxy.
  - Fuel bonus points (4 additional per INR 100, capped at 5,000 bonus points per calendar month) are omitted from
    calculator estimates; the uncapped 1 point per INR 100 floor is modeled.
  source:
    url: https://www.americanexpress.com/in/benefits/the-platinum-card/
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: medium
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.base.unit_value_inr
    - rewards.base.excluded_categories
    - rewards.accelerated
    - rewards.redemption.rate_inr_per_unit
    - rewards.exclusions
    notes: Current issuer terms state 1 point per INR 40 on eligible regular spend, 3x on overseas spend, and 1
      point per INR 100 on fuel plus 4 bonus points per INR 100 capped at 5,000 bonus points per calendar month.
      Fuel bonus fulfilment may take up to 90 days. Calculator models overseas 3x and the uncapped fuel floor only;
      bonus points are omitted because the component-only cap is not represented. Insurance and utility bill payments
      do not earn points. The 0.5 face value comes from the currently advertised Taj Experiences voucher; values
      vary by redemption option. Rechecked on 27 Oct 2026 against current Platinum page; base 1 point per INR 40
      and 3X eligible overseas spend remain listed. The page also currently lists ShopWise 5X e-vouchers and Rewards
      Xcelerator up to 20X on 20+ luxury brands; merchant-specific terms are dynamic and these are not encoded as
      flat card-wide accelerators.

    - docs/sources/idfc-first/wealth/travel-rewards-terms-retrieved-2026-10-26.pdf
  notes: 3 points per INR200 on other eligible online/offline spends; points value INR0.25. No points for transactions below INR200, fuel, EMI, fees/charges, cash withdrawal, Loan on Card or Balance Transfer. Points are earned only on spend up to the credit limit per billing cycle; points for a cycle may be withheld/reversed if MAD is not paid by due date. Current product page explicitly removes international reward earning effective 2026-10-26; older banner/FAQ copy still describes international 10X and conflicts with that dated footnote. FIRST Wealth T&Cs separately advertise 20% hotel and 10% flight bonus points via app, capped at 8,000 bonus points/month, but card page examples and T&C tables phrase total rates inconsistently; bonus rates are preserved under benefits notes, not scored.
benefits:
- effective_from: '2026-04-01'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 1
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      via:
      - visa
    international:
      visits_per_cycle: 1
      cycle: quarterly
      guests_per_visit: 0
      spend_threshold_inr: 20000
      spend_threshold_cycle: monthly
      via:
      - dreamfolks
  welcome:
  - condition: Spend at least INR5,000 within 30 days of card generation; primary card only
    benefit: INR500 gift voucher from selected brands
    value_inr: 500
    window_days: 30
  - condition: First EMI transaction within 30 days of card generation
    benefit: 5% cashback on first EMI transaction, capped at INR1,000
    value_inr: 1000
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 300
    cycle: monthly
  movies:
    type: bogo
    partner: District by Zomato
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 250
    notes: INR250 off the second ticket when booking at least two tickets; once per offer use, twice per card per calendar month. Requires INR20,000 card spend in the previous calendar month under the June 2026 update.
  insurance:
  - type: personal-accident
    sum_insured_inr: 1000000
    conditions: Minimum one purchase or ATM withdrawal on the card within the last 30 days; accidental death/permanent disability terms apply.
  - type: air-accident
    sum_insured_inr: 100000000
    conditions: Covered air ticket must be purchased using the card; one claim per cardholder, subject to insurer terms.
  - type: lost-card-liability
    sum_insured_inr: 50000
    conditions: Active card and insurer claim/reporting terms apply.
  - type: purchase-protection
    sum_insured_inr: 50000
    coverage_duration_days: 60
    conditions: Residential fire/burglary cover for eligible purchases; active-card and policy terms apply.
  - type: other
    sum_insured_inr:
    sum_insured_amount: 1200
    sum_insured_currency: USD
    conditions: Travel insurance including checked baggage loss up to USD500, baggage delay USD100, passport/document loss USD300 and flight delay USD300; ticket must be purchased with card and active-card terms apply.
  other:
  - name: Railway lounge access
    description: "Issuer sources conflict on quota: current product FAQ says four railway lounge visits per year, while the detailed privileges terms say up to four per quarter. No single quota is asserted. Both sources require INR20,000 spend in the current calendar month to unlock access next month."
    value_inr:
  - name: Golf privilege
    description: One complimentary golf round or one golf lesson per quarter after INR20,000 eligible spend in a statement cycle; benefit appears next month and expires after 60 days. The schema cannot represent the either/or choice.
    value_inr:
  - name: Trip cancellation cover
    description: Up to INR10,000 reimbursement for eligible non-refundable flight/hotel cancellations, up to two claims per policy period. Requires an eligible card transaction in the month before policy coverage starts; booking and cancellation must fall within policy period.
    value_inr: 10000
  - name: Roadside assistance
    description: Complimentary 24/7 roadside assistance. Current product page confirms availability; frequency limit for Wealth is not clearly stated in the card-specific terms.
    value_inr: 1399
  - name: Travel-booking bonus points
    description: Current Wealth reward T&Cs state 20% bonus points for app hotel bookings and 10% for app flight bookings, over the normal earn, with an 8,000 bonus-point monthly account cap. Product copy also labels overall travel earn as up to 25% hotel and 15% flight rewards and separately states 40/20 points per INR200; exact total earning is ambiguous, so no accelerator is encoded.
    value_inr:
  - name: Visa Infinite privileges
    description: Concierge, airport meet-and-greet/immigration discounts, airport-transfer discounts and hotel offers. Partner availability and service charges apply.
    value_inr:
  concierge: true

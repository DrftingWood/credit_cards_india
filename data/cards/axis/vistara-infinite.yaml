  - effective_from: 2024-11-12
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: annual
        guests_per_visit: 0
        spend_threshold_inr: 50000
        spend_threshold_cycle: quarterly

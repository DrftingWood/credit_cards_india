  age_ranges:
    salaried:
      min_age: 21
      max_age: 60
    self_employed:
      min_age: 21
      max_age: 65
  notes: Current card page states salaried age 21–60 and monthly income INR 12,000, without an explicit greater-than sign; annualized to INR 144,000 because schema only supports annual income. Self-employed age 21–65 and ITR greater than INR 6 lakh. Bank approval is subject to internal policy; minimum score is unpublished. Launch date 1-Mar-2023 is per issuer press release.
  source:
    url: https://www.hdfc.bank.in/credit-cards/irctc-credit-card
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hdfc/irctc-hdfc/launch-release-2023-03-01.pdf
    fields_verified:
    - eligibility.min_age
    - eligibility.max_age
    - eligibility.age_ranges
    - eligibility.income_inr_annual.salaried
    - eligibility.income_inr_annual.self_employed
    - eligibility.residency
    - launched_on
    notes: The main card page lists salaried monthly income of INR 12,000 with no comparator, while the dedicated eligibility page says gross monthly income greater than INR 25,000. The record preserves INR 12,000 from the main product page; the live issuer pages conflict. Self-employed ITR is greater than INR 6 lakh. The eligibility FAQ excludes NRIs and publishes no numeric score floor.

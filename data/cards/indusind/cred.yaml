    program: CRED app - flights, hotels, CRED Store, eligible CRED Pay merchants
    rate_inr_per_unit: 1.0
    constraints: Up to 70% of available points may be used per transaction; governed by CRED terms. Points expire 24 months after issue.
  - type: statement-credit

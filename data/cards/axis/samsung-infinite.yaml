- effective_from: 2023-01-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 8
      cycle: annual
      guests_per_visit: 0
      spend_threshold_inr: 50000
      spend_threshold_cycle: quarterly
      notes: 8 complimentary domestic lounge visits per calendar year, conditional on at least INR 50,000 eligible spend in the previous 3 months (effective 1-May-2024). Schema quarterly cycle is only an approximation of the issuer's previous-3-month window.
      via: []
    international:
      visits_per_cycle: 12
      cycle: annual
      guests_per_visit: 0

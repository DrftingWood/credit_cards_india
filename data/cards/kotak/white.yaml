  mcc_exclusions: []
  capping_rules:
  - 'No flat per-rupee earn: White Pass is awarded only on crossing the card-anniversary-year settled-spend milestones
    listed in benefits.milestones.'
  - Milestone calculation excludes education and transportation categories effective 2026-04-01; Kotak says this
    is based on MCCs. General excluded transactions include fees, EMI, cash withdrawal and specified other transactions.
  - Annual maximum INR27,000; White Pass wallet resets on card anniversary. Unclaimed balance is valid for 90 days
    after anniversary cycle.
  - One active White or White Reserve card per customer for White Pass earning; multiple active cards do not receive
    White Pass.
  redemption:
  - type: catalog
    program: White Pass catalogue
    rate_inr_per_unit: 1.0
    constraints: Issuer states INR1 per White Pass for catalogue redemption; curated voucher/brand catalogue.

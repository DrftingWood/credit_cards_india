    - rewards.redemption.rate_inr_per_unit
    notes: Current Tiara page confirms 3 points/INR100 core, 15 points/INR100 eligible dining/travel/international spend, 5,000-point cycle cap, UPI cap of 500 points/cycle and INR0.25 cashback value per point. No points on fuel or selected MCCs. Removed unsupported INR0.18 realized value. Detailed exclusions and merchant-category scope are in BOBCARD's shared Features and Rewards T&C effective 01-Apr-2026.
benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: quarterly
      spend_threshold_inr: 75000
      spend_threshold_cycle: quarterly
      guests_per_visit: null
      notes: Unlimited domestic lounge visits after at least INR75,000 eligible spend in the preceding calendar quarter. Current issuer page confirms the threshold; the exact implementation date is not stated in the accessible current page. A BOBCARD revision notice initially scheduled this threshold for 15-Jul-2026.
  movies:
    type: discount
    partner: BookMyShow
    cycle: quarterly
    cap_inr: 250
    notes: Flat INR250 off with a minimum purchase of two movie or non-movie tickets; current issuer page says quarterly.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  welcome:
  - condition: Card issued on or after 2026-08-01.
    benefit: Complimentary 12-month FITPASS PRO membership; code sent to the registered email within 30 days of card issuance.
    window_days: 30
  insurance: []
  other:
  - name: Women's health package
    description: Complimentary women's health package including Pap Smear, blood tests and mammography; detailed appointment terms are available to existing Tiara customers.
  - name: Quarterly shopping vouchers
    description: Primary cardholders can redeem quarterly vouchers of INR500 each at Myntra, Nykaa and Flipkart, INR1,500 at Lakme Salon, and INR250 at BigBasket. Quarterly period is calendar quarter.
  - name: OTT and music memberships
    description: Complimentary annual memberships including Amazon Prime, JioHotstar and Gaana Plus; primary-cardholder benefit, redemption and availability conditions apply.
  - name: Swiggy One membership
    description: Three-month Swiggy One membership once per annum for the primary cardholder.
  - name: Lifetime-free add-on cards
    description: Up to three add-on cards for female family members aged 18 or older.
  concierge: false

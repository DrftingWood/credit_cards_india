      and cash-advance terms are carried forward from the product page, not this notice.
rewards:
- effective_from: 2024-04-20
  effective_until: null
  currency: points
  currency_name: EDGE Reward Points
  base:
    rate: 15
    per_inr: 200
    unit_value_inr: 0.2
    unit_value_inr_realized: 0.2
  exclusions:
  - emi
  - government
  - jewellery
  - fuel
  - utilities
  mcc_exclusions: []
  capping_rules:
  - Base earn is 15 EDGE Reward Points per Rs 200 spent (7.5 per Rs 100 = 1.5% at
    the Rs 0.20 floor).
  - 'Rent: only spends up to Rs 1,00,000 per month earn EDGE Reward Points.'
  - 'Insurance: earn capped at 6,000 EDGE Reward Points per month (w.e.f. 20 Apr 2024;
    was per transaction before).'
  - Telecom spends earn no EDGE Reward Points (w.e.f. 20 Apr 2024), alongside government,
    gold/jewellery, fuel and utilities.
  - Points are DEBITED when a transaction is converted to EMI, and are not credited
    back if the EMI is later cancelled.
  - From 20 Jun 2025 excluded spends are identified by spend category rather than
    by 4-digit MCC.
  - 'Miles transfer caps: 3 lakh EDGE Reward Points cumulatively to Group A partners,
    12 lakh to Group B.'
  redemption:
  - type: catalog
    program: Axis EDGE Rewards
    rate_inr_per_unit: 0.2
  - type: airmiles
    program: Axis Miles Transfer (15+ airline & hotel partners)
    ratio: null
    constraints: The rewards T&C states only "Enjoy dynamic conversion ratios" and
      refers to a separate Miles Transfer document for rates — no ratio is published
      here, so no transfer value is encoded. The Rs 0.20 catalog rate is the guaranteed
      floor. Cumulative transfer caps of 3 lakh points (Group A) and 12 lakh points
      (Group B) apply.
    rate_inr_per_unit: 0.2
  source:
    url: https://www.axis.bank.in/docs/default-source/default-document-library/bp-rewards-program-tnc.pdf
    retrieved_on: 2026-07-28
    type: issuer-pdf
    confidence: high
    notes: Base earn, the exclusion list, the rent and insurance caps, the EMI point-debit
      rule and the transfer caps are verbatim from the Burgundy Private "The One Card"
      Rewards Program T&C PDF (1 page, parsed in full on 2026-07-28).

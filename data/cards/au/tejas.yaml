  exclusions:
  - fuel
  - rent
  - emi
  - cash-advance
  - government
  - education
  mcc_exclusions:
  - '6513'
  reward_cap:
    max_units: 25000
    cap_unit: points
    cycle: statement
  capping_rules:
  - Overall maximum 25,000 Reward Points per statement cycle per AU's current card-member agreement. Points accrue only on transaction amounts in multiples of INR 100.
  - Reward Points are valid for two years from accrual; points are zeroized on account closure or after 12 months without card use, and can be forfeited after more than 90 days delinquent.
  - Reward points are not earned on cash, rent, education/government, EMI, fuel, cash withdrawal, BBPS, transportation and quasi-cash. The current agreement explicitly excludes BBPS transactions on AU 0101; the product FAQ lists BBPS as excluded without clarifying channel scope.
  - Partner discounts/cashback are separate from Reward Points. Merchant-specific thresholds and periods are listed in benefits.other; cab and AU 0101 bill-payment offers cap at INR 50 per statement cycle, while District, Amazon Fresh/Now and Zomato terms say once per card per month.
  redemption:
  - type: catalog
    program: AU Rewardz
    rate_inr_per_unit: 0.0025
    min_units: 200
    fee_inr: 99
    constraints: INR 99 plus GST per successful redemption.
  - type: voucher
    program: AU Rewardz e-vouchers
    rate_inr_per_unit: 0.002
    min_units: 200
    fee_inr: 99
    constraints: INR 99 plus GST per successful redemption.
  source:
    url: https://www.au.bank.in/personal-banking/credit-cards
    retrieved_on: '2026-11-01'
    type: issuer-page
    confidence: high

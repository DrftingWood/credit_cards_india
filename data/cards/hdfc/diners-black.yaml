    window_days: 90
    value_inr: null
  insurance:
  - type: air-accident
    sum_insured_inr: 20000000
    sum_insured_amount: 250000
    sum_insured_currency: USD
    conditions: Primary cardholder only; air tickets must be purchased using the Diners card; death from bodily injury due to an air accident must occur within 12 months. Policy 2999204800579204000, valid 23-Jul-2026 to 22-Jul-2027.
  - type: travel-medical
    sum_insured_inr: 5000000
    sum_insured_amount: 62500
    sum_insured_currency: USD
    conditions: Primary cardholder only; sudden illness or bodily injury during international travel outside India; pre-existing illness excluded. Policy 2999204800579204000, valid 23-Jul-2026 to 22-Jul-2027.
  - type: lost-card-liability
    sum_insured_inr: 900000
    conditions: Primary cardholder; liability cover is INR 900,000 for the 2 days before card block and 30 days after block, subject to policy terms.
  - type: other
    sum_insured_inr: 55000
    sum_insured_amount: 688
    sum_insured_currency: USD
    conditions: Primary cardholder only; international flight baggage delay beyond 8 hours; maximum payment USD 10 per hour. International travel originating in India, Diners-card ticket purchase, trip duration up to 30 days; current policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: credit-shield
    sum_insured_inr: 900000
    conditions: Credit Shield of up to INR 900,000 for the primary cardholder under policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 688
    sum_insured_currency: USD
    conditions: Loss of personal documents during international travel; actual duplicate-document expenses, per-article sublimit 10%, under policy valid 23-Jul-2026 to 22-Jul-2027.
  - type: other
    sum_insured_inr: null
    sum_insured_amount: 688
    sum_insured_currency: USD
    conditions: International-flight hijacking cover of USD 75 per 6 hours after a 12-hour deductible; primary cardholder, policy valid 23-Jul-2026 to 22-Jul-2027.

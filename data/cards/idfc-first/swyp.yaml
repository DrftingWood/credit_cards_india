rewards:
- effective_from: '2026-07-01'
  effective_until:
  currency: points
  currency_name: Reward Points
  base:
    rate:
    per_inr:
    unit_value_inr: 0.25
    unit_value_inr_realized: 0.25
  accelerated: []
  exclusions:
  - fuel
  - education
  - road-fees-and-tolls
  - emi
  - cash-advance
  - other
  capping_rules:
  - 'Monthly standard-spend milestones are non-incremental: 200 points at INR5,000; 500 total at INR10,000; 1,000 total at INR15,000; 2,000 total at INR30,000; 4,000 total at INR60,000 eligible statement-cycle spend. Fuel, education, FASTag, rail, cash withdrawals, UPI, and EMI transactions do not count toward standard milestones.'
  - Effective July 2026 statement cycle, special-category combined eligible education (specified MCCs), FASTag (MCC 4784), and railway spends earn 400 points at INR20,000 and 800 total at INR40,000 in the billing cycle.
  - Reward points accrue only for spends up to the credit limit in each billing cycle; re-used credit limit after repayments does not generate additional rewards in the same cycle.
  redemption:
  - type: catalog
    program: IDFC FIRST Rewards
    rate_inr_per_unit: 0.25
    fee_inr: 99
    constraints: No expiry. Redemption fee INR99 + GST. FIRST Rewards Gallery travel bookings earn bonus points only when paid fully by card; up to 70% of travel booking value may be redeemed in points.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/swyp-emi-credit-card
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high
    fields_verified:
    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.capping_rules
    - rewards.exclusions
    - rewards.redemption
    method: manual-read
    local_refs:
    - docs/sources/idfc-first/swyp/card-communication-retrieved-2026-10-26.pdf
    - docs/sources/idfc-first/swyp/privileges-retrieved-2026-10-26.pdf
    - docs/sources/idfc-first/swyp/travel-rewards-terms-retrieved-2026-10-26.pdf
  notes: 'SWYP earns through non-incremental milestone awards rather than a general points-per-rupee base earn; reward thresholds and amounts are recorded in benefits.milestones because the schema has no dedicated reward-milestone object. First Digital RuPay card is an optional separate card with its own fee and UPI rewards, not ordinary SWYP rewards. Travel bonus: 25% on hotels and 12% on flights booked through FIRST Rewards Gallery, capped at 8,000 bonus points/month; account must be active at credit, entire booking paid by card, and points post after stay/travel completion. Points never expire.'

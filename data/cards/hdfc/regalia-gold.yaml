id: hdfc-regalia-gold
name: HDFC Bank Regalia Gold Credit Card
issuer: hdfc
network: visa
network_tier: signature
tier: premium
card_type: credit
co_brand: null
status: active
launched_on: 2022-06-01
discontinued_on: null

fees:
  - effective_from: 2022-06-01
    effective_until: null
    joining_fee_inr: 2500
    annual_fee_inr: 2500
    fee_waiver:
      spend_inr: 400000
      cycle: annual
      conditions: "Renewal fee waived on spends of ₹4L in the preceding year."
    forex_markup_pct: 2.0
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.hdfc.bank.in/credit-cards/regalia-gold-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2022-06-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 5
      per_inr: 200
      unit_value_inr: 0.65
      unit_value_inr_realized: 0.5
    accelerated:
      - category: marquee-partners
        canonical_categories: [online, groceries]
        multiplier: 5
        effective_rate: 25
        cap_per_cycle: 5000
        cap_unit: points
        cycle: monthly
        merchants: [myntra, nykaa, reliance-digital, marks-spencer]
        notes: "5X Reward Points at select merchants (Myntra, Nykaa, Reliance Digital, Marks & Spencer). Minimum transaction value of ₹150 to be eligible; 5X cap of 5,000 RP/month across all brands combined."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - insurance-premiums
      - emi
    capping_rules:
      - "Maximum 50,000 Reward Points can be earned in a statement cycle."
    redemption:
      - type: catalog
        program: SmartBuy Gold Catalogue
        rate_inr_per_unit: 0.65
      - type: catalog
        program: SmartBuy Flights & Hotels
        rate_inr_per_unit: 0.5
        constraints: "Redeem up to a maximum of 70% of the travel booking value using Reward Points."
      - type: catalog
        program: SmartBuy Products & Vouchers
        rate_inr_per_unit: 0.35
      - type: statement-credit
        program: Statement balance (cashback)
        rate_inr_per_unit: 0.20
      - type: airmiles
        program: Multiple (Airmiles hub)
        ratio: "1:0.5"
    source:
      url: https://www.hdfc.bank.in/credit-cards/regalia-gold-credit-card
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2024-10-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 3
        cycle: quarterly
        guests_per_visit: 0
        via: [issuer-direct]
        spend_threshold_inr: 60000
        spend_threshold_cycle: quarterly
        notes: "3 domestic lounge visits per calendar quarter, unlocked by ₹60,000 spend in the preceding quarter."
      international:
        visits_per_cycle: 6
        cycle: annual
        guests_per_visit: 0
        via: [priority-pass]
    milestones:
      - spend_inr: 150000
        cycle: quarterly
        benefit: "Myntra / Nykaa / Reliance Digital / Marriott voucher worth ₹1,500"
        value_inr: 1500
      - spend_inr: 750000
        cycle: annual
        benefit: "SmartBuy flight voucher worth ₹5,000"
        value_inr: 5000
    welcome:
      - condition: "Joining fee paid"
        benefit: "Gift voucher worth ₹2,500"
        value_inr: 2500
        window_days: 90
      - condition: "₹1,00,000 net retail spend within 90 days of card issuance"
        benefit: "Complimentary Swiggy One & MakeMyTrip (MMT) Black Gold memberships"
    insurance:
      - type: air-accident
        sum_insured_inr: 10000000
    fuel_surcharge_waiver:

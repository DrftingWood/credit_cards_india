id: bob-tiara
name: BOBCARD Tiara Credit Card
issuer: bob
network: visa
network_tier: signature
tier: premium
card_type: credit
co_brand: null
status: active
launched_on: 2022-01-01
discontinued_on: null

fees:
  - effective_from: 2022-01-01
    effective_until: null
    joining_fee_inr: 2499
    annual_fee_inr: 2499
    fee_waiver:
      spend_inr: 250000
      cycle: annual
      conditions: "Annual fee waived on ₹2,50,000 spend per anniversary year. Joining fee waived on ₹25,000 spend in first 60 days."
    forex_markup_pct: 2.0
    finance_charge_monthly_pct: 3.49
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    notes: "Women-only credit card."
    source:
      url: https://www.bobcard.co.in/credit-card-types/tiara
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2022-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 3
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.18
    accelerated:
      - category: dining-travel-international
        canonical_categories: [dining, travel, international]
        multiplier: 5
        effective_rate: 15
        cap_per_cycle: 5000
        cap_unit: points
        cycle: statement
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    capping_rules:
      - "Reward Points on Credit Card UPI spends capped at 500 RP per statement cycle."
    mcc_exclusions: ['6513']
    redemption:
      - type: catalog
        program: BOBCARD Rewards
        rate_inr_per_unit: 0.25
      - type: statement-credit
        rate_inr_per_unit: 0.25
    source:
      url: https://www.bobcard.co.in/credit-card-types/tiara
      retrieved_on: 2026-07-03

benefits:
  - effective_from: 2022-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: "unlimited"
        cycle: annual
        guests_per_visit: 0
        via: [visa, dreamfolks]
    movies:
      type: discount
      partner: BookMyShow
      cycle: quarterly
      cap_inr: 250
      notes: "Flat ₹250 off on min. 2 movie/non-movie tickets per quarter."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 5000
      cap_per_cycle_inr: 250
      cycle: monthly
    other:
      - name: Women's health package
        description: "Complimentary women's health package incl. Pap Smear, blood tests and mammography."
      - name: Quarterly shopping vouchers
        description: "₹500/qtr each at Myntra, Nykaa, Flipkart; ₹1,500/qtr at Lakmé Salon; ₹250/qtr at BigBasket."
        value_inr: 1500
      - name: OTT & music memberships
        description: "Complimentary annual Amazon Prime / JioHotstar, Gaana Plus; Swiggy One 3-month membership once p.a."
      - name: Add-on cards
        description: "Up to 3 lifetime-free add-on cards for female family members (18+)."
    concierge: false
    source:
      url: https://www.bobcard.co.in/credit-card-types/tiara
      retrieved_on: 2026-07-03


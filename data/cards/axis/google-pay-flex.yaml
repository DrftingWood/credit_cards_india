  - condition: Earn 2 Stars per cumulative INR 500 of eligible spend in the first reward cycle; Google Pay offer availability/eligibility also applies.
    benefit: INR 1,750 in Stars and an INR 250 Google Pay gift card as the welcome reward, subject to offers run by Google Pay.
    value_inr: null
    window_days: null
  fuel_surcharge_waiver: null
  concierge: false
  other:
  - name: Google Pay Flex reward-cycle campaign (16-Oct-2026 to 15-Oct-2027)
    description: Google One members who cross INR 15,000 eligible spend in a reward cycle receive 3.2% back in Stars on all eligible spends that cycle; non-members receive 1.6%. Google One membership and prior-cycle activity affect rates. Google Pay also offers 15% back up to INR 450 on INR 3,000 in eligible bills, OTT and recharges, and 5% back up to INR 250 on INR 5,000 UPI spend at listed top food/grocery apps, each once per reward cycle. These Stars are awarded by Google Pay; campaign terms, eligible categories and the INR 1,500 overall cap apply.
    value_inr: null

benefits:
- effective_from: 2025-01-01
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 1
      cycle: quarterly
      spend_threshold_inr: 20000
      spend_threshold_cycle: quarterly
      guests_per_visit: 0
      via:
      - visa
  welcome:
  - condition: Spend at least INR 5,000 within 60 days of issuance for 500 bonus Reward Points; settled eligible spend is counted.
    benefit: 500 bonus reward points
    value_inr: 125
    window_days: 60
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids above age 18.
  - name: BOBCARD SmartDeal flight rewards
    description: Additional 8 reward points per ₹100 for eligible flight bookings in the logged-in BOBCARD app/portal.
  - name: BOBCARD SmartDeal hotel rewards
    description: Additional 20 reward points per ₹100 for eligible hotel bookings in the logged-in BOBCARD app/portal.
  - name: Smart EMI
    description: Purchases above ₹2,500 can be converted to Smart EMI for 6–48 months; applicable charges are not
      stated on the Premier product page.
  - name: Contactless payments
    description: Contactless-enabled card; issuer advertises wireless-chip payments.
  - name: Lost-card zero liability
    description: The issuer advertises zero liability for fraudulent transactions when card loss is reported immediately; subject to issuer reporting and claim terms.

benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Card activation completed within 37 days of issuance; membership must be claimed in the Swiggy app.
    benefit: Complimentary Swiggy One membership for 12 months
    value_inr: null
    window_days: null
  golf:
    rounds_per_cycle: 4
    cycle: annual
    lessons_per_cycle: 12
  fuel_surcharge_waiver: null
  concierge: null
  source:
    url: https://www.hdfc.bank.in/credit-cards/swiggy-ornge-hdfc-bank-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/hdfc/swiggy-ornge/swiggy-orange-retrieved-2026-10-26.pdf
    - docs/sources/hdfc/_shared/co-branded-mitc-v3.9-retrieved-2026-10-26.pdf
    fields_verified:
    - benefits.welcome
    - benefits.golf.rounds_per_cycle
    - benefits.golf.lessons_per_cycle
    notes: Current HDFC product page confirms a 12-month Swiggy One welcome membership and Mastercard golf benefits
      of 12 lessons and 4 complimentary green-fee rounds per calendar year, with 50% off additional green fees.
      The April 2026 card terms include a conflicting sentence stating a 3-month Swiggy One benefit; elsewhere in
      the same terms and on the product page the benefit is 12 months. No fixed INR membership value is assigned.
      The issuer advertises zero lost-card liability when a loss is reported promptly; the product record's
      benefit notes should be read with that condition. Forex markup and named concierge availability remain unverified.

- effective_from: '2026-10-26'
  effective_until: null
  joining_fee_inr: 999
  annual_fee_inr: 999
  fee_waiver:
    spend_inr: 250000
    cycle: annual
    conditions: Renewal fee waiver after qualifying retail spend during the 12 months before the card renewal date. Joining fee is separately waived after INR 50,000 retail spend within three months of card setup.
  forex_markup_pct: 2.0
  finance_charge_monthly_pct: 3.99
  cash_advance_fee:
    pct: 2.5
    min_inr: 650
  gst_applicable: true
  notes: Standard joining and renewal membership fees are INR 999 plus GST. The issuer says new issuance to new customers has been discontinued; existing cardholders receive a new card on expiry. Current MITC v18 and June 2026 issuer update set foreign-currency markup at 2.00% from 15-Jun-2026, monthly finance at 3.99% (47.88% APR) for the standard variant, and cash advance at 2.5% or INR 650 minimum from 15-Jun-2026. The product page separately displays 2.49% monthly against Fixed Deposit; this record is the standard unsecured variant. The fee record's 2026-10-26 date is a verification snapshot, not a claim that membership fees first took effect then.

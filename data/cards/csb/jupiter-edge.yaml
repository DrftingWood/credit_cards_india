    notes: MITC updated 2026-08-29; the associated KFS states revised charges apply from 2025-12-06. MITC lists the standard Edge+ joining fee as INR999 and annual fee as nil. CSB's product page currently advertises INR499 while Jupiter advertises a limited-period INR0 joining offer (regular INR999); actual offer is channel/campaign dependent and cannot be represented as a universal fee. Forex is 3.5%; monthly finance charge is 3.75% (45% annual). ATM cash advances are unavailable, so the prior cash-advance fee is removed. GST applies to fees, interest and surcharges.

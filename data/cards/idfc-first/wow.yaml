rewards:
  - effective_from: 2021-06-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 4
      per_inr: 150
      unit_value_inr: 0.50
      unit_value_inr_realized: 0.25
    accelerated:
      - category: travel-spend
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 4
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        notes: "4X reward points on travel spends (base 4X on all spends). Bonus 10% RP on hotels / 5% on flights via IDFC FIRST app (up to 16.7% / 10%). 1 RP = ₹0.50 on travel redemptions via app."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: catalog
        program: IDFC FIRST Rewards
        rate_inr_per_unit: 0.25
        constraints: "Up to ₹0.50 per reward point on travel bookings via the IDFC FIRST Bank app."
      - type: statement-credit
        rate_inr_per_unit: 0.25
    source:
      url: https://www.idfcfirst.bank.in/credit-card/wow
      retrieved_on: 2026-07-03


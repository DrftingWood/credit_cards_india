rewards:
- effective_from: '2023-08-03'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 0.4
    unit_value_inr_realized: 0.4
    notes: Base earn 1 point per INR100; annual slab rewards add incremental points
      above this base.
  accelerated:
  - category: Anniversary-year spend tiers (bonus above base)
    effective_rate: 5
    effective_per_inr: 100
    multiplier: 6
    cycle: annual
    over_cap_earns_base: true
    slabs:
    - upto_spend_inr: 100000
      rate_pct: 0
    - upto_spend_inr: 250000
      rate_pct: 0.4
    - upto_spend_inr: 500000
      rate_pct: 1.2
    - upto_spend_inr: null
      rate_pct: 2.0
  exclusions:
  - fuel
  mcc_exclusions: []
  redemption:
  - type: statement-credit
    program: Cash credit
    rate_inr_per_unit: 0.4
  - type: catalog
    program: IndusMoments vouchers
    rate_inr_per_unit: 0.4
  source:
    url: https://www.indusind.bank.in/in/en/personal/cards/credit-card/tiger-credit-card.html
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/indusind/tiger/tiger-benefit-guide-retrieved-2026-10-26.pdf
    fields_verified:
    - rewards.base
    - rewards.accelerated
    - rewards.exclusions
    - rewards.capping_rules
    - rewards.redemption
    verified_by: agent
    method: manual-read
    notes: Annual incremental spend multipliers are 1x up to INR100,000; 2x on next
      INR150,000; 4x on next INR250,000; 6x above INR500,000. The encoding represents
      bonus points above the base 1x. Select MCCs suppress the accelerator but retain
      base earn; fuel earns no points. Website reward-value chart uses 1 point = INR0.40.
  capping_rules:
  - Cash credit conversion INR0.40 per point; maximum 5,000 points redeemed for cash
    per calendar month effective 1-Sep-2024. Reward points expire 24 months after
    accrual. Card page says points earned only up to assigned credit limit.

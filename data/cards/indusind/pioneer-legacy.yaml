rewards:
- effective_from: 2026-10-26
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1
    unit_value_inr_realized: 1
    notes: Weekday transactions earn 1 point per INR100; weekend transactions earn 2 points per INR100. Selected low-MCC categories earn 0.7 points per INR100 on both weekdays and weekends.
  accelerated:
  - category: weekend-spend
    multiplier: 2
    effective_rate: 2
    cap_status: not-published
    canonical_categories:
    - online
    - groceries
    - dining
    - travel
    - international
    - entertainment
    - other
    notes: Saturday and Sunday transactions earn 2 points per INR100, except selected low-MCC categories which earn 0.7 points per INR100.
    source:
      url: https://www.indusind.bank.in/in/en/personal/cards/credit-card/pioneer-legacy-credit-card.html
      retrieved_on: 2026-10-26
      type: issuer-page
      confidence: high
  - category: low-mcc-merchant-spend
    effective_rate: 0.7
    effective_per_inr: 100
    cap_status: not-published
    canonical_categories:
    - utilities
    - insurance
    - education
    - government
    - rent
    - telecom
    - other
    notes: Selected categories include fuel, transportation/tolls, utilities, insurance, education, telecom, securities brokers, cleaning/maintenance, government and real-estate/rent. Fuel itself is excluded from reward earning under bank-wide terms; low-MCC lower rate applies to eligible listed non-fuel transactions.
    source:
      url: https://www.indusind.bank.in/in/en/personal/revision-indusInd-bank-credit-card-rewards-program.html
      retrieved_on: 2026-10-26
      type: issuer-page
      confidence: high
  exclusions:
  - fuel
  mcc_exclusions: []
  capping_rules:
  - No general points-earning cap published. Cash-credit redemption is capped at 20,000 points per calendar month, with a minimum 500 points. A separate bonus offer gives 4,000 points after INR500,000 spend within the first year; listed low-MCC categories are excluded.
  redemption:
  - type: statement-credit
    program: cash credit
    rate_inr_per_unit: 1
    min_units: 500
    fee_inr: 149
    constraints: Maximum 20,000 points per calendar month for cash credit. A cash-redemption fee of INR149 applies under current MITC; Pioneer Legacy is not listed as exempt.
  - type: catalog
    program: IndusMoments
    rate_inr_per_unit: null
    fee_inr: 100
    constraints: Catalogue value varies by item; MITC lists INR100 for other redemption categories, while direct merchant redemption is advertised as nil-fee; confirm category-specific fee at redemption.
  - type: airmiles
    program: Partner airline miles
    rate_inr_per_unit: null
    ratio: null
    fee_inr: 100
    constraints: Current card material lists airline miles but no current partner-specific ratio was established; MITC lists INR100 for other redemption categories.
  source:

id: rbl-irctc
name: IRCTC RBL Bank Credit Card
issuer: rbl
network: mastercard
network_tier: platinum
tier: entry
card_type: credit
co_brand:
  partner: IRCTC
  category: railway
  partner_website: https://www.irctc.co.in
status: active
launched_on: 2021-03-01
discontinued_on: null

fees:
  - effective_from: 2021-03-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 500
    fee_waiver: null
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.99
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.rbl.bank.in/personal-banking/cards/credit-cards/irctc-rbl-bank-credit-card
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2021-03-01
    effective_until: null
    currency: points
    currency_name: IRCTC Reward Points
    redemption_scope: closed-loop
    ecosystem_label: IRCTC
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 125
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 10
        card_attributable_rate: 10
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "10 points per ₹100 spent on AC train ticket bookings via IRCTC portal/app."
      - category: groceries-department-stores-utilities
        canonical_categories: [groceries, utilities]
        multiplier: 1
        effective_rate: 2
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: voucher
        program: IRCTC
        rate_inr_per_unit: 1.0
        constraints: "Redeemable against IRCTC rail ticket bookings."
    source:
      url: https://www.rbl.bank.in/personal-banking/cards/credit-cards/irctc-rbl-bank-credit-card
      retrieved_on: '2026-07-05'

      notes: 'Closed-loop: IRCTC rewards redeem only within the IRCTC ecosystem (not cash/transfer). Valued at full in-ecosystem face Rs1.0; realized set = face and redemption_scope=closed-loop so the UI shows an ecosystem-only badge instead of an arbitrary haircut (was realized 0.9).'
benefits:
  - effective_from: 2021-03-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [issuer-direct]
        notes: "Complimentary access to IRCTC Executive Lounges at select stations (2/quarter, 8/year)."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 4000
      cap_per_cycle_inr: 100
      cycle: monthly
    other:
      - name: IRCTC transaction charge waiver
        description: Waiver of the 1% + GST transaction charge on IRCTC ticket bookings.
    concierge: false
    source:
      url: https://www.rbl.bank.in/personal-banking/cards/credit-cards/irctc-rbl-bank-credit-card
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: null
    self_employed: null
  credit_score_min: 700
  residency: resident-indian

application:
  apply_url: https://www.rbl.bank.in/personal-banking/cards/credit-cards/irctc-rbl-bank-credit-card

metadata:
  last_verified_on: '2026-07-05'
  tags: [co-branded, railway, entry, niche]

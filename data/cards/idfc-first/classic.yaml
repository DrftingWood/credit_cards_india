  notes: >-
    Lifetime-free. The product page publishes a variable APR range of 8.5%-46.2%
    p.a.; no fixed monthly rate is asserted. Domestic ATM cash withdrawals cost INR
    199 + GST per transaction and have up to 45 interest-free days; international ATM
    withdrawal charges are described separately by the issuer and are not quantified
    here. The optional FIRST Digital RuPay UPI add-on has a INR 199 joining fee and
    annual fee from its second year. Effective 18-Jan-2026, the issuer also states a
    1% charge on total FASTag recharges above INR 10,000 per billing cycle and a 1%
    charge on total railway spend above INR 25,000 per billing cycle; GST applies.
    These high-use charges are preserved in notes because the fee schema cannot
    express their threshold formulas. Zero forex markup applies to all existing and
    new IDFC FIRST cards from 17-Sep-2026, superseding the older general MITC rate.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/classic
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - fees.joining_fee_inr
    - fees.annual_fee_inr
    - fees.forex_markup_pct
    - fees.cash_advance_fee.flat_inr

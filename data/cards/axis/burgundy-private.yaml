benefits:
- effective_from: '2026-08-28'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - issuer-direct
      notes: Unlimited domestic lounge access for primary and add-on cardholders. Up to 12 complimentary guest visits
        per card anniversary year. Use the Burgundy Private credit card; Priority Pass is not valid at domestic
        Indian lounges from 28-Aug-2026. Lounge terms state quarterly access quotas may be set by Axis and lounge
        capacity/validation conditions apply.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: null
      via:
      - priority-pass
      notes: Unlimited international visits per card anniversary year via Priority Pass for primary/add-on holders.
        Up to 12 complimentary guest visits per card anniversary year; additional visits are chargeable. Priority
        Pass is required for eligible international lounges.
  golf: null
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 5
    cycle: monthly
    cap_inr: 500
    notes: Buy one movie ticket and receive up to INR500 off the second ticket, at most 5 times/month per card.
      Applies to primary and add-on cards. A separate non-movie offer allows up to INR1,000 off the second ticket,
      at most 5 times/month; see other benefits.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 400
    cycle: statement
    notes: 1% surcharge reversal for fuel transactions INR400-INR4,000, capped INR400 per statement cycle; GST on
      fuel surcharge is not reversed. The card page says capped per month while the current MITC says per statement
      cycle; record uses MITC cycle wording and retains the source difference here.
  insurance:
  - type: baggage-loss
    sum_insured_inr: null
    sum_insured_amount: 500
    sum_insured_currency: USD
    conditions: FY2026-27 Axis insurance schedule lists USD500 baggage loss/delay cover. International travel only;
      airline ticket must be purchased on the same Axis card. Policy terms and claim conditions apply.
  - type: credit-shield
    sum_insured_inr: 500000
    conditions: Outstanding credit-card dues waived up to INR500,000 on accidental death; card activity/transaction
      and claim-notice requirements apply.
  - type: purchase-protection
    sum_insured_inr: 200000
    conditions: FY2026-27 schedule lists INR200,000 cover for eligible tangible goods purchased on the card, subject
      to theft/fire damage, residential-premises, 90-day and policy conditions.
  dining:
    program: EazyDiner Prime
    discount_pct: null
    notes: Complimentary membership; issuer page advertises INR1,000 off eligible dining transactions, birthday-month
      benefit, and additional membership savings. Merchant/offer terms apply.
  concierge: true
  other:
  - name: Complimentary memberships
    description: Primary cardholders can request Club Marriott, ALL Accor+ Explorer and Taj Epicure memberships.
      Complimentary membership renewals require explicit customer consent effective 15-Nov-2026; existing membership/partner
      terms apply.
  - name: EazyDiner Prime membership
    description: Complimentary membership with eligible dining savings; benefits subject to EazyDiner terms.
  - name: Airport meet and assist
    description: Up to 8 complimentary airport meet-and-assist services per year through the issuer partner; participating
      airports and booking terms apply.
  - name: BookMyShow non-movie offer
    description: Up to INR1,000 off the second non-movie event ticket, maximum 5 times per month per card, after
      purchase of one ticket.
  - name: The Postcard Hotel
    description: Up to 15% off and stay privileges; partner terms apply.
  - name: Airport transfers
    description: Up to 30% off domestic and international airport transfers through the issuer partner; current
      offer terms apply.
  - name: Travel and health services
    description: Issuer page advertises travel insurance, global travel/medical assistance, specialist consultations
      and diagnostic services. Coverage and access depend on separate provider terms.
  - name: Membership renewal consent
    description: Effective 15-Nov-2026, complimentary memberships linked to the card will be renewed only with explicit
      customer consent; this date is future-dated as of this review.
  - name: Golf programme
    description: 50 complimentary domestic rounds/lessons combined per financial year and 4 complimentary international
      rounds per financial year. Primary cardholders only; local availability, reservation, guest, handicap and
      partner rules apply. The schema cannot represent the combined domestic round/lesson allowance without double-counting,
      so exact entitlements are kept in this description.

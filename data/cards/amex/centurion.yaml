  notes: Charge card; full statement balance is due each cycle, so revolving monthly
    interest is not applicable. MITC confirms ₹700,000 joining and ₹275,000 annual
    fee, 3.5% cash advance fee (₹250 minimum), and 2.5% delinquency fee (₹500 minimum).

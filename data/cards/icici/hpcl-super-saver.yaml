id: icici-hpcl-super-saver
name: HPCL Super Saver ICICI Bank Credit Card
issuer: icici
network: visa
network_tier: signature
tier: entry
card_type: credit
co_brand:
  partner: Hindustan Petroleum (HPCL)
  category: fuel
  partner_website: https://www.hindustanpetroleum.com
status: active
launched_on: 2022-01-01
discontinued_on: null

fees:
  - effective_from: 2022-01-01
    effective_until: null
    joining_fee_inr: 500
    annual_fee_inr: 500
    fee_waiver:
      spend_inr: 150000
      cycle: annual
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 3.75
    cash_advance_fee:
      pct: 2.5
      min_inr: 500
    gst_applicable: true
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/hpcl-super-saver
      retrieved_on: 2026-07-03

rewards:
  - effective_from: 2022-01-01
    effective_until: null
    currency: points
    currency_name: ICICI Reward Points
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.2
    accelerated:
      - category: hpcl-fuel-via-hp-pay
        canonical_categories: [fuel]
        multiplier: 2
        effective_rate: 4
        cap_per_cycle: 200
        cap_unit: cashback-inr
        cycle: monthly
        merchants: [hpcl-fuel-stations, hp-pay]
        notes: "4% cashback on fuel purchases at HPCL fuel pumps and the HP Pay app, capped at ₹200/month (no minimum threshold). An additional 1.5% cashback (6 Happy Coins per ₹100) is credited to the HP Pay app wallet on fuel spends made via the HP Pay app."
      - category: utilities-and-departmental-stores
        canonical_categories: [groceries, utilities, government]
        multiplier: 10
        effective_rate: 20
        cap_per_cycle: 400
        cap_unit: points
        cycle: statement
        notes: "5% back as 20 Reward Points per ₹100 on utilities (groceries, telecom, government, tax) and departmental stores, capped at 400 Reward Points per statement cycle."
    exclusions:
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
      - type: catalog
        program: ICICI Rewards
        rate_inr_per_unit: 0.25
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/hpcl-super-saver
      retrieved_on: 2026-07-03

    mcc_exclusions: ['6513']
benefits:
  - effective_from: 2022-01-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 1
        cycle: quarterly
        guests_per_visit: 0
        via: [dreamfolks]
        spend_threshold_inr: 75000
        spend_threshold_cycle: quarterly
    welcome:
      - condition: "Pay joining fee and spend ₹5,000 within 45 days of issuance"
        benefit: "2,000 ICICI Bank Reward Points"
        value_inr: 500
        window_days: 45
    movies:
      type: discount
      partner: BookMyShow and INOX
      max_per_cycle: 2
      cycle: monthly
      cap_inr: 100
      notes: "25% off up to ₹100 on movie tickets, twice a month at BookMyShow and INOX."
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: 400
      max_txn_inr: 4000
      cap_per_cycle_inr: null
      cycle: monthly
    concierge: false
    other:
      - name: Roadside Assistance
        description: 24/7 roadside assistance in case of vehicle breakdown.
    source:
      url: https://www.icici.bank.in/personal-banking/cards/credit-card/hpcl-super-saver
      retrieved_on: 2026-07-03

eligibility:
  min_age: 21
  max_age: 65
  income_inr_annual:
    salaried: 240000
    self_employed: 240000
  credit_score_min: 720
  residency: resident-indian

application:
  apply_url: https://www.icici.bank.in/personal-banking/cards/credit-card/hpcl-super-saver

metadata:
  last_verified_on: 2026-07-03
  tags: [co-branded, fuel, hpcl, entry, points]

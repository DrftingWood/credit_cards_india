rewards:
  - effective_from: 2024-01-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 100
      # Primary redemption is 1:1 transfer to airline/hotel partners, not the
      # HSBC catalogue (₹0.25/RP). Valued on the transfer path: ₹0.75 achievable
      # via good 1:1 partner redemptions; ₹0.50 realized (conservative, mirrors
      # Axis EDGE Miles realized value — TravelOne draws on an overlapping
      # partner pool). Catalogue redemption remains ₹0.25 (see redemption[]).
      unit_value_inr: 1.1
      unit_value_inr_realized: 0.25
    accelerated:
      - category: flights-travel-agg-forex
        canonical_categories: [travel, international]
        multiplier: 2
        effective_rate: 4
        cap_per_cycle: 50000
        cap_unit: points
        cycle: annual
        notes: "4 Reward Points per ₹100 on flights, travel aggregators and foreign-currency spends (capped 50,000 RP/year, then 2 RP/₹100); 2 RP per ₹100 on everything else (no cap). 1:1 transfer to 15+ airline & hotel partners."
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - insurance-premiums
      - emi
    mcc_exclusions: ['6513']
    redemption:
      - type: catalog
        program: HSBC Rewards
        rate_inr_per_unit: 0.25
      - type: airmiles
        program: HSBC India Rewards (20+ airline & hotel loyalty partners)
        ratio: "1:1"
        constraints: "20 transfer partners; ratios are card-point : partner-unit. realized Rs 0.25 = guaranteed non-transfer floor; best documented transfer Rs 1.10. 19 partners beat the floor. Full per-partner values below."

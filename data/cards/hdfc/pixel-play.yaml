  notes: Current product page lists Indian nationality, salaried age 21-60 and
    monthly income INR 25,000 without a comparator; self-employed age 21-65 and
    annual ITR above INR 600,000. Indian nationality does not establish a
    residency requirement, so residency is null. No minimum credit score is
    published. The separate FD-backed route has no income-proof requirement and
    is not modeled by this record.

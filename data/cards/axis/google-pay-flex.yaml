    notes: Card-specific terms confirm fuel is eligible, 1 Star per cumulative INR 500 at INR 1/Star, 2 Stars per INR 500 in the first reward cycle and subsequent cycles after at least INR 100 prior-cycle net eligible spend, INR 1,500 total cycle cap (up to 750 from Axis), one-year Star expiry, and the excluded categories listed. Exact network is RuPay from Axis launch release; issuer launch source does not specify a network tier, so it is null. Stars are a Google Pay passthrough program and redemption modes depend on Google Pay. Google Pay's dated 16-Oct-2026 to 15-Oct-2027 promotional campaign is modeled separately under benefits rather than as base issuer earn.

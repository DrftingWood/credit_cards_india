    - benefits[0].lounge_access.domestic.spend_threshold_inr
    - benefits[0].fuel_surcharge_waiver
    - benefits[0].dining
    - benefits[0].other
    notes: Product page lists 4 domestic lounge visits per calendar year; current lounge program specifies 1 per quarter. INR 50,000 settled eligible spend in the previous three calendar months is required, with a new-card waiver for issuance month plus the next three months.

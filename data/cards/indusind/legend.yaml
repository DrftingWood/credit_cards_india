rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: Reward Points
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 0.5
    unit_value_inr_realized: 0.5
    notes: 1 point per INR100 on weekdays and 2 points per INR100 on weekends for eligible ordinary spend; total
      card monthly points cap listed as 5,000, but current bank update does not clarify whether the cap applies
      to earning or redemption. Points earn only up to assigned credit limit per statement cycle. Cash credit value
      is INR0.50 per point.
  accelerated:
  - category: weekend-spend
    multiplier: 2
    effective_rate: 2
    effective_per_inr: 100
    cap_unit: points
    cycle: monthly
    notes: 2 points/INR100 on Sat/Sun (base weekday earn is 1 point/INR100). The 5,000 monthly product cap is stated
      in the bank reward update; its application to earning vs redemption is not specified there. Medical, automobile
      and telecom transactions earn 1 point/INR100 on both weekdays and weekends.
    canonical_categories:
    - dining
    - entertainment
    source:
      url: https://www.indusind.bank.in/in/en/personal/cards/credit-card/legend-credit-card.html
      retrieved_on: '2026-10-27'
      type: issuer-page
      confidence: high
      fields_verified:
      - rewards.accelerated[0].effective_rate
      - rewards.accelerated[0].effective_per_inr
      method: manual-read
      local_refs: []
  - category: reduced-reward-categories
    canonical_categories:
    - utilities
    - insurance
    - government
    - education
    - rent
    multiplier: 0.7
    effective_rate: 0.7
    effective_per_inr: 100
    cap_status: not-published
    cap_unit: points
    notes: Issuer reward revision lists 0.7 point/INR100 for utilities, insurance, government services, education
      and rent on Legend, on weekdays and weekends. Real-estate/rental revision effective 20-Jan-2022.
    source:
      url: https://www.indusind.bank.in/in/en/personal/cards/credit-card/legend-credit-card.html
      retrieved_on: '2026-10-27'
      type: issuer-page
      confidence: high
      method: manual-read
      local_refs:

  notes: 'Current product page and 8-Oct-2026 Axis KFS confirm zero joining/annual fees, 3.7% monthly finance charge (55.55% p.a.), 2.5% cash advance fee (minimum INR 500), 3.5% forex and DCC, INR 175 cash payment, waived duplicate statement/charge-slip/outstation-cheque fees, free mobile alerts and balance enquiry, 2.5% overlimit fee (minimum INR 500), 2% cheque/auto-debit reversal (minimum INR 500), and railway surcharges as prescribed. Redemption fees: INR 99 per EDGE Rewards redemption; INR 199 for transfer to partner miles. Other transaction fees: rent 1% per transaction; wallet loads 1% at cumulative INR 10,000 per statement; fuel 1% at INR 50,000 per statement; third-party education 1% per transaction; utilities 1% at INR 25,000 per statement; online skill-based gaming 1% at INR 10,000 per statement. Late-fee slabs: nil below INR 500, INR 500 for INR 501-5,000, INR 750 for INR 5,001-10,000, INR 1,200 for INR 10,001-50,000 and INR 1,300 above INR 50,000, plus INR 100 after two consecutive unpaid MAD cycles until cleared. Issuer wording leaves exactly INR 500 unassigned. The KFS states standard Kwik fees of zero; campaign/application-specific fee profile is not modeled.'


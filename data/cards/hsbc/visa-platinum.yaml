    sum_insured_inr: 300000
  other:
  - name: Fuel contactless cashback offer
    description: INR250 cashback on domestic contactless fuel transactions after at least INR10,000 in eligible
      calendar-quarter spend. Each transaction must be INR1,000-INR5,000; primary/add-on spend combines; cashback
      credits to primary card within 45 days of quarter end. Offer runs through 2026-12-31.
  - name: Visa Signature privileges
    description: Current card page lists a complimentary 12-month Times Prime subscription, two complimentary
      domestic flight seat selections per year for MakeMyTrip bookings, and 15% My Cash cashback on eligible
      India hotel stays booked with MakeMyTrip using code VISASIGNATURE. Privileges are dynamic and subject
      to linked offer terms; Visa Signature benefits do not independently establish the issued card network
      tier.
  - name: Bicester Collection privileges
    description: Current page advertises eVIP pass discounts and sale-event access; registration and partner
      terms apply.

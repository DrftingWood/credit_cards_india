rewards:
- effective_from: 2019-08-22
  effective_until: null
  currency: cashback
  currency_name: CashPoints
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: monthly
  accelerated:
  - category: online-partner-merchants
    canonical_categories:
    - online
    - dining
    - entertainment
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: monthly
    merchants:
    - amazon
    - bookmyshow
    - cult.fit
    - flipkart
    - myntra
    - sony-liv
    - swiggy
    - tata-cliq
    - zomato
    channel:
      class: cobrand-merchant
      merchants:
      - amazon
      - bookmyshow
      - cult-fit
      - flipkart
      - myntra
      - sony-liv
      - swiggy
      - tata-cliq
      - zomato
    cap_group: millennia-partner-cashback
    notes: 5% cashback (as CashPoints) on eligible non-EMI spends at nine named partner merchants. The monthly cap is shared with Uber; settlement and merchant ID determine eligibility.
  - category: Uber eligible travel/commute
    canonical_categories:
    - travel
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: monthly
    merchants:
    - uber
    channel:
      class: cobrand-merchant
      merchants:
      - uber
    mcc_list:
    - '4121'
    cap_group: millennia-partner-cashback
    notes: Uber receives 5% only when the transaction is classified under MCC 4121. Shares one ₹1,000 monthly cap across all partner merchants.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  - cash-advance
  redemption:
  - type: statement-credit
    rate_inr_per_unit: 1.0
    min_units: 500
    fee_inr: 50
    constraints: Maximum 3,000 CashPoints per calendar month; ₹50 redemption fee applies to statement cashback from 1-Aug-2024.
  - type: catalog
    program: HDFC SmartBuy / NetBanking
    rate_inr_per_unit: 0.3
    fee_inr: 99
    constraints: ₹99 plus tax per redemption; unredeemed CashPoints expire after two years. Product/voucher redemption can cover up to 70% of selected value.
  - type: airmiles
    rate_inr_per_unit: 0.3
    constraints: Issuer lists ₹0.30 equivalent value per CashPoint for AirMiles; transfer ratio/provider is not stated on card page.
  - type: other
    program: HDFC SmartBuy flights and hotels
    rate_inr_per_unit: 0.3
    constraints: Maximum 50% of booking value payable with points and 50,000 points per calendar month.

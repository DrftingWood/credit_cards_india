    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr: 400
    cycle: monthly
    notes: 1% surcharge waiver at fuel stations in India on transactions from INR 400 to INR 4,000; maximum monthly benefit INR 400. GST on the surcharge is non-refundable. Fuel transactions earn no reward points.
  insurance:
  - type: lost-card-liability
    sum_insured_inr: null
    conditions: Complimentary lost-card liability cover up to the card's credit limit; the issuer product page does not publish a separate numeric coverage cap or full policy terms.
  concierge: false
  notes: Purchases of INR 1,500 or more may be converted to EMI. EMI transactions do not earn reward points. Wednesday Delight offers are dynamic and merchant/value dependent.

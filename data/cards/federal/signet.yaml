      notes: Product page includes conflicting Signet welcome amounts in its main product section (₹200) and embedded recommendation panel (₹500); the card-specific CVP table confirms ₹200, which is retained. The current Visa Signet page does not advertise fuel surcharge waiver or insurance. Swiggy voucher face value is unpublished. A separate Visa campaign offers INR 250 voucher to new Visa Platinum Signet cardholders with at least one INR 300 transaction during 7 Feb?31 Oct 2026; this temporary campaign is not modeled as an evergreen welcome benefit. Product page variants are illustrative; actual variant/network is selected during application.

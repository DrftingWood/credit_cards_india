rewards:
  - effective_from: 2022-03-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 150
      unit_value_inr: 0.25
      unit_value_inr_realized: null
    accelerated:
      - category: dining-movies-grocery-departmental
        canonical_categories: [groceries, dining, entertainment]
        multiplier: 10
        effective_rate: 10
        cap_per_cycle: 5000
        cap_unit: points
        cycle: monthly
        over_cap_earns_base: true
        notes: "10 total Reward Points per INR 150 on dining, movies, groceries and departmental-store transactions recognized under eligible MCCs. Accelerated points cap at 5,000 per calendar month; thereafter these categories earn the 1-point-per-INR-150 base rate. The customer spend profile has no separate departmental-store bucket, so that part of the eligible scope cannot be isolated in estimates."
    exclusions:
      - fuel
      - wallet-loads
      - cash-advance
      - emi
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
      - type: catalog
        program: SBI Card Rewards
        rate_inr_per_unit: null
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/simplysave-sbi-card.html
      retrieved_on: 2026-10-25
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/SimplySAVE-TnC.pdf
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - rewards.base.rate
        - rewards.base.per_inr
        - rewards.base.unit_value_inr
        - rewards.accelerated.effective_rate
        - rewards.accelerated.cap_per_cycle
        - rewards.accelerated.cap_unit
        - rewards.accelerated.cycle
        - rewards.exclusions
        - rewards.mcc_exclusions
        - rewards.redemption.rate_inr_per_unit
        - rewards.capping_rules
      notes: Current SimplySAVE product page and card-specific T&C confirm 1 point per INR 150 generally, 10 per INR 150 on dining, movies, grocery and departmental stores, and a 5,000-point calendar-month cap on accelerated points with base earn after the cap. Current page values statement-credit redemption at 4 points per INR 1. General SBI rewards FAQ/MITC states INR 99 plus tax redemption fee where applicable, 24-month point expiry and (from 1-Apr-2026) 4,000-point statement-credit increments and a 60,000-point monthly cap. Catalogue value is item-specific; realized value is left unknown because applicable fees depend on redemption type and batch timing.
    mcc_exclusions: ['5172', '5541', '5542', '5983']
    capping_rules:
      - Accelerated earn is 10 total points per INR 150 on dining MCC 5812/5813/5814, grocery MCC 5411, departmental-store MCC 5311 and movie-theatre MCC 7832. The monthly 5,000-point cap applies to accelerated points in aggregate; after the cap, base earn of 1 point per INR 150 continues.
      - Fuel MCCs 5172/5541/5542/5983 do not earn points. Cash advance, balance transfer, Encash and Flexipay transactions are excluded under card terms. General SBI wallet-load exclusions are identified under MCCs 6540/6541.
      - Statement-credit redemption is INR 0.25 per point before applicable fee. From 1-Apr-2026 it requires 4,000-point increments and is capped at 60,000 points per card per calendar month. INR 99 plus tax batch fee may apply; points expire after 24 months. Aggregate inputs cannot calculate redemption batch fees or catalogue-specific value.

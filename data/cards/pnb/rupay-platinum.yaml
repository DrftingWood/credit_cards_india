# ---------------------------------------------------------------------------
# PROVENANCE & CONFIDENCE  (full matrix: docs/PROVENANCE.md)
#   Source     : PNB card page creditcard.pnb.bank.in/types5.html (fees, earn,
#                point value, lounge, insurance, income) + PNB Key Fact
#                Statement (finance charge, cash advance, forex).
#   Verified   : 2026-10-20   Confidence: HIGH
#   D5 blocker resolved: the base earn rate IS issuer-stated on the card page
#   ("Reward Points : 1 pt on Rs 100"; "Value of reward points : 1 pt =
#   Rs.0.25"). PNB's rewards.html still says 1 RP = Rs 0.50; that is stale —
#   PNB's Reward Point Notice (w.e.f. 1-Sep-2024) and MITC say 25 paise.
#   From 1-Nov-2026 PNB's revised KFS adds a Rs 99 + GST fee per reward
#   redemption (noted on the redemption entry).
# ---------------------------------------------------------------------------
id: pnb-rupay-platinum
name: PNB RuPay Platinum Credit Card
issuer: pnb
network: rupay
network_tier: platinum
tier: entry
card_type: credit
co_brand: null
status: active
launched_on: 2022-01-01
discontinued_on: null

fees:
  - effective_from: 2024-09-01
    effective_until: null
    joining_fee_inr: 0
    annual_fee_inr: 500
    fee_waiver:
      spend_inr: 0
      cycle: annual
      conditions: "Annual fee waived if the card is used at least once in each quarter of the preceding year (card page)."
    forex_markup_pct: 3.5
    finance_charge_monthly_pct: 2.95
    cash_advance_fee:
      pct: 2.0
      min_inr: 150
    gst_applicable: true
    notes: "Cash advance: 2% or Rs 100 (whichever higher) at PNB ATMs, 2% or Rs 150 at other ATMs; the other-ATM minimum is recorded."
    source:
      url: https://creditcard.pnb.bank.in/types5.html
      retrieved_on: 2026-10-20
      type: issuer-page
      confidence: high
      fields_verified:
        - fees.joining_fee_inr
        - fees.annual_fee_inr
        - fees.fee_waiver
      notes: "Card page: joining NIL, annual Rs 500, 'Annual Fee shall be waived in case the card is used at least once in each quarter in the preceding year'. Forex 3.50% ('for all other card'), finance charge 2.95%/month and cash-advance fees from the PNB Key Fact Statement (creditcard.pnb.bank.in/Documents/KeyFactStatement.pdf). effective_from is the date of the current point value (1-Sep-2024), not the card's launch."

rewards:
  - effective_from: 2024-09-01
    effective_until: null
    currency: points
    currency_name: PNB Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
      # Same realised haircut as the PSU siblings (pnb-rupay-select,
      # union-rupay-select): catalogue redemption with a 1,000-point minimum.
      unit_value_inr_realized: 0.18
    exclusions:
      - fuel
      - cash-advance
    redemption:
      - type: catalog
        program: PNB Credit Card Rewards
        rate_inr_per_unit: 0.25
        constraints: "Minimum redemption 1,000 points (card page). From 1-Nov-2026 a Rs 99 + GST fee applies to each redemption (PNB revised KFS)."
    source:
      url: https://creditcard.pnb.bank.in/types5.html
      retrieved_on: 2026-10-20
      type: issuer-page
      confidence: high
      fields_verified:
        - rewards.base.rate
        - rewards.base.per_inr
        - rewards.base.unit_value_inr
      notes: "Card page: 'Reward Points : 1 pt on Rs 100', 'Value of reward points : 1 pt = Rs.0.25', reward multiplier 'NA'. Point value confirmed by PNB's Reward Point Notice (w.e.f. 1-Sep-2024) and MITC ('25 paise'). Exclusions are the general PNB rewards exclusions."

benefits:
  - effective_from: 2024-09-01
    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [rupay]
      international:
        visits_per_cycle: 2
        cycle: annual
        guests_per_visit: 0
        via: [rupay]
    welcome:
      - condition: "First transaction within 90 days of receiving the card"
        benefit: "300 bonus reward points"
        value_inr: 75
        window_days: 90
    insurance:
      - type: personal-accident
        sum_insured_inr: 200000
    concierge: false
    source:
      url: https://creditcard.pnb.bank.in/types5.html
      retrieved_on: 2026-10-20
      type: issuer-page
      confidence: high
      notes: "Card page: lounge 'Domestic-2 per qtr, International-2 per yr'; personal accident insurance Rs 2 lakh; 300 bonus points on the first swipe within 90 days. Fuel surcharge waiver not stated for this variant (the KFS row names RuPay Select), so none is recorded."

eligibility:
  min_age: 21
  max_age: 70
  income_inr_annual:
    salaried: 250000
    self_employed: 250000
  credit_score_min: 700
  residency: resident-indian
  notes: "Card page: 'Annual income of Rs.2.50 Lacs p.a.'"

application:
  apply_url: https://creditcard.pnb.bank.in/types5.html

metadata:
  last_verified_on: 2026-10-24
  tags: [entry, rupay, points, upi-linkable, psu-bank, lounge]

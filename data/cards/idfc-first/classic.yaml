benefits:
- effective_from: 2026-06-18
  effective_until: null
  lounge_access: null
  welcome:
  - condition: Primary card spends INR 5,000 within 30 days from card generation
    benefit: INR 500 voucher from a selected top brand; fulfilment link sent after qualification
    value_inr: 500
    window_days: 30
  - condition: First EMI conversion within 30 days from card generation
    benefit: 5% cashback on the first EMI transaction, capped at INR 1,000
    value_inr: 1000
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 200
    cycle: monthly
    notes: Issuer specifies a monthly/cycle cap of INR 200; exact cycle boundary is
      not further defined in the reviewed page.
  movies:
    type: discount
    partner: Paytm
    max_per_cycle: 1
    cycle: monthly
    cap_inr: 100
    notes: >-
      25% off up to INR100 once per calendar month; any transaction in the previous
      calendar month is required. Current product copy does not name the platform;
      linked Classic privileges terms name Paytm.
  other:
  - name: Railway lounge access
    description: >-
      Four complimentary railway-lounge visits per calendar quarter. Spend INR20,000
      in the current calendar month to unlock access in the following month. Present
      the card and a valid train ticket at a participating lounge. A Pine Labs terminal
      applies a INR2 validation charge; guests pay separately. The PDF does not state
      whether add-on cards share the primary card quota.
    value_inr: null
  - name: Travel-booking bonus Reward Points
    description: >-
      Current Classic page and May-2026 communication say 20% extra on hotel
      bookings and 10% extra on flights through FIRST Rewards Gallery, over
      applicable card rewards. The Jan-2026 update and linked Tripstacc terms
      retain 33%/13%; current amount remains unresolved across issuer sources.
    value_inr: null
  - name: Roadside assistance
    description: Up to four services annually through Global Assure; requires an active card with a purchase or ATM transaction in the prior 30 days.
    value_inr: 1399
  - name: Card liability cover
    description: Lost-card liability, counterfeit/skimming and online-fraud cover; active-card condition applies.
    value_inr: 25000
  - name: Personal accident cover
    description: Personal accident cover; an active card requires at least one purchase/POS/ATM transaction in the preceding 30 days. Claim is payable once across the cardholder's IDFC FIRST cards.
    value_inr: 200000
  - name: Credit shield cover
    description: Cover for qualifying card debit on accidental death.
    value_inr: 50000
  - name: Purchase protection
    description: Residential-premises fire/allied-perils and burglary protection for 60 days from purchase; active-card condition applies.
    value_inr: 25000
  - name: FIRST Digital RuPay UPI add-on
    description: Optional virtual RuPay card linked to Classic; INR 199 joining fee and annual fee from year two. Its UPI earn split is recorded in reward notes.
    value_inr: null
  concierge: false
  source:
    url: https://www.idfcfirst.bank.in/content/dam/IDFCFirstBank/credit-cards/FIRSTClassicCreditCard/FIRST-Classic-Privileges.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - benefits.welcome.value_inr
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.movies.cap_inr
    - benefits.other.value_inr
    local_refs:
    - docs/sources/idfc-first/classic/classic-tripstacc-bonus-terms.pdf
    notes: >-
      Current product page and May-2026 card communication confirm welcome-offer
      spend/expiry conditions, fuel-waiver percentage, INR200-INR5,000 transaction
      range and INR200 statement-cycle cap, movie activation, and railway threshold.
      The linked privileges PDF states four quarterly railway visits through Pine Labs,
      a INR2 validation charge and no complimentary guest. It has no clear publication
      date and names Paytm for movies. Its insurance table lists no travel or air-
      accident insurance for Classic; those unsupported claims were removed. It
      confirms INR25,000 card-liability, INR200,000 personal-accident, INR25,000
      credit-shield and INR25,000 purchase-protection limits.
eligibility:
  min_age: null
  max_age: null
  income_inr_annual:
    salaried: 300000
    self_employed: null
  credit_score_min: null
  residency: null
  notes: >-
    The Classic page publishes annual income of INR 300,000 or more; the general
    application page applies the same minimum to Classic and Millennia but does not
    distinguish salaried and self-employed applicants. It gives Indian citizenship,
    not residence, so residency remains null. The general page conflicts on age: its
    card-application FAQ says at least 21, while a later generic eligibility FAQ says
    at least 18. No Classic-specific age limit or numeric bureau-score floor is
    published, so both fields remain null. A bank blog?s 750+ score is guidance, not
    a stated hard minimum.
  source:
    url: https://www.idfcfirst.bank.in/credit-card/classic
    retrieved_on: 2026-10-27
    type: issuer-page
    confidence: high
    fields_verified:
    - eligibility.income_inr_annual.salaried

    notes: 'Current White Reserve KFS version KFSWR12032026 (12-Mar-2026) confirms INR 12,500 joining/annual fees, annual-fee waiver at INR 10 lakh retail spend, 2% foreign-currency markup, 3.50% monthly/42% annual finance charge, and cash-advance fee 2.5% (minimum INR 500). It also lists 2% DCC; over-limit, rent, utility, education, fuel, wallet-loading, online gaming, branch cash-payment, replacement-card, and credit-limit-increase fees waived; standing-instruction failure fee 2% (minimum INR 450, maximum INR 5,000); cheque-return fee 2% (minimum INR 500); and late-payment slabs INR 0 up to 100, INR 100 for 101-500, INR 500 for 501-1,000, INR 600 for 1,001-5,000, INR 750 for 5,001-10,000, INR 900 for 10,001-25,000, INR 1,100 for 25,001-50,000, and INR 1,300 above 50,000. Dedicated schema fields do not represent all these charges. The KFS identifies its version date; no separate effective date for each charge is stated.'

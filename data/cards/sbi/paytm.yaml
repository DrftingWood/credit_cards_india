rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: cashback
    currency_name: Cashback
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: paytm-travel-movies-mall
        canonical_categories: [travel, entertainment, other]
        multiplier: 3
        effective_rate: 3
        channel:
          required: true
          class: cobrand-merchant
          merchants: [paytm-app]
        notes: "3% valueback on travel, movies and mall purchases through the Paytm App. Cap not stated on crawl."
      - category: paytm-app-spends
        channel:
          required: true
          class: cobrand-merchant
          merchants: [paytm-app]
        canonical_categories: [online]
        multiplier: 2
        effective_rate: 2
        notes: "2% Cashback on all other purchases on the Paytm App. Cap not stated on crawl."
    redemption:
      - type: catalog
        program: Paytm Gift Voucher balance
        rate_inr_per_unit: 1.0
        constraints: "Reward Points are automatically converted to Paytm Gift Voucher balance in the cardholder's linked Paytm Wallet; not statement credit. Minimum eligible transaction is INR 100."
    exclusions:
      - fuel
      - wallet-loads
      - rent
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/paytm-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
    notes: "1% valueback everywhere else; 2% on other Paytm App purchases and 3% on Paytm App travel, movies and mall purchases. UPI transactions earn 1% valueback."

    mcc_exclusions: ['6513']
    capping_rules:
      - No monthly or statement cap stated in the Paytm SBI Card base booklet for the 3% Paytm App category.

rewards:
- effective_from: '2026-10-27'
  effective_until: null
  currency: points
  currency_name: Zen Points
  base:
    rate: 5
    per_inr: 150
    unit_value_inr: 0.25
    unit_value_inr_realized: 0.2
    notes: 5 Zen Points per INR150 on eligible non-shopping retail spends. Cash redemption realizes INR0.20 per point; catalogue categories including recharge, shopping, vouchers, movies and travel list INR0.25 per point. Cash redemption requires at least 2,000 points.
  accelerated:
  - category: shopping
    canonical_categories:
    - online
    multiplier: 2
    effective_rate: 10
    cap_per_cycle: unlimited
    cap_unit: points
    cycle: statement
    notes: 10 points per INR150 on shopping including apparel, lifestyle goods, departmental stores and jewellery; all reward points together are capped at 6,500 per billing cycle.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - emi
  - other
  mcc_exclusions:
  - '6513'
  - '5172'
  - '5541'
  - '5542'
  - '5983'
  reward_cap:
    max_units: 6500
    cap_unit: points
    cycle: statement
  capping_rules:
  - Overall earned Zen Points are capped at 6,500 per billing cycle.
  - Education and insurance earn points only on spend up to INR70,000 per statement cycle; utility up to INR50,000; government up to INR40,000.
  - Wallet load, fuel, rent and online skill-based gaming earn no points. EMI transactions are also excluded from earn.
  - Education, insurance, utility, government, wallet load, fuel, rent and online skill-based gaming spends do not count toward milestone benefits; MCC mapping applies.
  redemption:
  - type: catalog
    program: Kotak Rewards catalogue
    rate_inr_per_unit: 0.25
    constraints: Issuer lists INR0.25 per Zen Point for categories including mobile recharge, shopping, e-vouchers, movies and travel; item/offer terms may apply.
  - type: statement-credit
    program: Cash value redemption
    rate_inr_per_unit: 0.2
    min_units: 2000
    constraints: Since 2025-06-01 cash redemption is INR0.20 per point, minimum 2,000 points.
  source:
    url: https://www.kotak.bank.in/en/personal-banking/cards/credit-cards/zen-signature-credit-card.html
    retrieved_on: '2026-10-27'
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/kotak/zen-signature/mitc-wealth-and-white-reserve-2026-10-27.pdf

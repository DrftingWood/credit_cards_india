    local_refs:
    - docs/sources/idfc-first/mayura/Mayura-Rewards-Structure-TnC.pdf
    notes: >-
      Cross-checked to the issuer Mayura Rewards Structure T&C and 18-Jun-2026 update. App hotel/flight bonuses
      are 30 additional points per INR 150 on hotels and 15 additional points per INR 150 on flights, with a shared
      25,000 bonus-point monthly cap in the linked 2025 reward structure/current FAQ. However, the May-2026 update says app travel bonus is 20% of applicable base hotel points and 10% of base flight points; current page continues to advertise 30X/15X bonus points. No single current travel-booking rate can be reconciled, so this remains an unresolved issuer conflict. Redeemable points are capped at 150,000 per month and 300,000 per year.
      Rewards accrue only up to the credit limit per billing cycle and are reversed if MAD is unpaid by due date.
      Associated FIRST Digital RuPay UPI earns 3 points/INR 150 above INR 2,000 and 1 point/INR 150 at or below
      INR 2,000; UPI spend counts toward the INR 20,000 threshold. The model cannot represent the linked UPI rail.
  capping_rules:
  - App hotel/flight bonus earn has a shared 25,000 bonus-point monthly cap; redeemable points separately cap at 150,000 monthly and 300,000 annually.
  - Rewards accrue only on spend up to the credit limit per billing cycle; excess spend earns no points, and cycle points reverse if MAD is unpaid by due date.
  - Associated FIRST Digital RuPay UPI earns 3 points per INR 150 above INR 2,000 and 1 point per INR 150 at or below INR 2,000; the card model cannot express the associated network/payment rail precisely.

      notes: An SBI 2020 notice sets separate 10,000-point calendar-month caps on cumulative 10X eligible partner and 5X other-online earn, with standard base points continuing after each cap. Newer Advantage T&C confirms the 5X cap but does not restate the partner cap; the record retains the last explicit cap conservatively pending clarification. They also state that Reward Points cannot pay the outstanding card balance, so no fixed point-to-cash value is modeled. General SBI redemption fees/expiry apply where relevant; catalogue e-voucher value varies by item.
    mcc_exclusions: ['5172', '5541', '5542', '5983', '6513', '6540', '6541', '9311', '9399', '5816', '7993', '7994']
    capping_rules:
      - An SBI notice effective 1-Oct-2020 set a 10,000-point monthly cap on each cumulative 10X partner and 5X other-online stream. The newer Advantage T&C restates the 5X cap but not the partner cap; this record retains the last explicit 10X cap conservatively pending issuer clarification. After each cap, standard base earn of 1 point per INR 100 continues.
      - Advantage-specific T&C list Apollo 24x7, BookMyShow, Cleartrip, Domino's, GyFTR, IGP, Myntra, Netmeds, Swiggy and Yatra. Cleartrip/Yatra affiliate channels are excluded; Amazon gift-card purchases do not earn 10X; GyFTR e-gift vouchers qualify only through the SimplyCLICK GyFTR portal. Partner merchant IDs and network/acquirer online flags determine eligibility on a best-effort basis.
      - SBI Card website/app utility bill payments do not earn 5X. Wallet MCCs 6540/6541, rent MCC 6513, government MCCs 9311/9399, gaming MCCs 5816/7993/7994, cash advance, balance transfer, Encash, Flexipay and offline fuel MCCs 5172/5541/5542/5983 do not earn Reward Points.
      - Reward Points cannot be redeemed against the outstanding balance for this variant. Catalogue values vary by item; no fixed point value is modeled. General SBI points expire after 24 months; any applicable catalog redemption fee depends on the item/fulfillment method.

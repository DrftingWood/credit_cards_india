rewards:
  - effective_from: 2026-10-25
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 150
      unit_value_inr: 0.25
      unit_value_inr_realized: null
      notes: Point face value is ₹0.25; statement credit is ₹0.10 per point. Redemption charges and route-dependent value are not reflected in realized value.
    accelerated:
      - category: healthcare-grocery
        canonical_categories: [groceries]
        multiplier: 3
        effective_rate: 3
        cap_status: not-published
        cap_unit: points
        cycle: monthly
        notes: Issuer advertises 3X on healthcare and grocery. Healthcare transactions cannot be isolated in the current spend profile and are not assigned a calculator bucket.
      - category: utilities
        canonical_categories: [utilities]
        multiplier: 2
        effective_rate: 2
        cap_status: not-published
        cap_unit: points
        cycle: monthly
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - financial-institutions
    mcc_exclusions: ['5541', '7983', '5172', '5542', '9399', '4784', '9311', '9222', '9402', '4011', '9405', '9211', '6012', '6051', '6050', '6513']
    category_caps:

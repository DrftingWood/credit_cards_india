benefits:
- effective_from: '2026-10-27'
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via: []
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Unlimited for primary and add-on Priority Pass members; guests are charged USD29 plus GST per guest
        per visit.
  golf:
    rounds_per_cycle: unlimited
    cycle: monthly
    lessons_per_cycle: unlimited
    notes: Current card terms say primary cardmember only. Monthly round(s) appear in Golftripz after the 10th day
      of the following month and remain usable during the next two months; booking availability and course terms
      apply.
  welcome:
  - condition: Joining fee realised and card activated
    benefit: 12,500 ICICI Reward Points as joining bonus; 1-year Taj Epicure Plus membership; 12-month EazyDiner
      Prime membership. Annual bonus of 12,500 points and memberships renew subject to annual fee receipt. Points/membership
      details are sent within 45 business days.
    window_days: null
  milestones:
  - spend_inr: 1000000
    cycle: annual
    benefit: Annual fee waiver from second year onward.
  - spend_inr: 400000
    cycle: annual
    benefit: First EaseMyTrip flight voucher worth INR3,000; a second INR3,000 voucher is issued on reaching INR800,000
      annual spend.
    value_inr: 3000
  - spend_inr: 800000
    cycle: annual
    benefit: Two EaseMyTrip flight vouchers worth INR3,000 each in total INR6,000.
    value_inr: 6000
  insurance:
  - type: air-accident
    sum_insured_inr: 30000000
    conditions: Primary cardholder only; current card FAQ says card must have been used at least once in prior 60
      days and international travel ticket must be purchased using the card. Linked group policy has a general 90-day
      active-card clause; card-specific FAQ timing is recorded, discrepancy retained.
  - type: travel-medical
    sum_insured_inr: 50000
    conditions: Medical expenses for bodily injury caused by and arising out of rail/road accident, per current
      linked ICICI Lombard policy; this is not INR5,000,000 general medical cover.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: null
    max_txn_inr: 4000
    cap_per_cycle_inr: 1000
    cycle: statement
    notes: 1% on fuel transactions; current page states transactions up to INR4,000, card terms cap total waiver
      at INR1,000 per statement cycle. No minimum transaction band stated in current reviewed card terms.
  dining:
    program: EazyDiner Prime
    discount_pct: 25
    notes: 12-month Prime membership, primary cardmember. Prime discounts apply at participating restaurants; PayEazy-enabled
      venues may have an additional 25% discount up to INR1,000 under EazyDiner terms.
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 750
    notes: Up to INR750 off the second ticket, twice per month on eligible movie, sport, theatre or concert bookings;
      minimum two tickets.
  concierge: true
  other:
  - name: Taj Epicure Plus membership
    description: Complimentary one-year membership for primary cardmember; renewal linked to fee payment and current
      voucher terms.
  - name: EazyDiner Prime membership
    description: Complimentary 12-month membership for primary cardmember, renewable subject to annual fee receipt.
  - name: EaseMyTrip flight cancellation cover
    description: No cancellation charges / reimbursement up to INR12,000 for eligible non-refundable domestic flight,
      hotel and movie bookings; primary cardmember and card payment conditions apply. Current card terms limit coverage
      to first two cancellations and eligible India bookings.
  - name: Fraud protection
    description: Counterfeit card liability and account takeover cover are advertised on the current product page;
      detailed limits are subject to issuer terms.

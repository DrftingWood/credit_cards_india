rewards:
- effective_from: 2026-10-19
  effective_until: null
  currency: points
  currency_name: Marriott Bonvoy Points
  loyalty_program: marriott-bonvoy
  base:
    rate: 2
    per_inr: 150
    unit_value_inr: 0.85
    unit_value_inr_realized: 0.55
  accelerated:
  - category: marriott-properties
    canonical_categories:
    - travel
    effective_rate: 8
    card_attributable_rate: 8
    card_attributable_per_inr: 150
    stacks_with_program: false
    cap_per_cycle: 1000000
    cap_unit: spend-inr
    cycle: monthly
    channel:
      required: true
      class: cobrand-merchant
      merchants:
      - marriott-direct
    notes: 8 points per INR 150 up to INR 10 lakh eligible monthly spend, then 2 points per INR 150. Participating properties and Marriott-owned/managed branded retail and online stores only; excludes Homes & Villas. No additional 4-point travel/dining earn applies to the same transaction. Hotel-stay program points are excluded from estimates because the calculator cannot isolate eligible hotel stays from other Marriott-branded retail spend.
  - category: travel-dining
    canonical_categories:
    - travel
    - dining
    - entertainment
    effective_rate: 4
    card_attributable_rate: 4
    card_attributable_per_inr: 150
    stacks_with_program: false
    cap_per_cycle: 500000
    cap_unit: spend-inr
    cycle: monthly
    notes: 4 points per INR 150 up to INR 5 lakh eligible monthly spend; above the threshold, base 2 points per INR 150 applies. Category assignment follows network MCCs.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  - cash-advance
  capping_rules:
  - Grocery earn stops after INR 1,50,000 eligible grocery spend per month (maximum 2,000 points); generic base earn must not continue above this cap.
  - Only primary cardmember receives Marriott points; supplementary-card spend credits the primary member's Marriott account.
  - Points are rounded to the nearest integer; fractional points are not accrued.
  - Online gaming transactions are excluded from earning.
  - Cash advances, card fees, other charges and outstanding-balance payments do not earn points. Only an eligible down-payment amount earns points; EMI amounts, interest, processing fees and GST do not.
  redemption:
  - type: hotel-points
    program: Marriott Bonvoy
    rate_inr_per_unit: 0.85
    constraints: Points credited directly to Marriott Bonvoy account.
  source:
    url: https://www.hdfc.bank.in/content/dam/hdfcbankpws/in/en/personal-banking/discover-products/cards/credit-cards/marriott-bonvoy-credit/terms-and-condition.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    local_refs:
    - docs/sources/hdfc/marriott-bonvoy/terms-and-condition-retrieved-2026-10-27.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated
    - rewards.exclusions
    - rewards.capping_rules
    notes: Published 19-Oct-2026 card-specific terms confirm 8/150 Marriott earn up to INR 10 lakh monthly; 4/150 travel, dining and entertainment up to INR 5 lakh monthly; base 2/150 otherwise; grocery earn capped at INR 1.5 lakh monthly; and the exclusion list. Reward valuations come from the separate Marriott Bonvoy loyalty-program record, not HDFC.

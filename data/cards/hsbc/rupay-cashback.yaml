  welcome:
  - condition: Apply by 2026-12-31; card may be issued subsequently; download and log in to HSBC India Mobile Banking app and complete eligible transactions totalling INR10,000 within 30 calendar days of issuance; primary card only, updated KYC, no minimum due unpaid over 30 days.
    benefit: INR500 introductory cashback, credited within 60 days after the 30-day spend window.
    value_inr: 500
    window_days: 30
  - condition: Apply online, complete Video KYC and receive the card during 2026-01-01 to 2026-10-31.
    benefit: INR250 Amazon eGift Voucher.
    value_inr: 250
  - condition: Activate an HSBC RuPay credit card during 2025-07-15 to 2026-12-31; primary card only and register as an EazyDiner user.
    benefit: Complimentary EazyDiner Prime membership for two months.
    value_inr: null
  fuel_surcharge_waiver: null
  other:
  - name: UPI linkage
    description: Link the RuPay credit card to HSBC SimplyPay or another UPI app and pay eligible merchants, subject to the network and issuer terms.
  - name: 0% foreign currency markup offer
    description: HSBC waives the standard 3.5% foreign currency markup on eligible transactions from 2025-07-15 to 2026-12-31; DCC and network/merchant conversion rates are separate.
  concierge: false
  notes: >-
    Current HSBC product page advertises two local lounge visits per quarter and two
    international visits per year. The linked Service Guide's older key-summary text says

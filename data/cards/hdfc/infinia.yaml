    effective_until: null
    joining_fee_inr: 12500
    annual_fee_inr: 12500
    fee_waiver:
      spend_inr: 1000000
      cycle: annual
      conditions: "Renewal fee waived on spends of ₹10L in the preceding membership year."
    forex_markup_pct: 2.0
    finance_charge_monthly_pct: 1.99
    cash_advance_fee: null

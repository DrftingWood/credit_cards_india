  welcome:
  - condition: Make a first card transaction within 30 days of issuance;
      paid/full-fee cards only. Offer activates after 6 PM on the day after the
      first statement is generated and remains valid for 90 days after that
      statement.
    benefit: Up to INR500 BookMyShow discount across movies, events, plays,
      streams, activities and sports bookings
    value_inr: 500
    window_days: 30
  other:
  - name: BookMyShow food and beverage offer
    description: INR100 discount on food and beverages once per month when
      booking at least two movie tickets on BookMyShow with the Play card.
    value_inr: 100
  - name: RuPay UPI and NCMC features
    description: Product terms describe UPI scan-and-pay and NCMC functions for
      the RuPay variant only; current product page and network guide list
      Mastercard and Visa. Variant availability is inconsistent across issuer
      pages; treat as variant-specific/unresolved. Small-merchant offline UPI
      transactions under INR2,000 are excluded from product benefits where RuPay
      terms apply.
    value_inr:
  notes: Current product page and card terms publish BookMyShow discounts and
    fuel surcharge waiver, not reward points or lounge access; stale point and
    lounge claims were removed. Product-page fee waiver also recognizes
    BookMyShow Superstar status for cards sourced through BookMyShow. Product
    terms contain RuPay-only clauses even though the current product page and
    network guide list Mastercard/Visa; this variant conflict is documented.

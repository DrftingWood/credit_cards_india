benefits:
- effective_from: '2026-10-26'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - mastercard
      - visa
      notes: Current Wellness Plus guide specifies 2 domestic airport visits per
        calendar quarter; current MITC domestic lounge gate applies INR50,000
        qualifying prior-quarter spend.
  welcome:
  - condition: Complete health check-up within first 90 days after issuance
    benefit: Amazon voucher worth INR500 plus complimentary annual preventive
      health check-up
    value_inr: 500
    window_days: 90
  other:
  - name: Aditya Birla Wellness health and fitness services
    description: Preventive health check-up up to 31 parameters; unlimited
      doctor/specialist on-call and nutritionist consultations through AB
      Multiply; 12 fitness sessions per month, booking subject to availability.
  - name: Additional health assessments
    description: Issuer value chart also mentions fitness assessment and
      eye/dental check-up; current conditions were not independently visible.
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 500
    max_txn_inr: 3000
    cap_per_cycle_inr: 250
    cycle: monthly
    notes: Current MITC v18 groups Wellness Plus with a INR250 per statement cap
      and INR500-3,000 transaction range. Older usage guide states INR500 cap;
      v18 followed. GST not reversed, UPI fuel ineligible.

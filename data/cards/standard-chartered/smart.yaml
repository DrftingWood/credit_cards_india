rewards:
- effective_from: '2026-10-26'
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 1.0
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    notes: 1% cashback on eligible other/offline spends; online transactions earn 2% total.
  accelerated:
  - category: online-spend
    canonical_categories:
    - online
    multiplier: 2
    effective_rate: 2
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: statement
    notes: 2% online cashback capped at INR 1,000 per statement cycle; issuer FAQs supersede the product page's older monthly wording.
  exclusions:
  - fuel
  - cash-advance
  mcc_exclusions: []
  reward_cap: null
  capping_rules:
  - 1% offline/other eligible cashback is capped at INR 500 per statement cycle; online cap is INR 1,000 per statement cycle.
  - Cashback caps are consolidated across primary and supplementary cards at customer level, not an additional INR 1,500 card-level cap.
  - BillDesk/SC Bill Pay telecom and electricity, water or gas billers are eligible for online cashback; eligibility of other bill-payment channels/categories is not established by the cited FAQ.
  - Cashback redemption requires at least INR 2,500, then is in increments of INR 1,000; redeemed cashback is applied to the card account within three working days. No INR 99 redemption handling fee applies.
  redemption:
  - type: statement-credit
    program: Cashback
    rate_inr_per_unit: 1.0
    min_units: 2500
    fee_inr: 0
    constraints: Minimum INR 2,500; subsequent redemption amounts in INR 1,000 increments; credited to card account within three working days.
  source:

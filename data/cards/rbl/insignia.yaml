    notes: 10 points per INR100 on international eligible retail spend; billing
      cycle for posting, with no cap stated.
  exclusions: []
  redemption:
  - type: catalog
    program: RBL Rewards
    rate_inr_per_unit:
    constraints: Redeem on RBL Rewards portal. Current RBL terms vary point
      requirement by card and redemption category; no universal INR value. No
      redemption fee for Insignia. Rewards points do not expire while the
      account remains open; points lapse on card closure. Eligible Insignia
      holders can transfer 3 reward points to 1 active partner mile/point;
      partner terms and account-name matching apply.
  source:
    url:
      https://webassets.rbl.bank.in/document/credit-cards/terms-conditions-insignia-credit-card.pdf
    retrieved_on: '2026-10-27'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    local_refs:
    - docs/sources/rbl/insignia/product-terms-retrieved-2026-10-27.pdf
    - docs/sources/rbl/insignia/miles-transfer-terms-retrieved-2026-10-27.pdf

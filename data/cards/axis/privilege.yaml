  notes: 'Standard joining and renewal fees are INR 1,500 (joining fee waived for Priority account holders per KFS); the issuer page separately advertises a limited-period INR 0 joining and renewal offer on the American Express network only. Annual fee is reversed at INR 500,000 eligible anniversary-year spend; utility/telecom, rent, wallet, government, insurance, gold/jewellery, fuel, education, gift-card and bridge/road/toll spends are excluded. From 28-Aug-2026, DCC is 3.5% plus taxes; foreign-currency transaction markup is 3.5%. Additional issuer-listed charges: cash payment INR 175; replacement/add-on cards nil; duplicate statement, charge-slip retrieval, outstation cheque, mobile alerts, hotlisting and balance enquiry waived; late fee nil below INR 500, INR 500 at INR 501-5,000, INR 750 at INR 5,001-10,000, INR 1,200 at INR 10,001-50,000, INR 1,300 above INR 50,000 (the exact INR 500 boundary is unspecified), plus INR 100 after two consecutive missed MAD cycles until cured; overlimit 2.5% (minimum INR 500); cheque return/auto-debit reversal 2% (minimum INR 500); railway surcharge as set by IRCTC; rent 1%; wallet 1% at INR 10,000/cycle; fuel 1% at INR 50,000/cycle; third-party education 1%; utility 1% at INR 25,000/cycle; online skill gaming 1% at INR 10,000/cycle. Reward redemption fee is marked Yes but no amount is published. The product page reports standard annual fee INR 1,500 and also lists Amex-network limited-time nil fees.'

  - other
  mcc_exclusions: []
  capping_rules:
  - Points are earned only on integer multiples of INR125; amounts below INR125 and residual amounts do not earn points.
  - No points on fuel or railway transactions where the associated surcharge waiver applies, personal loans, cash advances, fees and charges, balance transfers, EMI, cash withdrawals, demand drafts and service-charge transactions.
  - Kotak may set a maximum reward-point accrual limit for a period; the current published terms specify no numeric cap.
  - Points expire two years after the date earned under the current consolidated MITC.

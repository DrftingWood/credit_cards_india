  notes: 'Select product guide confirms one domestic airport visit and four railway lounge visits per quarter (railway threshold INR20,000 previous month); Select important update effective 2026-04-01 says airport spend INR20,000 in current month unlocks access next month. Product page FAQs conflict on current vs previous month. Product page says movie BOGO without clear INR cap, current product guide says up to INR125 twice monthly. Current Select update says 33% hotel/13% flight bonus, while product page says 20%/10%; benefit rate unresolved. Product usage guide also lists fuel surcharge waiver up to INR300/month; purchase amount limits shown in guide terms should be reconfirmed.'

rewards:
- effective_from: '2026-05-15'
  effective_until: null
  currency: points
  currency_name: CashPoints
  base:
    rate: 2
    per_inr: 200
    unit_value_inr: 0.25
    unit_value_inr_realized: 0.2
  accelerated:
  - category: online-partner-merchants
    canonical_categories:
    - online
    multiplier: 10
    effective_rate: 20
    cap_per_cycle: 2500
    cap_unit: points
    cycle: monthly
    merchants:
    - amazon
    - bigbasket
    - flipkart
    - swiggy
    - reliance-smart-superstore
    channel:
      class: cobrand-merchant
      merchants:
      - amazon
      - bigbasket
      - flipkart
      - swiggy
      - reliance-smart-superstore
    over_cap_earns_base: false
    notes: Current terms dated 15-May-2026 specify 20 CashPoints per INR 200 on eligible non-EMI merchant-ID transactions at Amazon, BigBasket, Flipkart, Reliance Smart SuperStore and Swiggy; cap 2,500 points per calendar month. Spends beyond this cap do not post CashPoints.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  - cash-advance
  redemption:
  - type: statement-credit
    rate_inr_per_unit: 0.2
    min_units: 2000
    fee_inr: 50
    constraints: Product page states INR 0.20 per point; May-2026 detailed terms say up to INR 0.25. May-2026 linked detailed terms cap cashback redemption at 50,000 points/calendar month; the product page still states 3,000, treated as stale conflicting content.
  - type: catalog
    program: HDFC SmartBuy rewards catalogue
    rate_inr_per_unit: 0.25
    fee_inr: 99
    constraints: Up to INR 0.25 per point; INR 99 plus taxes per redemption request; selected product/voucher redemption up to 70% of value.
  - type: other
    program: HDFC SmartBuy flights and hotels
    rate_inr_per_unit: 0.25
    constraints: Up to INR 0.25 per point; maximum 50% of booking value payable with points and 50,000 points per calendar month.
  - type: airmiles
    ratio: '1:0.25'
    constraints: 1 CashPoint converts to 0.25 AirMiles per issuer product page.
  capping_rules:
  - Overall maximum 15,000 reward points per statement cycle.
  - Grocery transactions are capped at 1,000 reward points per calendar month per terms; interaction with the 10X merchant cap is unspecified.
  - Direct school/college website or POS education may earn; third-party education apps do not. MCC alone cannot distinguish channels.
  - May-2026 linked terms say statement cashback is capped at 50,000 points/month; the current product page still says 3,000, preserved as an issuer-page conflict. Terms also require transactions to be at least INR 200 and in INR 200 multiples for points posting.
  source:

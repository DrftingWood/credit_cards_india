benefits:
- effective_from: 2026-10-26
  effective_until: null
  lounge_access:
    domestic:
      visits_per_cycle: 2
      cycle: quarterly
      guests_per_visit: 0
      via:
      - issuer-direct
      notes: Two visits per quarter at participating domestic lounges. Requires at least INR 50,000 eligible settled spend in the previous 3 calendar months; newly issued cards receive a waiver for the issue month and the next 3 calendar months. Guests pay separately. Current lounge list and program rules govern.
  welcome:
  - condition: First transaction within 30 days of card issuance; no minimum spend. Not applicable to existing-card swaps or customers migrated to Premium before 31-Jul-2024.
    benefit: 500 EDGE Miles, credited by T+12 days.
    value_inr: 500
    window_days: 30
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: null
    max_txn_inr: null
    cap_per_cycle_inr: null
    cycle: monthly
    notes: Unlimited 1% waiver at listed IndianOil outlets with authorized IOCL EDCs. GST charged on fuel surcharge is not refunded; on some transactions the acquiring fee may be INR 10 plus GST instead of 1% plus GST.
  other:
  - name: Zomato discount
    description: 30% off orders with minimum INR 200 spend, maximum INR 150 discount per order, up to twice per calendar month per card; use coupon AXISIOCL. Current offer terms apply.
    value_inr: null
  - name: Wednesday Delight and Dining Delights
    description: Current product page lists rotating Wednesday offers (MakeMyTrip flights/hotels, Swiggy and Tira) and access to Axis Dining Delights. Merchant participation, offer limits and availability depend on current program terms.
    value_inr: null

rewards:
  - effective_from: 2026-10-27
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 2
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: null
    accelerated:
      - category: dining-grocery-departmental
        canonical_categories: [groceries, dining, other]
        multiplier: 5
        effective_rate: 10
        cap_per_cycle: 10000
        cap_unit: points
        cycle: monthly
        over_cap_earns_base: true
        notes: 5X total Reward Points (10 points per INR100 including base) on Dining, Departmental Stores and Grocery; combined accelerated earn cap 10,000 points per month, then base 2 points per INR100 continues.
    exclusions:
      - fuel
      - wallet-loads
      - rent
      - government
      - emi
      - cash-advance
    redemption:
      - type: statement-credit
        rate_inr_per_unit: 0.25
        constraints: Redeem in multiples of 2,000 points; current SBI Card reward terms charge INR99 plus applicable taxes per statement-credit redemption batch.
      - type: catalog
        program: SBI Card Rewards
    capping_rules:
      - Current cardholder agreement caps cumulative Dining, Departmental Store and Grocery accelerated earnings at 10,000 Reward Points per month; after cap, base earn of 2 points per INR100 continues.
      - Points expire after 24 months. SBI identifies eligible merchants and MCCs on a best-effort basis.
      - Current cardholder agreement also excludes balance transfers and related services, EasyMoney, Encash, Dial a Draft, ATM withdrawals, financial charges, transactions before enrollment, points-plus-pay redemptions and flexipay/merchant EMI transactions.
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/sbi-card-elite.html
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      fields_verified: [rewards.base, rewards.accelerated, rewards.exclusions, rewards.redemption, rewards.mcc_exclusions]
      notes: Current product page supports base earn, 5X dining/departmental/grocery earn, statement redemption at 4 points per INR1 and 1.99% forex. Current cardholder agreement supports the monthly 10,000-point cap, 24-month expiry, redemption fee/minimum, fuel/wallet exclusions and post-cap base accrual. SBI's April 2024 and June 2024 lists specifically exclude Elite rewards on rent MCC6513 and government MCCs 9399/9311.

    mcc_exclusions: ['6513', '6540', '6541', '9311', '9399']

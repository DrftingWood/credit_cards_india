    notes: Non-EMI Tata Neu and eligible partner-brand transactions earn 5% total (1.5% base plus 3.5% additional), independent of NeuPass. Merchant IDs/terminal IDs and merchant-specific monthly/annual eligible-spend ceilings apply. The 5% earn is not yet included in calculator scoring because those spend ceilings are not modeled.
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - government
  - emi
  - gift-cards
  - cash-advance
  reward_cap:
    max_units: 50000
    cap_unit: points
    cycle: statement
  capping_rules:
  - >-
    Eligible non-EMI Tata partner-brand transactions earn 5% total (1.5% base plus 3.5% additional), independent of NeuPass. NeuPass registration is required only for the separate additional 5% on selected Tata Neu categories.
    Eligible spend ceilings by merchant, monthly/annual: Croma 600,000/1,800,000; Tata CliQ and Westside
    300,000/1,800,000; IHCL, Air India Express, and Air India 800,000/3,000,000; 1Mg, Cult, and Tata Play
    200,000/1,500,000; Tata Pay 100,000/600,000 (monthly limit increased from 50,000 on 1-Aug-2024); BigBasket 100,000/1,200,000; Titan and Tanishq
    600,000/1,800,000; Qmin 50,000/600,000. The calculator does not model this 5% rate until merchant-level
    annual caps can be applied.
  - Non-UPI grocery, insurance, utility, and telecom/cable spends each earn 1.5%, capped separately at 2,000 NeuCoins per calendar month.
  - Additional 5% NeuCoins on selected Tata Neu app/website categories via NeuPass requires registration and primary cardholder mobile matching since 15-Jan-2025. Current exclusions include Tata Pay, Tanishq, Cult.fit, Air India and Tata Play; category scope varies and this earn is not included in calculator scoring.
  - 'From 1-Jul-2025: no NeuCoins on online skill-based gaming (MCC 5816).'
  - From 25-Nov-2026 HDFC states that card-earned NeuCoins require manual in-app claiming within 12 months or expire; after transfer to Tata Neu they remain valid for another 12 months. This future-dated change is not applied to current behavior.
  redemption:
  - type: voucher
    program: Tata Neu App/Website and eligible Tata brands
    rate_inr_per_unit: 1.0
    constraints: NeuCoins redeem at INR 1 on eligible Tata Neu transactions and are not cash convertible. Until 24-Nov-2026 card-earned coins transfer within seven working days of statement generation; from 25-Nov-2026 the primary cardholder must claim them within 12 months or unclaimed coins expire. Transferred coins remain valid another 12 months.
  source:

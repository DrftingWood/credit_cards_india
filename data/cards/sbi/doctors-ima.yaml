    cap_per_cycle: 7500
    cap_unit: points
    cycle: monthly
    notes: 5 Reward Points per INR100 on Medical Supplies and Travel Agent/Booking spends; combined cap 7,500 points per month, then base 1 point per INR100 continues.
  - category: international-spends
    canonical_categories: [international]
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 7500
    cap_unit: points
    cycle: monthly
    notes: 5 Reward Points per INR100 on international spends; separate cap of 7,500 points per month, then base 1 point per INR100 continues.
  - category: doctors-day-spends
    multiplier: 5
    effective_rate: 5
    notes: 5 Reward Points per INR100 on all eligible spends made on Doctor's Day (1 July); ordinary program exclusions continue to apply. No separate Doctor's Day cap is stated in current terms.
    canonical_categories:
    - online
    - groceries
    - dining
    - travel
    - international
    - entertainment
    - utilities
    - telecom
    - education
    - other
  exclusions:
  - fuel
  - wallet-loads
  - rent
  - emi
  - cash-advance
  - government
  capping_rules:
  - Medical Supplies and Travel Booking 5X earn share one 7,500 point monthly cap; International 5X earn has a separate 7,500 point monthly cap. Base points continue after each cap.
  - Doctor's Day (1 July) earns 5X on all otherwise eligible spend; current issuer terms do not state a separate cap.
  - The IMA-specific terms say points cannot be exchanged for credit or applied to card charges, while SBI's current general cardholder agreement lists statement-credit redemption for eligible cards. Treat statement-credit eligibility for the IMA card as unresolved; no fixed cash value is asserted.
  - The IMA terms state points expire 24 months after accrual. General SBI terms add rent MCC 6513, government MCCs 9399/9311 and wallet MCCs 6540/6541 exclusions; all MCC identification is best-effort.
  redemption:
  - type: catalog
    program: SBI Card Rewards
  source:

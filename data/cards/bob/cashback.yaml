    notes: "The current page confirms the 1% fuel surcharge waiver for INR 400-5,000 transactions, capped at INR 250 per statement, and excludes fuel from cashback. Add-on cards are available for family aged over 18; zero liability is conditional on immediate lost-card reporting. The 15-Jan-2026 MITC confirms 3.75% monthly finance charges (45% annualized), 2.5% cash advance fee subject to INR 500 minimum, and 3.5% foreign currency fee for this card class. BOBCARD's 1-Apr-2026 revision notice adds fees the schema cannot model: 1% on third-party-app online education payments (max INR 5,000), 1% on toll/bus MCC 4784 transactions of INR 5,000 or more, and 1% on railway MCC 4112 transactions of INR 30,000 or more (max INR 5,000)."

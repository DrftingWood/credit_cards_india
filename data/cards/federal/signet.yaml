        visits_per_cycle: 1
        cycle: quarterly
        spend_threshold_inr: 20000
        spend_threshold_cycle: quarterly
        guests_per_visit: 0
        via: [visa]
        notes: Spend in the immediately preceding quarter unlocks access in the next quarter; spend period runs 21st to 20th. Primary cardholder only; add-on spends aggregate toward threshold, but add-on holders cannot use lounge access. Cash/ATM withdrawals and transactions not billed within cycle do not count. ₹2 non-refundable domestic validation charge; guest visits are chargeable.
    welcome:

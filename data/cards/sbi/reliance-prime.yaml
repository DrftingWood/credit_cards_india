    effective_until: null
    lounge_access:
      domestic:
        visits_per_cycle: 8
        cycle: annual
        guests_per_visit: 0
        via: [dreamfolks]
      international:
        visits_per_cycle: 4
        cycle: annual
        guests_per_visit: 0
        via: [priority-pass]
    welcome:
      - condition: "Joining fee paid"
        benefit: "Reliance Retail e-voucher worth ₹3,000"
        value_inr: 3000
        window_days: 90
      - condition: "Joining fee paid"
        benefit: "Additional discount vouchers worth ₹11,999 across participating Reliance Retail stores"
    milestones:
      - spend_inr: 75000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹1,500"
        value_inr: 1500
      - spend_inr: 150000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹2,250"
        value_inr: 2250
      - spend_inr: 300000
        cycle: annual
        benefit: "Reliance Retail voucher worth ₹5,000"
        value_inr: 5000

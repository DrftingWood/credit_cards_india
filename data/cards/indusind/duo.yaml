    rate_inr_per_unit: 0.75
    constraints: Minimum 500 points; maximum 2,500 points per calendar month for cash redemption.
  - type: airmiles
    program: Singapore Airlines KrisFlyer
    constraints: Current transfer ratio not verified.
  - type: catalog
    program: IndusMoments
    constraints: Catalog values vary; no fixed value verified.
  source:
    url: https://www.indusind.bank.in/in/en/personal/tnc-duoProduct.html
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: medium
    notes: Issuer Duo benefit guide dated 2025-12-20 says credit points have no earning cap and expire while
      account remains live. Card page caps cash redemption at 2,500/month. General reward-updates page labels
      2,500 as monthly reward-point capping, creating unresolved ambiguity. Credit reward rate is 1 point per
      INR150 and cash credit is INR0.75/point; 500-point minimum.
    fields_verified:
    - rewards[0].base.rate
    - rewards[0].base.per_inr
    - rewards[0].base.unit_value_inr

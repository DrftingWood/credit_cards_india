    rate_inr_per_unit: null
    constraints: Redeem within the Miles & More program. Miles do not expire while cardholder has held the Axis card for at least 3 months and makes at least one eligible miles purchase each month. First transaction must be within 30 days of issuance. Expiry can reactivate if conditions fail, the card is cancelled, or there is an unpaid outstanding.
  source:
    url: https://www.axis.bank.in/cards/credit-card/miles-more-credit-card
    retrieved_on: 2026-10-26
    type: issuer-page
    confidence: high
    local_refs:
    - docs/sources/axis/miles-more/mmi-world-terms-retrieved-2026-10-26.pdf
    - docs/sources/axis/miles-more/mmi-reward-change-2025-06-20.pdf
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    notes: >-
      The World variant earns 4 miles per INR200 on eligible spends; World Select earns 6. Since 20-Jun-2025, excluded categories are identified by spend type rather than MCC: utilities/telecom, rent, wallet, government services, insurance, gold/jewellery, gift cards, fuel, cash advances, tolls and repayments. Also ineligible: reversals, fraud, fee payments, cash withdrawals, interest and EMI transactions. Welcome miles credit after the first purchase. The 2024 World terms' MCC exclusions are superseded by the category-based 2025 change.
  mcc_exclusions: []

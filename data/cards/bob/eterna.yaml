    notes: Buy One Get One on movie tickets via District, up to ₹250 per month.
  insurance: []
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 5000
    cap_per_cycle_inr: 250
    cycle: statement
  other:
  - name: FITPASS PRO membership
    description: Complimentary 12-month membership advertised at INR 48,000 after INR 10,000 eligible spend within 30 days of card issuance; applies to cards issued on or after 1-Aug-2026. Code may arrive within 30 days after the spend window.
  - name: Add-on cards
    description: Up to 3 lifetime-free add-on cards for spouse, parents, siblings or kids (18+).
  - name: BOBCARD SmartDeal flight rewards
    description: Additional 12 reward points per ₹100 for eligible flight bookings in the logged-in BOBCARD app/portal.
  - name: BOBCARD SmartDeal hotel rewards
    description: Additional 30 reward points per ₹100 for eligible hotel bookings in the logged-in BOBCARD app/portal.
  - name: Smart EMI
    description: Purchases above ₹2,500 can be converted to Smart EMI for 6–48 months; applicable charges are not
      stated on the Eterna product page.
  - name: Lost-card zero liability
    description: BOBCARD advertises zero liability for fraudulent transactions when card loss is reported immediately; subject to issuer reporting and claim terms.
  - name: Contactless payments
    description: Contactless-enabled card; issuer advertises wireless-chip payments.

    redemption_scope: closed-loop
    ecosystem_label: IRCTC
    loyalty_program: irctc-loyalty
    base:
      rate: 1
      per_inr: 125
      unit_value_inr: 1.0
      unit_value_inr_realized: 1.0
    accelerated:
      - category: irctc-rail-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 10
        effective_per_inr: 100
        card_attributable_rate: 10
        card_attributable_per_inr: 100
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-direct]
        notes: "10% value back as points on eligible AC-class base fare booked on IRCTC website/app; cardholder must be a passenger and link the IRCTC loyalty number. Excludes reservation/superfast charges, taxes, cancelled/modified tickets; points credit after travel."
      - category: irctc-air-bookings
        canonical_categories: [travel]
        multiplier: 1
        effective_rate: 5
        effective_per_inr: 125
        card_attributable_rate: 5
        card_attributable_per_inr: 125
        stacks_with_program: false
        cap_per_cycle: 750
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-air]
        notes: "5 Reward Points per ₹125 spent on eligible Air IRCTC bookings; maximum 750 points each monthly statement cycle."
      - category: irctc-e-catering
        canonical_categories: [dining]
        multiplier: 1
        effective_rate: 5
        effective_per_inr: 125
        card_attributable_rate: 5
        card_attributable_per_inr: 125
        stacks_with_program: false
        cap_per_cycle: unlimited
        cap_unit: points
        cycle: monthly
        merchants: [irctc]
        channel:
          required: true
          class: cobrand-merchant
          merchants: [irctc-ecatering]
        notes: "5 Reward Points per ₹125 spent on e-catering through IRCTC. The issuer's monthly cap is stated for Air ticket bookings; no separate e-catering cap is published."
      - category: dining-utilities
        canonical_categories: [dining]
        multiplier: 1
        effective_rate: 3
        effective_per_inr: 125
        card_attributable_rate: 3
        card_attributable_per_inr: 125
        stacks_with_program: false
        cap_per_cycle: "unlimited"
        cap_unit: points
        cycle: monthly
        notes: "3 Reward Points per ₹125 on dining and standing-instruction utility spends. Only dining is scored because the calculator cannot distinguish standing instructions from other utilities."

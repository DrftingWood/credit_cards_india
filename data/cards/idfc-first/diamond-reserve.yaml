fees:
- effective_from: 2026-01-06
  effective_until: null
  joining_fee_inr: 3000
  annual_fee_inr: 3000
  fee_waiver:
    spend_inr: 600000
    cycle: annual
    conditions: Annual fee waived at INR 6 lakh annual spend.
  forex_markup_pct: 0
  finance_charge_monthly_pct: null
  cash_advance_fee:
    flat_inr: 199
  gst_applicable: true
  notes: >-
    Current issuer terms show INR 3,000 + GST joining and annual fees, with annual-fee
    waiver at INR 6 lakh annual spends. The issuer's product announcement says zero
    forex markup; its current product page also says zero markup. Finance charges
    are dynamic, with an issuer-published range of 8.5%-42% p.a.; the exact
    cardholder rate is not published here. ATM cash advance fee is flat INR 199 +
    GST per transaction irrespective of amount/location; the issuer FAQ says ATM
    withdrawals have up to 45 interest-free days and a INR 10,000 per-transaction
    limit. Add-on card
    fee INR 499 + GST, UPI fee INR 199 + GST, and replacement fee INR 199 + GST are
    listed separately by the issuer and are retained in notes because the schema
    only represents core-card joining/annual fees.
  source:

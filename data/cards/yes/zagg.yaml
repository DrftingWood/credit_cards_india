  notes: 'Current program is operated by Zagg/Rivpe, not YES Rewardz. 3 Zagg Coins
    per INR100 on eligible UPI transactions through the Zagg app only (minimum INR50,
    coins rounded down); 4 coins = INR1, so headline rupee return is 0.75%. Maximum
    coin count per statement cycle is 1.5% of assigned credit limit. No coins on UPI
    paid through other apps, Bharat QR, mandates, or excluded categories: rent, POI
    funding, utilities, insurance, education, government, fines/taxes, jewellery,
    cable/satellite TV and fuel. Credited within 7 business days after statement.
    Expiry/complete redemption constraints not stated in reviewed policy.'

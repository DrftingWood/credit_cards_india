rewards:
- effective_from: 2026-04-12
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1.0
    unit_value_inr_realized: 1.0
    excluded_categories:

  reward_cap: null
  capping_rules:
  - Minimum eligible transaction is INR 200; points are calculated on each INR 200
    increment, so partial increments do not earn points. Refunds/reversals reverse
    points.
  - 12% and 5% earn groups share one 12,000-point cap per statement cycle. 1% base
    and 2.5% CheQ UPI (RuPay only) are uncapped. No points below INR 200, on fuel,
    education, gold/jewellery, insurance, rent, wallet reload, government-service
    MCCs, EMI-converted, gaming, or cash transactions.
  - 'CheQ point redemption: 2 points = INR 1 for flights/hotels and gift cards; 4
    points = INR 1 for bill payments. No cash-out or transfer. AU KFS lists INR 99
    plus GST per successful reward-point redemption, but CheQ terms do not establish
    whether this applies to CheQ Points; fee applicability is unresolved. Points
    expire 2 years after statement credit; card/account closure forfeits them, with
    a 30-day redemption window on customer cancellation.'
  redemption:
  - type: voucher
    program: CheQ Travel and gift cards
    rate_inr_per_unit: 0.5
    constraints: 2 CheQ points = INR 1; value is limited to eligible CheQ Travel or
      gift-card redemption.
  - type: other
    program: CheQ App bill payments
    rate_inr_per_unit: 0.25
    constraints: 4 CheQ points = INR 1; no cash-out or bank transfer.

    over_cap_earns_base: false
    notes: 15 points per INR 150 on eligible grocery and utility combined; INR 4,000 spend / 400 points per statement cycle, MCC identified.
  - category: idfc-first-fastag
    canonical_categories:
    - other
    effective_rate: 15
    effective_per_inr: 150
    cap_per_cycle: 200
    cap_unit: points
    cycle: statement
    over_cap_earns_base: false
    notes: 15 points per INR 150 for IDFC FIRST FASTag recharges through IDFC FIRST Mobile Banking or FIRST Forward App; INR 2,000 / 200 points per statement cycle.
  - category: travel-gallery-hotel-flight-bonus
    canonical_categories:
    - travel
    effective_rate: null
    effective_per_inr: 150
    cap_per_cycle: 8000
    cap_unit: points
    cycle: monthly
    notes: >-
      Effective 18-Jun-2026, issuer terms state 26.7% bonus Reward Points on hotel
      bookings and 13.3% on flights through the IDFC FIRST app, capped at 8,000 bonus
      points per calendar month. The percentage calculation basis is not encoded as
      absolute points because the wording is not safely convertible to schema units.
      Bonus does not apply on Cash+Points or EMI bookings; credited after travel or
      hotel check-in.

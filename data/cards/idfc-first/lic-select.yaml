      Current LIC Select product page, linked 2026 welcome offer and LIC Select privileges PDF were checked.
      The product page's welcome offer says 2,000 points but its linked offer PDF says 2,500; unresolved pending
      issuer clarification. The page also says spend INR 10,000 while the linked offer PDF says more than INR 10,000.
      Product page lists INR 5 lakh personal accident and INR 25,000 each for purchase
      protection and credit shield; the linked privileges PDF's extracted sum-insured table is poorly aligned and
      appears inconsistent, so insurance amounts remain subject to the insurer's current policy schedule. The
      airport-lounge terms require INR20,000 eligible spend in the previous calendar month, now recorded in the
      lounge model. Travel terms effective 18-Jun-2026 specify 20%/8% bonuses; the product page also shows
      inconsistent point-rate and 40% headline figures, preserved as unresolved. The current product guide image
      shows Mastercard but does not publish a card tier, so Visa Signature was cleared and network tier is unknown.
      Welcome offer T&C: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/credit-card/LIC-Joining-Offers-01.pdf

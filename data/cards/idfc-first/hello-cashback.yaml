rewards:
- effective_from: 2026-10-25
  effective_until: null
  currency: cashback
  currency_name: Cashback
  base:
    rate: 1
    per_inr: 100
    unit_value_inr: 1
    unit_value_inr_realized: 1
    notes: >-
      1% on in-store card swipes, UPI purchases made through IDFC FIRST Bank's app,
      and issuer-defined essential categories. Cashback is credited to the card
      account after the payment due date once MAD is paid on time; cashback for a
      cycle is forfeited when MAD is not paid by the due date. Refunds/reversals
      reverse the associated cashback. Earn is limited to spend up to the credit limit.
      Essential categories include rent, utilities, jewellery, wallet loads,
      insurance, education, gift cards, government services, FASTag and railway.
      The issuer advertises up to 5% cashback on eligible international online spends;
      such transactions follow the online tiers, category rules and caps.
  accelerated:
  - category: tiered-online-spends
    canonical_categories:
    - online
    multiplier: 5
    effective_rate: 5
    cap_per_cycle: 1000
    cap_unit: cashback-inr
    cycle: statement
    slabs:
    - upto_spend_inr: 10000
      rate_pct: 3
    - upto_spend_inr:
      rate_pct: 5
    notes: >-
      3% cashback on eligible online spending up to INR 10,000 in a statement cycle,
      then 5% on incremental eligible online spending above INR 10,000. Combined
      online cashback is capped at INR 1,000 per statement cycle. Online fuel and
      essential-category spending do not count toward the INR 10,000 threshold.
  - category: app-travel-bookings-bonus
    canonical_categories:
    - travel
    multiplier: 1
    effective_rate: 1
    cap_unit: cashback-inr
    cycle: statement
    notes: >-
      Additional 1% bonus cashback on flight/hotel bookings through the IDFC FIRST
      Bank app. Because these are online transactions, their base rate is 3% up to
      the INR 10,000 threshold or 5% on incremental spend; total rate is 4%/6% before
      caps. Bonus is included in the total INR 1,500 cashback cap per statement cycle.
      Bonus applies to full-swipe e-commerce bookings, posts after completed travel or
      hotel check-in, and is not paid on cancelled bookings or EMI transactions.
  exclusions:
  - fuel
  - emi
  - cash-advance
  mcc_exclusions: []
  reward_cap:
    max_units: 1500
    cap_unit: cashback-inr
    cycle: statement
  capping_rules:
  - >-
    Online cashback has a combined INR 1,000 per-statement cap; total cashback across
    eligible categories, including app travel bonus, is INR 1,500 per statement.
  - >-
    Third-party UPI-app transactions earn no cashback. Essential categories earn 1%
    but do not count toward the INR 10,000 online-spend threshold even when processed
    online. The schema cannot express all channel/category interactions exactly.
  redemption:
  - type: statement-credit
    program: IDFC FIRST Cashback
    rate_inr_per_unit: 1
    constraints: >-
      Cashback is applied to the card account and adjusted against the next statement;
      one cashback unit equals INR 1. It does not expire while eligible for posting.
  source:
    url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/Hello-Cashback-Terms-and-Conditions.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - rewards.base.rate
    - rewards.base.per_inr
    - rewards.accelerated.effective_rate
    - rewards.accelerated.cap_per_cycle
    - rewards.reward_cap.max_units
    - rewards.redemption.rate_inr_per_unit
    local_refs:
    - docs/sources/idfc-first/hello-cashback/hello-cashback-product-feature-terms.pdf
    - docs/sources/idfc-first/hello-cashback/hello-cashback-product-guide.pdf
    notes: >-
      Current live product page and the issuer's Hello Cashback Product Feature
      Document match on 3%/5% online earn, 1% base categories, 1% travel bonus and
      caps. The cashback feature PDF does not give its original effective date; the
      effective_from date here is the date verified, not an assertion of launch date.
benefits:
- effective_from: 2026-10-25
  effective_until: null
  welcome: []
  fuel_surcharge_waiver:
    pct: 1
    min_txn_inr: 200
    max_txn_inr: 5000
    cap_per_cycle_inr: 100
    cycle: statement
    notes: 1% fuel surcharge reversal on fuel transactions from INR 200 to INR 5,000; capped at INR 100 per statement cycle.
  insurance:
  - type: personal-accident
    sum_insured_inr: 200000
    conditions: >-
      Accidental death/permanent disability; card must have had at least one purchase
      or ATM withdrawal in the prior 30 days. Claim payable once across the cardholder's
      IDFC FIRST cards; policy exclusions and deadlines apply.
  - type: lost-card-liability
    sum_insured_inr: 25000
    conditions: >-
      Lost-card liability, counterfeit/skimming and online fraud protection. Card
      must have had at least one purchase or ATM withdrawal in the prior 30 days;
      PIN-based transactions are excluded except where PIN acquisition was under duress.
  - type: credit-shield
    sum_insured_inr: 50000
    conditions: >-
      Credit Shield covers card-account debits established from card use in the event
      of accidental death; active-card requirement and policy terms apply.
  - type: purchase-protection
    sum_insured_inr: 25000
    coverage_duration_days: 60
    conditions: >-
      Standard fire/allied perils and burglary at the cardholder's recorded residential
      premises for purchases made on the card. At least one purchase or ATM withdrawal
      in the preceding 30 days is required; policy terms apply.
  other:
  - name: Roadside assistance
    description: >-
      Complimentary RSA described by the issuer as worth INR 1,399, usable up to four
      times per year. Some parts, taxi/fuel and incidental costs remain chargeable.
  - name: RuPay UPI
    description: >-
      RuPay card can be linked to supported UPI apps for merchant payments. 1% cashback
      is specified only for UPI payments made through the IDFC FIRST Bank app; third-party
      UPI-app transactions are excluded from cashback. UPI is merchant-only and subject
      to NPCI-restricted categories.
  - name: FD-backed credit limit
    description: >-
      Credit limit is 100% of linked FD value, starting with an FD of INR 10,000;
      issuer page allows linking additional FDs from INR 5,000 to raise the limit.
  concierge: false
  source:
    url: https://www.idfcfirst.bank.in/content/dam/idfcfirstbank/pdf/Hello-Cashback-Terms-and-Conditions.pdf
    retrieved_on: 2026-10-27
    type: issuer-pdf
    confidence: high
    fields_verified:
    - benefits.fuel_surcharge_waiver.pct
    - benefits.fuel_surcharge_waiver.min_txn_inr
    - benefits.fuel_surcharge_waiver.max_txn_inr
    - benefits.fuel_surcharge_waiver.cap_per_cycle_inr
    - benefits.insurance
    local_refs:
    - docs/sources/idfc-first/hello-cashback/hello-cashback-product-feature-terms.pdf
    - docs/sources/idfc-first/hello-cashback/hello-cashback-product-guide.pdf
    notes: >-
      The currently linked Hello Cashback feature PDF gives the insurance limits and
      RSA detail; the live issuer page repeats the principal insurance benefits. No
      airport lounge or trip-cancellation cover was found for this card. The source
      document does not state an original effective date; effective_from is the review
      date, not an asserted benefit launch date.

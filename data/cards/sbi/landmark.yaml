  partner: Landmark
  category: retail
status: active
launched_on: 2020-02-20
discontinued_on: null

fees:
  - effective_from: 2026-07-03
    effective_until: null
    joining_fee_inr: 499
    annual_fee_inr: 499
    renewal_fee_inr: 499
    fee_waiver: null # verified: MITC — Landmark Rewards SBI Card 499/499, no spend-based waiver listed
    forex_markup_pct: 3.5 # verified: MITC — 3.5% foreign currency txn fee (standard cards)
    finance_charge_monthly_pct: 3.75 # verified: MITC — up to 3.75% p.m. (45% p.a.)
    cash_advance_fee:
      pct: 2.5 # verified: MITC — 2.5% or Rs.500 whichever higher
      min_inr: 500
    gst_applicable: true
    supplementary_card_fee_inr: 0
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card.html
      retrieved_on: 2026-11-01
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/_shared/mitc-english.pdf
      fields_verified:
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee
    notes: "Annual Fee Rs.499 + taxes; Renewal Fee Rs.499 + taxes from second year; Add-on Fee Nil."

rewards:
  - effective_from: 2026-07-03
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
    accelerated:
      - category: landmark-stores-online-and-retail
        canonical_categories: [online, other]
        multiplier: 10
        effective_rate: 10
        channel:
          class: cobrand-merchant
          merchants: [lifestyle, home-centre, max, spar, baby-shop, easybuy]
        notes: "10 Reward Points per INR100 at the named online and retail Landmark stores. No Landmark-specific cap is stated. The generic SBI Cardholder Agreement cap is worded for 5X categories; its application to this distinct 10X co-brand rate is unresolved."
      - category: dining-movies
        canonical_categories: [dining, entertainment]
        multiplier: 5
        effective_rate: 5
        cap_per_cycle: 7500
        cap_unit: points
        cycle: monthly
        notes: "5 Reward Points per INR100 on dining and movies. Current SBI Cardholder Agreement sets a 7,500-point monthly cap for cumulative 5X PRIME categories and says the caps apply to relevant co-brand variants; this 5X tier is modeled with the cap. Base 1 point per INR100 continues after it."
      - category: international-spends
        canonical_categories: [international]
        multiplier: 5
        effective_rate: 5
        notes: "5 Reward Points per INR100 on international spend. International is not among the categories named in the PRIME 7,500-point cap clause."
    exclusions:
      - fuel
      - rent
      - government
      - wallet-loads
      - emi
    capping_rules:
      - "Current SBI Cardholder Agreement caps cumulative 5X points on SBI Card PRIME dining, movies, departmental stores and groceries at 7,500/month, with caps extended to relevant co-brand variants. The 5X dining/movie tier is capped accordingly. The Landmark 10X store tier is not expressly mapped to that 5X wording; no cap is published in the Landmark booklet, and the generic cap's application remains unresolved."
    redemption:
      - type: catalog
        program: Landmark Rewards
        rate_inr_per_unit: 0.25
        constraints: Closed-loop conversion into Landmark Rewards only; 4 SBI Reward Points = INR 1 and 1 Landmark Reward = INR 0.60. Issuer page offers instant in-store redemption at participating Landmark stores; no statement-credit redemption is published for this co-brand card.
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/landmark-sbi-card.html
      retrieved_on: '2026-11-01'
      type: issuer-page
      confidence: high
      notes: "Landmark booklet clauses 11.4-11.5: 10/5/1 points per INR100, 4 points = INR1, closed-loop conversion to Landmark Rewards, and INR99 + GST fee below 1,000 points. Current SBI Cardholder Agreement states 24-month point expiry."
    notes: "1 Reward Point per Rs.100 on other retail purchases (base). SBI page lists exclusions: Fuel, Rental, Govt Spends, Gaming, Wallet and EMI; gaming is not a standalone schema exclusion enum and is preserved here in the note."

    mcc_exclusions: ['6513', '5712', '5541', '5983', '5542']
benefits:
  - effective_from: 2026-07-03
    effective_until: null
    lounge_access: null
    milestones:
      - spend_inr: 200000

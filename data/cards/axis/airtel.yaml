    notes: 10% online value back at District Movies, up to Rs 200 per primary card per calendar month. Credited to District wallet with no expiry and usable only there. E-commerce payment only; UPI excluded. This is not card cashback.
  - category: airtel-thanks-utilities
    canonical_categories:
    - utilities
    multiplier: 1
    effective_rate: 10
    cap_base_multiplier: 1
    cap_unit: cashback-inr
    cycle: statement
    over_cap_earns_base: false
    merchants:
    - airtel-thanks-utilities
    channel:
      class: cobrand-merchant
      merchants:
      - airtel-thanks-utilities
    notes: 10% on eligible utility bills (including BBPS-enabled billers) via Thanks app, capped at 1x base cashback earned in the same statement cycle. Utilities outside the app are excluded from all cashback.
  capping_rules:
  - Base cashback is 1% on eligible other spends, uncapped; it determines the Airtel and utility app cashback caps. If base cashback is zero, the app bill categories earn zero.
  - Per-transaction cashback is rounded down. Revised caps appear on statements generated on/after 2026-06-12. April 2026 terms contain both a 60-day credit-cycle statement and a more detailed next-cycle posting example; current product page says statement credit. Timing discrepancy is documented.
  - Zomato, Blinkit and District benefits are partner-wallet value back, not Axis statement cashback. They are retained in the rewards structure as a schema workaround, so reward totals must not count them as statement cashback.

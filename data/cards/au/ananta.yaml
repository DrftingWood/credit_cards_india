  other:
  - name: Partner merchant discounts
    description: Up to 15% instant discount, capped at INR 500 per month and once per month at each partner. Minimum INR 1,000 at Amazon Fashion and District dining; minimum INR 3,000 for AU Rewardz hotel bookings. Add-on cards are eligible for shopping and dining offers, but not travel offers.
  - name: No-Cost EMI on AU Rewardz travel
    description: 3-month No-Cost EMI on flight and hotel bookings through AU Rewardz. Conversion fee INR 199 plus GST; minimum transaction INR 2,000.
  - name: Xpress EMI
    description: Transactions of INR 500 or more can be converted to EMIs when the total value is at least INR 2,000; current card page does not state a card-specific Xpress EMI processing fee.
  - name: Contactless payments
    description: Tap the card or a digitally added card at POS for payments up to INR 5,000 without entering a PIN.
  - name: Add-on cards
    description: AU advertises lifetime-free add-on cards for Ananta.
  - name: Protection covers
    description: Issuer lists insurance coverage, card liability, air accident, purchase protection, baggage loss and delay, flight delay, passport loss, credit shield and device protection. Limits and applicable conditions are not established for Ananta from the available card-specific terms. See https://www.au.bank.in/pdf/credit-card/insurance-terms-and-conditions.pdf.

  cash_advance_fee:
    pct: 3.0
    min_inr: 300
  gst_applicable: true
  notes: >-
    Published joining/first-year fee is INR 499 + GST, currently waived as an acquisition special offer for applicants
    who are not existing SCB credit-card holders. Renewal is INR 499 + GST and is reversed at preceding-year Smart
    spend of at least INR 120,000. General issuer tariffs set 3.5% forex, 3.75% monthly finance and cash advance fee
    of 3% or INR 300 minimum; fuel surcharge is ordinarily charged and no Smart-specific fuel surcharge waiver was
    found. Rent transactions (MCC 6513) incur a 1% processing fee plus taxes.

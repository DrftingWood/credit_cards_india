    description: 5,000 Reward Points every year on card anniversary.
    value_inr: null
  source:
    url: https://www.airindia.com/in/en/maharaja-club/partner-offers/sbi.html
    retrieved_on: '2026-10-27'
    type: other
    confidence: high
    notes: Air India's current SBI co-brand page publishes Signature earn, conversion, milestones, fees, domestic lounge visits, membership and anniversary points. SBI's card-specific terms and Priority Pass FAQ support reward exclusions, insurance and paid international lounge details. No current Signature-specific fuel waiver schedule was found, so the unsupported legacy values were cleared.
    local_refs:

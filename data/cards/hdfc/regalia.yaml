        visits_per_cycle: 2
        cycle: quarterly
        guests_per_visit: 0
        via: [issuer-direct]
        spend_threshold_inr: 100000
        spend_threshold_cycle: quarterly
        notes: "Up to 2 domestic lounge access vouchers per calendar quarter for self and add-on, based on ₹1L spend per calendar quarter."
      international:
        visits_per_cycle: 6
        cycle: annual
        guests_per_visit: 0
        via: [priority-pass]
        notes: "Priority Pass for self and add-on issued after using the card at least 4 times; up to 6 complimentary visits/yr, US$27 + GST per visit beyond that."

    notes: Unlimited domestic lounge access requires ₹75,000 net eligible spend in the preceding calendar quarter,
      effective 15-Jul-2026. Newly issued cards are exempt in the issuance quarter and the next quarter if issued
      in the last month; upgrades do not receive the waiver. Accident cover was discontinued for newly issued
      Eterna cards effective 25-Aug-2026. FITPASS PRO applies only to cards issued from 1-Aug-2026. The lounge
      revision is at https://media.bobcard.co.in/media/0aqczg5p/final-revision-in-charges-benefits-effective-july-202615.pdf;
      lounge activation conditions are at https://media.bobcard.co.in/media/1funxwuy/airpor-lounge-benefit-tc.pdf.
      Other lounge access channels and complimentary guest entitlement were not established by the reviewed issuer sources.
      Concierge is not advertised on the current product page; the schema's boolean false cannot distinguish an
      unpublished service from a confirmed absence, so treat that flag as unresolved.

benefits:
- effective_from: '2026-10-26'
  effective_until:
  lounge_access:
    domestic:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - visa
      notes: Unlimited domestic airport lounge access; one entry per cardholder per lounge visit.
    international:
      visits_per_cycle: unlimited
      cycle: annual
      guests_per_visit: 0
      via:
      - priority-pass
      notes: Unlimited international Priority Pass lounge visits for primary cardholder only; airport lounge terms do not grant guest access.
  golf:
    rounds_per_cycle: 12
    cycle: annual
    notes: Issuer product page says 12 complimentary golf games and lessons per year; the page does not clarify whether games and lessons share one combined quota or separate quotas, so only the 12 headline count is structured.
  welcome:
  - condition: Card activation or renewal
    benefit: Two breakfast-inclusive one-night stay vouchers at participating hotels in India and one one-night Taj Palaces voucher on card activation/renewal. Current issuer program terms say vouchers are credited within 8 working days; no issuer-published INR value found.
    value_inr:
    window_days:
  - condition: Eligible cardholder; offer terms apply
    benefit: Additional Taj Palace one-night voucher with every new or renewed card; issuer page says valid for 6 months. Offer valid through 2026-12-31.
    value_inr:
    window_days: 180
  fuel_surcharge_waiver:
    pct: 1.0
    min_txn_inr: 400
    max_txn_inr: 4000
    cap_per_cycle_inr:
    notes: Service Guide states 1% fuel surcharge waiver on petrol transactions INR400-INR4,000; no cap or cycle given.
  dining:
    program: Taj dining and EazyDiner
    discount_pct: 25
    notes: '25% savings on food at IHCL hotels/Qmin per current product page. Separate EazyDiner offer: 30% off up to INR1,500 on minimum bill INR3,000, once per card per calendar month, terms apply.'
  movies:
    type: bogo
    partner: BookMyShow
    max_per_cycle: 2
    cycle: monthly
    cap_inr: 1000
    notes: Buy-one-get-one movie tickets twice a month; discount capped at INR1,000 per ticket.
  concierge: true
  other:
  - name: Taj and IHCL stay privileges
    description: Unlimited room upgrades subject to availability; 25% savings on hotel Best Available Rate; breakfast-inclusive stays and Taj Palace voucher subject to offer terms.
  - name: Taj food, spa, pool and lounges
    description: 25% food/Qmin savings; 60-minute spa and sauna/steam access (up to 4 spa visits/year); pool for two up to 12/year; Chambers Lounge up to 12/year for cardholder plus guest; Taj Club Lounge up to 12/year.
  - name: NeuPass Platinum
    description: IHCL NeuPass Taj InnerCircle Platinum membership entitlement.
  - name: EazyDiner
    description: 30% off up to INR1,500, minimum bill INR3,000, once per card per calendar month, under current 2026 offer T&C.
  - name: AdaniOne duty-free
    description: 15% discount once monthly, minimum spend INR7,500, maximum discount INR3,000.
  - name: Airport transfers
    description: Four domestic and four international chauffeur transfers per year, subject to provider terms.
  - name: Starbucks
    description: 50% discount up to INR150, four times per month, terms apply.
  - name: Airport travel offers
    description: Four domestic and four international chauffeur-driven airport transfers/year. Current product page also lists up to 20% off (maximum INR20,000) on MMT business-class travel and 20% off (maximum INR10,000) on domestic/international flights via Yatra; offer terms apply.
  - name: Retail and event offers
    description: Current page lists Bicester Collection guest benefits; Unicorn portal 6X/14X Apple-product points and EMI discounts; 50 points/INR100 on direct Dyson purchases; and up to INR10,000 off Reliance Brand outlets on spend of INR35,000+. Offers are volatile and terms apply.
  - name: Starbucks
    description: 50% off up to INR150, four times per month, subject to current terms.
  source:
    url: https://www.hsbc.bank.in/credit-cards/products/taj/
    retrieved_on: '2026-10-26'
    type: issuer-page
    confidence: high

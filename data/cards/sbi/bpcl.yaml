      fields_verified:
        - fees.joining_fee_inr
        - fees.annual_fee_inr
        - fees.renewal_fee_inr
        - fees.fee_waiver.spend_inr
        - fees.supplementary_card_fee_inr
        - fees.forex_markup_pct
        - fees.finance_charge_monthly_pct
        - fees.cash_advance_fee
      notes: Current SBI page and MITC confirm INR499 joining/annual/renewal fees, nil add-on fee, 3.5% forex, finance and cash-advance charges. SBI's 29-Mar-2026 notice makes the annual-fee reversal threshold INR1 lakh effective 1-May-2026, up from INR50,000.

rewards:
  - effective_from: 2020-09-01
    effective_until: null
    currency: points
    currency_name: Reward Points
    base:
      rate: 1
      per_inr: 100
      unit_value_inr: 0.25
      unit_value_inr_realized: 0.25
    accelerated:
      - category: bpcl-fuel
        canonical_categories: [fuel]
        multiplier: 13
        effective_rate: 13
        cap_per_cycle: 1300
        cap_unit: points
        cycle: statement
        merchants: [bpcl-fuel-stations]
        channel:
          class: fuel-network
          merchants: [bpcl]
        notes: "13 Reward Points per INR100 on BPCL fuel at eligible petrol-pump merchant IDs, capped at 1,300 points per statement cycle. T&Cs separately cap BPCL fuel reward earning to INR10,000 eligible spend per month; the 1% surcharge waiver has its own INR4,000 transaction limit."
      - category: dining-departmental-grocery-movies
        canonical_categories: [dining, groceries, entertainment]
        multiplier: 5
        effective_rate: 5
        cap_per_cycle: 5000
        cap_unit: points
        cycle: monthly
        notes: "5 Reward Points per INR100 on dining MCCs 5812/5813/5814, departmental stores MCC 5311, grocery MCC 5411 and movie MCCs 7832/7922; combined 5X cap 5,000 points/month, after which base 1 point/INR100 continues. Accelerated department/grocery earning excludes Metro Cash & Carry, Reliance Market and Walmart per booklet."
    exclusions:
      - wallet-loads
      - cash-advance
      - emi
    capping_rules:
      - "Base 1 Reward Point per INR100 on other retail purchases. Non-BPCL fuel/service-station purchases do not earn points. The booklet also excludes balance transfers, financial charges, disputed transactions, Flexipay and merchant EMI."
    redemption:
      - type: catalog
        program: Shop & Smile Rewards Catalogue
        rate_inr_per_unit: 0.25
      - type: product
        program: BPCL fuel redemption
        rate_inr_per_unit: 0.25
        constraints: "Instant redemption of Reward Points against fuel at select BPCL petrol pumps."
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/bpcl-sbi-card.html
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/bpcl-sbi-card/bpcl-terms-current.pdf
      fields_verified: [rewards.base, rewards.accelerated, rewards.exclusions, rewards.capping_rules, rewards.redemption]
      notes: The current product page confirms 13 points/INR100 on BPCL fuel (cap 1,300/statement cycle), 5 points/INR100 on dining, departmental stores, grocery and movies (cap 5,000/month), base 1/INR100 other retail and 4 points=INR1. Terms specify the separate INR10,000/month BPCL fuel spend ceiling, MCC eligibility/exclusions and no cash value. Current page offers BPCL fuel or Shop n Smile redemption; no statement credit is listed.

    mcc_exclusions: ['6540', '6541']
benefits:
  - effective_from: 2017-12-20
    effective_until: null
    welcome:
      - condition: "Payment of Joining Fee"
        benefit: "2,000 bonus Reward Points worth INR500 (credited within 20 days of Joining Fee payment)"
        value_inr: 500
        window_days: 20
    fuel_surcharge_waiver:
      pct: 1.0
      min_txn_inr: null
      max_txn_inr: 4000
      cap_per_cycle_inr: 100
      cycle: statement
      notes: "1% fuel surcharge waiver on BPCL fuel transactions up to INR4,000; no minimum transaction threshold; capped at INR100 per statement cycle/account. POS swipes only; GST and other charges are excluded."
    concierge: false
    source:
      url: https://www.sbicard.com/en/personal/credit-cards/bpcl-sbi-card.html
      retrieved_on: 2026-10-27
      type: issuer-page
      confidence: high
      local_refs:
        - docs/sources/sbi/bpcl-sbi-card/bpcl-terms-current.pdf
      fields_verified: [benefits.welcome, benefits.fuel_surcharge_waiver]
      notes: Current page confirms 2,000 welcome points worth INR500 after joining-fee payment, credit within 20 days, plus the BPCL surcharge waiver conditions. Current page has no lounge or insurance benefit listed for this card.


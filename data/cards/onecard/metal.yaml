  - rent
  - wallet-loads
  - cash-advance
  - other
  redemption:
  - type: statement-credit
    program: OneCard Pay with Points in app
    rate_inr_per_unit: null
    constraints: Issuer terms allow points to pay for prior transactions less than two months old and/or redeem for in-app offers. No fee or minimum threshold is advertised in the current generic OneCard FAQ; no shared rupee conversion value is published.
  source:
    url: https://www.getonecard.app/faq/
    retrieved_on: '2026-10-27'

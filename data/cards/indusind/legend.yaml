  other:
  - name: BookMyShow movie offer
    description: Buy one ticket, get the second ticket free; one free ticket per month since 1-Jun-2023; free-ticket
      value capped at INR200. Current page retains stale wording about up to three tickets, but explicit dated revision
      says one/month.
  - name: Priority Pass
    description: Complimentary membership card; lounge visit fees USD35 per person are billed, and India visits
      and guests are not waived. Product page says lounge access discontinued effective 7-Mar-2025.
  - name: Travel Plus
    description: Optional program costs INR5,000 annual fee; includes waiver of lounge usage charges for up to eight
      international visits/year outside India and travel insurance, subject to program terms.
  - name: Travel insurance
    description: Current benefit guide lists baggage loss INR100,000, baggage delay INR25,000, passport loss INR50,000,
      ticket loss INR25,000 and missed connection INR25,000 under Travel Plus. International travel up to 20 days;
      bank activation notice required 48 hours before travel and within 48 hours after return.
  - name: Concierge and Auto Assist
    description: Issuer page lists concierge; 2025 benefit guide describes roadside repair, emergency fuel delivery,
      flat tyre, locked keys, battery and towing coordination. Third-party repair/service costs may be payable.

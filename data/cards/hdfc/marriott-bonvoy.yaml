    notes: 19-Oct-2026 card terms confirm lounge, Free Night Awards, Elite Night Credits, Silver status and golf. FNA permits up to 15,000 additional Bonvoy points (not 25,000). HDFC's current product page also lists concierge and an enrollment-based Oct-Nov 2026 anniversary offer; campaign dates and thresholds are captured in benefits.other because schema lacks date-windowed benefits. The issuer insurance cover summary says these advertised covers remain valid through 22-Jul-2027; structured coverage and primary-card/travel conditions are recorded below. INR 8,250 FNA values are estimates derived from the separate Marriott Bonvoy realized point value (INR 0.55/point), not issuer-guaranteed rupee values. Current co-branded MITC says fuel surcharge waiver is not applicable.

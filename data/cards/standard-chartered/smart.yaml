    - rewards.base.unit_value_inr
    - rewards.base.unit_value_inr_realized
    - rewards.accelerated
    - rewards.exclusions
    - rewards.mcc_exclusions
    - rewards.reward_cap
    - rewards.capping_rules
    - rewards.redemption
    notes: Current FAQ effective 25-Aug-2024 sets cycle caps, customer-level consolidation, channel-specific bill-pay eligibility and redemption conditions; product page's monthly wording and INR 18,000 annual illustration are inconsistent with FAQ cycle caps and are not encoded as a contractual annual cap.
benefits:
- effective_from: '2026-10-26'
  effective_until: null
  lounge_access: null
  fuel_surcharge_waiver: null
  concierge: null
  other:
  - name: Extended interest-free period
    description: >-
      Available only during the first 90 days after card issuance. Cardholder must pay the minimum amount due on the
      first three statements by each due date, then clear the full amount due on the fourth statement by its due date.
      Applies to retail transactions only; not cash advances, EMI or loan-on-card products. Missing a required minimum
      payment withdraws the extension and interest applies under the card terms.
    value_inr: null
  - name: Kuch Bhi on EMI offer
    description: >-
      Eligible transactions of INR 2,000 or more can be converted into a three-month EMI at 0.99% monthly interest
      with no processing fee, subject to current bank eligibility and EMI terms. This is a financing offer, not a
      general reward or unconditional benefit.
    value_inr: null
  source:
    url: https://av.sc.bank.in/content/docs/in-smartcard-product-terms-and-conditions.pdf
    retrieved_on: '2026-10-26'
    type: issuer-pdf
    confidence: high
    method: pdf-extract
    fields_verified:
